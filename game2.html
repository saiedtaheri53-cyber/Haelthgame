    let currentQ = 0;
    let score = 0;

    function init() {
        const savedScore = parseInt(localStorage.getItem('h_score_2') || 0);
        document.getElementById('golden-score').innerText = `نشان: ${savedScore}`;
        render();
    }

    function render() {
        if(currentQ >= questions.length) return finish();
        const q = questions[currentQ];
        document.getElementById('q-counter').innerText = `سوال ${currentQ + 1} از ۱۰۰`;
        document.getElementById('q-text').innerText = q.q;
        const optCont = document.getElementById('options');
        optCont.innerHTML = '';
        q.a.forEach((txt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = txt;
            btn.onclick = () => {
                const isCorrect = (idx === q.correct);
                btn.classList.add(isCorrect ? 'correct' : 'wrong');
                if(isCorrect) score++;
                setTimeout(() => { currentQ++; render(); }, 600);
            };
            optCont.appendChild(btn);
        });
    }

    function finish() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('score-text').innerText = `امتیاز نهایی: ${score} از ۱۰۰`;
        if(score === 100) {
            let s = parseInt(localStorage.getItem('h_score_2') || 0) + 1;
            localStorage.setItem('h_score_2', s);
            document.getElementById('score-text').innerText += " (تبریک! نشان طلایی ثبت شد)";
        }
    }

    init();
</script>
</body>
</html>
