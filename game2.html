<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی سته ضروریه - نسخه نهایی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-box { background: white; width: 350px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #444; }
        #question { font-size: 1.1em; margin-bottom: 20px; height: 100px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #eee; }
        .btn-opt { width: 100%; padding: 15px; margin: 5px 0; border: 2px solid #28a745; border-radius: 8px; background: white; cursor: pointer; font-weight: bold; }
        .btn-opt:hover { background: #28a745; color: white; }
        .nav-btn { width: 100%; padding: 10px; margin-top: 10px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #back-btn { background: #dc3545; }
        .golden-score { color: #d4af37; font-weight: bold; font-size: 1.2em; display: none; }
    </style>
</head>
<body>

<div id="game-box">
    <div class="stats">
        <span id="q-num">سوال ۱</span>
        <span id="score">امتیاز: ۰</span>
    </div>
    <div id="golden-msg" class="golden-score">✨ امتیاز طلایی!</div>
    <div id="question">در حال بارگذاری...</div>
    <button class="btn-opt" id="o0" onclick="check(0)">-</button>
    <button class="btn-opt" id="o1" onclick="check(1)">-</button>
    <button class="nav-btn" id="back-btn" onclick="window.location.href='index.html'">بازگشت به فهرست</button>
</div>

<script>
    // بانک سوالات کاملاً مجزا (بدون حلقه)
    const questions = [
        {q: "هوای آلوده چه اثری بر روح حیوانی دارد؟", o: ["تضعیف و تیرگی", "تقویت و نشاط"], a: 0},
        {q: "بهترین زمان برای ورزش چه موقع است؟", o: ["بعد از هضم غذا", "قبل از غذا"], a: 0},
        {q: "خواب روز (قیلوله) در فصول گرم چگونه است؟", o: ["مذموم و مضر", "بسیار مفید"], a: 0},
        {q: "کدام اصل سته، مادرِ بیماری‌های گوارشی است؟", o: ["مأکول و مشروب", "خواب"], a: 0},
        {q: "خشم شدید موجب چه حالتی در قلب می‌شود؟", o: ["گرمی مفرط", "سردی مفرط"], a: 0},
        {q: "آیا نوشیدن آب یخ بعد از ورزش صحیح است؟", o: ["خیر", "بله"], a: 0},
        {q: "استفراغ مفرط چه چیزی را تحلیل می‌برد؟", o: ["حرارت غریزی", "رطوبت اضافی"], a: 0},
        {q: "اعراض نفسانی شامل چه مواردی است؟", o: ["خشم، شادی، غم", "خوراک و خواب"], a: 0},
        {q: "آیا در طب سنتی، ورزش باید تا حد تعریق باشد؟", o: ["بله", "خیر"], a: 0},
        {q: "خوابیدن با معده پر چه عوارضی دارد؟", o: ["تولید بخارات غلیظ", "هضم سریع"], a: 0}
        // می‌توانید اینجا به راحتی سوالات ۱۱ تا ۱۰۰ را به همین شکل دستی اضافه کنید
    ];

    let cur = 0, score = 0, streak = 0;

    function update() {
        if(cur >= questions.length) {
            alert("بازی تمام شد! امتیاز نهایی: " + score);
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('q-num').innerText = "سوال " + (cur + 1);
        document.getElementById('score').innerText = "امتیاز: " + score;
        document.getElementById('question').innerText = questions[cur].q;
        document.getElementById('o0').innerText = questions[cur].o[0];
        document.getElementById('o1').innerText = questions[cur].o[1];
    }

    function check(idx) {
        if (idx === questions[cur].a) {
            score += 10;
            streak++;
            if (streak >= 3) {
                score += 5; // پاداش امتیاز طلایی
                document.getElementById('golden-msg').style.display = 'block';
            }
        } else {
            streak = 0;
            document.getElementById('golden-msg').style.display = 'none';
        }
        cur++;
        update();
    }

    update();
</script>
</body>
</html>
