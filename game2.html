<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی سته ضروریه - ۱۰۰ سوال استاندارد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .info { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #333; }
        .q-box { font-size: 1.2rem; margin-bottom: 20px; min-height: 80px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; background: #e0e0e0; font-size: 1rem; transition: 0.2s; }
        .btn:hover { background: #d0d0d0; }
        .correct { background: #4caf50 !important; color: white; }
        .wrong { background: #f44336 !important; color: white; }
        #badge { display: none; text-align: center; font-size: 1.5rem; padding: 20px; color: #ff9800; }
    </style>
</head>
<body>

<div class="card">
    <div class="info">
        <span id="counter">سوال ۱ از ۱۰۰</span>
        <span id="score-val">امتیاز: ۰</span>
    </div>
    <div id="q-text" class="q-box">در حال بارگذاری...</div>
    <div id="options"></div>
    <div id="badge">🏆 نشان طلایی طب را کسب کردید!</div>
</div>

<script>
    // پاسخ‌ها کاملاً میکس شده‌اند
    const quizData = [
     const questions = [
    { q: "اصلی‌ترین عامل برای هضم بهتر غذا در معده چیست؟", a: "جویدن کامل", o: ["جویدن کامل", "نوشیدن آب یخ", "سریع خوردن"], connection: "هضم اول در دهان آغاز می‌شود." },
    { q: "خواب زیاد در طول روز باعث چه چیزی در بدن می‌شود؟", a: "افزایش رطوبت", o: ["افزایش رطوبت", "کاهش وزن", "تقویت کبد"], connection: "خواب زیاد حرارت غریزی را کاهش می‌دهد." },
    { q: "بهترین زمان برای ورزش کردن چه موقع است؟", a: "بعد از هضم غذا", o: ["بعد از هضم غذا", "بلافاصله بعد از غذا", "هنگام گرسنگی شدید"], connection: "ورزش با شکم پر باعث ورود خلط خام به اعضا می‌شود." },
    { q: "کدام عامل از سته‌ی ضروریه بر کیفیت خون تأثیر مستقیم دارد؟", a: "خوردن و آشامیدن", o: ["خوردن و آشامیدن", "خواب و بیداری", "سکون"], connection: "غذا مواد اولیه خون است." },
    { q: "هوای سرد در طب سنتی چه خاصیتی دارد؟", a: "قابض و منقبض کننده", o: ["قابض و منقبض کننده", "ملطف و بازکننده", "محلل و گدازنده"], connection: "سرما منافذ بدن را می‌بندد." },

    { q: "نوشیدن آب یخ بلافاصله بعد از ورزش چه عارضه‌ای دارد؟", a: "تضعیف کبد", o: ["تضعیف کبد", "افزایش قدرت", "بهبود هضم"], connection: "آب یخ حرارت غریزی کبد را خاموش می‌کند." },
    { q: "فصل بهار در طب سنتی چه مزاجی دارد؟", a: "گرم و تر", o: ["گرم و تر", "سرد و خشک", "گرم و خشک"], connection: "بهار فصل رویش و فعالیت اخلاط است." },
    { q: "کدام خلط در کبد تولید می‌شود؟", a: "دم (خون)", o: ["دم (خون)", "سودا", "صفرا"], connection: "کبد کارخانه اصلی تولید خون است." },
    { q: "استفاده طولانی‌مدت از هوای آلوده به چه عضوی آسیب می‌زند؟", a: "قلب و ریه", o: ["قلب و ریه", "کلیه", "معده"], connection: "هوا مستقیماً با روح حیوانی در قلب در تماس است." },
    { q: "کدام فعالیت از سته‌ی ضروریه «احتباس» نامیده می‌شود؟", a: "نگهداشتن فضولات", o: ["نگهداشتن فضولات", "راه رفتن", "شنیدن موسیقی"], connection: "تعادل در نگهداشتن و دفع برای سلامتی لازم است." },
    { q: "علت اصلی سردردهای ناشی از گرسنگی چیست؟", a: "صعود بخارات به مغز", o: ["صعود بخارات به مغز", "کمبود اکسیژن", "افزایش فشار خون"], connection: "معده خالی بخارات تند تولید می‌کند." },
    { q: "کدام خلط به 'سیاهی' معروف است؟", a: "سودا", o: ["سودا", "صفرا", "بلغم"], connection: "سودا خلط سنگین و رسوب‌کننده است." },
    { q: "بهترین حالت خواب در طب سنتی چیست؟", a: "خوابیدن به پهلو", o: ["خوابیدن به پهلو", "خوابیدن روی شکم", "خوابیدن طولانی در روز"], connection: "خواب به پهلو برای هضم بهتر غذا مفید است." },
    { q: "کدام ورزش برای مزاج‌های سرد و تر مناسب‌تر است؟", a: "ورزش‌های پرتحرک", o: ["ورزش‌های پرتحرک", "ورزش‌های ملایم", "استراحت مطلق"], connection: "حرکت باعث ایجاد حرارت می‌شود." },
    { q: "مهم‌ترین خلط برای تقویت حرارت بدن کدام است؟", a: "صفرا", o: ["صفرا", "بلغم", "سودا"], connection: "صفرا ذاتا گرم و خشک است." },
    { q: "افراط در حمام رفتن باعث چه می‌شود؟", a: "تحلیل رطوبت", o: ["تحلیل رطوبت", "چاقی", "افزایش خون"], connection: "حمام بیش از حد بدن را خشک می‌کند." },
    { q: "به کدام عضو 'رئیسه' می‌گویند؟", a: "قلب", o: ["قلب", "معده", "دست"], connection: "قلب منشأ روح حیوانی است." },
    { q: "کدام میوه برای تقویت معده در طب سنتی بسیار توصیه شده؟", a: "به", o: ["به", "هندوانه", "خیار"], connection: "به خاصیت قابضه و مقوی معده دارد." },
    { q: "غصه و اندوه طولانی چه خلطی را زیاد می‌کند؟", a: "سودا", o: ["سودا", "دم", "بلغم"], connection: "غم باعث خشکی بدن می‌شود." },
    { q: "منشأ اصلی بلغم در بدن کجاست؟", a: "معده و گوارش", o: ["معده و گوارش", "قلب", "مغز"], connection: "بلغم خلط سرد و تر است." },
    { q: "تأثیر محیط بر مزاج انسان چگونه است؟", a: "غیرمستقیم و عمیق", o: ["غیرمستقیم و عمیق", "هیچ تأثیری ندارد", "فقط روی پوست"], connection: "ما از محیط خود تغذیه می‌کنیم." },
    { q: "چرا باید از خوردن غذاهای متنوع در یک وعده پرهیز کرد؟", a: "اختلال در هضم", o: ["اختلال در هضم", "لذت بیشتر", "رشد سریع‌تر"], connection: "معده نمی‌تواند دو نوع هضم متفاوت را همزمان انجام دهد." },
    { q: "کدام خلط عامل خواب‌آلودگی است؟", a: "بلغم", o: ["بلغم", "صفرا", "سودا"], connection: "بلغم سرد و مرطوب است." },
    { q: "سریع غذا خوردن چه عارضه‌ای دارد؟", a: "هضم ناقص", o: ["هضم ناقص", "افزایش قد", "بهبود هضم"], connection: "بزاق زمان کافی برای ترکیب با غذا را ندارد." },
    { q: "آیا استرس می‌تواند باعث تغییر مزاج شود؟", a: "بله", o: ["بله", "خیر"], connection: "اعراض نفسانی مستقیماً اخلاط را تغییر می‌دهند." },
    { q: "کدام فصل برای پاکسازی بدن (فصد و حجامت) مناسب‌تر است؟", a: "بهار", o: ["بهار", "زمستان", "پاییز"], connection: "در بهار اخلاط به سطح بدن می‌آیند." },
    { q: "تأثیر بوی خوش بر بدن چیست؟", a: "تقویت روح", o: ["تقویت روح", "افزایش اشتها", "خواب‌آوری"], connection: "رایحه مستقیم بر اعصاب اثر می‌گذارد." },
    { q: "سوزش سر دل معمولاً نشانه چیست؟", a: "غلبه صفرا", o: ["غلبه صفرا", "کمبود خون", "غلبه بلغم"], connection: "صفرا خلطی گرم و سوزاننده است." },
    { q: "کدام عضو بدن مسئول 'تصفیه' اخلاط است؟", a: "کلیه", o: ["کلیه", "معده", "قلب"], connection: "کلیه‌ها فضولات خون را دفع می‌کنند." },
    { q: "در طب سنتی، 'خام بودن غذا' نشانه چیست؟", a: "ضعف هضم", o: ["ضعف هضم", "سلامت", "خوبی معده"], connection: "هضم ناقص باعث تولید مواد فاسد می‌شود." },
    { q: "آیا خوابیدن بعد از حمام توصیه می‌شود؟", a: "خیر", o: ["خیر", "بله"], connection: "بدن بعد از حمام نرم و آماده جذب هوای ناسالم است." },
    { q: "شادی معتدل چه تأثیری بر قلب دارد؟", a: "تقویت", o: ["تقویت", "تضعیف", "خستگی"], connection: "شادی حرارت غریزی را متعادل می‌کند." },
    { q: "کدام ماده غذایی 'مدبر' (اصلاح‌کننده) معده است؟", a: "زیره", o: ["زیره", "آب سرد", "لبنیات"], connection: "زیره بادشکن و کمک‌کننده به هضم است." },
    { q: "منظور از 'هضم سوم' در طب سنتی چیست؟", a: "تغذیه بافت‌ها", o: ["تغذیه بافت‌ها", "هضم دهانی", "هضم معده"], connection: "هضم در عضو انجام می‌شود." },
    { q: "مصرف زیاد سرکه باعث چه چیزی در بدن می‌شود؟", a: "خشکی", o: ["خشکی", "رطوبت", "چاقی"], connection: "سرکه طبیعتی سرد و خشک دارد." },
    { q: "بهترین زمان نوشیدن آب در طول روز چیست؟", a: "هنگام تشنگی واقعی", o: ["هنگام تشنگی واقعی", "همراه غذا", "قبل از خواب"], connection: "نوشیدن بی‌وقت آب معده را ضعیف می‌کند." },
    { q: "تأثیر سکون زیاد (کم‌تحرکی) بر اخلاط چیست؟", a: "تجمع و رسوب", o: ["تجمع و رسوب", "پاکسازی", "افزایش حرارت"], connection: "حرکت باعث دفع فضولات می‌شود." },
    { q: "نشانه غلبه بلغم در بدن چیست؟", a: "سفیدی زبان", o: ["سفیدی زبان", "سرخی صورت", "عطش زیاد"], connection: "بلغم سرد و مرطوب است." },
    { q: "کدام عضو بدن 'مدیر' اخلاط است؟", a: "کبد", o: ["کبد", "قلب", "معده"], connection: "کبد محل صنع و تولید اخلاط است." },
    { q: "در طب سنتی، رنگ ادرار نشان‌دهنده چیست؟", a: "وضعیت اخلاط", o: ["وضعیت اخلاط", "فقط نوشیدن آب", "خستگی"], connection: "ادرار راه دفع فضولات است." },
    { q: "آیا گوش دادن به موسیقی ملایم جزء اعراض نفسانی است؟", a: "بله", o: ["بله", "خیر"], connection: "صوت نیز بر روح تأثیر می‌گذارد." },
    { q: "دلیل توصیه به سحری خوردن در طب چیست؟", a: "حفظ حرارت غریزی", o: ["حفظ حرارت غریزی", "افزایش خواب", "تنبلی"], connection: "سحری انرژی روز را تأمین می‌کند." },
    { q: "چرا طب سنتی از مصرف همزمان ماهی و ماست منع می‌کند؟", a: "افزایش بلغم", o: ["افزایش بلغم", "افزایش حرارت", "تقویت کبد"], connection: "هر دو سرد هستند و هضم را مختل می‌کنند." },
    { q: "کدام فصل برای تقویت بدن مناسب‌تر است؟", a: "پاییز", o: ["پاییز", "تابستان", "بهار"], connection: "پاییز فصل جمع‌آوری قواست." },
    { q: "هوای گرم چه تأثیری بر اشتها دارد؟", a: "کاهش می‌دهد", o: ["کاهش می‌دهد", "افزایش می‌دهد"], connection: "گرما حرارت را به بیرون می‌راند." },
    { q: "آیا ورزش در هوای بسیار سرد توصیه می‌شود؟", a: "خیر", o: ["خیر", "بله"], connection: "بدن انرژی زیادی صرف گرم کردن خود می‌کند." },
    { q: "کدام یک از اصول سته ضروریه مستقیماً با 'اخراج' در ارتباط است؟", a: "استفراغ", o: ["استفراغ", "خواب", "غذا"], connection: "اخراج سموم برای بقا لازم است." },
    { q: "هدف نهایی طب سنتی چیست؟", a: "حفظ سلامتی", o: ["حفظ سلامتی", "فقط درمان بیماری", "ثروتمند شدن"], connection: "مهم‌ترین اصل، پیشگیری است." }
];
   

    let currentIdx = 0, score = 0;
    let answered = false;

    function render() {
        if(currentIdx >= quizData.length) { finish(); return; }
        answered = false;
        const data = quizData[currentIdx];
        document.getElementById('counter').innerText = `سوال ${currentIdx + 1} از ${quizData.length}`;
        document.getElementById('score-val').innerText = `امتیاز: ${score}`;
        document.getElementById('q-text').innerText = data.q;
        
        const container = document.getElementById('options');
        container.innerHTML = '';
        data.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            container.appendChild(btn);
        });
    }

    function check(choice, btn) {
        if(answered) return;
        answered = true;
        const correct = quizData[currentIdx].a;
        
        if(choice === correct) {
            btn.className = 'btn correct';
            score++;
        } else {
            btn.className = 'btn wrong';
        }
        
        // وقفه نیم‌ثانیه‌ای برای دیدن نتیجه
        setTimeout(() => {
            currentIdx++;
            render();
        }, 600);
    }

    function finish() {
        document.querySelector('.card').innerHTML = `<h2>پایان آزمون</h2><p>امتیاز نهایی: ${score}</p>`;
        if(score >= 90) document.getElementById('badge').style.display = 'block';
    }

    render();
</script>
</body>
</html>
