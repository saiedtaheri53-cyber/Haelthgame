<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی سته ضروریه</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 10px; margin: 0; }
        #game-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .q-info { text-align: center; color: #7f8c8d; margin-bottom: 10px; font-size: 14px; }
        .question { font-size: 18px; margin-bottom: 20px; color: #34495e; font-weight: bold; line-height: 1.5; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; text-align: right; background: #fff; font-size: 15px; touch-action: manipulation; transition: 0.2s; }
        .option:hover { background: #f0f0f0; }
        .option.correct { background: #2ecc71 !important; color: white; border-color: #27ae60; }
        .option.wrong { background: #e74c3c !important; color: white; border-color: #c0392b; }
        #feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; background: #ecf0f1; color: #2c3e50; font-size: 14px; line-height: 1.6; }
        #next-btn, #portal-btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; font-size: 16px; text-align: center; text-decoration: none; }
        #next-btn { background: #3498db; color: white; display: none; }
        #portal-btn { background: #95a5a6; color: white; margin-top: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>ستهٔ ضروریه</h2>
    <div id="q-number" class="q-info"></div>
    <div class="question" id="q-text"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next-btn" onclick="nextQuestion()">سوال بعد</button>
    <a href="index.html" id="portal-btn">بازگشت به پورتال</a>
</div>

<script>
    const questions = [
    { w: "ستهٔ ضروریه به چند اصل بنیادین اشاره دارد؟", options: ["چهار اصل", "پنج اصل", "شش اصل", "هفت اصل"], answer: 2, h: "«سته» به معنای شش است." },
    { w: "کدام گزینه یکی از اصول شش‌گانهٔ سلامت در طب سنتی است؟", options: ["هوا", "رنگ چشم", "قد", "گروه خونی"], answer: 0, h: "کیفیت هوای تنفسی از اصول شش‌گانه شمرده می‌شود." },
    { w: "کدام مورد در شمار اصول ستهٔ ضروریه قرار می‌گیرد؟", options: ["خواب و بیداری", "رنگ مو", "نوع پوشش", "اندازهٔ دست"], answer: 0, h: "تنظیم خواب و بیداری یکی از شش اصل است." },
    { w: "«حرکت و سکون بدنی» به چه معناست؟", options: ["فعالیت و استراحت جسم", "گفت‌وگو و سکوت", "گرسنگی و سیری", "گرما و سرما"], answer: 0, h: "این اصل به میزان فعالیت جسمی و استراحت مربوط است." },
    { w: "کدام مورد نمونه‌ای از اعراض نفسانی است؟", options: ["خشم", "نوشیدن آب", "راه‌رفتن", "خوابیدن"], answer: 0, h: "هیجان‌هایی مانند خشم و اندوه در این دسته قرار می‌گیرند." },
    { w: "«احتباس» در بیان اصول شش‌گانه بیشتر به چه مفهومی اشاره دارد؟", options: ["نگه‌داشتن مواد ضروری در بدن", "افزایش فعالیت بدنی", "تغییر فصل", "کاهش مدت خواب"], answer: 0, h: "احتباس به نگه‌داری آنچه بدن به آن نیاز دارد اشاره می‌کند." },
    { w: "«استفراغ» در اصطلاح طب سنتی به چه معناست؟", options: ["دفع مواد زائد از بدن", "افزایش خواب", "نگه‌داشتن غذا", "کاهش تنفس"], answer: 0, h: "در این اصطلاح، استفراغ به معنای دفع است، نه الزاماً استفراغ معده." },
    { w: "کدام جفت، دو اصل از ستهٔ ضروریه را کنار هم آورده است؟", options: ["هوا و خواب‌وبیداری", "رنگ چشم و قد", "گروه خونی و سن", "مو و ناخن"], answer: 0, h: "هوا و خواب‌وبیداری هر دو از اصول شش‌گانه‌اند." },
    { w: "کدام گزینه دو اصل بدنی از ستهٔ ضروریه را نشان می‌دهد؟", options: ["حرکت‌وسکون و خوردنی‌ونوشیدنی", "خشم و شادی", "رنگ و بو", "شنیدن و دیدن"], answer: 0, h: "فعالیت جسم و خوراک، هر دو در این مجموعه مطرح‌اند." },
    { w: "در دسته‌بندی ستهٔ ضروریه، خوردنی‌ها و نوشیدنی‌ها به چه چیزی مربوط‌اند؟", options: ["تدبیر خوراک و آشامیدنی", "کیفیت خواب", "هیجان‌های روحی", "هوای محیط"], answer: 0, h: "این اصل به نوع و شیوهٔ مصرف خوراک و نوشیدنی می‌پردازد." },
    { w: "کدام گزینه نام یکی از شش اصل را درست بیان می‌کند؟", options: ["هوا", "رنگ پوست", "اندازهٔ استخوان", "حافظه"], answer: 0, h: "هوا یکی از اصول شناخته‌شدهٔ ستهٔ ضروریه است." },
    { w: "کدام مورد در فهرست اصول شش‌گانه جای دارد؟", options: ["اعراض نفسانی", "رنگ لباس", "نوع خط", "قد"], answer: 0, h: "حالت‌های روانی و هیجانی در این دسته‌بندی مطرح‌اند." },
    { w: "کدام گزینه دربارهٔ ستهٔ ضروریه درست است؟", options: ["مجموعه‌ای از شش عامل مرتبط با تدبیر سلامت است", "فهرستی از شش گیاه دارویی است", "نام شش اندام بدن است", "مجموعه‌ای از شش نوع غذاست"], answer: 0, h: "این عنوان به شش عامل مهم در تدبیر سلامت اشاره دارد." },
    { w: "کدام مورد جزو اصول ستهٔ ضروریه نیست؟", options: ["رنگ چشم", "هوا", "خواب‌وبیداری", "حرکت‌وسکون"], answer: 0, h: "رنگ چشم در شمار اصول شش‌گانه قرار نمی‌گیرد." },
    { w: "در میان گزینه‌ها، کدام‌یک به دفع و خارج‌کردن مواد از بدن مربوط است؟", options: ["استفراغ", "احتباس", "خواب", "هوا"], answer: 0, h: "استفراغ در اصطلاح این اصول، مفهوم دفع دارد." },
    { w: "کدام جفت در اصول شش‌گانه به نگه‌داری و دفع اشاره می‌کند؟", options: ["احتباس و استفراغ", "خواب و بیداری", "گرمی و سردی", "گرسنگی و تشنگی"], answer: 0, h: "این دو مفهوم معمولاً در کنار هم بررسی می‌شوند." },
    { w: "در پرسش از اصول ستهٔ ضروریه، کدام مورد به حالات روانی مربوط می‌شود؟", options: ["اعراض نفسانی", "خوردنی‌ونوشیدنی", "هوا", "حرکت‌وسکون"], answer: 0, h: "اعراض نفسانی به حالات و هیجان‌های روانی اشاره دارد." },
    { w: "کدام مورد به تنظیم چرخهٔ استراحت و فعالیت روزانه مربوط است؟", options: ["خواب و بیداری", "احتباس و استفراغ", "هوا و محیط", "خوردنی‌ونوشیدنی"], answer: 0, h: "این اصل، خواب و بیداری را در کنار هم بررسی می‌کند." },
    { w: "کدام مورد نمونه‌ای از اصل حرکت‌وسکون بدنی است؟", options: ["پیاده‌روی و استراحت", "خشم و شادی", "غذا و نوشیدنی", "تنفس در هوای آزاد"], answer: 0, h: "پیاده‌روی نمونه‌ای از حرکت و استراحت نمونه‌ای از سکون است." },
    { w: "کدام گزینه، همهٔ مواردش از اصول ستهٔ ضروریه هستند؟", options: ["هوا، خواب‌وبیداری، خوردنی‌ونوشیدنی", "رنگ چشم، قد، رنگ مو", "گیاهان، سنگ‌ها، فلزها", "شنیدن، دیدن، بوییدن"], answer: 0, h: "هر سه مورد در فهرست اصول شش‌گانه جای دارند." },
    { w: "تأثیر اصلی هوای نامناسب بر بدن چیست؟", options: ["تغییر مزاج", "تغییر رنگ چشم", "بلندتر شدن قد", "تقویت ناخن"], answer: 0, h: "هوا مستقیماً کیفیت روح و اخلاط را تحت تأثیر قرار می‌دهد." },
    { w: "هوای معتدل در طب سنتی به چه هوایی گفته می‌شود؟", options: ["هوایی که نه سرد است و نه گرم", "هوای کاملاً سرد", "هوای بسیار خشک", "هوای پر از رطوبت"], answer: 0, h: "اعتدال در حرارت و برودت شرط هوای سالم است." },
    { w: "کدام عامل در کیفیت هوا اثرگذار است؟", options: ["وجود گیاهان و فضای سبز", "رنگ دیوار", "نوع فرش", "تعداد پنجره‌ها"], answer: 0, h: "گیاهان و فضای سبز به تصفیه و اعتدال هوا کمک می‌کنند." },
    { w: "تأثیر بادهای موسمی بر مزاج چیست؟", options: ["تغییر در رطوبت و حرارت", "تغییر در رنگ مو", "تأثیر بر حافظه", "افزایش قد"], answer: 0, h: "بادها حامل کیفیت‌های محیطی هستند." },
    { w: "آلودگی هوا در طب سنتی موجب چه تغییری در اخلاط می‌شود؟", options: ["فساد در اخلاط", "تقویت اخلاط", "تعادل اخلاط", "توقف تولید اخلاط"], answer: 0, h: "هوای آلوده موجب فساد کیفیت هوای تنفسی و اخلاط می‌شود." },
    { w: "کدام فصل برای افراد با مزاج گرم خطرناک‌تر است؟", options: ["تابستان", "زمستان", "پاییز", "بهار"], answer: 0, h: "تابستان به دلیل گرما، مزاج گرم را تشدید می‌کند." },
    { w: "هوای کوهستانی معمولاً چه خصوصیتی دارد؟", options: ["لطیف و رقیق", "سنگین و غلیظ", "بسیار گرم", "بسیار مرطوب"], answer: 0, h: "هوا در ارتفاعات لطیف‌تر و رقیق‌تر است." },
    { w: "تنفس در هوای سرد چه تأثیری بر بدن دارد؟", options: ["انقباض و سفتی عروق", "اتساع عروق", "خوشحالی مفرط", "کاهش اشتها"], answer: 0, h: "سرما موجب انقباض و کاهش جریان خون سطحی می‌شود." },
    { w: "کدام گزینه برای تصفیه هوای اتاق توصیه می‌شود؟", options: ["استفاده از گیاهان خوشبو", "بستن تمام منافذ", "افزایش حرارت اتاق", "استفاده از دود غلیظ"], answer: 0, h: "استفاده از گیاهان خوشبو (عطردرمانی) محیط را مطبوع می‌کند." },
    { w: "هوای شهرها معمولاً نسبت به حومه چه تفاوتی دارد؟", options: ["آلوده‌تر و غلیظ‌تر", "لطیف‌تر و پاک‌تر", "سردتر", "مرطوب‌تر"], answer: 0, h: "تراکم جمعیت و آلودگی، هوا را غلیظ می‌کند." },
    { w: "باد شمال معمولاً چه خصوصیتی دارد؟", options: ["سرد و خشک", "گرم و مرطوب", "گرم و خشک", "سرد و مرطوب"], answer: 0, h: "باد شمال در بسیاری از اقلیم‌ها خنک‌کننده است." },
    { w: "تأثیر رطوبت بیش از حد هوا چیست؟", options: ["ایجاد بلغم و سستی", "خشکی پوست", "افزایش حرارت", "تقویت صفرا"], answer: 0, h: "رطوبت زیاد باعث غلبه بلغم می‌شود." },
    { w: "هوای خشک چه اثری بر مخاط دارد؟", options: ["خشکی و التهاب", "ترشح بیش از حد", "نرمی مخاط", "خنکی مخاط"], answer: 0, h: "خشکی هوا مخاط را تحریک و ملتهب می‌کند." },
    { w: "چرا تهویه هوا در طب سنتی اهمیت دارد؟", options: ["جلوگیری از تجمع بخارات زائد", "زیباتر شدن اتاق", "گرم شدن محیط", "کاهش هزینه"], answer: 0, h: "تجمع بخارات زائد در هوای تنفسی مضر است." },
    { w: "تأثیر تابش مستقیم آفتاب بر بدن در ظهر تابستان چیست؟", options: ["غلبه حرارت", "غلبه برودت", "غلبه رطوبت", "تعادل"], answer: 0, h: "گرما و تابش شدید باعث غلبه حرارت می‌شود." },
    { w: "کدام گزینه به هوای «لطیف» اشاره دارد؟", options: ["هوایی که زود نفوذ می‌کند", "هوای بسیار غلیظ", "هوای آلوده", "هوای سرد و سنگین"], answer: 0, h: "هوای لطیف رقیق است و به راحتی به اعضا نفوذ می‌کند." },
    { w: "کدام یک از شرایط محیطی بر کیفیت هوای خواب تأثیر دارد؟", options: ["دمای اتاق", "رنگ پرده", "جنس تخت", "نوع بالش"], answer: 0, h: "دما در خواب بسیار تعیین‌کننده است." },
    { w: "اثر هوای معطر بر روح و روان چیست؟", options: ["تلطیف روح", "تیره شدن ذهن", "خستگی", "گرسنگی"], answer: 0, h: "رایحه‌های خوش باعث تلطیف روح حیوانی می‌شوند." },
    { w: "باد صبا در متون طب سنتی نشانه چیست؟", options: ["هوای معتدل و بهاری", "توفان شدید", "سرمای کشنده", "گرما"], answer: 0, h: "باد صبا نماد اعتدال و رویش است." },
    { w: "هوای غلیظ برای افراد با کدام مزاج مضرتر است؟", options: ["سرد و مرطوب", "گرم و خشک", "گرم و مرطوب", "سرد و خشک"], answer: 0, h: "افراد بلغم‌مزاج به دلیل رطوبت و غلظت بدن، از هوای غلیظ آسیب بیشتری می‌بینند." },
    { w: "بهترین زمان برای نوشیدن آب چه زمانی است؟", options: ["هنگام تشنگی واقعی", "بلافاصله بعد از غذا", "قبل از خواب", "با معده خالیِ بسیار سرد"], answer: 0, h: "نوشیدن آب باید با نیاز واقعی بدن باشد." },
    { w: "چرا جویدن کامل غذا توصیه می‌شود؟", options: ["کمک به هضم اولیه", "کاهش سرعت غذا خوردن", "تقویت دندان", "طولانی شدن زمان غذا"], answer: 0, h: "جویدن، اولین مرحله هضم است و بار معده را کم می‌کند." },
    { w: "مصرف آب یخ چه اثری بر معده دارد؟", options: ["سستی هضم", "تقویت هضم", "کاهش چربی", "افزایش جذب"], answer: 0, h: "سرمای شدید معده را سست و هضم را مختل می‌کند." },
    { w: "غذاهای غلیظ مانند حلیم چه ویژگی دارند؟", options: ["هضم سخت", "هضم سریع", "جذب سریع", "کم‌کالری"], answer: 0, h: "غذاهای غلیظ دیر هضم می‌شوند و انرژی زیادی برای هضم می‌طلبند." },
    { w: "کدام غذا برای معده‌های ضعیف مناسب‌تر است؟", options: ["غذاهای سبک و پخته", "غذای خام", "غذاهای بسیار پر ادویه", "غذاهای سرخ‌کردنی"], answer: 0, h: "غذاهای پخته و سبک راحت‌تر هضم می‌شوند." },
    { w: "مصرف میوه بعد از غذا چه عارضه احتمالی دارد؟", options: ["فساد هضم", "تقویت جذب", "کاهش وزن", "زیبایی پوست"], answer: 0, h: "میوه‌ها سریع هضم می‌شوند و در صورت وجود غذای قبلی در معده، فاسد می‌شوند." },
    { w: "در طب سنتی، «مصلح» به چه معناست؟", options: ["اصلاح‌کننده طبع غذا", "چاشنی غذا", "ظرف غذا", "زمان غذا"], answer: 0, h: "مصلح ماده‌ای است که عوارض طبعی یک غذا را تعدیل می‌کند." },
    { w: "مصلحِ ماست چیست؟", options: ["زنیان یا نعنا", "شکر", "روغن", "آب"], answer: 0, h: "ماست سرد است و افزودن مواد گرم مثل نعنا آن را اصلاح می‌کند." },
    { w: "غذاهای بسیار گرم و پرادویه برای کدام مزاج مضرتر است؟", options: ["گرم", "سرد", "مرطوب", "معتدل"], answer: 0, h: "افراد گرم‌مزاج با مصرف غذای گرم دچار غلبه صفرا می‌شوند." },

    { w: "خوابیدن روی زمین سفت چه اثری دارد؟", options: ["مانع تجمع رطوبت اضافی", "نرمی بدن", "خواب عمیق‌تر", "افزایش گرمی"], answer: 0, h: "بستر سفت مانع از تجمع رطوبت در بدن می‌شود." },

    { w: "ورزش معتدل در طب سنتی چه اثری دارد؟", options: ["افزایش حرارت غریزی و هضم", "تضعیف عضلات", "افزایش چربی", "کند شدن هضم"], answer: 0, h: "ورزش حرارت را به حد مطلوب می‌رساند." },
    { w: "اثر خشم شدید بر بدن چیست؟", options: ["افزایش سریع حرارت صفرا", "کاهش دما", "آرامش کبد", "تولید بلغم"], answer: 0, h: "خشم ناگهانی خون را به سمت قلب و سر می‌راند." },
    { w: "استفراغ در ستهٔ ضروریه به چه معناست؟", options: ["دفع مواد زائد", "حالت تهوع", "خوردن بیش از حد", "خوابیدن"], answer: 0, h: "استفراغ اصطلاحاً به معنای هر نوع دفع فضولات است." },
    { w: "احتباس یعنی چه؟", options: ["نگه داشتن مواد مفید در بدن", "دفع مواد", "ورزش کردن", "خوابیدن"], answer: 0, h: "احتباس به معنای حبس و نگه داشتن چیزهای مورد نیاز است." },
    { w: "ورزشِ شدید قبل از غذا چه ضرری دارد؟", options: ["تحلیل قوای اصلی", "چاقی", "بهبود هضم", "افزایش قد"], answer: 0, h: "ورزش شدید قبل از غذا، رطوبات ضروری را می‌سوزاند." },
    { w: "غم و اندوه طولانی چه اثری بر اعضا دارد؟", options: ["ضعف قلب و کبد (سوداوی)", "تقویت بدن", "افزایش انرژی", "بهبود هضم"], answer: 0, h: "غم اندوه، بدن را سرد و خشک (سوداوی) می‌کند." },
    { w: "کدام گزینه از مصادیق «استفراغ» است؟", options: ["عرق کردن", "خوابیدن", "خشم", "خوردن"], answer: 0, h: "عرق کردن راهی برای دفع فضولات است." },
    { w: "ورزش برای چه زمانی توصیه می‌شود؟", options: ["بعد از هضم غذا", "قبل از غذا", "بلافاصله بعد از غذا", "هنگام گرسنگی مفرط"], answer: 0, h: "ورزش باید زمانی باشد که معده سبک است." },
    { w: "تأثیر شادیِ معتدل بر بدن چیست؟", options: ["تلطیف روح و تقویت قلب", "تضعیف قلب", "تولید بلغم", "سردی بدن"], answer: 0, h: "شادی معتدل خون را به سطح پوست می‌آورد." },
    { w: "ورزش در حمام چه تأثیری دارد؟", options: ["تحلیل زیاد قوا", "کاهش حرارت", "تقویت استخوان", "بدون اثر"], answer: 0, h: "ورزش در حمام به دلیل گرمای محیط، بدن را سریع تحلیل می‌برد." },
    { w: "ترس ناگهانی چه اثری بر بدن دارد؟", options: ["سردی و لرزش (عقب‌نشینی خون)", "گرمی", "شادی", "تقویت"], answer: 0, h: "ترس خون را به عمق می‌کشد و سطح بدن سرد می‌شود." },
    { w: "احتباسِ مدفوع چه عارضه‌ای دارد؟", options: ["مسمومیت بدن و برگشت بخارات", "کاهش وزن", "افزایش انرژی", "خوشحالی"], answer: 0, h: "دفع نکردن فضولات، سموم را در بدن برمی‌گرداند." },
    { w: "ورزش برای کدام مزاج مناسب‌تر است؟", options: ["بلغم‌مزاج (برای تحلیل رطوبت)", "صفراوی (ممکن است شدید شود)", "دموی", "سوداوی"], answer: 0, h: "بلغم‌مزاج‌ها بیشترین نیاز را به ورزش برای دفع رطوبت دارند." },
    { w: "کدام ورزش برای تقویت کلی بدن توصیه شده است؟", options: ["ورزش معتدل و مداوم", "ورزش بسیار شدید", "ورزش نامنظم", "ورزش فقط در شب"], answer: 0, h: "اعتدال و استمرار در ورزش کلید سلامت است." },
    { w: "تأثیر اعراض نفسانی بر هضم چیست؟", options: ["اختلال شدید در هضم", "بهبود هضم", "تغییر طعم غذا", "تغییر کالری"], answer: 0, h: "هیجانات شدید بلافاصله هضم معده را متوقف می‌کنند." },
    { w: "منظور از «حرکت بدنی» در ستهٔ ضروریه چیست؟", options: ["فعالیت‌های ارادی جسمانی", "حرکتِ خون", "حرکتِ غذا", "خوابیدن"], answer: 0, h: "منظور هر نوع حرکت فیزیکی و ورزشی است." },
    { w: "استفراغِ بیش از حد چه اثری دارد؟", options: ["تضعیف قوای جسمانی", "تقویت قوا", "افزایش چربی", "افزایش قد"], answer: 0, h: "دفعِ بیش از حد، موجب ضعف و لاغری مفرط می‌شود." },
    { w: "کدام فعالیت از دستهٔ «سکون» است؟", options: ["استراحت بعد از فعالیت", "دویدن", "پریدن", "کار سخت"], answer: 0, h: "استراحت و بی‌حرکتی، سکون محسوب می‌شود." },
    { w: "آیا اعراض نفسانی قابل کنترل هستند؟", options: ["بله، با تدبیر و تمرین", "خیر، غیرممکن است", "فقط با دارو", "فقط با خواب"], answer: 0, h: "طب سنتی بر مدیریت هیجانات (تدبیر نفس) تأکید دارد." },
    { w: "نتیجه‌گیری کلی ستهٔ ضروریه چیست؟", options: ["تعادل در تمام عوامل برای حفظ سلامت", "فقط خوردن و خوابیدن", "فقط ورزش کردن", "فقط دوری از استرس"], answer: 0, h: "سلامت نتیجهٔ رعایتِ تعادل در هر شش اصل است." }
    ];

    let currentQ = 0;
    let score = 0;

    function getCorrectAnswerText(q) {
        if (typeof q.answer === 'number') {
            return q.options[q.answer];
        }
        return q.answer;
    }

    function render() {
        const q = questions[currentQ];
        const correctText = getCorrectAnswerText(q);
        document.getElementById('q-number').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
        document.getElementById('q-text').innerText = q.w;
        
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        
        let opts = [...q.options];
        opts.sort(() => Math.random() - 0.5);

        opts.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(opt, correctText, btn);
            optDiv.appendChild(btn);
        });
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback').style.display = 'none';
    }

    function check(selected, correctText, btn) {
        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option');
        buttons.forEach(b => b.disabled = true);
        
        if (selected === correctText) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => { if (b.innerText === correctText) b.classList.add('correct'); });
        }
        document.getElementById('feedback').style.display = 'block';
        document.getElementById('feedback').innerText = "پاسخ صحیح: " + correctText + (q.h ? (" | راهنما: " + q.h) : "");
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) render();
        else alert('پایان بازی! امتیاز نهایی شما: ' + score + ' از ' + questions.length);
    }

    render();
</script>
</body>
</html>
