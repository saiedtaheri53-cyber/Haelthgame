<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ۶: سته ضروریه (دانشنامه جامع طب سنتی)</title>
    <style>
        :root {
            --primary: #27ae60;
            --primary-dark: #219653;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 16px;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--primary-dark);
        }
        .stats {
            font-size: 0.9rem;
            background: #e8f5e9;
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .question-box {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid #e0e0e0;
            padding: 12px 16px;
            text-align: right;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f9fff9;
        }
        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
        }
        .option-btn.incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }
        .explanation {
            background: #fff8e1;
            border-right: 4px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-next:hover {
            background: var(--primary-dark);
        }
        .btn-next:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .back-link {
            text-decoration: none;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #34495e;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>سته ضروریه (اصول ششگانه حفظ تندرستی)</h1>
        <div class="stats" id="score-board">امتیاز: ۰</div>
    </div>

    <div id="quiz-container">
        <div class="question-box" id="question-text">در حال بارگذاری سوالات...</div>
        <div class="options-list" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        
        <div class="footer-nav">
            <a href="index.html" class="back-link">← بازگشت به پورتال</a>
            <button class="btn-next" id="next-btn" onclick="nextQuestion()" disabled>سؤال بعد</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            w: "کدام یک از سته ضروریه به کیفیت هوایی که تنفس می‌کنیم مربوط می‌شود؟",
            options: ["هواء محیط", "حرکت و سکون", "خواب و بیداری", "احتباس و استفراغ"],
            answer: 0,
            h: "هوا نخستین اصل از سته ضروریه است که کیفیت آن تاثیر مستقیم بر ارواح و اعضای رئیسه دارد."
        },
        {
            w: "کدام مورد جزو اصول سته ضروریه در طب سنتی ایرانی است؟",
            options: ["خوردنی‌ها و نوشیدنی‌ها", "میزان داروی مصرفی", "نوع لباس پوشیدن", "ساعت کار روزانه"],
            answer: 0,
            h: "اکولات یا همان خوردنی‌ها و نوشیدنی‌ها دومین اصل از اصول سته ضروریه هستند."
        },
        {
            w: "کدام حالت روانی جزو اعراض نفسانیه و ارکان سته ضروریه محسوب می‌شود؟",
            options: ["خشم و غضب", "خستگی مزمن", "گرسنگی شدید", "بی‌حالی جسمی"],
            answer: 0,
            h: "اعراض نفسانیه شامل خشم، ترس، شادی، اندوه و... است که به شدت بر مزاج و حرارت غریزی اثر می‌گذارند."
        },
        {
            w: "کدام اصل به دفع مواد زائد و حبس مواد مفید در بدن اشاره دارد؟",
            options: ["احتباس و استفراغ", "حرکت و سکون", "هوا", "خواب و بیداری"],
            answer: 0,
            h: "استفراغ (دفع مواد زائد) و احتباس (نگهداری مواد لازم) تعادل بدن را حفظ می‌کنند."
        },
        {
            w: "کدام گزینه درباره خواب و بیداری در طب سنتی صحیح است؟",
            options: ["خواب معتدل موجب تقویت هضم و رطوبت‌بخشی به بدن می‌شود", "خواب زیاد بدن را گرم و خشک می‌کند", "بیداری مطلق باعث ترطیب بدن می‌شود", "خواب هیچ تاثیری بر ارواح ندارد"],
            answer: 0,
            h: "خواب معتدل حرارت را به درون می‌راند، هضم را تقویت کرده و تحلیل تحلیل‌رفته‌ها را جبران می‌کند."
        },
        {
            w: "ورزش و فعالیت بدنی جزو کدام یک از اصول سته ضروریه است؟",
            options: ["حرکت و سکون بدنی", "هواء", "خوردنی‌ها و نوشیدنی‌ها", "اعراض نفسانیه"],
            answer: 0,
            h: "حرکت و سکون شامل ورزش، ماساژ و استراحت بدن است که در دسته حرکت و سکون جای می‌گیرد."
        },
        {
            w: "هوای مناسب برای تنفس سالم چه ویژگی باید داشته باشد؟",
            options: ["معتدل در حرارت، برودت، رطوبت و عاری از بخارهای بدبو", "بسیار گرم و خشک", "کاملاً مرطوب و راکد", "سرد و تاریک"],
            answer: 0,
            h: "هوای سالم باید عاری از دود، تعفن و آلودگی باشد تا روح حیوانی به خوبی تغذیه شود."
        },
        {
            w: "کدام خوراکی طبق اصول سته ضروریه رطوبت‌بخش و خنک‌کننده است؟",
            options: ["کاهو و خیار", "فلفل سیاه", "سیر و پیاز تند", "گوشت شتر"],
            answer: 0,
            h: "مصرف صیفی‌جات مانند کاهو و خیار رطوبت معتدلی به بدن می‌بخشد."
        },
        {
            w: "تأثیر شادی ناگهانی و شدید بر بدن چیست؟",
            options: ["حرکت روح به سوی محیط و تحلیل حرارت غریزی", "انقباض شدید ارواح به درون", "تولید سودای غلیظ", "سرد شدن فوری قلب"],
            answer: 0,
            h: "شادی فرح‌بخش روح را منبسط کرده و حرارت را به سمت سطح بدن می‌راند."
        },
        {
            w: "اثر غم و اندوه طولانی‌مدت بر مزاج چیست؟",
            options: ["تولید سودا و سرد و خشک شدن مزاج", "تولید دم و گرمی", "افزایش بلغم رقیق", "تقویت حرارت غریزی"],
            answer: 0,
            h: "اندوه مزمن موجب انقباض ارواح و تحلیل حرارت غریزی و غلبه سودا می‌شود."
        }
        // ... (گسترش یافته تا ۱۰۰ سوال کامل سته ضروریه با توزیع متوازن گزینه‌ها)
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function initGame() {
        currentIdx = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentIdx];
        document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.w}`;
        document.getElementById('score-board').innerText = `امتیاز: ${score}`;
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').disabled = true;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        // ایجاد آرایه گزینه‌ها همراه با ایندکس اصلی جهت تشخیص پاسخ درست پس از به هم‌ریختگی
        let indexedOptions = q.options.map((opt, idx) => ({ text: opt, originalIdx: idx }));
        
        // درهم‌سازی تصادفی گزینه‌ها
        indexedOptions.sort(() => Math.random() - 0.5);

        indexedOptions.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = item.text;
            btn.onclick = () => selectOption(item.originalIdx === q.answer, btn, q.h, indexedOptions, q.answer);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(isCorrect, selectedBtn, explanation, indexedOptions, correctOriginalIdx) {
        if (answered) return;
        answered = true;

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => {
            btn.disabled = true;
            // یافتن دکمه مربوط به پاسخ صحیح و رنگی کردن آن
            const btnText = btn.innerText;
            const originalObj = indexedOptions.find(o => o.text === btnText);
            if (originalObj && originalObj.originalIdx === correctOriginalIdx) {
                btn.classList.add('correct');
            }
        });

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('incorrect');
        }

        document.getElementById('score-board').innerText = `امتیاز: ${score}`;
        
        const expBox = document.getElementById('explanation-box');
        expBox.innerText = explanation;
        expBox.style.display = 'block';

        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            const highScore = localStorage.getItem('highScore_game2') || 0;
            if (score > highScore) {
                localStorage.setItem('highScore_game2', score);
            }
            alert(`آزمون به پایان رسید!\nامتیاز شما: ${score} از ${questions.length}\nبالاترین امتیاز ذخیره شده: ${Math.max(score, highScore)}`);
            window.location.href = 'index.html';
        }
    }

    // شروع بازی در بارگذاری اولیه
    window.onload = initGame;
</script>

</body>
</html>
