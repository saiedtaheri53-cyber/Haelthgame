<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی سته ضروریه</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .game-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
        }
        h2 { color: #2c3e50; text-align: center; font-size: 1.4rem; margin-top: 0; }
        .score-board {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #e8f4f8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #2980b9;
            font-size: 14px;
        }
        @media (min-width: 400px) { .score-board { flex-direction: row; justify-content: space-between; } }
        #q-number { font-size: 13px; color: #7f8c8d; margin-bottom: 8px; }
        #q-text { font-size: 17px; color: #34495e; margin-bottom: 15px; line-height: 1.6; font-weight: bold; }
        .option-btn {
            display: block;
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 10px;
            background: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: right;
            transition: all 0.2s;
        }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #2ecc71 !important; color: white; border-color: #27ae60 !important; }
        .option-btn.wrong { background: #e74c3c !important; color: white; border-color: #c0392b !important; }
        #feedback { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.5; }
        #next-btn { display: none; margin-top: 15px; width: 100%; padding: 14px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .portal-link { display: block; text-align: center; margin-top: 25px; color: #7f8c8d; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="game-container">
    <h2>بازی سته ضروریه</h2>
    <div class="score-board">
        <span id="score-display">امتیاز: 0</span>
        <span id="golden-score-display">🌟 امتیاز طلایی: 0</span>
    </div>
    
    <div id="q-number"></div>
    <div id="q-text"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next-btn" onclick="nextQuestion()">سوال بعد</button>
    
    <a href="index.html" class="portal-link">بازگشت به دانشنامه جامع (پورتال)</a>
</div>

<script>
    // دیتای سوالات (نمونه - شما باید تمام ۱۰۰ سوال خود را با این فرمت در اینجا قرار دهید)
    // نکته مهم: مقدار answer باید ایندکس گزینه درست باشد (0 تا 3)
    const questions = [
        { w: "ستهٔ ضروریه به چند اصل بنیادین اشاره دارد؟", options: ["چهار اصل", "پنج اصل", "شش اصل", "هفت اصل"], answer: 2, h: "«سته» به معنای شش است." },
        { w: "کدام مورد یکی از اصول شش‌گانه سلامت است؟", options: ["هوا", "رنگ چشم", "قد", "گروه خونی"], answer: 0, h: "کیفیت هوای تنفسی از اصول شش‌گانه است." },
        // ... بقیه ۱۰۰ سوال را اینجا کپی کنید
    ];

    let currentQ = parseInt(localStorage.getItem('game2_currentQ')) || 0;
    let score = parseInt(localStorage.getItem('game2_score')) || 0;
    let goldenScore = parseInt(localStorage.getItem('goldenScore')) || 0;
    let answered = false;

    function initGame() {
        document.getElementById('golden-score-display').innerText = `🌟 امتیاز طلایی: ${goldenScore}`;
        document.getElementById('score-display').innerText = `امتیاز: ${score}`;
        if (currentQ >= questions.length) {
            showFinalResult();
            return;
        }
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQ];
        document.getElementById('q-number').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
        document.getElementById('q-text').innerText = q.w;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(idx, btn) {
        if (answered) return;
        answered = true;
        const q = questions[currentQ];
        const allBtns = document.querySelectorAll('.option-btn');
        
        if (idx === q.answer) {
            btn.classList.add('correct');
            score += 10;
            showFeedback("آفرین! پاسخ صحیح بود.", "#d4edda", "#155724");
        } else {
            btn.classList.add('wrong');
            allBtns[q.answer].classList.add('correct');
            showFeedback(`اشتباه بود. ${q.h}`, "#f8d7da", "#721c24");
        }

        document.getElementById('score-display').innerText = `امتیاز: ${score}`;
        localStorage.setItem('game2_score', score);
        localStorage.setItem('game2_currentQ', currentQ); // ذخیره برای بازگشت
        document.getElementById('next-btn').style.display = 'block';
    }

    function showFeedback(text, bg, color) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.style.display = 'block';
        fb.style.backgroundColor = bg;
        fb.style.color = color;
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            localStorage.setItem('game2_currentQ', currentQ);
            loadQuestion();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        const container = document.querySelector('.game-container');
        container.innerHTML = `
            <h2>پایان بازی!</h2>
            <div style="text-align:center; font-size:1.2rem; margin:20px 0;">
                امتیاز نهایی شما: ${score}<br>
                امتیاز طلایی: ${goldenScore}
            </div>
            <button onclick="location.reload()" class="option-btn" style="text-align:center">دوباره بازی کنید</button>
            <a href="index.html" class="portal-link">بازگشت به پورتال</a>
        `;
    }

    initGame();
</script>

</body>
</html>
