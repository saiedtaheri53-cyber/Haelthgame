<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشنامه سته ضروریه - نسخه نهایی</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .q-box { font-size: 19px; color: #2c3e50; margin-bottom: 25px; min-height: 60px; line-height: 1.6; }
        .btn { display: block; width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 15px; cursor: pointer; font-size: 17px; font-weight: bold; transition: 0.2s; color: white; }
        .btn-yes { background: #27ae60; }
        .btn-no { background: #c0392b; }
        .progress { font-size: 14px; color: #7f8c8d; margin-top: 15px; }
        .golden-badge { color: #f39c12; font-size: 24px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

<div class="box" id="game-box">
    <div class="q-box" id="q-text">در حال بارگذاری دانشنامه...</div>
    <div id="options">
        <button class="btn btn-yes" onclick="checkAnswer('بله')">بله</button>
        <button class="btn btn-no" onclick="checkAnswer('خیر')">خیر</button>
    </div>
    <div class="progress" id="status">سوال ۱ از ۱۰۰</div>
</div>

<script>
    // کلید پاسخ‌دهی (ترکیب دقیق بله و خیر)
    const questions = [
        {q: "آیا هوای محیط اولین اصل از سته ضروریه است؟", a: "بله"}, {q: "آیا خواب روز برای همگان مفید است؟", a: "خیر"},
        {q: "آیا پرخوری از عوامل اصلی بیماری است؟", a: "بله"}, {q: "آیا نوشیدن آب یخ در ناشتا مفید است؟", a: "خیر"},
        {q: "آیا ورزش شدید بعد از غذا توصیه می‌شود؟", a: "خیر"}, {q: "آیا انفعالات نفسانی بر کبد اثر دارد؟", a: "بله"},
        {q: "آیا یبوست مزاج مادر بیماری‌هاست؟", a: "بله"}, {q: "آیا خواب بعد از غروب مفید است؟", a: "خیر"},
        {q: "آیا هوای متعفن باعث فساد روح می‌شود؟", a: "بله"}, {q: "آیا سکون بیش از حد باعث سستی اعضا است؟", a: "بله"},
        {q: "آیا نوشیدن آب بین غذا مفید است؟", a: "خیر"}, {q: "آیا برای هر فرد باید سته را شخصی‌سازی کرد؟", a: "بله"},
        {q: "آیا شادی مفرط می‌تواند باعث سکته شود؟", a: "بله"}, {q: "آیا پیاده‌روی سریع بعد از غذا توصیه می‌شود؟", a: "خیر"},
        {q: "آیا هوای آلوده موجب انقباض مسام بدن می‌شود؟", a: "خیر"}, {q: "آیا خوردن نان سبوس‌دار مفید است؟", a: "بله"},
        {q: "آیا ورزش تا حد تعریق مفید است؟", a: "بله"}, {q: "آیا بیداری بیش از حد باعث رطوبت مغز است؟", a: "خیر"},
        {q: "آیا حمام رفتن بیش از حد باعث تقویت بدن است؟", a: "خیر"}, {q: "آیا خشم زیاد قلب را سرد می‌کند؟", a: "خیر"},
        {q: "آیا دفع مواد زائد (استفراغ) از اصول سته است؟", a: "بله"}, {q: "آیا خوردن میوه همراه غذا مضر است؟", a: "بله"},
        {q: "آیا هوای کوهستان برای ریه مضر است؟", a: "خیر"}, {q: "آیا استراحت بعد از ورزش لازم است؟", a: "بله"},
        {q: "آیا غم زیاد موجب گرمی مزاج می‌شود؟", a: "خیر"}, {q: "آیا خواب با شکم پر مفید است؟", a: "خیر"},
        {q: "آیا سته ضروریه ۶ اصل دارد؟", a: "بله"}, {q: "آیا بدون رعایت سته، دارو اثر کامل دارد؟", a: "خیر"},
        {q: "آیا باید از خوردن غذاهای فاسد اجتناب کرد؟", a: "بله"}, {q: "آیا تعادل در سته ضروریه یعنی سلامتی؟", a: "بله"},
        {q: "آیا هوای خنک صبحگاهی برای مغز مضر است؟", a: "خیر"}, {q: "آیا ماساژ جزو حرکات بدنی است؟", a: "بله"},
        {q: "آیا خواب کافی برای تقویت حافظه لازم است؟", a: "بله"}, {q: "آیا مصرف نمک بیش از حد مفید است؟", a: "خیر"},
        {q: "آیا افسردگی باعث سردی معده می‌شود؟", a: "بله"}, {q: "آیا جویدن کامل غذا هضم را بدتر می‌کند؟", a: "خیر"},
        {q: "آیا سته ضروریه برای کودکان کاربرد ندارد؟", a: "خیر"}, {q: "آیا عرق کردن بیش از حد باعث ضعف قلب است؟", a: "بله"},
        {q: "آیا هوای گرم باعث افزایش اشتها می‌شود؟", a: "خیر"}, {q: "آیا خوابیدن روی شکم توصیه می‌شود؟", a: "خیر"},
        {q: "آیا رعایت آداب غذا خوردن ضروری است؟", a: "بله"}, {q: "آیا پیاده‌روی روی زمین ناهموار مفید است؟", a: "بله"},
        {q: "آیا احتباس حیض برای زنان مفید است؟", a: "خیر"}, {q: "آیا تخلیه کامل مثانه ضروری است؟", a: "بله"},
        {q: "آیا نگرانی دائمی سیستم ایمنی را تقویت می‌کند؟", a: "خیر"}, {q: "آیا عشق و امید به سلامتی کمک می‌کند؟", a: "بله"},
        {q: "آیا بیداری بین‌الطلوعین برای سلامتی مفید است؟", a: "خیر"}, {q: "آیا هوای خشک برای ریه مفید است؟", a: "خیر"},
        {q: "آیا خواب در هوای باز مضر است؟", a: "خیر"}, {q: "آیا ورزش باعث باز شدن منافذ پوست می‌شود؟", a: "بله"},
        {q: "آیا اسهال بیش از حد بدن را قوی می‌کند؟", a: "خیر"}, {q: "آیا خشم آنی خون را به جوش می‌آورد؟", a: "بله"},
        {q: "آیا آرامش ذهنی هضم را بهبود می‌دهد؟", a: "بله"}, {q: "آیا خوردن غذا در حال عصبانیت مفید است؟", a: "خیر"},
        {q: "آیا خواب ظهر (قیلوله) باید طولانی باشد؟", a: "خیر"}, {q: "آیا بی خوابی باعث شادابی پوست می‌شود؟", a: "خیر"},
        {q: "آیا ورزش برای افراد پیر باید سنگین باشد؟", a: "خیر"}, {q: "آیا حرکات ناگهانی در ورزش مفید است؟", a: "خیر"},
        {q: "آیا پاکسازی بدن از اخلاط فاسد ضروری است؟", a: "بله"}, {q: "آیا سته ضروریه شامل مسائل معنوی است؟", a: "بله"},
        {q: "آیا هوای بارانی برای همه مفید است؟", a: "خیر"}, {q: "آیا هوای آلوده شهر برای بیماران ریوی مفید است؟", a: "خیر"},
        {q: "آیا حمام آب داغ بدن را قوی می‌کند؟", a: "خیر"}, {q: "آیا پرخوری در شب موجب خواب خوب می‌شود؟", a: "خیر"},
        {q: "آیا سکوت و آرامش برای اعصاب مفید است؟", a: "بله"}, {q: "آیا سته ضروریه برای همه سنین کاربرد دارد؟", a: "بله"},
        {q: "آیا طب سنتی بر پیشگیری تاکید دارد؟", a: "بله"}, {q: "آیا گوش دادن به موسیقی ملایم روح را شاد می‌کند؟", a: "بله"},
        {q: "آیا درسته که «معده خانه بیماری است»؟", a: "بله"}, {q: "آیا هوای معتدل برای تنفس بد است؟", a: "خیر"},
        {q: "آیا بیداری بیش از حد باعث خشکی مغز می‌شود؟", a: "بله"}, {q: "آیا خوردن قبل از هضم غذای قبلی مفید است؟", a: "خیر"},
        {q: "آیا کم‌خوری (نه گرسنگی) موجب سلامتی است؟", a: "بله"}, {q: "آیا کیفیت غذا بر کیفیت خون بی‌اثر است؟", a: "خیر"},
        {q: "آیا ورزش جزو اصول سته است؟", a: "بله"}, {q: "آیا پیاده‌روی ملایم بهترین ورزش نیست؟", a: "خیر"},
        {q: "آیا تعریق مناسب برای بدن مضر است؟", a: "خیر"}, {q: "آیا احتباس مواد زائد باعث بیماری‌های مزمن است؟", a: "بله"},
        {q: "آیا ترس شدید موجب قدرت روح می‌شود؟", a: "خیر"}, {q: "آیا شادی معتدل برای روح مفید است؟", a: "بله"},
        {q: "آیا هوای بسیار گرم برای قلب مفید است؟", a: "خیر"}, {q: "آیا نوشیدن آب جوشیده مضر است؟", a: "خیر"},
        {q: "آیا تفکر بیش از حد مغز را تقویت می‌کند؟", a: "خیر"}, {q: "آیا هوای سرد همیشه برای بدن مفید است؟", a: "خیر"},
        {q: "آیا خواب کافی از اصول سته نیست؟", a: "خیر"}, {q: "آیا ورزش در هوای آلوده مفید است؟", a: "خیر"},
        {q: "آیا دفع مدفوع روزانه لازم نیست؟", a: "خیر"}, {q: "آیا دفع ادرار نباید منظم باشد؟", a: "خیر"},
        {q: "آیا غم زیاد موجب سردی مزاج می‌شود؟", a: "بله"}, {q: "آیا پیاده‌روی سریع بعد از ورزش لازم است؟", a: "خیر"},
        {q: "آیا سته ضروریه همان سبک زندگی صحیح است؟", a: "بله"}, {q: "آیا خوردن نان سفید برای همه مفید است؟", a: "خیر"},
        {q: "آیا هوای کوهستان برای ریه مفید است؟", a: "بله"}, {q: "آیا خواب روز برای بیمار مفید است؟", a: "خیر"},
        {q: "آیا تعادل در سته ضروریه یعنی بیماری؟", a: "خیر"}, {q: "آیا طب سنتی علمی قدیمی و منسوخ است؟", a: "خیر"}
    ];

    let cur = 0, score = 0;

    function checkAnswer(ans) {
        if (ans === questions[cur].a) score++;
        cur++;
        if (cur < questions.length) {
            update();
        } else {
            showResult();
        }
    }

    function update() {
        document.getElementById('q-text').innerText = questions[cur].q;
        document.getElementById('status').innerText = `سوال ${cur + 1} از ۱۰۰`;
    }

    function showResult() {
        const isGolden = score === 100;
        document.getElementById('game-box').innerHTML = `
            ${isGolden ? '<div class="golden-badge">🌟 متخصص طب سنتی</div>' : '<h2>پایان آزمون</h2>'}
            <p>امتیاز شما: <strong>${score} از ۱۰۰</strong></p>
            <button class="btn" style="background:#3498db" onclick="location.reload()">شروع مجدد دانشنامه</button>
        `;
    }

    update();
</script>
</body>
</html>
