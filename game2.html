<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه - ۱۰۰ سوال تخصصی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #e8f5e9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .game-container { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; font-size: 1.5rem; text-align: center; }
        .section { display: none; margin-top: 20px; }
        .active { display: block; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: center; font-size: 1rem; }
        .btn:hover { background: #388e3c; }
        #question-box { font-size: 1.1rem; margin: 20px 0; line-height: 1.6; }
        .progress-bar { height: 10px; background: #ddd; border-radius: 5px; margin-bottom: 20px; }
        #progress-fill { height: 100%; width: 0%; background: #2e7d32; border-radius: 5px; transition: 0.3s; }
        .badge { display: none; text-align: center; padding: 20px; background: #ffd700; border-radius: 10px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="intro-section" class="section active">
        <h1>سته ضروریه</h1>
        <p><strong>راهنما:</strong> شش اصل ضروری برای حفظ سلامتی که هر طبیبی باید بداند.</p>
        <p><strong>ارتباط:</strong> این شش اصل (هوا، غذا، خواب، حرکت، دفع، اعراض نفسانی) اساس حفظ الصحه هستند.</p>
        <button class="btn" onclick="startGame()">شروع آزمون</button>
    </div>

    <div id="quiz-section" class="section">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="q-counter">سوال ۱ از ۱۰۰</div>
        <div id="question-box"></div>
        <div id="options-box"></div>
    </div>

    <div id="result-section" class="section">
        <h2>پایان آزمون</h2>
        <p id="score-text"></p>
        <div id="badge-gold" class="badge">🏆 نشان طلایی طب را کسب کردید!</div>
        <button class="btn" onclick="location.reload()">بازی مجدد</button>
    </div>
</div>

<script>
    const quizData = [
        {q:"هوای محیط از کدام سته ضروریه است؟", a:"هوا", o:["هوا", "غذا", "خواب"]},
        {q:"آیا خواب زیاد موجب غلبه رطوبت می‌شود؟", a:"بله", o:["بله", "خیر"]},
        {q:"ورزشِ اسب‌سواری برای تقویت کدام عضو مفید است؟", a:"کل بدن", o:["کل بدن", "فقط پا", "کبد"]},
        {q:"دفع مواد زائد از ضروریات کدام بخش است؟", a:"استفراغ", o:["استفراغ", "احتباس", "هوا"]},
        {q:"خشمِ شدید کدام مزاج را در بدن فعال می‌کند؟", a:"صفرا", o:["صفرا", "بلغم", "دم"]},
        {q:"آیا نوشیدن آب بلافاصله بعد غذا توصیه شده؟", a:"خیر", o:["بله", "خیر"]},
        {q:"بهترین زمان برای خوابِ با کیفیت چه زمانی است؟", a:"شب", o:["روز", "شب"]},
        {q:"استفاده از غذای مانده باعث افزایش کدام خلط می‌شود؟", a:"سودا", o:["سودا", "صفرا", "دم"]},
        {q:"کدام حرکت برای تقویت قلب توصیه شده است؟", a:"پیاده‌روی", o:["پیاده‌روی", "پرخوری", "خواب طولانی"]},
        {q:"آیا غم و اندوه باعث سردی مزاج می‌شود؟", a:"بله", o:["بله", "خیر"]},
        {q:"کدام یک از سته ضروریه بیشترین تاثیر در دفع دارد؟", a:"ورزش", o:["ورزش", "خواب", "هوا"]},
        {q:"هوای آلوده چه تاثیری بر روح دارد؟", a:"تضعیف", o:["تقویت", "تضعیف", "خنثی"]},
        {q:"غذای غلیظ برای کدام مزاج سنگین است؟", a:"بلغم", o:["بلغم", "صفرا", "دم"]},
        {q:"خواب در روز چه تاثیری بر بدن دارد؟", a:"سستی", o:["سستی", "تقویت", "دفع"]},
        {q:"کدام عامل موجب خشکی پوست می‌شود؟", a:"خشم", o:["خشم", "شادی", "خواب"]},
        {q:"آیا حمام رفتن بلافاصله بعد غذا توصیه می‌شود؟", a:"خیر", o:["بله", "خیر"]},
        {q:"غذای شور باعث افزایش کدام خلط می‌شود؟", a:"صفرا", o:["صفرا", "بلغم", "سودا"]},
        {q:"ورزش باید تا چه زمانی ادامه یابد؟", a:"سرخ شدن پوست", o:["تا خستگی", "سرخ شدن پوست", "تا سیری"]},
        {q:"اعراض نفسانی شامل چه مواردی است؟", a:"شادی و غم", o:["شادی و غم", "غذا", "ورزش"]},
        {q:"هوای معتدل باعث تعادل کدام خلط می‌شود؟", a:"دم", o:["دم", "سودا", "بلغم"]},
        {q:"خواب زیاد باعث کدام اختلال می‌شود؟", a:"کندی ذهن", o:["کندی ذهن", "هوشیاری", "تقویت"]},
        {q:"دفع مدفوع منظم از نشانه‌های سلامت چیست؟", a:"کبد و گوارش", o:["کبد و گوارش", "قلب", "مغز"]},
        {q:"ترس زیاد باعث کدام وضعیت در بدن می‌شود؟", a:"سرد و خشک", o:["سرد و خشک", "گرم و تر", "گرم و خشک"]},
        {q:"آیا سیری قبل از هضم غذای قبلی مفید است؟", a:"خیر", o:["بله", "خیر"]},
        {q:"شادی معتدل باعث کدام فرآیند می‌شود؟", a:"انبساط روح", o:["انبساط روح", "تنگ‌دلی", "انقباض"]},
        {q:"هوای گرم چه اثری بر کبد دارد؟", a:"افزایش صفرا", o:["افزایش صفرا", "کاهش صفرا", "تعادل"]},
        {q:"خواب در شب موجب کدام فرآیند می‌شود؟", a:"هضم کامل", o:["هضم کامل", "تولید بلغم", "سردی"]},
        {q:"ورزش قبل از غذا چه تاثیری دارد؟", a:"اشتهای کاذب", o:["اشتهای کاذب", "هضم سریع", "دفع"]},
        {q:"احتباس مواد زائد باعث کدام بیماری می‌شود؟", a:"سموم بدن", o:["سموم بدن", "سبکی", "شادی"]},
        {q:"آیا مصرف میوه بعد از غذا توصیه شده؟", a:"خیر", o:["بله", "خیر"]},
        {q:"کدام سته ضروریه «ام‌الامراض» را دفع می‌کند؟", a:"دفع", o:["دفع", "هوا", "خواب"]},
        {q:"تغذیه بیش از حد باعث افزایش کدام خلط می‌شود؟", a:"بلغم", o:["بلغم", "صفرا", "سودا"]},
        {q:"ورزش در هوای سرد چه مزیتی دارد؟", a:"گرمازایی", o:["گرمازایی", "سردی", "خشکی"]},
        {q:"خوابِ نیمروز برای کدام مزاج مضر است؟", a:"بلغم", o:["بلغم", "دم", "صفرا"]},
        {q:"اعراض نفسانی چگونه بر گوارش اثر می‌گذارند؟", a:"مستقیم", o:["مستقیم", "غیرمستقیم", "اصلا"]},
        {q:"هوای سالم اولین اصل از کدام گروه است؟", a:"سته ضروریه", o:["سته ضروریه", "خلط اربعه", "مزاج"]},
        {q:"برای رفع سودا، کدام مورد مفید است؟", a:"شادی", o:["شادی", "خشم", "غم"]},
        {q:"آیا ورزشِ سبک بعد از غذا توصیه می‌شود؟", a:"خیر", o:["بله", "خیر"]},
        {q:"خوابِ بیش از حد، حافظه را چگونه می‌کند؟", a:"تضعیف", o:["تقویت", "تضعیف", "بهتر"]},
        {q:"کدام نوع ورزش برای پیران مناسب است؟", a:"ملایم", o:["ملایم", "سنگین", "بسیار زیاد"]},
        {q:"اهمیت «دفع» در حفظ سلامتی چقدر است؟", a:"بسیار زیاد", o:["بسیار کم", "معمولی", "بسیار زیاد"]},
        {q:"آیا فکرِ زیاد باعث خشکی مغز می‌شود؟", a:"بله", o:["بله", "خیر"]},
        {q:"کدام خلط با ورزش مداوم کاهش می‌یابد؟", a:"بلغم", o:["بلغم", "دم", "صفرا"]},
        {q:"غذای لطیف برای کدام عضو مفید است؟", a:"مغز", o:["مغز", "استخوان", "عضله"]},
        {q:"خوابیدن بلافاصله بعد از ورزش چه حکمی دارد؟", a:"مضر است", o:["مضر است", "مفید است", "خنثی"]},
        {q:"آیا عطر خوش جزو سته ضروریه است؟", a:"بله", o:["بله", "خیر"]},
        {q:"برای درمان صفرا، کدام مورد مفید است؟", a:"آرامش", o:["آرامش", "خشم", "شادی زیاد"]},
        {q:"آیا گرسنگی مفرط از سته ضروریه است؟", a:"خیر", o:["بله", "خیر"]},
        {q:"کدام فعالیت باعث تعادل مزاج می‌شود؟", a:"ورزش", o:["ورزش", "پرخوری", "خواب روز"]},
        {q:"اثر هوای پاک بر تنفس چیست؟", a:"تصفیه", o:["تصفیه", "آلودگی", "سنگینی"]},
        {q:"خواب کافی باعث کدام مورد می‌شود؟", a:"تعادل", o:["تعادل", "افزایش بلغم", "بی‌خوابی"]},
        {q:"ورزش شدید در هوای گرم چه خطری دارد؟", a:"غلبه صفرا", o:["غلبه صفرا", "کاهش بلغم", "رفع سودا"]},
        {q:"دفع ادرار مکرر نشانه چیست؟", a:"ضعف مثانه", o:["ضعف مثانه", "سلامت", "قوی بودن"]},
        {q:"آیا گوش دادن به موسیقی ملایم مفید است؟", a:"بله", o:["بله", "خیر"]},
        {q:"کدام مزاج با غذای سرد متعادل می‌شود؟", a:"صفرا", o:["صفرا", "بلغم", "سودا"]},
        {q:"خوابِ کم باعث خشکی کدام عضو می‌شود؟", a:"مغز", o:["مغز", "کبد", "قلب"]},
        {q:"آیا ورزشِ صبحگاهی توصیه شده است؟", a:"بله", o:["بله", "خیر"]},
        {q:"برای کاهش سودا، چه نوع حرکتی مفید است؟", a:"ملایم", o:["ملایم", "سریع", "نداشتن حرکت"]},
        {q:"اهمیت سته ضروریه در چیست؟", a:"پیشگیری", o:["پیشگیری", "درمان فقط", "تزئین"]},
        {q:"هوای کوهستان برای کدام عضو مفید است؟", a:"ریه", o:["ریه", "معده", "کبد"]},
        {q:"آیا دفع عرقیات از سته ضروریه است؟", a:"بله", o:["بله", "خیر"]},
        {q:"خشم، حرارت را به کجا می‌برد؟", a:"قلب", o:["قلب", "معده", "کلیه"]},
        {q:"برای کاهش بلغم، کدام مورد مفید است؟", a:"ورزش", o:["ورزش", "خواب", "غذای مرطوب"]},
        {q:"غذای اصلی باید چگونه باشد؟", a:"معتدل", o:["معتدل", "سریع هضم", "دیر هضم"]},
        {q:"خوابِ بعد از حمام چه تاثیری دارد؟", a:"تولید بلغم", o:["تولید بلغم", "پاکسازی", "تقویت"]},
        {q:"اعراض نفسانی در کدام کتاب طب ذکر شده؟", a:"قانون", o:["قانون", "شاهنامه", "گلستان"]},
        {q:"هوای سرد چه اثری بر هضم دارد؟", a:"کاهش", o:["کاهش", "افزایش", "تاثیر ندارد"]},
        {q:"دفع مواد زائد چه اثری بر پوست دارد؟", a:"شفافیت", o:["شفافیت", "تیرگی", "زبری"]},
        {q:"خشم چه اثری بر کبد دارد؟", a:"تحریک", o:["تحریک", "تضعیف", "خاموشی"]},
        {q:"آیا چرت زدن عصرانه مفید است؟", a:"خیر", o:["بله", "خیر"]},
        {q:"ورزش در هوای خیلی مرطوب چه عیبی دارد؟", a:"سستی بدن", o:["سستی بدن", "افزایش صفرا", "خشکی"]},
        {q:"دفع سودا با چه چیزی بهتر انجام می‌شود؟", a:"تحرک", o:["تحرک", "خواب", "پرخوری"]},
        {q:"آیا تنفس عمیق در هوای پاک مفید است؟", a:"بله", o:["بله", "خیر"]},
        {q:"خوابیدن روی شکم چه حکمی دارد؟", a:"مضر", o:["مضر", "مفید", "عادی"]},
        {q:"برای تقویت معده، چه نوع حرکتی مفید است؟", a:"پیاده‌روی آرام", o:["پیاده‌روی آرام", "دویدن شدید", "خواب"]},
        {q:"آیا غذا خوردن هنگام عصبانیت مفید است؟", a:"خیر", o:["بله", "خیر"]},
        {q:"دفع مواد زائد یعنی چه؟", a:"خروج مواد اضافه", o:["خروج مواد اضافه", "تغذیه", "استراحت"]},
        {q:"آیا نور خورشید در هوای صبح مفید است؟", a:"بله", o:["بله", "خیر"]},
        {q:"خواب زیاد، کدام عضو را سرد می‌کند؟", a:"معده", o:["معده", "قلب", "کبد"]},
        {q:"ورزش زیاد، کدام خلط را کاهش می‌دهد؟", a:"بلغم", o:["بلغم", "دم", "صفرا"]},
        {q:"اعراض نفسانی شامل کدام است؟", a:"غم و شادی", o:["غم و شادی", "خوردن", "ورزش"]},
        {q:"هوای گرم و مرطوب برای چه کسی خطرناک است؟", a:"بلغمی‌ها", o:["بلغمی‌ها", "صفراوی‌ها", "سوداوی‌ها"]},
        {q:"دفع ادرار صحیح چه تاثیری دارد؟", a:"سبکی بدن", o:["سبکی بدن", "سنگینی", "گرسنگی"]},
        {q:"خشمِ طولانی چه اثری بر قلب دارد؟", a:"تضعیف", o:["تضعیف", "تقویت", "خنثی"]},
        {q:"آیا بعد از ورزش، آب سرد مفید است؟", a:"خیر", o:["بله", "خیر"]},
        {q:"کدام غذا بلغم را تشدید می‌کند؟", a:"ماست", o:["ماست", "گوشت بره", "عسل"]},
        {q:"خوابِ کم، کدام خلط را زیاد می‌کند؟", a:"صفرا", o:["صفرا", "بلغم", "دم"]},
        {q:"آیا فعالیت ذهنی بخشی از سته ضروریه است؟", a:"بله", o:["بله", "خیر"]},
        {q:"هوای معتدل چه اثری بر حافظه دارد؟", a:"بهبود", o:["بهبود", "تضعیف", "بدون اثر"]},
        {q:"دفع مواد زائد یعنی پاکسازی چه عضوی؟", a:"کبد", o:["کبد", "مغز", "قلب"]},
        {q:"خشم باعث افزایش کدام خلط می‌شود؟", a:"صفرا", o:["صفرا", "بلغم", "سودا"]},
        {q:"آیا سکوت مفید است؟", a:"بله", o:["بله", "خیر"]},
        {q:"ورزش در هوای خیلی آلوده چه اثری دارد؟", a:"بیماری", o:["بیماری", "سلامت", "شادی"]},
        {q:"خوابِ بعد غذا چه تاثیری دارد؟", a:"تولید بلغم", o:["تولید بلغم", "هضم", "دفع"]},
        {q:"اعراض نفسانی یعنی چه؟", a:"احساسات", o:["احساسات", "غذاها", "داروها"]},
        {q:"هوای کوهستانی برای کدام عضو است؟", a:"قلب و ریه", o:["قلب و ریه", "کلیه", "معده"]},
        {q:"دفع مواد زائد از طریق پوست چیست؟", a:"عرق", o:["عرق", "ادرار", "مدفوع"]},
        {q:"خوابیدن روی سمت راست بدن بهتر است؟", a:"بله", o:["بله", "خیر"]},
        {q:"آیا ماساژ جزو سته ضروریه است؟", a:"بله", o:["بله", "خیر"]}
    ];

    let currentIdx = 0, score = 0;

    function startGame() {
        document.getElementById('intro-section').classList.remove('active');
        document.getElementById('quiz-section').classList.add('active');
        render();
    }

    function render() {
        if(currentIdx >= quizData.length) { showResult(); return; }
        const q = quizData[currentIdx];
        document.getElementById('q-counter').innerText = `سوال ${currentIdx + 1} از ${quizData.length}`;
        document.getElementById('progress-fill').style.width = `${(currentIdx/quizData.length)*100}%`;
        document.getElementById('question-box').innerText = q.q;
        const opt = document.getElementById('options-box');
        opt.innerHTML = '';
        q.o.forEach(o => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = o;
            b.onclick = () => check(o);
            opt.appendChild(b);
        });
    }

    function check(val) {
        if(val === quizData[currentIdx].a) score++;
        currentIdx++;
        render();
    }

    function showResult() {
        document.getElementById('quiz-section').classList.remove('active');
        document.getElementById('result-section').classList.add('active');
        document.getElementById('score-text').innerText = `امتیاز نهایی: ${score} از ${quizData.length}`;
        localStorage.setItem('score_Sitteh', score);
        if(score >= (quizData.length * 0.9)) document.getElementById('badge-gold').style.display = 'block';
    }
</script>
</body>
</html>
