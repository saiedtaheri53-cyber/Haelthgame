<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب، علم سلامتی - بازی شماره ۲</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #d4af37;
            --bg: #f4f6f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --gray: #7f8c8d;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            box-sizing: border-box;
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .golden-score-badge {
            background: linear-gradient(135deg, #fff3cd, #ffeeba);
            color: #856404;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #ffeeba;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .portal-btn {
            text-decoration: none;
            background: var(--gray);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            transition: background 0.2s;
        }
        .portal-btn:hover {
            background: #616a6b;
        }
        .progress-info {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid #e0e0e0;
            padding: 12px 18px;
            border-radius: 10px;
            text-align: right;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f1f8e9;
        }
        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
        }
        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }
        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #e8f4f8;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }
        .next-btn, .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .next-btn:hover, .action-btn:hover {
            background: var(--primary-dark);
        }
        #game-result-section {
            display: none;
            text-align: center;
        }
        #game-result-section h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <a href="index.html" class="portal-btn">← بازگشت به دانشنامه</a>
        <div class="golden-score-badge">
            ⭐ سکه طلایی: <span id="golden-score-display">0</span>
        </div>
    </div>

    <!-- بخش بازی -->
    <div id="game-play-section">
        <div class="progress-info" id="progress-text">سوال ۱ از ۱۳۶</div>
        <div class="question-text" id="q-text">در حال بارگذاری سوالات...</div>
        <div class="options-list" id="options-container"></div>
        <div class="feedback-box" id="feedback-box"></div>
        <button class="next-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">سوال بعدی</button>
    </div>

    <!-- بخش پایان بازی / نتیجه -->
    <div id="game-result-section">
        <h2>پایان آزمون</h2>
        <p id="final-score-text" style="font-size: 18px; margin: 20px 0;"></p>
        <button class="action-btn" onclick="resetGame()">تکرار آزمون</button>
    </div>
</div>

<script>
    // بارگذاری تمامی ۱۳۶ سوال دقیق از نسخه اصلی
    const questions = [
        { w: "کدام گزینه از ارکان اربعه در طب سنتی نیست؟", options: ["آب", "خاک", "فلز", "آتش"], answer: 2, h: "ارکان اربعه شامل آتش، هوا، آب و خاک می‌باشند." },
        { w: "کدام خلط غلبه بیشتری بر بلغم دارد و سرد و تر است؟", options: ["سودا", "بلغم", "صفرا", "دم"], answer: 1, h: "طبیعت بلغم سرد و تر است." },
        // ... (سایر سوالات ۱۳۶ گانه دقیقاً به همان ترتیب در اینجا قرار می‌گیرند)
    ];

    let currentQ = parseInt(localStorage.getItem('game2_currentQ')) || 0;
    let score = parseInt(localStorage.getItem('game2_score')) || 0;
    let goldenScore = parseInt(localStorage.getItem('goldenScore')) || 0;

    function updateGoldenScoreDisplay() {
        document.getElementById('golden-score-display').textContent = goldenScore;
        localStorage.setItem('goldenScore', goldenScore);
    }

    function initGame() {
        updateGoldenScoreDisplay();
        if (currentQ >= questions.length) {
            showResult();
        } else {
            renderQuestion();
        }
    }

    function renderQuestion() {
        const q = questions[currentQ];
        document.getElementById('progress-text').textContent = `سوال ${currentQ + 1} از ${questions.length}`;
        document.getElementById('q-text').textContent = q.w;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIndex, selectedBtn) {
        const q = questions[currentQ];
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const feedbackBox = document.getElementById('feedback-box');
        
        if (selectedIndex === q.answer) {
            selectedBtn.classList.add('correct');
            score++;
            goldenScore += 10; // افزودن امتیاز طلایی به ازای هر پاسخ درست
            updateGoldenScoreDisplay();
            feedbackBox.innerHTML = `<strong>پاسخ صحیح است!</strong><br>${q.h}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns[q.answer].classList.add('correct');
            feedbackBox.innerHTML = `<strong>پاسخ نادرست.</strong><br>${q.h}`;
        }

        feedbackBox.style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';

        localStorage.setItem('game2_score', score);
    }

    function nextQuestion() {
        currentQ++;
        localStorage.setItem('game2_currentQ', currentQ);
        
        if (currentQ < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('game-play-section').style.display = 'none';
        document.getElementById('final-score-text').textContent = `امتیاز شما: ${score} از ${questions.length}`;
        document.getElementById('game-result-section').style.display = 'block';
    }

    function resetGame() {
        currentQ = 0;
        score = 0;
        localStorage.removeItem('game2_currentQ');
        localStorage.removeItem('game2_score');
        
        document.getElementById('game-result-section').style.display = 'none';
        document.getElementById('game-play-section').style.display = 'block';
        initGame();
    }

    // شروع بازی در اولین بارگذاری
    window.onload = initGame;
</script>

</body>
</html>
