<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی سته ضروریه</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; text-align: center; }
        #game-container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* نوار وضعیت جدید */
        #ui-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        #question-counter { font-size: 0.9em; color: #555; font-weight: bold; }
        #golden-score-btn { background: #FFD700; border: none; padding: 5px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; cursor: default; }

        #question-text { font-size: 1.2em; margin-bottom: 20px; min-height: 80px; }
        .answer-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; background: #e0e0e0; cursor: pointer; transition: 0.3s; }
        .answer-btn:hover { background: #d0d0d0; }
        .correct { background: #4CAF50 !important; color: white; }
        .wrong { background: #f44336 !important; color: white; }
        
        #result-screen { display: none; }
        #golden-badge-animation { font-size: 3em; animation: pulse 1.5s infinite; margin: 20px 0; display: block; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="game-container">
    <!-- هدر جدید -->
    <div id="ui-header">
        <span id="question-counter">سوال ۰ از ۰</span>
        <button id="golden-score-btn" title="مجموع امتیازات طلایی پروژه">نشان طلایی: 0</button>
    </div>

    <div id="quiz-screen">
        <div id="question-text">در حال بارگذاری...</div>
        <div id="options"></div>
    </div>

    <div id="result-screen">
        <div id="golden-badge-animation">🏅</div>
        <h2 id="final-score-text"></h2>
        <button class="answer-btn" onclick="location.reload()">شروع مجدد</button>
    </div>
</div>

<script>
    const questions = [
        { q: "آیا هوای محیط از سته ضروریه است؟", a: ["بله", "خیر"], correct: 0 },
        { q: "آیا خواب و بیداری از سته ضروریه است؟", a: ["بله", "خیر"], correct: 0 },
        { q: "آیا اعراض نفسانی از سته ضروریه است؟", a: ["بله", "خیر"], correct: 0 }
    ];

    let currentQ = 0;
    let score = 0;

    // فراخوانی امتیاز طلایی از حافظه
    function getGlobalGoldenScore() {
        return parseInt(localStorage.getItem('healthgame_total_golden_scores') || '0');
    }

    function updateGoldenScoreUI() {
        document.getElementById('golden-score-btn').innerText = `نشان طلایی: ${getGlobalGoldenScore()}`;
    }

    function updateCounter() {
        document.getElementById('question-counter').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
    }

    function loadQuestion() {
        updateCounter();
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = q.q;
        const opts = document.getElementById('options');
        opts.innerHTML = '';
        q.a.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            opts.appendChild(btn);
        });
    }

    function checkAnswer(index) {
        if (index === questions[currentQ].correct) {
            score++;
        }
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('question-counter').style.display = 'none';

        if (score === questions.length) {
            document.getElementById('final-score-text').innerText = "عالی! امتیاز کامل. نشان طلایی کسب شد.";
            // افزایش امتیاز طلایی پروژه
            let currentTotal = getGlobalGoldenScore();
            localStorage.setItem('healthgame_total_golden_scores', currentTotal + 1);
            updateGoldenScoreUI();
        } else {
            document.getElementById('golden-badge-animation').style.display = 'none';
            document.getElementById('final-score-text').innerText = `امتیاز شما: ${score} از ${questions.length}`;
        }
    }

    // شروع بازی
    updateGoldenScoreUI();
    loadQuestion();
</script>

</body>
</html>
