<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشنامه سته ضروریه</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #f0f4f8; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; background: #2c3e50; color: white; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .correct { background: #27ae60 !important; }
        .wrong { background: #c0392b !important; }
        .golden { border: 4px solid #f39c12; background: #fffaf0; }
        h2 { color: #1a5276; font-size: 18px; margin-bottom: 20px; min-height: 50px; }
    </style>
</head>
<body>

<div class="box" id="game-box">
    <h2 id="q-text">در حال شروع سته ضروریه...</h2>
    <div id="options"></div>
    <p id="status">سوال ۱ از ۱۰۰</p>
</div>

<script>
    const questions = [
        {q: "هوای محیط اولین اصل از سته ضروریه است؟", a: "بله"}, {q: "آیا هوای آلوده موجب فساد روح می‌شود؟", a: "بله"},
        {q: "آیا هوای بسیار گرم مضر قلب است؟", a: "بله"}, {q: "آیا هوای معتدل بهترین حالت برای تنفس است؟", a: "بله"},
        {q: "آیا تغییرات فصلی بر مزاج هوا اثر دارد؟", a: "بله"}, {q: "آیا هوای سرد موجب انقباض مسام بدن می‌شود؟", a: "بله"},
        {q: "آیا خواب کافی از اصول سته است؟", a: "بله"}, {q: "آیا خواب زیاد موجب غلظت خون می‌شود؟", a: "بله"},
        {q: "آیا بیداری بیش از حد باعث خشکی مغز می‌شود؟", a: "بله"}, {q: "آیا خواب روز برای همه مفید است؟", a: "خیر"},
        {q: "آیا پرخوری از عوامل اصلی بیماری است؟", a: "بله"}, {q: "آیا خوردن قبل از هضم غذای قبلی مضر است؟", a: "بله"},
        {q: "آیا نوشیدن آب یخ در ناشتا مضر است؟", a: "بله"}, {q: "آیا کم‌خوری (نه گرسنگی) موجب سلامتی است؟", a: "بله"},
        {q: "آیا کیفیت غذا بر کیفیت خون موثر است؟", a: "بله"}, {q: "آیا رعایت آداب غذا خوردن ضروری است؟", a: "بله"},
        {q: "آیا ورزش جزو اصول سته است؟", a: "بله"}, {q: "آیا ورزش شدید قبل از هضم مضر است؟", a: "بله"},
        {q: "آیا پیاده‌روی ملایم بهترین ورزش است؟", a: "بله"}, {q: "آیا سکون بیش از حد موجب تنبلی اعضا می‌شود؟", a: "بله"},
        {q: "آیا دفع مواد زائد (استفراغ) از اصول سته است؟", a: "بله"}, {q: "آیا یبوست موجب تجمع سموم در بدن می‌شود؟", a: "بله"},
        {q: "آیا تعریق مناسب برای بدن مفید است؟", a: "بله"}, {q: "آیا احتباس مواد زائد باعث بیماری‌های مزمن است؟", a: "بله"},
        {q: "آیا انفعالات نفسانی (خشم، شادی) از اصول سته است؟", a: "بله"}, {q: "آیا خشم زیاد قلب را گرم می‌کند؟", a: "بله"},
        {q: "آیا ترس شدید موجب ضعف روح می‌شود؟", a: "بله"}, {q: "آیا شادی معتدل برای روح مفید است؟", a: "بله"},
        {q: "آیا سته ضروریه پایه اصلی طب سنتی است؟", a: "بله"}, {q: "آیا بدون رعایت سته، دارو اثر کامل دارد؟", a: "خیر"},
        {q: "آیا مزاج شخص در سته ضروریه مهم است؟", a: "بله"}, {q: "آیا هوای کوهستان برای ریه مفید است؟", a: "بله"},
        {q: "آیا حمام رفتن بیش از حد باعث سستی بدن است؟", a: "بله"}, {q: "آیا هوای متعفن باعث بیماری‌های واگیر است؟", a: "بله"},
        {q: "آیا خوردن گوشت زیاد موجب سنگینی بدن است؟", a: "بله"}, {q: "آیا خوردن نان سبوس‌دار مفید است؟", a: "بله"},
        {q: "آیا خواب قبل از غروب مضر است؟", a: "بله"}, {q: "آیا بیداری شب موجب تحلیل رطوبات بدن است؟", a: "بله"},
        {q: "آیا ورزش تا حد تعریق مفید است؟", a: "بله"}, {q: "آیا ورزش در هوای آلوده مضر است؟", a: "بله"},
        {q: "آیا دفع مدفوع روزانه لازم است؟", a: "بله"}, {q: "آیا دفع ادرار باید منظم باشد؟", a: "بله"},
        {q: "آیا غم زیاد موجب سردی مزاج می‌شود؟", a: "بله"}, {q: "آیا تفکر بیش از حد مغز را خشک می‌کند؟", a: "بله"},
        {q: "آیا هوای خنک صبحگاهی برای مغز مفید است؟", a: "بله"}, {q: "آیا تغذیه در شب باید سبک باشد؟", a: "بله"},
        {q: "آیا خوابیدن با شکم پر مضر است؟", a: "بله"}, {q: "آیا نوشیدن آب بین غذا مفید است؟", a: "خیر"},
        {q: "آیا پیاده‌روی روی زمین ناهموار مضر است؟", a: "خیر"}, {q: "آیا ورزش باعث باز شدن منافذ پوست می‌شود؟", a: "بله"},
        {q: "آیا احتباس حیض برای زنان مضر است؟", a: "بله"}, {q: "آیا تخلیه کامل مثانه ضروری است؟", a: "بله"},
        {q: "آیا نگرانی دائمی سیستم ایمنی را ضعیف می‌کند؟", a: "بله"}, {q: "آیا عشق و امید به سلامتی کمک می‌کند؟", a: "بله"},
        {q: "آیا سته ضروریه شامل مسائل معنوی است؟", a: "بله"}, {q: "آیا سبک زندگی صحیح همان سته ضروریه است؟", a: "بله"},
        {q: "آیا هوای بارانی برای همه مفید است؟", a: "خیر"}, {q: "آیا هوای خشک برای ریه مضر است؟", a: "بله"},
        {q: "آیا خواب در هوای باز مفید است؟", a: "بله"}, {q: "آیا بیداری بین‌الطلوعین برای سلامتی مضر است؟", a: "بله"},
        {q: "آیا خوردن میوه همراه غذا مضر است؟", a: "بله"}, {q: "آیا جویدن کامل غذا هضم را بهتر می‌کند؟", a: "بله"},
        {q: "آیا ورزش‌های سنگین بعد از غذا مضر است؟", a: "بله"}, {q: "آیا استراحت بعد از ورزش لازم است؟", a: "بله"},
        {q: "آیا یبوست مزاج مادر بیماری‌هاست؟", a: "بله"}, {q: "آیا اسهال بیش از حد بدن را ضعیف می‌کند؟", a: "بله"},
        {q: "آیا خشم آنی خون را به جوش می‌آورد؟", a: "بله"}, {q: "آیا آرامش ذهنی هضم را بهبود می‌دهد؟", a: "بله"},
        {q: "آیا باید سته ضروریه را برای هر فرد شخصی‌سازی کرد؟", a: "بله"}, {q: "آیا هوای گرم باعث بی اشتهایی می‌شود؟", a: "بله"},
        {q: "آیا خوردن غذا در حال عصبانیت مضر است؟", a: "بله"}, {q: "آیا مصرف نمک بیش از حد مضر است؟", a: "بله"},
        {q: "آیا خواب ظهر (قیلوله) باید کوتاه باشد؟", a: "بله"}, {q: "آیا بی خوابی باعث تیرگی پوست می‌شود؟", a: "بله"},
        {q: "آیا ورزش برای افراد پیر باید ملایم باشد؟", a: "بله"}, {q: "آیا حرکات ناگهانی در ورزش مضر است؟", a: "بله"},
        {q: "آیا پاکسازی بدن از اخلاط فاسد ضروری است؟", a: "بله"}, {q: "آیا عرق کردن بیش از حد باعث ضعف قلب است؟", a: "بله"},
        {q: "آیا افسردگی باعث سردی معده می‌شود؟", a: "بله"}, {q: "آیا شادی مفرط می‌تواند باعث سکته شود؟", a: "بله"},
        {q: "آیا سته ضروریه ۶ اصل دارد؟", a: "بله"}, {q: "آیا رعایت این اصول پیشگیری از بیماری است؟", a: "بله"},
        {q: "آیا هوای آلوده شهر برای بیماران ریوی مضر است؟", a: "بله"}, {q: "آیا حمام آب داغ بدن را ضعیف می‌کند؟", a: "بله"},
        {q: "آیا پرخوری در شب موجب خواب بد می‌شود؟", a: "بله"}, {q: "آیا سکوت و آرامش برای اعصاب مفید است؟", a: "بله"},
        {q: "آیا ماساژ جزو حرکات بدنی است؟", a: "بله"}, {q: "آیا خواب کافی برای تقویت حافظه لازم است؟", a: "بله"},
        {q: "آیا باید از خوردن غذاهای فاسد اجتناب کرد؟", a: "بله"}, {q: "آیا نوشیدن آب جوشیده بهتر است؟", a: "بله"},
        {q: "آیا سته ضروریه برای همه سنین کاربرد دارد؟", a: "بله"}, {q: "آیا طب سنتی بر پیشگیری تاکید دارد؟", a: "بله"},
        {q: "آیا گوش دادن به موسیقی ملایم روح را شاد می‌کند؟", a: "بله"}, {q: "آیا پیاده‌روی سریع بعد از غذا مضر است؟", a: "بله"},
        {q: "آیا درسته که «معده خانه بیماری است»؟", a: "بله"}, {q: "آیا تعادل در سته ضروریه یعنی سلامتی؟", a: "بله"}
    ];

    let cur = 0, score = 0;

    function render() {
        if(cur >= questions.length) {
            const isGolden = score === questions.length;
            document.getElementById('game-box').innerHTML = `
                <div class="${isGolden ? 'golden' : ''}">
                    <h2>${isGolden ? '🌟 امتیاز طلایی' : 'پایان آزمون'}</h2>
                    <p>امتیاز: ${score} از ${questions.length}</p>
                    ${isGolden ? '<p>تبریک! شما متخصصِ سته ضروریه هستید.</p>' : ''}
                    <button class="btn" onclick="location.reload()">شروع مجدد دانشنامه</button>
                </div>`;
            return;
        }

        document.getElementById('q-text').innerText = questions[cur].q;
        document.getElementById('status').innerText = `سوال ${cur + 1} از ${questions.length}`;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        
        ["بله", "خیر"].forEach(text => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = text;
            b.onclick = () => {
                if(text === questions[cur].a) { 
                    score++; 
                    b.classList.add('correct'); 
                } else { 
                    b.classList.add('wrong'); 
                }
                setTimeout(() => { cur++; render(); }, 400);
            };
            optDiv.appendChild(b);
        });
    }
    render();
</script>
</body>
</html>
