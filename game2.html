<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ۶: سته ضروریه (اصول حفظ سلامتی)</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f9f4;
            color: #333;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 600px;
            background: #2e7d32;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 15px;
            background-color: #e8f5e9;
            border: 2px solid #81c784;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            transition: 0.2s;
        }
        .options button:hover {
            background-color: #c8e6c9;
        }
        .btn-nav {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>سته ضروریه (سؤال <span id="q-num">۱</span> از ۱۰۱)</span>
        <span>🪙 سکه طلایی: <span id="gold-score">۰</span></span>
    </div>

    <div class="container" id="game-box">
        <div class="question" id="question-text">در حال بارگذاری سوالات...</div>
        <div class="options" id="options-box"></div>
        <button class="btn-nav" id="next-btn" style="display:none;" onclick="nextQuestion()">سوال بعدی</button>
    </div>

<script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;

    // بارگذاری سوالات از فایل خارجی یا آرایه داخلی
    fetch('_qs.json')
        .then(response => response.json())
        .then(data => {
            questions = data;
            loadGameData();
            initGame();
        })
        .catch(err => {
            console.warn("خطا در بارگذاری فایل JSON، استفاده از حالت پشتیبان یا داده‌های پیش‌فرض", err);
            // حالت اضطراری برای جلوگیری از خرابی صفحه
            questions = [
                { q: "آیا هوای پاک و تازه از ارکان سته ضروریه است؟", options: ["بله", "خیر"], answer: 0 }
            ];
            loadGameData();
            initGame();
        });

    function loadGameData() {
        const savedIndex = localStorage.getItem('sitteh_index');
        const savedScore = localStorage.getItem('sitteh_score');
        if (savedIndex !== null) currentIndex = parseInt(savedIndex);
        if (savedScore !== null) score = parseInt(savedScore);
    }

    function saveGameData() {
        localStorage.setItem('sitteh_index', currentIndex);
        localStorage.setItem('sitteh_score', score);
    }

    function initGame() {
        if (currentIndex >= questions.length) {
            document.getElementById('game-box').innerHTML = `<h3>تبریک! بازی به اتمام رسید.</h3><p>امتیاز نهایی شما: ${score}</p>`;
            localStorage.removeItem('sitteh_index');
            localStorage.removeItem('sitteh_score');
            return;
        }

        document.getElementById('q-num').innerText = currentIndex + 1;
        document.getElementById('gold-score').innerText = score;

        const currentQ = questions[currentIndex];
        document.getElementById('question-text').innerText = currentQ.q;
        
        const optBox = document.getElementById('options-box');
        optBox.innerHTML = '';
        
        currentQ.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, currentQ.answer);
            optBox.appendChild(btn);
        });
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selected, correct) {
        const buttons = document.querySelectorAll('.options button');
        buttons.forEach((b, idx) => {
            b.disabled = true;
            if (idx === correct) b.style.backgroundColor = '#81c784';
            if (idx === selected && selected !== correct) b.style.backgroundColor = '#e57373';
        });

        if (selected === correct) {
            score += 10;
        }
        
        document.getElementById('gold-score').innerText = score;
        currentIndex++;
        saveGameData(); // ذخیره خودکار پیشرفت و امتیاز

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        initGame();
    }
</script>

</body>
</html>
