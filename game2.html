<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی سته ضروریه</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        #question { font-size: 1.2em; margin-bottom: 20px; line-height: 1.6; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; text-align: right; }
        .option:hover { background: #e9ecef; }
        .correct { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong { background: #f8d7da !important; border-color: #dc3545 !important; }
        #next-btn { display: none; width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; }
        .nav-btn { display: block; width: 100%; padding: 10px; margin-top: 20px; background: #6c757d; color: white; border: none; border-radius: 8px; text-align: center; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span id="q-counter">سوال ۱ از ۵</span>
        <span id="score">امتیاز: ۰</span>
    </div>
    <div id="question">متن سوال اینجا قرار می‌گیرد.</div>
    <div id="options"></div>
    <button id="next-btn" onclick="nextQuestion()">سوال بعدی</button>
    <a href="index.html" class="nav-btn">بازگشت به فهرست</a>
</div>

<script>
    const quizData = [
        { q: "اولین اصل از سته ضروریه چیست؟", o: ["هوا", "خواب", "غذا", "حرکت"], a: "هوا" },
        { q: "خواب و بیداری چه تأثیری بر بدن دارد؟", o: ["تأثیر بر روح حیوانی", "تأثیر بر استخوان", "تأثیر بر مو", "تأثیر بر ناخن"], a: "تأثیر بر روح حیوانی" },
        { q: "کدام عامل در سته ضروریه «مادر بیماری‌های گوارشی» است؟", o: ["خوردن و آشامیدن", "خواب", "استحمام", "ورزش"], a: "خوردن و آشامیدن" },
        { q: "مصرف آب یخ بعد از غذا در طب سنتی چه حکمی دارد؟", o: ["مضر و نهی شده", "بسیار مفید", "بی‌اثر", "درمان کننده"], a: "مضر و نهی شده" },
        { q: "ورزش ملایم چه اثری بر هضم دارد؟", o: ["تقویت هضم", "توقف هضم", "نفخ شدید", "تضعیف دستگاه گوارش"], a: "تقویت هضم" }
    ];

    let curIdx = 0, score = 0;

    function loadQ() {
        const q = quizData[curIdx];
        document.getElementById('q-counter').innerText = `سوال ${curIdx + 1} از ${quizData.length}`;
        document.getElementById('question').innerText = q.q;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';

        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            optDiv.appendChild(btn);
        });
    }

    function check(sel, btn) {
        const q = quizData[curIdx];
        const opts = document.querySelectorAll('.option');
        opts.forEach(b => b.disabled = true);
        
        if (sel === q.a) {
            btn.classList.add('correct');
            score += 10;
        } else {
            btn.classList.add('wrong');
            opts.forEach(b => { if(b.innerText === q.a) b.classList.add('correct'); });
        }
        document.getElementById('score').innerText = `امتیاز: ${score}`;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        curIdx++;
        if (curIdx < quizData.length) loadQ();
        else {
            document.querySelector('.container').innerHTML = `<h2>پایان بازی!</h2><p>امتیاز نهایی: ${score}</p><a href="index.html" class="nav-btn">بازگشت به فهرست</a>`;
        }
    }

    loadQ();
</script>
</body>
</html>
