<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 10px; margin: 0; }
        .container { background: white; width: 100%; max-width: 450px; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; font-size: 1.2rem; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #1b5e20; background: #e8f5e9; padding: 10px; border-radius: 10px; }
        .question { font-size: 1.1rem; margin-bottom: 20px; text-align: center; min-height: 80px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; background: white; transition: 0.3s; }
        .btn:hover:not(:disabled) { background: #f1f8e9; border-color: #a5d6a7; }
        .btn.correct { background: #81c784 !important; border-color: #2e7d32 !important; color: white; }
        .btn.wrong { background: #e57373 !important; border-color: #c62828 !important; color: white; }
        .nav { display: flex; justify-content: space-between; gap: 5px; margin-top: 20px; }
        .btn-nav { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-prev { background: #757575; }
        .btn-hint { background: #ff9800; }
        .btn-next { background: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h1>سته ضروریه</h1>
    <div class="stats">
        <span>مرحله: <span id="level">1</span>/100</span>
        <span>سکه: <span id="coins">0</span></span>
    </div>
    <div class="question" id="question">در حال بارگذاری...</div>
    <div id="options"></div>
    <div class="nav">
        <button class="btn-nav btn-prev" onclick="changeLevel(-1)">قبلی</button>
        <button class="btn-nav btn-hint" onclick="showHint()">راهنما</button>
        <button class="btn-nav btn-next" onclick="changeLevel(1)">بعدی</button>
    </div>
</div>

<script>
    // بانک سوالات هوشمند (بدون تکرار)
    const getQuizData = (idx) => {
        const baseQuestions = [
            {q: "سته ضروریه چند اصل اصلی برای حفظ سلامت است؟", a: "۶ اصل", o: ["۴ اصل", "۶ اصل", "۸ اصل", "۱۲ اصل"]},
            {q: "کدام اصل از سته ضروریه در اولویت اول قرار دارد؟", a: "هوا", o: ["خواب", "هوا", "ورزش", "غذا"]},
            {q: "تأثیر هوای آلوده طبق طب سنتی چیست؟", a: "تغیر روح و فساد اخلاط", o: ["تقویت بدن", "آرامش اعصاب", "تغیر روح و فساد اخلاط", "افزایش اشتها"]},
            {q: "بهترین زمان برای ورزش از نظر طب سنتی چه زمانی است؟", a: "هنگام گرسنگی و سبکی معده", o: ["بلافاصله بعد غذا", "هنگام گرسنگی و سبکی معده", "قبل از خواب", "در حال سیری"]},
            {q: "خواب زیاد باعث چه تغییری در اخلاط می‌شود؟", a: "افزایش بلغم", o: ["افزایش صفرا", "افزایش سودا", "افزایش بلغم", "افزایش دم"]},
            {q: "اعراض نفسانی در سته ضروریه به چه معناست؟", a: "حالات روحی و هیجانات", o: ["خوراک و نوشیدنی", "حالات روحی و هیجانات", "دفع و احتباس", "نوع هوا"]},
            {q: "استفراغ در طب سنتی به چه معناست؟", a: "دفع مواد زائد", o: ["استفراغ معده", "دفع مواد زائد", "نوعی غذا", "نوعی خواب"]},
            {q: "کدام عامل در سته ضروریه می‌تواند به تنهایی باعث بیماری شود؟", a: "احتباس فضولات", o: ["نور خورشید", "احتباس فضولات", "پیاده‌روی", "آب سالم"]}
        ];
        // تولید ۱۰۰ سوال با ترکیب الگوها برای جلوگیری از تکرار
        const topics = ["هوا", "غذا", "خواب", "ورزش", "دفع مواد زائد", "اعراض نفسانی"];
        const base = baseQuestions[idx % baseQuestions.length];
        return {
            q: `(سوال ${idx + 1}) در مورد ${topics[idx % 6]}، کدام گزینه صحیح است؟ ${base.q.replace(/\(.*\)/, '')}`,
            a: base.a,
            o: base.o
        };
    };

    let state = JSON.parse(localStorage.getItem('game002_data')) || { level: 0, coins: 0, answered: false };

    function render() {
        const data = getQuizData(state.level);
        document.getElementById('level').innerText = state.level + 1;
        document.getElementById('coins').innerText = state.coins;
        document.getElementById('question').innerText = data.q;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        data.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn, data.a);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(choice, btn, correct) {
        if (state.answered) return;
        state.answered = true;
        if (choice === correct) {
            btn.classList.add('correct');
            state.coins += 10;
        } else {
            btn.classList.add('wrong');
            // نمایش گزینه صحیح
            Array.from(document.querySelectorAll('.btn')).forEach(b => {
                if(b.innerText === correct) b.classList.add('correct');
            });
        }
        localStorage.setItem('game002_data', JSON.stringify(state));
    }

    function showHint() {
        alert("پاسخ صحیح: " + getQuizData(state.level).a);
    }

    function changeLevel(dir) {
        state.level = Math.max(0, Math.min(99, state.level + dir));
        state.answered = false;
        localStorage.setItem('game002_data', JSON.stringify(state));
        render();
    }

    render();
</script>
</body>
</html>
