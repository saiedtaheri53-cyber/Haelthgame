<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه - دانش‌نامه طب</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 90%; max-width: 500px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .score-box { font-size: 1.2rem; font-weight: bold; color: #2e7d32; margin-bottom: 20px; }
        .question { font-size: 1.1rem; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; background: #81c784; color: white; font-size: 1rem; }
        .btn:hover { background: #66bb6a; }
        #golden-badge { display: none; margin-top: 20px; padding: 15px; background: gold; color: #000; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="game-container">
    <div id="quiz-ui">
        <div class="score-box" id="score-display">امتیاز: ۰</div>
        <div class="question" id="question-text">در حال بارگذاری...</div>
        <div id="options"></div>
    </div>
    <div id="golden-badge">🏆 نشان طلایی طب را کسب کردید!</div>
</div>

<script>
    // بانک ۱۰۰ سوالی اختصاصی سته ضروریه
    const questions = [
        { q: "هوای محیط از کدام دسته سته ضروریه است؟", a: "هوا", options: ["هوا", "غذا", "خواب", "حرکت"] },
        { q: "آیا پرخوری در طب سنتی عامل بیماری است؟", a: "بله", options: ["بله", "خیر"] },
        { q: "بهترین زمان خواب بر اساس سته ضروریه چه زمانی است؟", a: "شب", options: ["روز", "شب", "صبح", "عصر"] },
        // ... (تعداد ۱۰۰ سوال به همین سبک به صورت کامل تعریف می‌شود)
        { q: "آیا اعراض نفسانی بر جسم تأثیر دارند؟", a: "بله", options: ["بله", "خیر"] }
    ];

    // پر کردن سوالات تا ۱۰۰ عدد (نمونه‌ای از ساختار)
    while(questions.length < 100) {
        questions.push({ q: "سوال تکمیلی شماره " + (questions.length + 1), a: "صحیح", options: ["صحیح", "غلط"] });
    }

    let currentIndex = 0;
    let score = 0;

    function render() {
        if(currentIndex >= questions.length) {
            finishGame();
            return;
        }
        const q = questions[currentIndex];
        document.getElementById('question-text').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => check(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function check(choice) {
        if(choice === questions[currentIndex].a) score++;
        document.getElementById('score-display').innerText = "امتیاز: " + score;
        currentIndex++;
        render();
    }

    function finishGame() {
        document.getElementById('quiz-ui').innerHTML = "<h2>پایان بازی</h2><p>امتیاز نهایی: " + score + "</p>";
        localStorage.setItem('goldenScore_Game002', score);
        if(score >= 90) {
            document.getElementById('golden-badge').style.display = 'block';
        }
    }

    render();
</script>
</body>
</html>
