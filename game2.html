<!DOCTYPE html>

        .option-btn { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer; text-align: right; }
        .option-btn:hover { background: #f9fff9; border-color: var(--primary); }
        #result-area { display: none; text-align: center; }
        .btn-main { display: inline-block; padding: 10px 20px; background: var(--primary); color: white; text-decoration: none; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="quiz-container">

</div>

    let currentQ = 0, score = 0;
    
    function renderQ() {
        if(currentQ >= questions.length) { 
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('score-display').innerText = `امتیاز شما: ${score} از ${questions.length}`;
            return;
        }
        const q = questions[currentQ];
        document.getElementById('question-text').innerText = (currentQ+1) + ". " + q.q;
        document.getElementById('counter').innerText = `سوال ${currentQ+1} از ۱۰۰`;
        document.getElementById('progress').style.width = `${((currentQ+1)/100)*100}%`;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.t;
            btn.onclick = () => { 
                if(opt.c) score++; 
                currentQ++; 
                renderQ(); 
            };
            container.appendChild(btn);
        });
    }
    renderQ();
