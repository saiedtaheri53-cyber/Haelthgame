<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشنامه جامع طب و علم سلامتی - بازی شماره ۲</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #27ae60;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
        }
        body { font-family: 'Tahoma', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--white); width: 90%; max-width: 600px; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: var(--primary-color); font-size: 1.5rem; margin-bottom: 20px; }
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem; background: #eee; padding: 10px; border-radius: 8px; }
        .question-container { margin-bottom: 30px; min-height: 150px; }
        .question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; line-height: 1.6; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .option-btn { background: var(--white); border: 2px solid #ddd; padding: 12px 20px; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; font-size: 1rem; text-align: right; }
        .option-btn:hover { border-color: var(--secondary-color); background: #f0fff4; }
        .option-btn.correct { background-color: #2ecc71 !important; color: white; border-color: #27ae60; }
        .option-btn.wrong { background-color: #e74c3c !important; color: white; border-color: #c0392b; }
        .controls { margin-top: 30px; display: flex; justify-content: space-between; }
        button.main-btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button.main-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #result-screen { display: none; }
        .score-display { font-size: 2.5rem; font-weight: bold; color: var(--secondary-color); margin: 20px 0; }
        .golden-score { color: var(--accent-color); font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; }
        .progress-bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--secondary-color); width: 0%; transition: width 0.3s ease; }
    </style>
</head>
<body>
<div class="container">
    <h1>دانشنامه جامع طب و علم سلامتی</h1>
    <div class="stats-bar">
        <div id="progress-text">سوال: ۱ از ۱۰۰</div>
        <div id="score-text">امتیاز: ۰</div>
        <div id="high-score-text">بهترین: ۰</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>

    <div id="quiz-section">
        <div class="question-container">
            <div class="question-text" id="question-text">در حال بارگذاری...</div>
            <div class="options-grid" id="options-grid"></div>
        </div>
        <div class="controls">
            <button class="main-btn" id="prev-btn" onclick="prevQuestion()">قبلی</button>
            <button class="main-btn" id="next-btn" onclick="nextQuestion()" disabled>بعدی</button>
        </div>
    </div>

    <div id="result-screen">
        <h2>پایان بازی!</h2>
        <div class="score-display" id="final-score">۰</div>
        <div id="golden-score-msg" class="golden-score"></div>
        <button class="main-btn" onclick="restartGame()">شروع مجدد</button>
    </div>
</div>

<script>
    // دیتای سوالات (نمونه کامل برای نمایش عملکرد - در پروژه واقعی ۱۰۰ سوال اینجا قرار می‌گیرد)
    const questions = [
        { w: "کدام خلط دارای ویژگی گرم و مرطوب است؟", options: ["دم", "صفرا", "بلغم", "سودا"], answer: 0, h: "دم گرم و مرطوب است." },
        { w: "مزاج صفرا با کدام ویژگی شناخته می‌شود؟", options: ["سرد و مرطوب", "گرم و خشک", "سرد و خشک", "گرم و مرطوب"], answer: 1, h: "صفرا گرم و خشک است." },
        { w: "کدام یک جزو ارکان چهارگانه (اخلاط) نیست؟", options: ["دم", "بلغم", "خون", "سودا"], answer: 2, h: "اخلاط چهارگانه دم، صفرا، بلغم و سودا هستند." },
        { w: "مزاج بلغم با چه ویژگی‌هایی شناخته می‌شود؟", options: ["گرم و خشک", "سرد و مرطوب", "سرد و خشک", "گرم و مرطوب"], answer: 1, h: "بلغم سرد و مرطوب است." },
        { w: "مزاج سودا دارای چه ویژگی‌هایی است؟", options: ["سرد و خشک", "گرم و خشک", "سرد و مرطوب", "گرم و مرطوب"], answer: 0, h: "سودا سرد و خشک است." },
        { w: "در طب سنتی، تعادل میان چه چیزهایی برای سلامت ضروری است؟", options: ["فقط غذا", "اخلاط و مزاج", "فقط خواب", "فقط ورزش"], answer: 1, h: "تعادل مزاج و اخلاط پایه سلامت است." },
        { w: "کدام خلط با ویژگی سرد و خشک شناخته می‌شود؟", options: ["دم", "صفرا", "بلغم", "سودا"], answer: 3, h: "سودا سرد و خشک است." },
        { w: "غذای مناسب برای اصلاح مزاج سرد و مرطوب چیست؟", options: ["غذاهای گرم و خشک", "غذاهای سرد و مرطوب", "فقط آب", "هیچ چیز"], answer: 0, h: "برای اصلاح مزاج سرد، باید از مواد گرم استفاده کرد." },
        { w: "تغذیه صحیح در طب سنتی بر چه اساسی است؟", options: ["مقدار زیاد غذا", "تناسب با مزاج فرد", "فقط گیاهخواری", "فقط گوشت"], answer: 1, h: "تغذیه باید بر اساس مزاج فرد باشد." },
        { w: "کدام مورد از ضروریات شش‌گانه برای حفظ پاکیزگی بدن است؟", options: ["خواب", "تغذیه", "پاکدامنی و تخلیه", "حرکت"], answer: 2, h: "پاکدامنی و تخلیه از ضروریات است." }
        // برای تکمیل به ۱۰۰ سوال، این لیست باید ادامه یابد.
    ];

    // پر کردن لیست تا ۱۰۰ برای تست ساختار (در نسخه نهایی این جایگزین می‌شود)
    while(questions.length < 100) {
        questions.push({
            w: "سوال تست شماره " + (questions.length + 1) + " در دانشنامه طب:",
            options: ["گزینه ۱", "گزینه ۲", "گزینه ۳", "گزینه ۴"],
            answer: 0,
            h: "توضیح مربوط به سوال."
        });
    }

    let currentQ = 0;
    let score = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let highScore = localStorage.getItem('game2_high_score') || 0;

    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const highScoreText = document.getElementById('high-score-text');
    const progressFill = document.getElementById('progress-fill');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const quizSection = document.getElementById('quiz-section');
    const resultScreen = document.getElementById('result-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    const goldenScoreMsg = document.getElementById('golden-score-msg');

    function initGame() {
        currentQ = 0;
        score = 0;
        userAnswers = new Array(questions.length).fill(null);
        highScoreText.innerText = `بهترین: ${highScore}`;
        showQuestion();
        updateStats();
        quizSection.style.display = 'block';
        resultScreen.style.display = 'none';
    }

    function showQuestion() {
        const q = questions[currentQ];
        questionText.innerText = q.w;
        optionsGrid.innerHTML = '';
        
        q.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(index);
            
            if (userAnswers[currentQ] !== null) {
                if (index === q.answer) btn.classList.add('correct');
                if (index === userAnswers[currentQ] && index !== q.answer) btn.classList.add('wrong');
                btn.disabled = true;
            }
            optionsGrid.appendChild(btn);
        });

        prevBtn.disabled = currentQ === 0;
        nextBtn.disabled = userAnswers[currentQ] === null;
    }

    function checkAnswer(selectedIndex) {
        if (userAnswers[currentQ] !== null) return;
        userAnswers[currentQ] = selectedIndex;
        if (selectedIndex === questions[currentQ].answer) score++;
        
        const buttons = optionsGrid.querySelectorAll('.option-btn');
        buttons[questions[currentQ].answer].classList.add('correct');
        if (selectedIndex !== questions[currentQ].answer) {
            buttons[selectedIndex].classList.add('wrong');
        }
        nextBtn.disabled = false;
        updateStats();
    }

    function nextQuestion() {
        if (currentQ < questions.length - 1) {
            currentQ++;
            showQuestion();
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQ > 0) {
            currentQ--;
            showQuestion();
        }
    }

    function updateStats() {
        progressText.innerText = `سوال: ${currentQ + 1} از ${questions.length}`;
        scoreText.innerText = `امتیاز: ${score}`;
        progressFill.style.width = `${((currentQ + 1) / questions.length) * 100}%`;
    }

    function showResults() {
        quizSection.style.display = 'none';
        resultScreen.style.display = 'block';
        finalScoreDisplay.innerText = `${score} از ${questions.length}`;

        const percentage = (score / questions.length) * 100;
        if (percentage >= 85) {
            goldenScoreMsg.innerText = "✨ سطح دانش شما: عالی (در حد متخصص) ✨";
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('game2_high_score', highScore);
            }
        } else if (percentage >= 60) {
            goldenScoreMsg.innerText = "✅ سطح دانش شما: خوب";
        } else {
            goldenScoreMsg.innerText = "📚 نیاز به مطالعه بیشتر دارید";
        }
    }

    function restartGame() {
        initGame();
    }

    initGame();
</script>
</body>
</html>
