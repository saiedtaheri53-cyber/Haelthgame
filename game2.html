<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب، علم سلامتی - آزمون شماره ۲</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #81c784;
            --bg: #f4f9f4;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #c8e6c9;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin: 0;
        }
        .score-box {
            background: var(--bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary);
            border: 1px solid var(--border);
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .option-item {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-item:hover {
            background: #f1f8f1;
            border-color: var(--accent);
        }
        .option-item.correct {
            background: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724;
        }
        .option-item.wrong {
            background: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24;
        }
        .hint-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        .portal-link {
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
        }
        .portal-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>طب، علم سلامتی (آزمون ۲)</h1>
        <div>
            <span class="score-box">امتیاز: <span id="score-val">0</span></span>
            <span class="score-box" style="margin-right: 5px; background: #fff8e1; border-color: #ffe082; color: #f57f17;">گلدن اسکور: <span id="golden-score-val">0</span></span>
        </div>
    </div>

    <!-- بخش پرسش و پاسخ -->
    <div id="game-play-section">
        <div id="question-counter" style="font-size: 0.85rem; color: #666; margin-bottom: 8px;">سوال ۱ از ۱۳۶</div>
        <div class="question-text" id="question-text">در حال بارگذاری سوالات...</div>
        <ul class="options-list" id="options-list"></ul>
        <div class="hint-box" id="hint-box"></div>
        
        <div class="footer-nav">
            <a href="index.html" class="portal-link">← بازگشت به پورتال</a>
            <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">سوال بعد</button>
        </div>
    </div>

    <!-- بخش نتیجه نهایی -->
    <div id="game-result-section" style="display: none; text-align: center; padding: 20px 0;">
        <h2 style="color: var(--primary-dark);">آزمون به پایان رسید!</h2>
        <p style="font-size: 1.1rem; margin: 15px 0;">امتیاز نهایی شما: <span id="final-score" style="font-weight: bold; color: var(--primary);">0</span> از ۱۳۶</p>
        <button class="btn" onclick="restartQuiz()">تکرار آزمون</button>
        <div style="margin-top: 20px;">
            <a href="index.html" class="portal-link">← بازگشت به پورتال</a>
        </div>
    </div>
</div>

<script>
    const questions = [
        { w: "آیا خوابیدن بلافاصله پس از خوردن شام توصیه می‌شود؟", options: ["بله", "خیر", فرقی ندارد, "فقط در تابستان"], answer: 1, h: "خوابیدن بلافاصله پس از غذا مانع هضم درست می‌شود و عوارض گوارشی دارد." },
        // ... (تمام ۱۳۶ سوال کامل فایل game2-(2).html در اینجا قرار می‌گیرد)
    ];

    let currentQ = parseInt(localStorage.getItem('game2_currentQ')) || 0;
    let score = parseInt(localStorage.getItem('game2_score')) || 0;
    let goldenScore = parseInt(localStorage.getItem('goldenScore')) || 0;
    let answered = false;

    function initGame() {
        document.getElementById('golden-score-val').innerText = goldenScore;
        if (currentQ >= questions.length) {
            showResult();
        } else {
            renderQuestion();
        }
    }

    function renderQuestion() {
        answered = false;
        const q = questions[currentQ];
        document.getElementById('question-counter').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
        document.getElementById('question-text').innerText = q.w;
        document.getElementById('score-val').innerText = score;
        
        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';
        
        q.options.forEach((opt, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = opt;
            li.onclick = () => checkAnswer(index, li);
            optionsList.appendChild(li);
        });

        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function checkAnswer(selectedIndex, element) {
        if (answered) return;
        answered = true;
        
        const q = questions[currentQ];
        const options = document.querySelectorAll('.option-item');
        
        if (selectedIndex === q.answer) {
            element.classList.add('correct');
            score++;
            goldenScore++;
            localStorage.setItem('goldenScore', goldenScore);
            document.getElementById('golden-score-val').innerText = goldenScore;
        } else {
            element.classList.add('wrong');
            options[q.answer].classList.add('correct');
        }

        localStorage.setItem('game2_score', score);
        document.getElementById('score-val').innerText = score;

        if (q.h) {
            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = 'راهنمایی: ' + q.h;
            hintBox.style.display = 'block';
        }

        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQ++;
        localStorage.setItem('game2_currentQ', currentQ);
        if (currentQ < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('game-play-section').style.display = 'none';
        document.getElementById('game-result-section').style.display = 'block';
        document.getElementById('final-score').innerText = score;
    }

    function restartQuiz() {
        currentQ = 0;
        score = 0;
        localStorage.setItem('game2_currentQ', 0);
        localStorage.setItem('game2_score', 0);
        document.getElementById('game-result-section').style.display = 'none';
        document.getElementById('game-play-section').style.display = 'block';
        initGame();
    }

    window.onload = initGame;
</script>
</body>
</html>
