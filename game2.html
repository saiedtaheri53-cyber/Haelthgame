<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی سته ضروریه</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #e8f4f8;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #2980b9;
        }
        #q-number {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        #q-text {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-align: right;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background: #ecf0f1;
            border-color: #95a5a6;
        }
        .option-btn.correct {
            background: #2ecc71 !important;
            color: white;
            border-color: #27ae60 !important;
        }
        .option-btn.wrong {
            background: #e74c3c !important;
            color: white;
            border-color: #c0392b !important;
        }
        #feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
        }
        #next-btn {
            display: none;
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #next-btn:hover {
            background: #2980b9;
        }
        .portal-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }
        .portal-link:hover {
            color: #34495e;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>بازی سته ضروریه</h2>
    <div class="score-board">
        <span id="score-display">امتیاز: 0</span>
        <span id="golden-score-display" style="color: #d4ac0d;">🌟 امتیاز طلایی: 0</span>
    </div>
    
    <div id="q-number"></div>
    <div id="q-text"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next-btn" onclick="nextQuestion()">سوال بعد</button>
    
    <a href="index.html" class="portal-link">بازگشت به دانشنامه جامع (پورتال)</a>
</div>

<script>
    const questions = [
        { w: "کدام گزینه جزء سته ضروریه (اصول سته) در طب سنتی ایران نیست؟", options: ["هوا", "خواب و بیداری", "تغذیه و نوشیدنی", "نوع پوشش لباس"], answer: 3, h: "سته ضروریه شامل هوا، خوراک، حرکت و سکون، خواب و بیداری، احتباس و استفراغ، و اعراض نفسانی است." },
        { w: "تأثیر هوای سالم و پاک بر بدن بر اساس اصول سته چیست؟", options: ["تقویت روح و احشاء", "افزایش بلغم", "ایجاد سردرد شدید", "کاهش حرارت غریزی"], answer: 0, h: "هوای لطیف و پاک موجب تقویت ارواح و اعضای رئیسه بدن می‌شود." },
        { w: "کدام عامل در طب سنتی به عنوان یکی از ارکان سته ضروریه برای حفظ سلامتی شناخته می‌شود؟", options: ["حرکت و سکون", "نوع مبلمان منزل", "رنگ لباس", "مدت زمان کار با رایانه"], answer: 0, h: "حرکت و سکون (ورزش و استراحت) از اصول شش‌گانه حفظ سلامتی است." },
        { w: "خواب و بیداری مناسب چه تأثیری بر هضم غذا دارد؟", options: ["بهبود هضم در صورت تعادل", "توقف کامل هضم", "ایجاد سنگ کلیه", "افزایش اسید معده به طور مخرب"], answer: 0, h: "خواب معتدل به هضم غذا کمک می‌کند و بیداری معتدل تحلیل‌برنده است." },
        { w: "احتباس و استفراغ (خروج مواد زائد و حفظ مواد مفید) در طب سنتی چه نقشی دارد؟", options: ["دفع سموم و مواد زائد از بدن", "افزایش وزن ناگهانی", "کاهش هوش و حافظه", "تولید صفرا در مغز"], answer: 0, h: "دفع به موقع مواد زائد برای سلامتی و پاکسازی بدن ضروری است." },
        { w: "اعراض نفسانی (حالات روحی و روانی) شامل چه مواردی است؟", options: ["خشم، شادی، غم، ترس و...", "فقط تعریق شبانه", "درد مفاصل", "تغییرات فشار خون فصلی"], answer: 0, h: "اعراض نفسانی به حالات روحی و روانی انسان اطلاق می‌شود که تأثیر مستقیمی بر جسم دارند." },
        { w: "کدام نوع آب طبق اصول سته ضروریه سالم‌تر و سبک‌تر محسوب می‌شود؟", options: ["آب باران جاری و زلال در هوای پاک", "آب راکد مرداب", "آب بسیار سرد چاه عمیق", "آب شور دریا"], answer: 0, h: "آب باران و چشمه‌های جاری در مناطق خوش‌آب‌وهوا سبک‌ترین و بهترین آب‌ها هستند." },
        { w: "بهترین زمان برای ورزش در حفظ سلامتی کدام است؟", options: ["پس از هضم کامل غذا در معده", "بلافاصله پس از خوردن غذای سنگین", "هنگام خواب عمیق شبانه", "در اوج گرمای ظهر تابستان"], answer: 0, h: "ورزش باید زمانی انجام شود که معده از غذای قبلی خالی شده باشد." },
        { w: "خواب روز (قیلوله) در کدام فصل و برای چه افرادی مفیدتر است؟", options: ["تابستان و برای افراد گرم‌مزاج یا خسته‌از کار", "زمستان برای افراد سردمزاج", "اصلاً در هیچ زمانی مفید نیست", "فقط نصف شب"], answer: 0, h: "خواب روز در تابستان برای رفع خستگی و حرارت برای برخی مزاج‌ها مفید است اما زیاده‌روی در آن مضر است." },
        { w: "تأثیر غم و اندوه شدید بر ارواح و اعضای بدن چیست؟", options: ["تحلیل حرارت غریزی و تضعیف قلب", "تقویت سیستم ایمنی", "افزایش شادی درون", "رشد سریع مو"], answer: 0, h: "غم و غصه شدید موجب ضعف قلب و تحلیل انرژی حیاتی بدن می‌شود." }
    ];

    // بازیابی وضعیت ذخیره شده از localStorage
    let currentQ = parseInt(localStorage.getItem('game2_currentQ')) || 0;
    let score = parseInt(localStorage.getItem('game2_score')) || 0;
    let goldenScore = parseInt(localStorage.getItem('goldenScore')) || 0;

    function updateScoreBoards() {
        document.getElementById('score-display').innerText = "امتیاز: " + score;
        document.getElementById('golden-score-display').innerText = "🌟 امتیاز طلایی: " + goldenScore;
    }

    function getCorrectAnswerText(q) {
        if (typeof q.answer === 'number') {
            return q.options[q.answer];
        }
        return q.answer;
    }

    function render() {
        updateScoreBoards();
        if (currentQ >= questions.length) {
            document.getElementById('q-number').innerText = "";
            document.getElementById('q-text').innerText = "تبریک! شما این بازی را به پایان رساندید.";
            document.getElementById('options').innerHTML = "";
            document.getElementById('feedback').style.display = "none";
            document.getElementById('next-btn').style.display = "none";
            return;
        }

        const q = questions[currentQ];
        document.getElementById('q-number').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
        document.getElementById('q-text').innerText = q.w;

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => check(opt, getCorrectAnswerText(q), btn);
            optionsDiv.appendChild(btn);
        });

        document.getElementById('feedback').style.display = "none";
        document.getElementById('next-btn').style.display = "none";
    }

    function check(selected, correctText, btn) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const feedback = document.getElementById('feedback');
        feedback.style.display = "block";

        if (selected === correctText) {
            btn.classList.add('correct');
            score++;
            goldenScore++; // افزایش امتیاز طلایی
            localStorage.setItem('goldenScore', goldenScore);
            feedback.innerHTML = "<b>پاسخ صحیح است!</b> " + (questions[currentQ].h || "");
            feedback.style.background = "#e8f8f5";
            feedback.style.color = "#27ae60";
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === correctText) b.classList.add('correct');
            });
            feedback.innerHTML = "<b>پاسخ نادرست.</b> پاسخ صحیح: " + correctText + "<br>" + (questions[currentQ].h || "");
            feedback.style.background = "#ffd2d2";
            feedback.style.color = "#c0392b";
        }

        // ذخیره پیشرفت کاربر در حافظه مرورگر برای جلوگیری از شروع مجدد از ابتدا
        localStorage.setItem('game2_score', score);
        updateScoreBoards();
        document.getElementById('next-btn').style.display = "block";
    }

    function nextQuestion() {
        currentQ++;
        localStorage.setItem('game2_currentQ', currentQ);
        render();
    }

    // شروع بازی
    render();
</script>

</body>
</html>
