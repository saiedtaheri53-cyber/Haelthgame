<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه - دانش‌نامه سلامت</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .game-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        .question { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; background: #27ae60; color: white; font-size: 1rem; transition: 0.3s; }
        .btn:hover { background: #219150; }
        #score-board { font-size: 1.1rem; margin-top: 20px; color: #333; }
        #badge { font-weight: bold; color: #d35400; margin-top: 10px; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-ui">
        <div id="q-number">سوال ۱ از ۱۰۰</div>
        <div class="question" id="question-text">در حال بارگذاری...</div>
        <div id="options"></div>
        <div id="feedback" style="margin-top: 15px; font-size: 0.9rem; color: #555;"></div>
    </div>
    <div id="score-board"></div>
    <div id="badge"></div>
</div>

<script>
    const questions = [
        { q: "کدام یک از سته ضروریه مستقیماً با تغییر فصل در ارتباط است؟", options: ["هوا", "خواب و بیداری"], a: 0, exp: "هوا و محیط پیرامون با تغییر فصول تغییر کرده و بر بدن اثر می‌گذارند." },
        { q: "بهترین زمان برای نوشیدن آب چه زمانی است؟", options: ["بلافاصله بعد از غذا", "با فاصله از غذا"], a: 1, exp: "نوشیدن آب بلافاصله بعد از غذا باعث اختلال در هضم می‌شود." },
        { q: "خواب زیاد باعث کدام مورد در بدن می‌شود؟", options: ["رطوبت‌افزایی", "خشکی‌افزایی"], a: 0, exp: "خواب زیاد می‌تواند باعث تجمع رطوبت در بدن شود." },
        // ... (تعداد ۱۰۰ سوال به صورت کامل در فایل نهایی تعبیه می‌شود)
        { q: "آیا ورزش سنگین بعد از غذا توصیه می‌شود؟", options: ["خیر", "بله"], a: 0, exp: "ورزش باید زمانی انجام شود که معده از غذا خالی باشد." },
        { q: "کدام یک از اعراض نفسانی قلب را به شدت گرم می‌کند؟", options: ["خشم", "غم"], a: 0, exp: "خشم باعث فوران حرارت غریزی و گرمی قلب می‌شود." }
    ];

    // تکمیل آرایه تا ۱۰۰ سوال (بخش نمونه برای حفظ ساختار)
    for(let i=5; i<100; i++) {
        questions.push({ q: `سوال تستی شماره ${i+1} در مورد سته ضروریه`, options: ["گزینه الف", "گزینه ب"], a: 0, exp: "توضیح آموزشی برای سوال شماره " + (i+1) });
    }

    let currentQ = 0;
    let score = 0;

    function renderQuestion() {
        const q = questions[currentQ];
        document.getElementById('q-number').innerText = `سوال ${currentQ + 1} از ۱۰۰`;
        document.getElementById('question-text').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(idx) {
        const correct = questions[currentQ].a;
        if(idx === correct) score++;
        document.getElementById('feedback').innerText = questions[currentQ].exp;
        
        setTimeout(() => {
            document.getElementById('feedback').innerText = '';
            currentQ++;
            if(currentQ < questions.length) renderQuestion();
            else endGame();
        }, 2000);
    }

    function endGame() {
        localStorage.setItem('game002_score', score);
        let badge = "";
        if(score <= 30) badge = "شاگردِ تازه کار";
        else if(score <= 70) badge = "حکیمِ سته";
        else badge = "استادِ ممتازِ سته";
        
        document.getElementById('game-ui').innerHTML = `<h3>بازی تمام شد!</h3>`;
        document.getElementById('score-board').innerText = `امتیاز نهایی شما: ${score} از ۱۰۰`;
        document.getElementById('badge').innerText = `نشان طلایی: ${badge}`;
    }

    renderQuestion();
</script>
</body>
</html>
