<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #e8f5e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 90%; max-width: 500px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; }
        .score { font-size: 1.2rem; font-weight: bold; color: #2e7d32; margin-bottom: 20px; }
        .question { font-size: 1.2rem; margin-bottom: 25px; min-height: 60px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #81c784; border-radius: 10px; cursor: pointer; background: white; font-size: 1rem; transition: 0.3s; }
        .btn:hover { background: #c8e6c9; }
        #golden-badge { display: none; margin-top: 20px; padding: 20px; background: gold; color: #000; border-radius: 15px; font-weight: bold; font-size: 1.3rem; border: 3px solid #fbc02d; }
    </style>
</head>
<body>

<div class="container">
    <div class="score" id="score-display">امتیاز: ۰</div>
    <div class="question" id="question-text">در حال بارگذاری...</div>
    <div id="options"></div>
    <div id="golden-badge">🏆 نشان طلایی طب را کسب کردید!</div>
</div>

<script>
    // بانک سوالات واقعی (میتوانید بقیه سوالات را در این لیست اضافه کنید)
    const questions = [
        { q: "هوای محیط از کدام دسته سته ضروریه است؟", a: "هوا", options: ["هوا", "غذا", "خواب"] },
        { q: "آیا خواب زیاد موجب غلبه رطوبت می‌شود؟", a: "بله", options: ["بله", "خیر"] },
        { q: "کدام ورزش برای تقویت کل بدن توصیه شده؟", a: "اسب‌سواری", options: ["خواب", "اسب‌سواری", "پرخوری"] },
        { q: "آیا دفع مواد زائد بدن برای سلامتی ضروری است؟", a: "بله", options: ["خیر", "بله"] },
        { q: "کدام یک از اعراض نفسانی باعث خشکی بدن می‌شود؟", a: "خشم", options: ["خشم", "شادی", "خنده"] },
        { q: "آیا مصرف آب بلافاصله بعد از غذا توصیه می‌شود؟", a: "خیر", options: ["بله", "خیر"] },
        { q: "بهترین زمان برای خوابیدن چه زمانی است؟", a: "شب", options: ["روز", "شب"] },
        { q: "آیا حرکات بدنی شدید بلافاصله بعد غذا مفید است؟", a: "خیر", options: ["بله", "خیر"] },
        { q: "کدام عامل در سته ضروریه «محرک» نامیده می‌شود؟", a: "حرکت", options: ["غذا", "حرکت", "خواب"] },
        { q: "آیا غم و اندوهِ طولانی مزاج را سرد می‌کند؟", a: "بله", options: ["بله", "خیر"] }
        // ... اینجا می‌توانید سوالات ۱۱ تا ۱۰۰ را به همین شکل ادامه دهید
    ];

    let currentIndex = 0;
    let score = 0;

    function loadQuestion() {
        if(currentIndex >= questions.length) {
            finishGame();
            return;
        }
        const q = questions[currentIndex];
        document.getElementById('question-text').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(choice) {
        if(choice === questions[currentIndex].a) {
            score++;
            document.getElementById('score-display').innerText = "امتیاز: " + score;
        }
        currentIndex++;
        loadQuestion();
    }

    function finishGame() {
        document.querySelector('.container').innerHTML = `<h2>بازی تمام شد</h2><p>امتیاز نهایی: ${score}</p>`;
        localStorage.setItem('goldenScore_Game002', score);
        if(score >= (questions.length * 0.9)) { // حد نصاب ۹۰ درصد برای نشان طلایی
            document.getElementById('golden-badge').style.display = 'block';
        }
    }

    loadQuestion();
</script>
</body>
</html>
