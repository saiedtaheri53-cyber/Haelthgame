<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه - ۱۰۰ سوال</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #e0f2f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 95%; max-width: 500px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .progress { font-size: 0.9rem; color: #666; margin-bottom: 10px; }
        .score { font-weight: bold; color: #2e7d32; font-size: 1.1rem; margin-bottom: 20px; }
        .question { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }
        .btn { display: block; width: 100%; padding: 15px; margin: 8px 0; border: 2px solid #80cbc4; border-radius: 12px; background: white; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #b2dfdb; }
        #badge { display: none; background: #ffd700; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div class="progress" id="counter">سوال ۱ از ۱۰۰</div>
    <div class="score" id="score-display">امتیاز: ۰</div>
    <div class="question" id="q-text">در حال بارگذاری...</div>
    <div id="options"></div>
    <div id="badge">🏆 شما موفق به دریافت نشان طلایی شدید!</div>
</div>

<script>
    // بانک سوالات ۱۰۰تایی
    const quizData = [
        { q: "هوای محیط از کدام دسته سته ضروریه است؟", a: "هوا", o: ["هوا", "غذا", "خواب"] },
        { q: "آیا خواب زیاد موجب غلبه رطوبت می‌شود؟", a: "بله", o: ["بله", "خیر"] },
        { q: "کدام ورزش برای تقویت کل بدن توصیه شده؟", a: "اسب‌سواری", o: ["خواب", "اسب‌سواری", "پرخوری"] },
        { q: "آیا دفع مواد زائد بدن برای سلامتی ضروری است؟", a: "بله", o: ["خیر", "بله"] },
        { q: "کدام یک از اعراض نفسانی باعث خشکی بدن می‌شود؟", a: "خشم", o: ["خشم", "شادی", "خنده"] },
        { q: "آیا مصرف آب بلافاصله بعد از غذا توصیه می‌شود؟", a: "خیر", o: ["بله", "خیر"] },
        { q: "بهترین زمان برای خوابیدن چه زمانی است؟", a: "شب", o: ["روز", "شب"] },
        { q: "آیا حرکات بدنی شدید بلافاصله بعد غذا مفید است؟", a: "خیر", o: ["بله", "خیر"] },
        { q: "کدام عامل در سته ضروریه «محرک» نامیده می‌شود؟", a: "حرکت", o: ["غذا", "حرکت", "خواب"] },
        { q: "آیا غم و اندوهِ طولانی مزاج را سرد می‌کند؟", a: "بله", o: ["بله", "خیر"] }
        // ادامه سوالات را در اینجا تا ۱۰۰ عدد وارد کنید. کد به صورت خودکار تا آخرین سوال پیش می‌رود.
    ];

    let currentIdx = 0;
    let score = 0;

    function render() {
        if(currentIdx >= quizData.length) {
            finish();
            return;
        }

        const data = quizData[currentIdx];
        document.getElementById('counter').innerText = `سوال ${currentIdx + 1} از ${quizData.length}`;
        document.getElementById('score-display').innerText = `امتیاز: ${score}`;
        document.getElementById('q-text').innerText = data.q;
        
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        
        data.o.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = item;
            btn.onclick = () => check(item);
            optDiv.appendChild(btn);
        });
    }

    function check(choice) {
        if(choice === quizData[currentIdx].a) score++;
        currentIdx++;
        render();
    }

    function finish() {
        document.querySelector('.card').innerHTML = `
            <h2>پایان آزمون</h2>
            <p style="font-size: 1.2rem;">امتیاز نهایی: ${score} از ${quizData.length}</p>
        `;
        localStorage.setItem('score_Sitteh', score);
        if(score >= (quizData.length * 0.9)) {
            document.getElementById('badge').style.display = 'block';
        }
    }

    render();
</script>
</body>
</html>
