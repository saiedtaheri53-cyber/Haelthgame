<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون سته ضروریه</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-card { background: white; width: 95%; max-width: 500px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); text-align: center; }
        .header { font-size: 1.2rem; font-weight: bold; color: #2c3e50; margin-bottom: 20px; }
        #q-text { font-size: 1.1rem; min-height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; line-height: 1.5; color: #34495e; }
        .btn-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-yes { background: #27ae60; color: white; }
        .btn-no { background: #c0392b; color: white; }
        .btn-hint { background: #f39c12; color: white; grid-column: span 2; margin-top: 10px; }
        #feedback { font-weight: bold; margin: 15px 0; height: 25px; font-size: 1.1rem; }
        .stats { margin-top: 20px; color: #7f8c8d; font-size: 0.9rem; }
        .hidden { display: none; }
        #golden-badge { font-size: 3rem; margin: 20px 0; }
    </style>
</head>
<body>

<div class="game-card" id="game-ui">
    <div class="header" id="progress">سوال ۱ از ۱۰۰</div>
    <div id="q-text">در حال بارگذاری...</div>
    <div id="feedback"></div>
    <div class="btn-box">
        <button class="btn btn-yes" onclick="submit(true)">صحیح</button>
        <button class="btn btn-no" onclick="submit(false)">غلط</button>
        <button class="btn btn-hint" onclick="showHint()">راهنما</button>
    </div>
    <div class="stats">امتیاز: <span id="score">0</span></div>
</div>

<div class="game-card hidden" id="result-ui">
    <div id="golden-badge">🌟</div>
    <h2 id="final-msg">پایان آزمون</h2>
    <p>امتیاز نهایی شما: <span id="final-score">0</span> از ۱۰۰</p>
    <button class="btn btn-yes" onclick="location.reload()">شروع مجدد</button>
</div>

<script>
const data = [
    {q: "آیا هوایِ آلوده برای تنفس مضر است؟", a: true, h: "هوا اولین اصل است و آلودگی مستقیم ریه را تخریب می‌کند."},
    {q: "آیا خوابیدن بلافاصله بعد از غذا توصیه می‌شود؟", a: false, h: "خوابِ بعد از غذا مانع هضم صحیح می‌شود و خلط خام تولید می‌کند."},
    {q: "آیا حرکتِ متعادلِ بدنی برای دفع فضولات لازم است؟", a: true, h: "ورزشِ معتدل باعث خروج مواد زائد از منافذ پوست می‌شود."},
    {q: "آیا پرخوری در طب سنتی موجب تجمع مواد زائد است؟", a: true, h: "وقتی بیش از ظرفیت معده غذا بخوریم، هضم ناقص مانده و بدن مسموم می‌شود."},
    {q: "آیا نوشیدن آبِ یخ بلافاصله بعد از ورزش مفید است؟", a: false, h: "نوشیدن یخ بعد از ورزش حرارت غریزی قلب و کبد را خاموش می‌کند."},
    {q: "آیا شادیِ معتدل باعثِ باز شدنِ منافذِ بدن می‌شود؟", a: true, h: "شادی معتدل روح را به سطح بدن می‌آورد و نشاط‌آور است."},
    {q: "آیا غم و اندوهِ طولانی موجبِ سردی و خشکی می‌شود؟", a: true, h: "غم و اندوهِ مفرط، حرارتِ غریزی را تحلیل می‌برد."},
    {q: "آیا استحمامِ زیاد باعث ضعفِ قوایِ بدنی می‌شود؟", a: true, h: "استحمام زیاد رطوبتِ اصلیِ بدن را تبخیر کرده و لاغر می‌کند."},
    {q: "آیا سکونِ مطلق و دائمی برای بدن مفید است؟", a: false, h: "سکونِ دائمی باعث تجمع فضولات در عروق می‌شود."},
    {q: "آیا نوشیدن آب در میان غذا هضم را مختل می‌کند؟", a: true, h: "آبِ میان غذا باعث می‌شود اسید معده رقیق و هضم ناتمام بماند."},
    {q: "آیا خوابِ روز (قیلوله) برای همه توصیه می‌شود؟", a: false, h: "خواب روز فقط برای افراد خاصی مفید است، برای اکثر مردم مضر است."},
    {q: "آیا هوایِ مرطوب برای بلغمی‌ها مشکل‌ساز است؟", a: true, h: "رطوبت برای افراد بلغمی که خودشان طبعِ سرد و مرطوب دارند، سنگین است."},
    {q: "آیا بی خوابی موجب خشکیِ مغز و بدن می‌شود؟", a: true, h: "خوابِ کافی رطوبت‌بخش است و بی خوابی به شدت بدن را خشک می‌کند."},
    {q: "آیا خشمِ ناگهانی حرارتِ بدن را بالا می‌برد؟", a: true, h: "خشم با هجومِ صفرا به قلب، حرارت را به سرعت بالا می‌برد."},
    {q: "آیا دفعِ به موقعِ مدفوع از اصولِ ۶ گانه است؟", a: true, h: "احتباس و استفراغ (دفع) مهم‌ترین اصل در پاکسازی بدن است."},
    {q: "آیا استحمام با معده پر توصیه می‌شود؟", a: false, h: "استحمام با معده پر باعث جذب مواد نپخته به عروق می‌شود."},
    {q: "آیا آبِ ولرم بهترین نوشیدنی است؟", a: true, h: "آب ولرم نزدیک‌ترین حرارت به حرارت بدن را دارد و ایمن‌ترین است."},
    {q: "آیا هوای کوهستان همیشه برای ریه مفید است؟", a: true, h: "هوای کوهستان سبک‌تر است و برای رفع گرفتگی‌ها عالی است."},
    {q: "آیا خوردن میوه‌های نارس هضم را سخت می‌کند؟", a: true, h: "میوه‌های نارس در معده نمی‌پزند و فساد می‌یابند."},
    {q: "آیا ورزشِ شدید برایِ افرادِ سوداوی مفید است؟", a: false, h: "سوداوی‌ها نباید بیش از حد خود را خشک کنند؛ ورزش باید معتدل باشد."},
    {q: "آیا پوشاندن سر در خواب مفید است؟", a: true, h: "پوشاندن سر بخاراتِ غلیظ را در مغز نگه می‌دارد (اگر سرد باشد)."},
    {q: "آیا یبوست موجب بروزِ لک‌هایِ پوستی می‌شود؟", a: true, h: "وقتی فضولات دفع نشود، به سمت پوست رفته و لک ایجاد می‌کنند."},
    {q: "آیا تنفسِ عمیق هوای پاک به تصفیه خون کمک می‌کند؟", a: true, h: "اکسیژن‌رسانیِ بهتر از طریق تنفسِ عمیق، خون را روشن می‌کند."},
    {q: "آیا خوابیدنِ بعد از غروبِ خورشید مفید است؟", a: false, h: "خوابِ بعد از غروب (خُسوف) موجبِ بیماری‌های سرد و سنگینی سر می‌شود."},
    {q: "آیا مصرفِ نمکِ زیاد باعثِ افزایشِ خشکی بدن می‌شود؟", a: true, h: "نمک خاصیتِ گرم‌کنندگی و خشک‌کنندگی دارد."},
    {q: "آیا ورزشِ گروهی برایِ سلامتِ روان مفید است؟", a: true, h: "فعالیتِ اجتماعی و گروهی، «اعراض نفسانی» را متعادل می‌کند."},
    {q: "آیا نوشیدنِ آبِ جوشیده بهتر از آبِ خام است؟", a: true, h: "جوشاندن، کیفیت‌هایِ سنگینِ آب را سبک می‌کند."},
    {q: "آیا عصبانیتِ هنگامِ غذا خوردن هضم را خراب می‌کند؟", a: true, h: "ترس و خشم هضم را در همان ثانیه متوقف می‌کنند."},
    {q: "آیا خوابِ زیادِ ظهر باعثِ کسالت و سنگینی سر می‌شود؟", a: true, h: "خوابِ زیاد رطوبت را در مغز انباشته می‌کند."},
    {q: "آیا پیاده‌رویِ آرام برای همه توصیه می‌شود؟", a: true, h: "پیاده‌رویِ آرام ملایم‌ترین ورزش است و برای همه مفید است."},
    {q: "آیا استفاده از مسواکِ طبیعی برای دهان مفید است؟", a: true, h: "پاکسازی دهان از فضولاتِ شبانه از اصولِ بهداشت است."},
    {q: "آیا خوابیدن با دهانِ باز در شب مفید است؟", a: false, h: "هوا بدون فیلترِ بینی وارد می‌شود و گلو را خشک می‌کند."},
    {q: "آیا حذفِ صبحانه برایِ کودکان توصیه می‌شود؟", a: false, h: "کودکان نیاز به غذایِ باکیفیت در صبح برای رشد دارند."},
    {q: "آیا ماساژِ بدن به دفعِ فضولات کمک می‌کند؟", a: true, h: "ماساژ باعث حرکت فضولاتِ زیر پوست به سمت مجاری دفعی می‌شود."},
    {q: "آیا هوایِ بسیار گرمِ تابستان برای صفراوی‌ها خوب است؟", a: false, h: "صفراوی‌ها در گرما دچار غلبه صفرا می‌شوند."},
    {q: "آیا تعریقِ ناشی از ورزش مفید است؟", a: true, h: "تعریق، موادِ زائدِ اعماقِ بدن را بیرون می‌کشد."},
    {q: "آیا درهم‌خوری (چند نوع غذا) معده را خسته می‌کند؟", a: true, h: "هر غذا هضمِ متفاوتی دارد و درهم‌خوری موجب فسادِ معده می‌شود."},
    {q: "آیا نوشیدنِ آبِ زیادِ قبل از خواب مفید است؟", a: false, h: "باعثِ پرکاریِ کلیه و ادرارِ زیاد در شب می‌شود."},
    {q: "آیا خندیدنِ زیاد (قهقهه) برای قلب مفید است؟", a: false, h: "خنده‌ی مفرط، روح را ناگهان پراکنده می‌کند و قلب را ضعیف می‌کند."},
    {q: "آیا سکوت در هنگامِ غذا خوردن به تمرکز کمک می‌کند؟", a: true, h: "تمرکز بر جویدن و هضمِ غذا بسیار مهم است."},
    {q: "آیا استرسِ مزمن سیستمِ عصبی را تخریب می‌کند؟", a: true, h: "استرسِ طولانی، اخلاطِ صالح را فاسد می‌کند."},
    {q: "آیا خوابِ زیادِ شبانه همیشه بهتر است؟", a: false, h: "خوابِ بیش از حد از توانِ بدن می‌کاهد."},
    {q: "آیا استفاده از عطرهایِ طبیعی برایِ روح مفید است؟", a: true, h: "بوهای خوش بلافاصله روح را قوی می‌کنند."},
    {q: "آیا حبسِ ادرار برای کلیه‌ها مضر است؟", a: true, h: "حبس ادرار باعث بازگشت سموم به خون می‌شود."},
    {q: "آیا هوایِ معتدلِ بهار برای اخلاط مفید است؟", a: true, h: "بهار بهترین فصل برای تعادل اخلاط است."},
    {q: "آیا خوابیدنِ دمر (روی شکم) توصیه می‌شود؟", a: false, h: "به ستون فقرات و تنفس فشار می‌آورد."},
    {q: "آیا حذفِ شام برایِ همه مفید است؟", a: false, h: "حذفِ کاملِ شام باعثِ خشکیِ بدن و پیریِ زودرس می‌شود."},
    {q: "آیا تنفسِ عمیق سیستمِ ایمنی را قوی می‌کند؟", a: true, h: "اکسیژنِ کافی سلول‌ها را برای دفاع آماده می‌کند."},
    {q: "آیا خوردنِ آبِ یخ در تابستان باعثِ بیماری می‌شود؟", a: true, h: "آب یخ کبد را سرد و ضعیف می‌کند."},
    {q: "آیا پیاده‌رویِ سریع برای قلب مفید است؟", a: true, h: "حرکتِ سریعِ قلب را تقویت می‌کند (به شرطِ توانایی)."},
    {q: "آیا خوابیدنِ بعد از ناهار (خیلوله) مفید است؟", a: true, h: "خیلوله (استراحتِ کوتاه) برای کمک به هضم است."},
    {q: "آیا استفاده از ظروفِ سنگی برای پخت غذا خوب است؟", a: true, h: "ظروفِ سنگی حرارت را یکنواخت و ملایم پخش می‌کنند."},
    {q: "آیا عصبانیت موجبِ افزایشِ ضربانِ قلب می‌شود؟", a: true, h: "خشم با افزایشِ حرارتِ قلب، ضربان را بالا می‌برد."},
    {q: "آیا خوردنِ زیادِ گوشتِ قرمز برای سوداوی‌ها خوب است؟", a: false, h: "گوشتِ قرمز خشکی‌زاست و برای سوداوی‌ها مضر است."},
    {q: "آیا فعالیتِ بدنیِ مداوم از تنبلی جلوگیری می‌کند؟", a: true, h: "ورزشِ مداوم رگ‌ها را باز نگه می‌دارد."},
    {q: "آیا استفاده از موادِ آرایشیِ شیمیایی مضر است؟", a: true, h: "موادِ شیمیایی از طریق پوست جذب شده و خون را آلوده می‌کنند."},
    {q: "آیا خوابِ منظمِ شبانه از پیریِ زودرس جلوگیری می‌کند؟", a: true, h: "خوابِ منظم حرارت غریزی را حفظ می‌کند."},
    {q: "آیا سحرخیزی برای حفظِ سلامتی توصیه شده است؟", a: true, h: "هوا در سحر پاکیزه‌ترین حالت را دارد."},
    {q: "آیا خوردنِ سیر برای همه توصیه می‌شود؟", a: false, h: "سیر برای افرادِ صفراوی گرم و تند است و مضر است."},
    {q: "آیا خشمِ مهارنشده به کبد آسیب می‌زند؟", a: true, h: "خشمِ زیاد صفرا را به جوش می‌آورد و کبد را ملتهب می‌کند."},
    {q: "آیا تنفسِ در هوایِ آلوده موجبِ سردرد می‌شود؟", a: true, h: "بخاراتِ آلوده در مغز جمع شده و سردرد ایجاد می‌کنند."},
    {q: "آیا استفاده از عطرهایِ تندِ شیمیایی همیشه مفید است؟", a: false, h: "عطرهای شیمیایی سردردآورند."},
    {q: "آیا ورزشِ صبحگاهی انرژی‌بخش است؟", a: true, h: "ورزشِ ملایم صبحگاهی گردشِ خون را فعال می‌کند."},
    {q: "آیا خوابِ زیادِ ظهر موجبِ گیجی می‌شود؟", a: true, h: "خوابِ زیاد رطوبتِ مغز را بیش از حد می‌کند."},
    {q: "آیا استفاده از ظروفِ سفالی مفید است؟", a: true, h: "ظروفِ سفالی طبعِ متعادلی دارند."},
    {q: "آیا خوردنِ آبِ یخ قبل از غذا معده را سرد می‌کند؟", a: true, h: "سردیِ ناگهانی معده را از هضم باز می‌دارد."},
    {q: "آیا پیاده‌رویِ روزانه از یبوست جلوگیری می‌کند؟", a: true, h: "تحرک روده را برای دفع تشویق می‌کند."},
    {q: "آیا خوابیدنِ در مکانِ تاریک توصیه می‌شود؟", a: true, h: "تاریکی به ترشح ملاتونین و آرامش اعصاب کمک می‌کند."},
    {q: "آیا خوردنِ تنقلاتِ مصنوعی عامل بیماری است؟", a: true, h: "موادِ نگهدارنده و رنگ‌ها خون را فاسد می‌کنند."},
    {q: "آیا حمامِ آبِ گرم برای مفاصلِ سرد مفید است؟", a: true, h: "گرما خشکی و سردیِ مفاصل را برطرف می‌کند."},
    {q: "آیا پیاده‌رویِ با شکمِ بسیار پر مفید است؟", a: false, h: "فشار به معده می‌آورد."},
    {q: "آیا استراحتِ کامل بعد از بیماری لازم است؟", a: true, h: "بدن بعد از بیماری ضعیف است و نیاز به بازیابی دارد."},
    {q: "آیا خوابِ نیمروز (قیلوله) باید کوتاه باشد؟", a: true, h: "خوابِ طولانیِ روز مضر است اما استراحتِ کوتاه مفید است."},
    {q: "آیا خوردنِ غذاهایِ سرد در زمستان توصیه می‌شود؟", a: false, h: "در زمستان باید غذاهایِ گرم مصرف کرد."},
    {q: "آیا بیداریِ شبانه موجبِ تیرگیِ پوست می‌شود؟", a: true, h: "بیداریِ شبانه کبد را ضعیف و پوست را تیره می‌کند."},
    {q: "آیا ورزشِ سنگین در هوایِ گرم مضر است؟", a: true, h: "باعثِ غش و سوختنِ اخلاط می‌شود."},
    {q: "آیا استفاده از مسواکِ چوبِ اراک مفید است؟", a: true, h: "بسیار نافع برای تقویت لثه و دندان است."},
    {q: "آیا هوایِ کوهستان برای افرادِ سوداوی مفید است؟", a: true, h: "هوای سبک و آزاد سودا را تحلیل می‌برد."},
    {q: "آیا خوابیدنِ بعد از حمام مفید است؟", a: true, h: "خواب بعد از حمام بدن را مرطوب و چاق می‌کند."},
    {q: "آیا نوشیدنِ دوغ همراه با گوشت مضر است؟", a: true, h: "ترکیب سرد و گرمِ شدید با هم هضم را مختل می‌کند."},
    {q: "آیا پیاده‌رویِ طولانیِ در آفتابِ ظهر مضر است؟", a: true, h: "باعثِ غلبه‌ی صفرا و سردرد می‌شود."},
    {q: "آیا مصرفِ سبزیجاتِ تازه به هضم کمک می‌کند؟", a: true, h: "فیبر موجود در سبزیجات به دفعِ مواد زائد کمک می‌کند."},
    {q: "آیا خوابِ زیادِ شبانه برایِ افرادِ بلغمی توصیه می‌شود؟", a: false, h: "بلغمی‌ها باید کمتر بخوابند تا سردی‌شان زیاد نشود."},
    {q: "آیا هوایِ بارانی برایِ تنفسِ همه عالی است؟", a: false, h: "برایِ برخی افرادِ حساسِ آلرژیک یا بلغمی ممکن است سخت باشد."},
    {q: "آیا شستنِ پا با آبِ سرد برایِ آرامشِ مغز مفید است؟", a: true, h: "بخارات را از سر به سمت پایین می‌کشد."},
    {q: "آیا استفاده از زیراندازِ نرم برای ستون فقرات بهتر است؟", a: false, h: "تشکِ بیش از حد نرم برای کمر مضر است."},
    {q: "آیا خوردنِ شیرینیِ طبیعی (عسل) مفید است؟", a: true, h: "عسل پاک‌کننده و تقویت‌کننده است."},
    {q: "آیا خوابِ ناکافی باعثِ پرخوری می‌شود؟", a: true, h: "کم‌خوابی هورمون‌های گرسنگی را زیاد می‌کند."},
    {q: "آیا استحمامِ با آبِ خیلی داغ برای قلب مفید است؟", a: false, h: "قلب را ضعیف و سست می‌کند."},
    {q: "آیا نشستنِ طولانی‌مدت برای کمر مضر است؟", a: true, h: "باعثِ رکودِ خون در ناحیه کمر می‌شود."},
    {q: "آیا هوایِ شرجی برایِ همه مفید است؟", a: false, h: "رطوبتِ بالا برایِ خیلی‌ها تنفس را سخت می‌کند."},
    {q: "آیا نوشیدنِ شربتِ سکنجبین برایِ کبد مفید است؟", a: true, h: "سکنجبین بازکننده انسدادهای کبد است."},
    {q: "آیا خوابِ در حالتِ نشسته مفید است؟", a: false, h: "خواب باید در حالتِ درازکش باشد تا آرامش کامل حاصل شود."},
    {q: "آیا پیاده‌رویِ عصرگاهی باعثِ آرامشِ اعصاب می‌شود؟", a: true, h: "هوایِ عصر تعادلِ طبعی دارد."},
    {q: "آیا مصرفِ میوه همراه با غذا مفید است؟", a: false, h: "میوه باید قبل یا جدا از غذا خورده شود."},
    {q: "آیا حمامِ بخار برایِ پاکسازیِ پوست عالی است؟", a: true, h: "بخار منافذ را باز و مواد زائد را نرم می‌کند."},
    {q: "آیا خشمِ کنترل‌نشده عمر را کوتاه می‌کند؟", a: true, h: "فشارِ شدید به قلب و عروق می‌آورد."},
    {q: "آیا خوابِ کافی باعث تقویتِ قوایِ بدنی می‌شود؟", a: true, h: "خواب زمانِ بازسازیِ سلول‌ها و تجدیدِ قواست."},
    {q: "آیا هوایِ سالم و پاک حقِ مسلمِ بدن است؟", a: true, h: "بدن بدون هوای پاک هرگز سالم نمی‌ماند."}
];

let cur = 0, score = 0;

function submit(ans) {
    const isCorrect = (ans === data[cur].a);
    const feedback = document.getElementById('feedback');
    if (isCorrect) {
        score++;
        feedback.innerText = "✅ درست بود";
        feedback.style.color = "#27ae60";
    } else {
        feedback.innerText = "❌ غلط بود";
        feedback.style.color = "#c0392b";
    }
    
    setTimeout(() => {
        cur++;
        if (cur < data.length) {
            update();
        } else {
            finish();
        }
    }, 1000);
}

function update() {
    document.getElementById('q-text').innerText = data[cur].q;
    document.getElementById('progress').innerText = `سوال ${cur + 1} از ۱۰۰`;
    document.getElementById('score').innerText = score;
    document.getElementById('feedback').innerText = "";
}

function showHint() {
    alert(data[cur].h);
}

function finish() {
    document.getElementById('game-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    document.getElementById('final-score').innerText = score;
    if (score === 100) {
        document.getElementById('final-msg').innerText = "امتیاز طلایی! استاد طب سنتی";
    }
}

update();
</script>
</body>
</html>
