<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون سته ضروریه</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; width: 90%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .q-text { font-size: 18px; margin-bottom: 20px; line-height: 1.6; min-height: 60px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-yes { background: #27ae60; color: white; }
        .btn-no { background: #c0392b; color: white; }
        .btn-hint { background: #f39c12; color: white; margin-top: 20px; }
        #feedback { font-weight: bold; margin: 10px 0; height: 20px; }
        .score { font-size: 18px; color: #2c3e50; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="box">
    <div class="score" id="score-display">امتیاز: ۰</div>
    <div class="q-text" id="q-text">در حال بارگذاری...</div>
    <div id="feedback"></div>
    <button class="btn btn-yes" onclick="check(true)">بله</button>
    <button class="btn btn-no" onclick="check(false)">خیر</button>
    <button class="btn btn-hint" onclick="showHint()">راهنما</button>
    <div style="margin-top:15px; color:#999; font-size:12px;" id="progress">۱ از ۱۰۰</div>
</div>

<script>
    const questions = [
        {q: "آیا خوابیدن بلافاصله بعد از غذا برای هضم مفید است؟", a: false, h: "خوابیدن بعد غذا باعث فساد هضم و تولید اخلاط بد می‌شود."},
        {q: "آیا هوایِ آلوده یکی از عواملِ بیماری‌زایِ سته ضروریه است؟", a: true, h: "هوا اولین اصل است و هوای آلوده مستقیم به ریه آسیب می‌زند."},
        {q: "آیا دفعِ به موقعِ مواد زاید (استفراغ و احتباس) برای سلامتی واجب است؟", a: true, h: "عدم دفع مواد زاید باعث مسمومیت بدن می‌شود."},
        {q: "آیا ورزشِ شدید برای کسی که بیمار است توصیه می‌شود؟", a: false, h: "ورزش برای فرد بیمار باعث تحلیل قوای اصلی می‌شود."},
        {q: "آیا اعراض نفسانی (خشم، شادی) بر جسم اثر می‌گذارند؟", a: true, h: "تغییرات روحی فوراً بر کیفیت اخلاط اثر می‌گذارند."}
        // ... (فرض بر اینکه ۱۰۰ سوال مشابه با این دقت چیده شده)
    ];

    let cur = 0, score = 0;

    function check(ans) {
        const isCorrect = (ans === questions[cur].a);
        if (isCorrect) {
            score++;
            document.getElementById('feedback').innerText = "✅ درست بود";
            document.getElementById('feedback').style.color = "green";
        } else {
            document.getElementById('feedback').innerText = "❌ اشتباه بود";
            document.getElementById('feedback').style.color = "red";
        }
        
        setTimeout(() => {
            cur++;
            if (cur < questions.length) {
                update();
            } else {
                finish();
            }
        }, 800);
    }

    function update() {
        document.getElementById('q-text').innerText = questions[cur].q;
        document.getElementById('feedback').innerText = "";
        document.getElementById('score-display').innerText = `امتیاز: ${score}`;
        document.getElementById('progress').innerText = `${cur + 1} از ۱۰۰`;
    }

    function showHint() {
        alert(questions[cur].h);
    }

    function finish() {
        const isGolden = score === 100;
        document.body.innerHTML = `<div class="box"><h1>${isGolden ? '🌟 امتیاز طلایی!' : 'پایان'}</h1><p>امتیاز شما: ${score}</p></div>`;
    }

    update();
</script>
</body>
</html>
