<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی دوم: سیت‌های ضروری (ستة ضروریة)</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: #f0fdf4; color: #166534; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .back-btn { background: #15803d; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .back-btn:hover { background: #166534; }
        .container { width: 100%; max-width: 800px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #14532d; }
        p.subtitle { color: #4b5563; margin-bottom: 25px; font-size: 0.95rem; }
        .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .match-item { background: #f8fafc; border: 2px solid #e2e8f0; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; font-weight: 500; transition: all 0.2s; }
        .match-item:hover { border-color: #22c55e; background: #f0fdf4; }
        .match-item.selected { background: #dcfce7; border-color: #16a34a; color: #166534; }
        .match-item.matched { background: #bbf7d0; border-color: #15803d; color: #14532d; opacity: 0.7; cursor: default; }
        .status-box { padding: 15px; border-radius: 10px; background: #f0fdf4; border: 1px solid #bbf7d0; text-align: center; font-weight: 600; margin-bottom: 20px; }
        .complete-btn { display: block; width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; text-align: center; }
        .complete-btn:hover { background: #15803d; }
    </style>
</head>
<body>

    <div class="header">
        <h1>سیت‌های ضروری (ستة ضروریة)</h1>
        <a href="index.html" class="back-btn">بازگشت به پورتال</a>
    </div>

    <div class="container">
        <p class="subtitle">اصول شش‌گانه حفظ سلامتی در طب سنتی را بشناسید و موارد مرتبط را به هم متصل کنید.</p>
        
        <div class="status-box" id="statusBox">وضعیت: موارد را به درستی مطابقت دهید.</div>

        <div class="match-grid" id="gameGrid">
            <!-- Items will be dynamically managed or interactive -->
        </div>

        <button class="complete-btn" id="finishBtn" onclick="completeGame()">ثبت پیروزی و بازگشت</button>
    </div>

    <!-- اتصال به موتور مرکزی پورتال برای ثبت امتیاز -->
    <script src="progress-core.js"></script>
    <script>
        // ثبت امتیاز بازی دوم (game2) پس از تکمیل موفقیت‌آمیز
        function completeGame() {
            if (typeof PortalProgress !== 'undefined') {
                PortalProgress.saveGameScore('game2', 100, 3); // 100 امتیاز، 3 ستاره
                alert('آفرین! امتیاز بازی دوم با موفقیت ثبت شد.');
                window.location.href = 'index.html';
            } else {
                alert('خطا در اتصال به موتور پورتال. لطفاً مطمئن شوید progress-core.js در کنار فایل است.');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
