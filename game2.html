<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون سته ضروریه</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .question { font-size: 20px; color: #34495e; margin-bottom: 30px; min-height: 100px; line-height: 1.6; display: flex; align-items: center; justify-content: center; }
        .btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-yes { background-color: #27ae60; }
        .btn-no { background-color: #c0392b; }
        .btn:active { transform: scale(0.98); }
        .stats { font-size: 14px; color: #95a5a6; margin-top: 20px; }
        .score-box { font-size: 24px; color: #2c3e50; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card" id="game">
    <div id="q-area">
        <div class="question" id="q-text">در حال بارگذاری...</div>
        <button class="btn btn-yes" onclick="submit(true)">بله</button>
        <button class="btn btn-no" onclick="submit(false)">خیر</button>
    </div>
    <div class="stats" id="counter">سوال ۱ از ۱۰۰</div>
</div>

<script>
    const data = [
        {q: "آیا هوای پاک و معتدل از ستون‌های سلامت است؟", a: true}, {q: "آیا خوابیدن بلافاصله بعد از غذا توصیه می‌شود؟", a: false},
        {q: "آیا حرکتِ بدنیِ متعادل برای دفع فضولات ضروری است؟", a: true}, {q: "آیا پرخوری در طب سنتی مذموم است؟", a: true},
        {q: "آیا نوشیدن آبِ یخ بلافاصله بعد از ورزش مفید است؟", a: false}, {q: "آیا خوابِ روز برای همه افراد مفید است؟", a: false},
        {q: "آیا خشم و غضبِ شدید مزاج را به سمت گرمی می‌برد؟", a: true}, {q: "آیا یبوست موجب تجمع سموم در بدن می‌شود؟", a: true},
        {q: "آیا هوایِ آلوده برای ریه مضر است؟", a: true}, {q: "آیا خوابِ کافی باعث تقویت قوای بدنی می‌شود؟", a: true},
        {q: "آیا خوردن میوه‌هایِ نارس توصیه می‌شود؟", a: false}, {q: "آیا استحمامِ زیاد باعث ضعفِ بدن می‌شود؟", a: true},
        {q: "آیا سکونِ مطلق و دائمی برای بدن مفید است؟", a: false}, {q: "آیا شادیِ معتدل باعث تقویتِ قلب می‌شود؟", a: true},
        {q: "آیا نوشیدن آب در میان غذا هضم را مختل می‌کند؟", a: true}, {q: "آیا دفعِ مناسبِ فضولات از ارکانِ سلامت است؟", a: true},
        {q: "آیا خوابِ طولانیِ شبانه همیشه مفید است؟", a: false}, {q: "آیا هوایِ سرد برای افراد سردمزاج مفید است؟", a: false},
        {q: "آیا ورزشِ شدید بعد از حمام توصیه می‌شود؟", a: false}, {q: "آیا غم و اندوهِ طولانی موجبِ سردیِ بدن می‌شود؟", a: true},
        {q: "آیا جویدنِ کاملِ غذا به هضم کمک می‌کند؟", a: true}, {q: "آیا خوردنِ غذا قبل از گرسنگیِ واقعی درست است؟", a: false},
        {q: "آیا هوایِ مرطوب برای بلغمی‌ها مشکل‌ساز است؟", a: true}, {q: "آیا بی خوابی موجب خشکی مغز می‌شود؟", a: true},
        {q: "آیا تعریقِ ناشی از فعالیت مفید است؟", a: true}, {q: "آیا درهم‌خوری (خوردن چند نوع غذا) مضر است؟", a: true},
        {q: "آیا حمامِ رفتن با معده پر توصیه می‌شود؟", a: false}, {q: "آیا نوشیدنِ آبِ ولرم بهتر از آبِ یخ است؟", a: true},
        {q: "آیا اضطراب موجب اختلال در خواب می‌شود؟", a: true}, {q: "آیا خوابِ قیلوله (قبل ظهر) برای همه مفید است؟", a: false},
        {q: "آیا ورزش کردنِ ناشتا مفید است؟", a: true}, {q: "آیا استفاده از عطر‌های طبیعی تقویت‌کننده است؟", a: true},
        {q: "آیا حبسِ ادرار برای کلیه‌ها مضر است؟", a: true}, {q: "آیا غذای مانده (بیات) برای بدن مفید است؟", a: false},
        {q: "آیا هوایِ بسیار گرم برای صفراوی‌ها مفید است؟", a: false}, {q: "آیا ماساژ بدن به دفع فضولات کمک می‌کند؟", a: true},
        {q: "آیا سحرخیزی برای حفظِ سلامتی توصیه شده است؟", a: true}, {q: "آیا خوابیدن زیر نور خورشید مفید است؟", a: false},
        {q: "آیا نوشیدن آبِ جوشیده بهتر از آبِ خام است؟", a: true}, {q: "آیا تنفسِ عمیق هوای پاک مفید است؟", a: true},
        {q: "آیا خوردن شیرینی‌های مصنوعی عامل بیماری است؟", a: true}, {q: "آیا عصبانیت در هنگام غذا خوردن مضر است؟", a: true},
        {q: "آیا خوابِ زیاد موجبِ غلظتِ خون می‌شود؟", a: false}, {q: "آیا ورزشِ نیمه‌سنگین برای بدن لازم است؟", a: true},
        {q: "آیا استرس‌های روانی بر هضم غذا اثر منفی دارد؟", a: true}, {q: "آیا خوابیدنِ دمر (روی شکم) توصیه می‌شود؟", a: false},
        {q: "آیا نوشیدن آبِ زیادِ قبل از خواب مفید است؟", a: false}, {q: "آیا هوایِ کوهستان برای تقویت قلب مفید است؟", a: true},
        {q: "آیا خوردنِ بیش از حدِ نمک مضر است؟", a: true}, {q: "آیا استفاده از عطرهایِ تند همیشه مفید است؟", a: false},
        {q: "آیا دفعِ به موقعِ مدفوع از ضروریات است؟", a: true}, {q: "آیا خوابِ بعد از غروبِ آفتاب توصیه می‌شود؟", a: false},
        {q: "آیا ورزشِ گروهی برای روحیه مفید است؟", a: true}, {q: "آیا خوردنِ غذا در ظروفِ آلومینیومی توصیه می‌شود؟", a: false},
        {q: "آیا تغییراتِ ناگهانیِ دما برای بدن مضر است؟", a: true}, {q: "آیا خندیدنِ زیاد موجبِ خشکیِ قلب می‌شود؟", a: true},
        {q: "آیا خوابِ کوتاه بعد از ناهار (خیلوله) مفید است؟", a: true}, {q: "آیا نوشیدنِ چای بلافاصله بعد غذا مفید است؟", a: false},
        {q: "آیا هوایِ خشک برای سوداوی‌ها مضر است؟", a: true}, {q: "آیا پیاده‌رویِ آرام برای همه مفید است؟", a: true},
        {q: "آیا عصبانیت موجبِ افزایشِ ضربان قلب می‌شود؟", a: true}, {q: "آیا خوابیدن با دهان باز مفید است؟", a: false},
        {q: "آیا حذفِ صبحانه برای بدن مفید است؟", a: false}, {q: "آیا استفاده از روغن‌های طبیعی مفید است؟", a: true},
        {q: "آیا حبسِ نفس به مدت طولانی مضر است؟", a: true}, {q: "آیا خوردنِ یخ موجبِ گرفتگیِ عروق می‌شود؟", a: true},
        {q: "آیا هوایِ بهاری بهترین هوا برای بدن است؟", a: true}, {q: "آیا بیداریِ شبانه موجبِ تیرگیِ پوست می‌شود؟", a: true},
        {q: "آیا ورزشِ زیاد موجبِ تحلیلِ بدن می‌شود؟", a: true}, {q: "آیا خوردنِ غذا در آرامشِ کامل توصیه می‌شود؟", a: true},
        {q: "آیا استراحتِ کامل بعد از بیماری لازم است؟", a: true}, {q: "آیا نوشیدنِ آبِ سردِ ناشتا مضر است؟", a: true},
        {q: "آیا تنوع در غذا برای همه لازم است؟", a: false}, {q: "آیا استرس باعثِ سفید شدنِ مو می‌شود؟", a: true},
        {q: "آیا هوایِ معتدل به تعادلِ اخلاط کمک می‌کند؟", a: true}, {q: "آیا نشستن طولانی‌مدت برای کمر مضر است؟", a: true},
        {q: "آیا خوابِ منظمِ شبانه از پیریِ زودرس جلوگیری می‌کند؟", a: true}, {q: "آیا خوردنِ سیر برای همه توصیه می‌شود؟", a: false},
        {q: "آیا فعالیتِ بدنیِ مداوم از تنبلی جلوگیری می‌کند؟", a: true}, {q: "آیا استفاده از موادِ آرایشیِ شیمیایی مضر است؟", a: true},
        {q: "آیا خشمِ مهارنشده به کبد آسیب می‌زند؟", a: true}, {q: "آیا نوشیدنِ آبِ شور تشنگی را رفع می‌کند؟", a: false},
        {q: "آیا هوایِ آلوده موجبِ سردرد می‌شود؟", a: true}, {q: "آیا ورزشِ صبحگاهی انرژی‌بخش است؟", a: true},
        {q: "آیا خوابِ زیادِ ظهر موجبِ گیجی می‌شود؟", a: true}, {q: "آیا استفاده از ظروفِ سفالی مفید است؟", a: true},
        {q: "آیا تنفسِ عمیق سیستمِ ایمنی را قوی می‌کند؟", a: true}, {q: "آیا خوردنِ آبِ یخ قبل از غذا معده را سرد می‌کند؟", a: true},
        {q: "آیا سکوتِ در هنگامِ غذا خوردن به هضم کمک می‌کند؟", a: true}, {q: "آیا استرسِ مزمن سیستمِ عصبی را تخریب می‌کند؟", a: true},
        {q: "آیا پیاده‌رویِ سریع برای قلب مفید است؟", a: true}, {q: "آیا خوابیدن با معده خالی (بسیار گرسنه) خوب است؟", a: false},
        {q: "آیا عصبانیت موجبِ ترشحِ صفرا می‌شود؟", a: true}, {q: "آیا هوایِ سردِ زمستان برای مفاصل مضر است؟", a: true},
        {q: "آیا استفاده از مسواکِ طبیعی (چوب اراک) مفید است؟", a: true}, {q: "آیا خوردنِ زیادِ گوشتِ قرمز توصیه می‌شود؟", a: false},
        {q: "آیا خندیدنِ طولانی موجبِ خستگیِ عضلات صورت می‌شود؟", a: true}, {q: "آیا ورزش کردن در هوایِ آلوده مفید است؟", a: false}
    ];

    let index = 0, score = 0;
    
    function submit(ans) {
        if (ans === data[index].a) score++;
        index++;
        if (index < data.length) {
            document.getElementById('q-text').innerText = data[index].q;
            document.getElementById('counter').innerText = `سوال ${index + 1} از ۱۰۰`;
        } else {
            showResult();
        }
    }

    function showResult() {
        const msg = (score === 100) ? "🌟 امتیاز طلایی! استاد طب سنتی" : "پایان آزمون";
        document.getElementById('game').innerHTML = `
            <div class="score-box">${msg}</div>
            <p>امتیاز نهایی: ${score} از ۱۰۰</p>
            <button class="btn btn-yes" onclick="location.reload()">شروع مجدد</button>
        `;
    }

    document.getElementById('q-text').innerText = data[0].q;
</script>
</body>
</html>
