<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون سته ضروریه</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .game-card { background: white; width: 95%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        
        #q-text { font-size: 1.1rem; margin: 20px 0; color: #333; height: 80px; display: flex; align-items: center; justify-content: center; }
        
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: #27ae60; width: 0%; transition: width 0.3s; }

        .btn-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-yes { background: #27ae60; color: white; }
        .btn-no { background: #c0392b; color: white; }
        .btn-hint { background: #f39c12; color: white; grid-column: span 2; }
        
        #feedback { font-weight: bold; margin: 10px 0; height: 20px; color: #555; }
        
        .hidden { display: none !important; }

        /* Golden Style */
        .golden-badge {
            background: linear-gradient(135deg, #ffd700, #ffb300);
            color: #fff; border-radius: 50%; width: 120px; height: 120px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; margin: 20px auto;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="game-card" id="game-ui">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div id="q-text">در حال بارگذاری...</div>
    <div id="feedback"></div>
    <div class="btn-box">
        <button class="btn btn-yes" onclick="submit(true)">صحیح</button>
        <button class="btn btn-no" onclick="submit(false)">غلط</button>
        <button class="btn btn-hint" onclick="showHint()">💡 راهنما</button>
    </div>
</div>

<div class="game-card hidden" id="result-ui">
    <div id="badge-container"></div>
    <h2 id="final-msg">پایان آزمون</h2>
    <p>امتیاز شما: <span id="final-score">0</span> از ۱۰۰</p>
    <button class="btn btn-yes" style="width:100%" onclick="location.reload()">شروع مجدد</button>
</div>

<script>
const data = [
    {q: "آیا هوایِ آلوده برای تنفس مضر است؟", a: true, h: "هوا اولین اصل است و آلودگی مستقیم ریه را تخریب می‌کند."},
    {q: "آیا خوابیدن بلافاصله بعد از غذا توصیه می‌شود؟", a: false, h: "خوابِ بعد از غذا مانع هضم صحیح می‌شود و خلط خام تولید می‌کند."},
    {q: "آیا حرکتِ متعادلِ بدنی برای دفع فضولات لازم است؟", a: true, h: "ورزشِ معتدل باعث خروج مواد زائد از منافذ پوست می‌شود."},
    {q: "آیا پرخوری در طب سنتی موجب تجمع مواد زائد است؟", a: true, h: "پرخوری مانع هضم کامل می‌شود و بدن را مسموم می‌کند."},
    {q: "آیا نوشیدن آبِ یخ بعد از ورزش حرارتِ قلب را خاموش می‌کند؟", a: true, h: "بله، یخ حرارت غریزیِ لازم برای بازسازی بدن را خاموش می‌کند."},
    {q: "آیا شادیِ معتدل باعثِ باز شدنِ منافذِ بدن می‌شود؟", a: true, h: "شادی معتدل روح را به سطح بدن می‌آورد."},
    {q: "آیا غم و اندوهِ طولانی موجبِ سردی و خشکی می‌شود؟", a: true, h: "غمِ طولانی، حرارتِ غریزی را تحلیل می‌برد."},
    {q: "آیا استحمامِ زیاد باعث ضعفِ قوایِ بدنی می‌شود؟", a: true, h: "استحمام زیاد رطوبتِ اصلیِ بدن را تبخیر می‌کند."},
    {q: "آیا سکونِ دائمی برای بدن مفید است؟", a: false, h: "سکونِ دائمی باعث تجمع فضولات در عروق می‌شود."},
    {q: "آیا نوشیدن آب در میان غذا هضم را مختل می‌کند؟", a: true, h: "آبِ میان غذا اسید معده را رقیق کرده و هضم را ناقص می‌کند."},
    {q: "آیا خوابِ روز برای همه توصیه می‌شود؟", a: false, h: "خواب روز برای اکثر مردم مضر است و تولید بلغم می‌کند."},
    {q: "آیا هوایِ مرطوب برای بلغمی‌ها مشکل‌ساز است؟", a: true, h: "رطوبت برای افراد بلغمی که خود طبع سرد و مرطوب دارند، سنگین است."},

    {q: "آیا نوشیدنِ دوغ همراه با گوشت مضر است؟", a: true, h: "ترکیبِ سرد و گرمِ شدید با هم هضم را مختل می‌کند."},
    {q: "آیا پیاده‌رویِ طولانیِ در آفتابِ ظهر مضر است؟", a: true, h: "باعثِ غلبه‌ی صفرا و سردرد می‌شود."},
    {q: "آیا سبزیجاتِ تازه به هضم کمک می‌کند؟", a: true, h: "فیبر موجود در سبزیجات به دفعِ مواد زائد کمک می‌کند."},
    {q: "آیا خوابِ زیادِ شبانه برایِ بلغمی‌ها توصیه می‌شود؟", a: false, h: "بلغمی‌ها باید کمتر بخوابند تا سردی‌شان زیاد نشود."},
    {q: "آیا شستنِ پا با آبِ سرد برایِ آرامشِ مغز مفید است؟", a: true, h: "بخارات را از سر به سمت پایین می‌کشد."},
    {q: "آیا تشکِ نرم برای ستون فقرات بهتر است؟", a: false, h: "تشکِ بیش از حد نرم برای کمر مضر است."},
    {q: "آیا خوردنِ عسل مفید است؟", a: true, h: "عسل پاک‌کننده و تقویت‌کننده است."},
    {q: "آیا خوابِ ناکافی باعثِ پرخوری می‌شود؟", a: true, h: "کم‌خوابی هورمون‌های گرسنگی را زیاد می‌کند."},
    {q: "آیا حمامِ خیلی داغ برای قلب مفید است؟", a: false, h: "قلب را ضعیف و سست می‌کند."},
    {q: "آیا نشستنِ طولانی‌مدت برای کمر مضر است؟", a: true, h: "باعثِ رکودِ خون در ناحیه کمر می‌شود."},
    {q: "آیا هوایِ شرجی برایِ همه مفید است؟", a: false, h: "رطوبتِ بالا تنفس را برای خیلی‌ها سخت می‌کند."},
    {q: "آیا سکنجبین برایِ کبد مفید است؟", a: true, h: "سکنجبین بازکننده انسدادهای کبد است."},
    {q: "آیا خوابِ در حالتِ نشسته مفید است؟", a: false, h: "خواب باید در حالتِ درازکش باشد."},
    {q: "آیا پیاده‌رویِ عصرگاهی باعثِ آرامشِ اعصاب می‌شود؟", a: true, h: "هوایِ عصر تعادلِ طبعی دارد."},
    {q: "آیا مصرفِ میوه همراه با غذا مفید است؟", a: false, h: "میوه باید قبل یا جدا از غذا خورده شود."},
    {q: "آیا حمامِ بخار برایِ پاکسازیِ پوست عالی است؟", a: true, h: "بخار منافذ را باز و مواد زائد را نرم می‌کند."},
    {q: "آیا خشمِ کنترل‌نشده عمر را کوتاه می‌کند؟", a: true, h: "فشارِ شدید به قلب و عروق می‌آورد."},
    {q: "آیا خوابِ کافی باعث تجدیدِ قواست؟", a: true, h: "خواب زمانِ بازسازیِ سلول‌هاست."},
    {q: "آیا هوایِ سالم و پاک حقِ مسلمِ بدن است؟", a: true, h: "بدن بدون هوای پاک هرگز سالم نمی‌ماند."}
];

let cur = 0, score = 0;

function update() {
    document.getElementById('q-text').innerText = data[cur].q;
    document.getElementById('progress-fill').style.width = ((cur) / data.length * 100) + "%";
}

function submit(ans) {
    if (ans === data[cur].a) {
        score++;
        document.getElementById('feedback').innerText = "✅ صحیح";
        document.getElementById('feedback').style.color = "#27ae60";
    } else {
        document.getElementById('feedback').innerText = "❌ غلط";
        document.getElementById('feedback').style.color = "#c0392b";
    }
    
    setTimeout(() => {
        cur++;
        if (cur < data.length) {
            update();
            document.getElementById('feedback').innerText = "";
        } else {
            finish();
        }
    }, 600);
}

function showHint() { alert(data[cur].h); }

function finish() {
    document.getElementById('game-ui').classList.add('hidden');
    document.getElementById('result-ui').classList.remove('hidden');
    document.getElementById('final-score').innerText = score;
    
    if (score === data.length) {
        document.getElementById('badge-container').innerHTML = '<div class="golden-badge">🌟</div>';
        document.getElementById('final-msg').innerText = "تبریک! امتیاز طلایی";
    } else {
        document.getElementById('final-msg').innerText = "پایان آزمون";
    }
}

update();
</script>
</body>
</html>
