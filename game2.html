<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی سته ضروریه</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .options-btn { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; }
        .options-btn:hover { background: #e9ecef; }
        .correct { background-color: #28a745 !important; color: white; }
        .wrong { background-color: #dc3545 !important; color: white; }
        #next-btn { margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; display: none; }
        .back-btn { margin-top: 15px; display: inline-block; color: #555; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="card">
    <div id="game-ui">
        <h3 id="question-text">سوال در حال بارگذاری...</h3>
        <div id="options-container"></div>
        <button id="next-btn" onclick="nextQuestion()">سوال بعدی</button>
        <p>امتیاز: <span id="score-val">0</span></p>
    </div>
    <a href="index.html" class="back-btn">بازگشت به فهرست</a>
</div>

<script>
    // این همان ساختار ثابت Game 1 است
    const questions = [
        { q: "کدام عامل در سته ضروریه «مادر بیماری‌های گوارشی» است؟", options: ["خوردن و آشامیدن", "خواب", "استحمام", "ورزش"], correct: "خوردن و آشامیدن" },
        { q: "مصرف آب یخ بعد از غذا در طب سنتی چه حکمی دارد؟", options: ["مضر و نهی شده", "بسیار مفید", "بی‌اثر", "درمان کننده"], correct: "مضر و نهی شده" },
        { q: "ورزش ملایم چه اثری بر هضم دارد؟", options: ["تقویت هضم", "توقف هضم", "نفخ شدید", "تضعیف دستگاه گوارش"], correct: "تقویت هضم" },
        { q: "خواب معتدل چه تأثیری بر روح حیوانی دارد؟", options: ["بازسازی و آرامش", "تضعیف روح", "توقف فعالیت", "افزایش غضب"], correct: "بازسازی و آرامش" },
        { q: "اولین اصل از سته ضروریه چیست؟", options: ["هوا", "خواب", "غذا", "حرکت"], correct: "هوا" }
    ];

    let currentIdx = 0;
    let score = 0;
    let streak = 0;

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'options-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        const q = questions[currentIdx];
        const buttons = document.querySelectorAll('.options-btn');
        buttons.forEach(b => b.disabled = true);

        if (selected === q.correct) {
            btn.classList.add('correct');
            score += 10;
            streak++;
            // امتیاز طلایی: ۳ پاسخ متوالی
            if (streak === 3) {
                score += 5;
                streak = 0;
                alert("آفرین! ۳ پاسخ صحیح متوالی (۵ امتیاز اضافه)");
            }
        } else {
            btn.classList.add('wrong');
            streak = 0;
            // پیدا کردن گزینه صحیح و هایلایت آن
            buttons.forEach(b => { if(b.innerText === q.correct) b.classList.add('correct'); });
        }
        document.getElementById('score-val').innerText = score;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('game-ui').innerHTML = `<h3>پایان!</h3><p>امتیاز نهایی شما: ${score}</p>`;
        }
    }

    loadQuestion();
</script>
</body>
</html>
