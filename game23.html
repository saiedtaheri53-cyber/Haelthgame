<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون هوشمند</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .quiz-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .question { font-size: 1.3rem; margin-bottom: 25px; font-weight: bold; color: #2c3e50; line-height: 1.6; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #3498db; border-radius: 12px; background: white; color: #3498db; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .option-btn:hover { background: #3498db; color: white; }
        #score { margin-top: 20px; text-align: center; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="quiz-card" id="quiz">
    <div id="question" class="question">بارگذاری سوالات...</div>
    <div id="options"></div>
    <div id="score">امتیاز: ۰</div>
</div>

<script>
    // ساختار جدید: سوال، پاسخ صحیح، و آرایه‌ای از پاسخ‌های غلط اختصاصی
    const questions = [
        { 
            q: "کدام عنصر طبیعت گرم و خشک است؟", 
            correct: "آتش", 
            wrong: ["آب", "باد", "خاک"] 
        },
        { 
            q: "کدام فصل مزاج سرد و خشک دارد؟", 
            correct: "پاییز", 
            wrong: ["بهار", "تابستان", "زمستان"] 
        },
        { 
            q: "مزاج اصلی خون چیست؟", 
            correct: "گرم و تر", 
            wrong: ["سرد و خشک", "گرم و خشک", "سرد و تر"] 
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function render() {
        if (currentIdx >= questions.length) {
            document.getElementById('quiz').innerHTML = `<h3>آزمون تمام شد</h3><p>امتیاز شما: ${score} از ${questions.length}</p><button onclick="location.reload()" class="option-btn">شروع مجدد</button>`;
            return;
        }

        const q = questions[currentIdx];
        // ترکیب پاسخ صحیح و غلط‌ها
        const allOptions = [q.correct, ...q.wrong];
        // درهم‌ریزی کامل
        allOptions.sort(() => Math.random() - 0.5);

        document.getElementById('question').innerText = q.q;
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';

        allOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (opt === q.correct) score++;
                currentIdx++;
                render();
            };
            optDiv.appendChild(btn);
        });
        document.getElementById('score').innerText = `سوال ${currentIdx + 1} از ${questions.length} | امتیاز: ${score}`;
    }

    render();
</script>
</body>
</html>
