<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب و علم سلامتی - بازی شماره ۱</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #27ae60;
            --accent-color: #f1c40f; /* رنگ طلایی برای امتیاز */
            --error-color: #e74c3c;
            --bg-color: #ecf0f1;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background-color: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .score-container {
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options-container {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid var(--bg-color);
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background-color: var(--bg-color);
        }

        .correct {
            background-color: var(--secondary-color) !important;
            color: white !important;
            border-color: var(--secondary-color) !important;
        }

        .wrong {
            background-color: var(--error-color) !important;
            color: white !important;
            border-color: var(--error-color) !important;
        }

        .next-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        .result-screen {
            display: none;
        }

        .golden-score-display {
            font-size: 1.2rem;
            color: #d4af37; /* Gold color */
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-box">
    <div class="header">
        <div id="progress">سوال: 1 / 100</div>
        <div class="score-container" id="golden-score-display">امتیاز طلایی: 0</div>
    </div>

    <div id="game-content">
        <div class="question-text" id="question">در حال بارگذاری...</div>
        <div class="options-container" id="options"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">سوال بعدی</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>پایان بازی!</h2>
        <p id="final-score"></p>
        <p class="golden-score-display" id="final-golden-score"></p>
        <button class="option-btn" onclick="location.reload()">شروع مجدد</button>
    </div>
</div>

<script>
    // داده‌های بازی (به عنوان نمونه برای تست)
    const quizData = [
        {
            question: "کدام عنصر در طب سنتی با حرارت زیاد شناخته می‌شود؟",
            options: ["آب", "آتش", "خاک", "باد"],
            correct: 1
        },
        {
            question: "مفهوم 'خلفت‌الله' در چه زمینه‌ای کاربرد دارد؟",
            options: ["فیزیک", "الهیات", "نجوم", "ریاضیات"],
            correct: 1
        }
        // سوالات ۱ تا ۱۰۰ در اینجا قرار خواهند گرفت
    ];

    let current = 0;
    let goldenScore = 0; // اضافه شدن امتیاز طلایی

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const progressEl = document.getElementById('progress');
    const nextBtn = document.getElementById('next-btn');
    const goldenScoreEl = document.getElementById('golden-score-display');
    const gameContent = document.getElementById('game-content');
    const resultScreen = document.getElementById('result-screen');

    function loadQuiz() {
        resetState();
        const currentQuiz = quizData[current];
        
        questionEl.innerText = currentQuiz.question;
        progressEl.innerText = `سوال: ${current + 1} / ${quizData.length}`;

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.addEventListener('click', () => selectOption(index, button));
            optionsEl.appendChild(button);
        });
    }

    function resetState() {
        nextBtn.style.display = 'none';
        while (optionsEl.firstChild) {
            optionsEl.removeChild(optionsEl.firstChild);
        }
    }

    function selectOption(selectedIndex, button) {
        const correctIndex = quizData[current].correct;
        const allButtons = optionsEl.querySelectorAll('.option-btn');

        if (selectedIndex === correctIndex) {
            button.classList.add('correct');
            goldenScore++; // افزایش امتیاز طلایی در صورت پاسخ صحیح
            updateGoldenScoreDisplay();
        } else {
            button.classList.add('wrong');
            allButtons[correctIndex].classList.add('correct');
        }

        // غیرفعال کردن تمام دکمه‌ها بعد از انتخاب
        allButtons.forEach(btn => btn.disabled = true);
        nextBtn.style.display = 'inline-block';
    }

    function updateGoldenScoreDisplay() {
        goldenScoreEl.innerText = `امتیاز طلایی: ${goldenScore}`;
    }

    function nextQuestion() {
        current++;
        if (current < quizData.length) {
            loadQuiz();
        } else {
            showResults();
        }
    }

    function showResults() {
        gameContent.style.display = 'none';
        resultScreen.style.display = 'block';
        document.getElementById('final-score').innerText = `تعداد پاسخ‌های صحیح: ${goldenScore}`;
        document.getElementById('final-golden-score').innerText = `امتیاز طلایی نهایی: ${goldenScore}`;
    }

    // شروع بازی
    loadQuiz();
</script>

</body>
</html>
