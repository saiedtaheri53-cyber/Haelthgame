<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارکان اربعه - دانشنامه طب، علم سلامتی</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --gold: #f39c12;
            --light: #f4f7f6;
            --secondary: #7f8c8d;
            --danger: #c0392b;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--light);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .back-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover { background-color: var(--primary); }
        .stats {
            font-weight: bold;
            color: var(--gold);
            background: #fff8e1;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #ffe082;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .option-item {
            background: var(--light);
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        .option-item:hover {
            background: #e8f5e9;
            border-color: var(--accent);
        }
        .option-item.correct {
            background: #d4edda !important;
            color: #155724;
            border-color: #c3e6cb;
        }
        .option-item.wrong {
            background: #f8d7da !important;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            align-items: center;
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover { opacity: 0.9; }
        .hint-btn {
            background-color: #2980b9;
        }
        .hint-box {
            margin-top: 15px;
            padding: 10px;
            background: #ebf5fb;
            border-right: 4px solid #2980b9;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <a href="index.html" class="back-btn">← بازگشت به پورتال</a>
        <div class="stats" id="gold-display">🪙 طلا: ۰</div>
    </div>

    <h2>آزمون تخصصی: ارکان اربعه</h2>
    <p id="q-progress" style="color: var(--secondary); font-size: 13px;">سوال ۱ از ۱۰۰</p>
    
    <div class="question-box" id="q-text">در حال بارگذاری سوالات...</div>
    
    <ul class="options-list" id="options-container"></ul>

    <div class="hint-box" id="hint-box"></div>

    <div class="controls">
        <button class="btn hint-btn" onclick="toggleHint()">راهنمایی</button>
        <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">سوال بعد ←</button>
    </div>
</div>

<script>
    // بانک سوالات ارکان اربعه (قابل گسترش تا ۱۰۰ سوال کامل و غیرتکراری)
    const questions = [
        {
            w: "کدام عنصر از عناصر ارکان اربعه، گرم و خشک است؟",
            options: ["آتش", "هوا", "آب", "خاک"],
            answer: 0,
            h: "عنصری است سبکتر از آب و خاک که طبعی رو به بالا و سوزان دارد."
        },
        {
            w: "کدام عنصر از عناصر ارکان اربعه، گرم و تر است؟",
            options: ["هوا", "آتش", "آب", "خاک"],
            answer: 0,
            h: "این رکن منشا حیات و به طبع دموی (خون) نزدیک‌تر است."
        },
        {
            w: "کدام عنصر از عناصر ارکان اربعه، سرد و تر است؟",
            options: ["آب", "آتش", "هوا", "خاک"],
            answer: 0,
            h: "طبیعت مایعات و بلغم در بدن از این رکن مایه می‌گیرد."
        },
        {
            w: "کدام عنصر از عناصر ارکان اربعه، سرد و خشک است؟",
            options: ["خاک", "آتش", "هوا", "آب"],
            answer: 0,
            h: "سنگین‌ترین رکن که مرکز ثقل و ماندگاری است (موافق طبع سودا)."
        },
        {
            w: "غلبه کدام رکن در بدن انسان معمولاً باعث بروز صفرا می‌شود؟",
            options: ["آتش", "آب", "خاک", "هوا"],
            answer: 0,
            h: "صفرا طبعی گرم و خشک دارد و همسان با آتش است."
        },
        {
            w: "کدام رکن بیشترین تناسب را با اخلاط بلغمی دارد؟",
            options: ["آب", "خاک", "هوا", "آتش"],
            answer: 0,
            h: "بلغم سرد و تر است، درست مانند رکن متناظر آن."
        },
        {
            w: "در حکمت طبی و فلسفه اسلامی، نسبت ارکان به اعضای بدن چگونه است؟",
            options: ["ارکان مواد اولیه و پایه‌ای اخلاط و اعضا هستند", "ارکان تنها نقش تزئینی دارند", "ارکان مختص گیاهان هستند", "ارکان ربطی به مزاج ندارند"],
            answer: 0,
            h: "بدن انسان از اخلاط و اخلاط از ارکان پدید می‌آیند."
        },
        {
            w: "کدامیک از ارکان چهارگانه به عنوان 'ام‌البلاد' اخلاط گرم و تر شناخته می‌شود؟",
            options: ["هوا", "خاک", "آب", "آتش"],
            answer: 0,
            h: "هوای محیط و دمای متعادل حامی این رکن است."
        },
        {
            w: "کدام عنصر بیشترین ثبات و پایداری را در میان ارکان دارد؟",
            options: ["خاک", "هوا", "آب", "آتش"],
            answer: 0,
            h: "به دلیل سردی و خشکی زیاد، پایین‌ترین جایگاه را دارد."
        },
        {
            w: "ارتباط میان اخلاط اربعه و ارکان اربعه چگونه تعریف می‌شود؟",
            options: ["هر خلطی از غلبه یک رکن خاص در بدن پدید می‌آید", "هیچ ارتباطی ندارند", "اخلاط مستقل از ارکان هستند", "تنها عوارض جانبی تغذیه‌اند"],
            answer: 0,
            h: "صفرا از آتش، دم از هوا، بلغم از آب و سودا از خاک."
        }
        // می‌توانید سوالات ۱۱ تا ۱۰۰ را با همین ساختار دقیق و بدون تکرار در اینجا اضافه کنید.
    ];

    let currentIdx = 0;
    let score = parseInt(localStorage.getItem('tibb_gold') || '0');

    function updateGoldDisplay() {
        document.getElementById('gold-display').innerText = `🪙 طلا: ${score}`;
        localStorage.setItem('tibb_gold', score);
    }

    function loadQuestion() {
        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        if (currentIdx >= questions.length) {
            document.getElementById('q-progress').innerText = "پایان آزمون";
            document.getElementById('q-text').innerText = "تبریک! این بخش از ارکان اربعه به پایان رسید. امتیاز شما ذخیره شد.";
            document.getElementById('options-container').innerHTML = '';
            return;
        }

        const q = questions[currentIdx];
        document.getElementById('q-progress').innerText = `سوال ${currentIdx + 1} از ${questions.length}`;
        document.getElementById('q-text').innerText = q.w;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = opt;
            li.onclick = () => selectOption(li, idx, q.answer);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(element, selected, correct) {
        const items = document.querySelectorAll('.option-item');
        items.forEach(item => item.onclick = null); // غیرفعال کردن کلیک مجدد

        if (selected === correct) {
            element.classList.add('correct');
            score += 10;
            updateGoldDisplay();
        } else {
            element.classList.add('wrong');
            items[correct].classList.add('correct');
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    function toggleHint() {
        const hintBox = document.getElementById('hint-box');
        hintBox.innerText = questions[currentIdx].h;
        hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    // مقداردهی اولیه
    updateGoldDisplay();
    loadQuestion();
</script>

</body>
</html>
