<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی ارکان اربعه</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 10px; margin: 0; }
        #game-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .q-info { text-align: center; color: #7f8c8d; margin-bottom: 10px; font-size: 14px; }
        .question { font-size: 18px; margin-bottom: 20px; color: #34495e; font-weight: bold; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; text-align: right; background: #fff; touch-action: manipulation; transition: 0.2s; }
        .option:hover { background: #f0f0f0; }
        .option.correct { background: #2ecc71 !important; color: white; border-color: #27ae60; }
        .option.wrong { background: #e74c3c !important; color: white; border-color: #c0392b; }
        #feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; background: #ecf0f1; color: #2c3e50; font-size: 14px; line-height: 1.6; }
        #next-btn, #portal-btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; font-size: 16px; text-align: center; text-decoration: none; }
        #next-btn { background: #3498db; color: white; display: none; }
        #portal-btn { background: #95a5a6; color: white; margin-top: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>ارکان اربعه</h2>
    <div id="q-number" class="q-info"></div>
    <div class="question" id="q-text"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="next-btn" onclick="nextQuestion()">سوال بعد</button>
    <a href="index.html" id="portal-btn">بازگشت به پورتال</a>
</div>

        { w: "عنصر آتش عامل چیست؟", options: ["تغییر", "پایداری", "سرمایش", "مرطوب‌سازی"], answer: "تغییر", h: "انرژی" },
        { w: "آیا بدن از ترکیب ارکان تشکیل شده؟", options: ["بله", "خیر", "فقط ارواح", "فقط اعضا"], answer: "بله", h: "قانون طبیعت" },
        { w: "کدام خلط برای مو و ناخن مفید است؟", options: ["سودا", "صفرا", "دم", "بلغم"], answer: "سودا", h: "خشکی و ساختار" },
        { w: "آیا هوای پاک برای ارکان مفید است؟", options: ["بله", "خیر", "فرقی ندارد", "مضر است"], answer: "بله", h: "نیاز اولیه" },
        { w: "کدام خلط با طحال مرتبط است؟", options: ["سودا", "بلغم", "صفرا", "دم"], answer: "سودا", h: "جذب و دفع" },
        { w: "کدام خلط با کبد مرتبط است؟", options: ["دم", "سودا", "بلغم", "صفرا"], answer: "دم", h: "تولید خون" },
        { w: "کدام رکن باعث لطافت پوست است؟", options: ["آب", "خاک", "آتش", "هوا"], answer: "آب", h: "رطوبت" },
        { w: "جمع‌بندی: «ارکان اربعه» کدام‌اند؟", options: ["آتش، هوا، آب، خاک", "دم، بلغم، صفرا، سودا", "گرم، سرد، تر، خشک", "قلب، کبد، مغز، ریه"], answer: "آتش، هوا، آب، خاک", h: "چهار عنصر بنیادین" }
    ];

    let currentQ = 0;
    let score = 0;

    function render() {
        const q = questions[currentQ];
        document.getElementById('q-number').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
        document.getElementById('q-text').innerText = q.w;
        
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        
        // ایجاد کپی از گزینه‌ها و درهم‌ریزی آن‌ها
        let opts = [...q.options];
        opts.sort(() => Math.random() - 0.5);

        opts.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            optDiv.appendChild(btn);
        });
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback').style.display = 'none';
    }

    function check(selected, btn) {
        const q = questions[currentQ];
        const buttons = document.querySelectorAll('.option');
        buttons.forEach(b => b.disabled = true);
        
        if (selected === q.answer) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); });
        }
        document.getElementById('feedback').style.display = 'block';
        document.getElementById('feedback').innerText = "پاسخ صحیح: " + q.answer + " | راهنما: " + q.h;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) render();
        else alert('پایان بازی! امتیاز نهایی شما: ' + score + ' از ' + questions.length);
    }

    render();
</script>
</body>
</html>
