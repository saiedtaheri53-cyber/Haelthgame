<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی شماره ۱: ارکان اربعه - طب، علم سلامتی</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --accent: #ff9800;
            --bg-color: #f4f6f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d0d7de;
        }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 25px;
            border: 1px solid var(--border-color);
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 22px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #e8f5e9;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: right;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            border-color: var(--primary-light);
            background-color: #f1f8e9;
        }
        .option-btn.correct {
            background-color: #c8e6c9 !important;
            border-color: var(--primary) !important;
            color: #1b5e20;
        }
        .option-btn.wrong {
            background-color: #ffcdd2 !important;
            border-color: #c62828 !important;
            color: #b71c1c;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-light);
        }
        .btn-secondary {
            background-color: #78909c;
        }
        .btn-secondary:hover {
            background-color: #607d8b;
        }
        .popup {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .popup h2 {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>بازی شماره ۱: ارکان اربعه (عناصر چهارگانه)</h1>
            <p>دانشنامه جامع طب، علم سلامتی</p>
        </header>

        <div id="gameArea">
            <div class="stats-bar">
                <span id="questionCounter">سوال ۱ از ۱۰۰</span>
                <span id="scoreTracker">💰 سکه این بازی: ۰</span>
            </div>

            <div class="question-box" id="questionText">
                در حال بارگذاری سوالات ارکان اربعه...
            </div>

            <div class="options-container" id="optionsContainer">
                <!-- گزینه‌ها اینجا قرار می‌گیرند -->
            </div>

            <div class="nav-buttons">
                <a href="index.html" class="btn btn-secondary">← بازگشت به درگاه پورتال</a>
                <button class="btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">سوال بعدی →</button>
            </div>
        </div>

        <div id="resultArea" class="popup">
            <h2>پایان بازی شماره ۱ 🎉</h2>
            <p id="finalScoreText" style="font-size: 18px; margin: 15px 0;"></p>
            <p style="color: #666;">امتیاز شما در صندوقچه کل پروژه ذخیره شد.</p>
            <div style="margin-top: 20px; display: flex; justify-content: center; gap: 15px;">
                <a href="index.html" class="btn">بازگشت به پورتال اصلی</a>
                <button class="btn btn-secondary" onclick="restartGame()">تلاش مجدد</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "کدام عنصر از ارکان اربعه دارای طبع گرم و خشک است؟",
                options: ["آتش", "آباد", "آب", "خاک"],
                answer: 0
            },
            {
                q: "طبع عنصر آب چیست؟",
                options: ["گرم و تر", "سرد و تر", "سرد و خشک", "گرم و خشک"],
                answer: 1
            },
            {
                q: "عنصر خاک دارای چه طبعی است؟",
                options: ["گرم و خشک", "سرد و تر", "سرد و خشک", "گرم و تر"],
                answer: 2
            },
            {
                q: "طبع عنصر هوا (باد) چیست؟",
                options: ["سرد و تر", "سرد و خشک", "گرم و خشک", "گرم و تر"],
                answer: 3
            },
            ...Array.from({length: 96}, (_, index) => ({
                q: `سوال شماره ${index + 5}: از مباحث تخصصی ارکان اربعه و تاثیرات آن بر امزاج انسانی، کدام گزینه صحیح است؟`,
                options: ["گزینه الف (صحیح)", "گزینه ب", "گزینه ج", "گزینه د"],
                answer: 0
            }))
        ];

        let currentQuestion = 0;
        let score = 0;
        const gameKey = "game_1_coins";

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            const qData = questions[currentQuestion];
            document.getElementById('questionCounter').innerText = `سوال ${currentQuestion + 1} از ${questions.length}`;
            document.getElementById('scoreTracker').innerText = `💰 سکه این بازی: ${score}`;
            document.getElementById('questionText').innerText = qData.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(idx, btn);
                container.appendChild(btn);
            });

            document.getElementById('nextBtn').style.display = 'none';
        }

        function selectAnswer(selectedIdx, btnElement) {
            const qData = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(b => b.onclick = null);

            if (selectedIdx === qData.answer) {
                btnElement.classList.add('correct');
                score += 1;
            } else {
                btnElement.classList.add('wrong');
                buttons[qData.answer].classList.add('correct');
            }

            localStorage.setItem(gameKey, score);
            document.getElementById('scoreTracker').innerText = `💰 سکه این بازی: ${score}`;

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function endGame() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('finalScoreText').innerText = `امتیاز نهایی شما: ${score} از ${questions.length}`;
            localStorage.setItem(gameKey, score);
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            localStorage.setItem(gameKey, score);
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
