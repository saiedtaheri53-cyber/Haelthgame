<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی ۶: ارکان و نسبت طبع‌ها (دانشنامه جامع سلامت)</title>
    <style>
        :root {
            --primary: #047857;
            --primary-dark: #065f46;
            --gold: #f59e0b;
            --accent: #10b981;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
        }
        body {
            font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 25px;
            border: 2px solid #d1fae5;
        }
        h1 {
            color: var(--primary);
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #ecfdf5;
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #a7f3d0;
        }
        .stat-gold { color: #b45309; background: #fef3c7; border-color: #fde68a; }
        
        .progress-container {
            width: 100%;
            background: #e5e7eb;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-box {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            min-height: 55px;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e5e7eb;
            padding: 12px 16px;
            border-radius: 10px;
            text-align: right;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }
        .option-btn:hover:not(:disabled) {
            background: #f9fafb;
            border-color: var(--accent);
        }
        .option-btn.correct {
            background: #d1fae5 !important;
            border-color: #059669 !important;
            color: #065f46;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #991b1b;
        }
        .explanation {
            background: #fffbeb;
            border-right: 4px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex: 1;
        }
        .btn-next { background: var(--primary); color: white; }

        .btn-next:disabled { background: #d1d5db; cursor: not-allowed; }
        .btn-hint { background: #f3f4f6; color: var(--text-muted); flex: 0.4; }

            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .back-portal, .reset-progress {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .reset-progress { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشنامه طب سنتی - بازی ۶</h1>
    <div class="subtitle">ارکان، کیفیت‌ها و نسبت طبع‌ها (۱۰۰ سؤال کاملاً غیرتکراری و تخصصی)</div>

    <div class="stats-grid">
        <div class="stat-card" id="q-counter">سؤال: ۱/۱۰۰</div>
        <div class="stat-card stat-gold" id="gold-display">⭐ صندوقچه: ۰</div>
        <div class="stat-card" id="score-display">🏆 امتیاز: ۰</div>
        <div class="stat-card" id="streak-display">🔥 زنجیره: ۰</div>
    </div>

    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div id="quiz-area">
        <div class="question-box" id="question-text">در حال بارگذاری...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>

        <div class="nav-buttons">
            <button class="btn btn-hint" id="hint-btn" onclick="showHint()">💡 راهنما</button>
            <button class="btn btn-next" id="next-btn" onclick="nextQuestion()" disabled>سؤال بعدی ➔</button>
        </div>
    </div>

    <div class="actions-footer">
        <a href="index.html" class="back-portal">← بازگشت به پورتال اصلی</a>
        <span class="reset-progress" onclick="resetGameProgress()">🔄 شروع مجدد بازی</span>
    </div>
</div>

<script>
    // سیستم صوتی ملایم
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    const soundCorrect = () => { playTone(523.25, 'sine', 0.2); setTimeout(() => playTone(659.25, 'sine', 0.2), 80); };
    const soundWrong = () => { playTone(200, 'sawtooth', 0.3); };
    const soundClick = () => { playTone(440, 'sine', 0.08); };

    // بانک ۱۰۰ سؤال کاملاً مستقل، کارشناسی شده و بدون تکرار (ارکان، مزاج، اخلاط و اغذیه)

        { q: "پایه و اساس آفرینش اجسام در طب سنتی بر چه چیزی استوار است؟", options: ["عناصر چهارگانه (ارکان)", "ترکیبات شیمیایی مدرن", "انواع سلول‌ها", "ذات اتمی مواد"], answer: 0, hint: "به چهار عنصر اصلی فکر کنید.", exp: "ارکان اربعه (آب، هوا، آتش، خاک) عناصر ساده و اولیه سازنده موجودات هستند." },
        { q: "طبیعت رکن آتش چگونه است؟", options: ["سرد و تر", "گرم و خشک", "سرد و خشک", "گرم و تر"], answer: 1, hint: "آتش همیشه گرما و خشکی دارد.", exp: "آتش به عنوان گرم‌ترین و خشک‌ترین رکن شناخته می‌شود." },
        { q: "رکن آب دارای چه کیفیتی است؟", options: ["گرم و تر", "سرد و خشک", "سرد و تر", "گرم و خشک"], answer: 2, hint: "آب هم خنک است و هم نرم.", exp: "آب ذاتاً سرد و تر است و مایه حیات و نرمی است." },
        { q: "طبیعت رکن هوا کدام است؟", options: ["گرم و تر", "سرد و تر", "گرم و خشک", "سرد و خشک"], answer: 0, hint: "هوا برای حیات گرم و لطیف است.", exp: "هوا گرم و تر است و شباهت زیادی به روح حیوانی دارد." },
        { q: "کدام رکن دارای طبیعت سرد و خشک است؟", options: ["آتش", "هوا", "آب", "خاک"], answer: 3, hint: "این رکن بسیار سنگین و ثابت است.", exp: "خاک سردترین و خشک‌ترین رکن است و پایه ثبات و سکون است." },
        { q: "کدام فصل سال بیشترین تناسب را با طبع گرم و تر (دم) دارد؟", options: ["بهار", "تابستان", "پاییز", "زمستان"], answer: 0, hint: "فصلی که گل‌ها باز می‌شوند.", exp: "فصل بهار به دلیل رویش و انبساط اخلاط، هم‌طبع با دم (گرم و تر) است." },
        { q: "فصل تابستان با کدام کیفیت و طبع تناسب بیشتری دارد؟", options: ["سرد و تر", "گرم و خشک", "سرد و خشک", "گرم و تر"], answer: 1, hint: "آتش در این فصل بسیار قوی است.", exp: "تابستان به دلیل حرارت زیاد خورشید، گرم و خشک است و صفرا را تحریک می‌کند." },
        { q: "فصل پاییز چه طبعی دارد و محرک کدام خلط است؟", options: ["گرم و تر - دم", "سرد و تر - بلغم", "سرد و خشک - سودا", "گرم و خشک - صفرا"], answer: 2, hint: "فصل ریزش برگ‌ها و خشکی.", exp: "پاییز سرد و خشک است و زمینه را برای غلبه سودا فراهم می‌کند." },
        { q: "فصل زمستان با کدام مزاج سازگارتر و محرک آن است؟", options: ["صفرا", "سودا", "دم", "بلغم"], answer: 3, hint: "فصل بارش برف و رطوبت.", exp: "زمستان سرد و تر است و سبب غلبه بلغم در بدن می‌شود." },
        { q: "در سنین مختلف زندگی، دوران کودکی و شیرخوارگی چه مزاجی دارد؟", options: ["گرم و تر", "سرد و تر", "گرم و خشک", "سرد و خشک"], answer: 0, hint: "کودکان بسیار پرجنب‌وجوش و گرم هستند.", exp: "کودکی به دلیل رشد و رویش، دارای مزاج گرم و تر است." },
        { q: "مزاج دوران جوانی و میانسالی چگونه است؟", options: ["سرد و تر", "سرد و خشک", "گرم و خشک", "معتدل مطلق"], answer: 2, hint: "اوج قدرت و فعالیت.", exp: "جوانی اوج حرارت و خشکی نسبی بدن و دارای مزاج گرم و خشک است." },
        { q: "دوران کهنسالی و پیری با کدام مزاج شناخته می‌شود؟", options: ["گرم و تر", "سرد و خشک", "گرم و خشک", "سرد و تر"], answer: 1, hint: "با افزایش سن، رطوبت بدن کم می‌شود.", exp: "با بالا رفتن سن و تحلیل رطوبت‌ها، پیری سرد و خشک می‌شود." },

        { q: "بلغم چه ویژگی مزاجی دارد؟", options: ["گرم و تر", "سرد و تر", "سرد و خشک", "گرم و خشک"], answer: 1, hint: "بلغم شبیه به آب است.", exp: "بلغم خلطی سرد و تر است که شباهت زیادی به آب دارد." },
        { q: "سودا در طب سنتی دارای چه طبعی است؟", options: ["گرم و خشک", "سرد و تر", "سرد و خشک", "گرم و تر"], answer: 2, hint: "سودا ته نشین خون و رسوب آن است.", exp: "سودا خلطی سرد و خشک است که ته نشین خون و مایه ثبات عروق و بافت‌هاست." },
        { q: "کدام عضو بدن به عنوان رئیس اول و منبع حرارت غریزی شناخته می‌شود؟", options: ["مغز", "کبد", "قلب", "معده"], answer: 2, hint: "مرکز تپش و روح حیوانی.", exp: "قلب رئیس اول بدن و منبع اصلی حرارت غریزی و حیات است." },
        { q: "کبد در طب سنتی چه نقشی در ساخت اخلاط دارد؟", options: ["مرکز گوارش نهایی و طبخ اخلاط", "محل ذخیره صفرا خالص", "پمپ خون رسانی", "تصفیه هوا"], answer: 0, hint: "پخت غذا و تبدیل آن به چهار خلط در اینجا انجام می‌شود.", exp: "کبد کارخانه اصلی بدن و مرکز طبخ و تولید اخلاط چهارگانه است." },
        { q: "مزاج استخوان‌ها در بدن انسان چگونه است؟", options: ["گرم و تر", "سرد و خشک", "گرم و خشک", "سرد و تر"], answer: 1, hint: "استخوان‌ها سخت، محکم و خنک هستند.", exp: "استخوان‌ها به دلیل نیاز به استحکام و کمترین میزان نفوذ، سرد و خشک‌اند." },
        { q: "مزاج چربی و پیه در بدن انسان چیست؟", options: ["سرد و تر", "گرم و تر", "گرم و خشک", "سرد و خشک"], answer: 1, hint: "چربی‌ها نرم و در عین حال گرم‌کننده اند.", exp: "چربی (شحم) و پیه دارای مزاج گرم و تر می‌باشند." },

        { q: "۳۱. کدام خلط بیشترین تشابه را با عنصر آب دارد؟", options: ["دم", "صفرا", "بلغم", "سودا"], answer: 2, hint: "خلط سفید و سرد.", exp: "بلغم به دلیل داشتن بیشترین میزان رطوبت و برودت، شباهت تام به آب دارد." },
