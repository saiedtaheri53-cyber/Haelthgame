        { q: "اضطراب باعث افزایش کدام ماده در بدن می‌شود؟", o: ["سودا", "خون", "بلغم", "صفرا"], a: "سودا" },
        { q: "ورزش کردن در فضای باز چه مزایایی دارد؟", o: ["هوای تازه", "آلودگی کمتر", "آرامش", "همه موارد"], a: "همه موارد" },
        { q: "خوابیدن در اتاقی که چراغ روشن است چه اثری دارد؟", o: ["خواب ناآرام", "خواب عمیق", "تقویت بینایی", "هیچ"], a: "خواب ناآرام" },
        { q: "غذاهای خام چه اثری بر معده دارند؟", o: ["دیر هضم", "زود هضم", "تقویت کننده", "سرد کننده"], a: "دیر هضم" },
        { q: "تاثیر حمام بر فضولات بدن چیست؟", o: ["دفع فضولات", "تجمع فضولات", "خنثی شدن", "تولید خون"], a: "دفع فضولات" },
        { q: "شادی متعادل باعث چه حرکتی در خون می‌شود؟", o: ["تبسط (گسترش)", "انقباض", "توقف", "تخریب"], a: "تبسط (گسترش)" },
        { q: "ورزش بلافاصله بعد از حمام چه نتیجه‌ای دارد؟", o: ["ضعف بدن", "تقویت عضله", "افزایش صفرا", "چربی‌سوزی"], a: "ضعف بدن" },
        { q: "خوابِ بیش از نیاز باعث چه عارضه‌ای می‌شود؟", o: ["کسالت", "نشاط", "تولید خون صالح", "رفع بلغم"], a: "کسالت" },
        { q: "مصرف زیاد سرکه چه تاثیری بر اعصاب دارد؟", o: ["ضعف اعصاب", "تقویت اعصاب", "گرم شدن اعصاب", "خواب‌آوری"], a: "ضعف اعصاب" },
        { q: "هوای سرد چه اثری بر هضم دارد؟", o: ["افزایش هضم (به دلیل حبس حرارت)", "کاهش هضم", "تولید صفرا", "بی‌اثر"], a: "افزایش هضم (به دلیل حبس حرارت)" },
        { q: "آیا در طب سنتی خوابیدن بعد از خوردن ناهار توصیه می‌شود؟", o: ["خیر", "بله", "فقط در تابستان", "فقط در زمستان"], a: "خیر" },
        { q: "کدام سبزی برای رفع سودا مفید است؟", o: ["کاسنی", "نعنا", "سیر", "پیاز"], a: "کاسنی" },
        { q: "حمام کردن باعث تعریق می‌شود؛ این تعریق چه خاصیتی دارد؟", o: ["دفع سموم", "افزایش غلظت خون", "ضعف", "سنگینی"], a: "دفع سموم" },
        { q: "ترس باعث چه واکنشی در خون می‌شود؟", o: ["انقباض", "انبساط", "توقف", "خون‌سازی"], a: "انقباض" },
        { q: "ورزش منظم چه تاثیری بر سن بیولوژیک دارد؟", o: ["کاهش پیری", "افزایش پیری", "بی‌اثر", "فقط لاغری"], a: "کاهش پیری" },
        { q: "خوابیدن در حالتی که سر بالاتر از بدن باشد چه اثری دارد؟", o: ["سلامت مغز", "درد گردن", "سردرد", "تولید بلغم"], a: "سلامت مغز" },
        { q: "کدام ماده برای تقویت کبد عالی است؟", o: ["کاسنی", "گوشت گاو", "سیر", "فلفل"], a: "کاسنی" },
        { q: "در سته ضروریه، منظور از استفراغ چیست؟", o: ["دفع فضولات", "بالا آوردن غذا", "تنفس عمیق", "هیچکدام"], a: "دفع فضولات" }
    ];

    let curIdx = 0, score = 0, streak = 0;

    function loadQ() {
        const q = quizData[curIdx];
        document.getElementById('q-counter').innerText = `سوال ${curIdx + 1} از ${quizData.length}`;
        document.getElementById('question').innerText = q.q;
        document.getElementById('msg').innerText = '';
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';

        q.o.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(opt, btn);
            optDiv.appendChild(btn);
        });
    }

    function check(sel, btn) {
        const q = quizData[curIdx];
        const opts = document.querySelectorAll('.option');
        opts.forEach(b => b.disabled = true);
        
        if (sel === q.a) {
            btn.classList.add('correct');
            score += 10;
            streak++;
            
            if (streak === 3) {
                score += 5;
                document.getElementById('msg').innerText = "امتیاز طلایی! ۵+ اضافه شد";
                streak = 0; 
            }
        } else {
            btn.classList.add('wrong');
            opts.forEach(b => { if(b.innerText === q.a) b.classList.add('correct'); });
            streak = 0; 
        }
        
        document.getElementById('score').innerText = `امتیاز: ${score}`;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        curIdx++;
        if (curIdx < quizData.length) loadQ();
        else {
            document.querySelector('.container').innerHTML = `<h2>پایان بازی!</h2><p>امتیاز نهایی شما: ${score}</p><a href="index.html" class="nav-btn">بازگشت به فهرست</a>`;
        }
    }

    loadQ();
</script>
</body>
</html>
