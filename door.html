<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به طب پلی | طب، علم سلامتی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --gold: #d4af37; --dark-wood: #3e2723; }
        body, html { height: 100%; margin: 0; font-family: 'Vazirmatn', sans-serif; overflow: hidden; }
        
        /* پس‌زمینه در چوبی */
        .door-container {
            background-image: url('door-bg.webp');
            height: 100vh; background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }

        /* بسم الله */
        .bismillah {
            position: relative; z-index: 10; font-size: 2.2rem; color: var(--gold);
            text-shadow: 0 2px 10px rgba(0,0,0,0.9); margin-bottom: 15px; font-weight: bold;
        }

        /* پلاک درب */
        .door-plate {
            position: relative; z-index: 10; background: linear-gradient(145deg, #d4af37, #8a6d3b);
            padding: 12px 35px; border-radius: 8px; border: 3px solid #5d4037;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 2px 2px 5px rgba(255,255,255,0.4);
            text-align: center; color: #2e1a05; margin-bottom: 25px;
        }
        .door-plate h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; }
        .door-plate p { margin: 3px 0 0 0; font-size: 0.85rem; font-weight: bold; }

        /* بکوب‌ها */
        .knocker {
            position: absolute; z-index: 10; font-size: 2.8rem; cursor: pointer;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.7)); transition: 0.1s; user-select: none;
        }
        .knocker-left { left: 8%; top: 45%; }
        .knocker-right { right: 8%; top: 45%; }
        .knocker:active { transform: scale(0.9) rotate(10deg); }

        /* پنل تنظیمات اولیه روی در */
        .settings-panel {
            position: relative; z-index: 10; background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px); padding: 15px 20px; border-radius: 15px;
            display: flex; gap: 12px; align-items: center; justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.3); margin-bottom: 20px; flex-wrap: wrap;
        }
        .setting-item { display: flex; flex-direction: column; gap: 3px; }
        .setting-item label { color: #f4f1ea; font-size: 0.75rem; text-align: center; }
        .settings-panel select {
            padding: 6px 10px; border-radius: 6px; border: 1px solid var(--gold);
            background: #2e1a05; color: #fff; font-family: inherit; font-size: 0.85rem; cursor: pointer;
        }

        /* دکمه ورود اصلی */
        .enter-main-btn {
            position: relative; z-index: 10;
            padding: 12px 45px; font-size: 1.3rem; background: linear-gradient(145deg, #d4af37, #b8860b);
            color: #fff; border: 2px solid #fff; border-radius: 50px;
            cursor: pointer; font-weight: bold; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: 0.3s; text-decoration: none; display: inline-block;
        }
        .enter-main-btn:hover { transform: scale(1.08); background: #d4af37; }

        /* فوتر ارتباطات */
        .contact-footer {
            position: absolute; bottom: 15px; z-index: 10; display: flex; gap: 20px;
        }
        .contact-footer a { color: #d4af37; text-decoration: none; font-size: 0.8rem; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .contact-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="door-container">
    <div class="overlay"></div>

    <span class="bismillah">بسم الله الرحمن الرحیم</span>

    <!-- بکوب‌ها -->
    <div class="knocker knocker-left" title="کوبش زنانه">🚪</div>
    <div class="knocker knocker-right" title="کوبش مردانه">🚪</div>

    <!-- پلاک درب -->
    <div class="door-plate">
        <h1>طِب پُلی</h1>
        <p>طب، علم سلامتی — فعال‌سازی دانشنامه جامع</p>
    </div>

    <!-- پنل تنظیمات سریع اولیه -->
    <div class="settings-panel">
        <div class="setting-item">
            <label>زبان / Language</label>
            <select id="doorLang" onchange="saveDoorSettings()">
                <option value="fa">فارسی</option>
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="zh">中文</option>
            </select>
        </div>
        <div class="setting-item">
            <label>صدا / Sound</label>
            <select id="doorSound" onchange="saveDoorSettings()">
                <option value="true">روشن (🔊)</option>
                <option value="false">خاموش (🔇)</option>
            </select>
        </div>
        <div class="setting-item">
            <label>تم / Theme</label>
            <select id="doorTheme" onchange="saveDoorSettings()">
                <option value="light">روشن</option>
                <option value="dark">تاریک</option>
            </select>
        </div>
    </div>

    <!-- دکمه ورود -->
    <a href="index.html" class="enter-main-btn" onclick="grantAccess()">ورود به درگاه</a>

    <!-- فوتر ارتباطات -->
    <div class="contact-footer">
        <a href="https://eitaa.com/pazashke" target="_blank">ارتباط در ایتا</a>
        <a href="mailto:saiedtaheri53@gmail.com">ارسال ایمیل</a>
    </div>
</div>

<script>
    function saveDoorSettings() {
        localStorage.setItem('userLang', document.getElementById('doorLang').value);
        localStorage.setItem('sound', document.getElementById('doorSound').value);
        localStorage.setItem('userTheme', document.getElementById('doorTheme').value);
    }

    function grantAccess() {
        localStorage.setItem('tibb_entered_through_door', 'true');
        saveDoorSettings();
    }

    // بارگذاری تنظیمات ذخیره‌شده قبلی در صورت وجود
    window.onload = function() {
        if(localStorage.getItem('userLang')) document.getElementById('doorLang').value = localStorage.getItem('userLang');
        if(localStorage.getItem('sound')) document.getElementById('doorSound').value = localStorage.getItem('sound');
        if(localStorage.getItem('userTheme')) document.getElementById('doorTheme').value = localStorage.getItem('userTheme');
    }
</script>

</body>
</html>
