<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به طب پلی | طب، علم سلامتی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --gold: #d4af37; --dark-wood: #2c1810; }
        body, html { height: 100%; margin: 0; font-family: 'Vazirmatn', sans-serif; overflow: hidden; }
        
        /* پس‌زمینه دقیقاً همان تصویر درگاه چوبی */
        .door-container {
            background-image: url('door-bg.webp');
            height: 100vh; background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            position: relative; padding: 20px 0; box-sizing: border-box;
        }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: 1; }

        .content-wrapper {
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; justify-content: space-between;
        }

        /* هدر / عنوان بالای صفحه */
        .header-section { text-align: center; margin-top: 10px; }
        .bismillah {
            font-size: 1.8rem; color: #f4d06f;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9); font-weight: bold; margin-bottom: 5px;
        }

        /* پنل تنظیمات حرفه‌ای روی در */
        .settings-panel {
            background: rgba(44, 24, 16, 0.75);
            backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 12px;
            display: flex; gap: 15px; align-items: center; justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .setting-item { display: flex; flex-direction: column; gap: 2px; }
        .setting-item label { color: #d4af37; font-size: 0.7rem; text-align: center; font-weight: bold; }
        .settings-panel select {
            padding: 5px 10px; border-radius: 6px; border: 1px solid var(--gold);
            background: #1a0f0a; color: #fff; font-family: inherit; font-size: 0.8rem; cursor: pointer;
        }

        /* بخش پایین (دکمه ورود و فوتر) */
        .bottom-section { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 10px; }

        /* دکمه ورود اصلی با استایل درخشان */
        .enter-main-btn {
            padding: 12px 50px; font-size: 1.2rem; background: linear-gradient(145deg, #d4af37, #997a25);
            color: #1a0f0a; border: 2px solid #fff; border-radius: 50px;
            cursor: pointer; font-weight: bold; box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            transition: 0.3s; text-decoration: none; display: inline-block;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        }
        .enter-main-btn:hover { transform: scale(1.06); background: #f3cf55; }

        /* فوتر ارتباطات */
        .contact-footer { display: flex; gap: 25px; }
        .contact-footer a { color: #f4d06f; text-decoration: none; font-size: 0.85rem; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
        .contact-footer a:hover { text-decoration: underline; color: #fff; }
    </style>
</head>
<body>

<div class="door-container">
    <div class="overlay"></div>

    <div class="content-wrapper">
        <!-- بالای صفحه: بسم الله و تنظیمات -->
        <div class="header-section">
            <div class="bismillah">بسم الله الرحمن الرحیم</div>
            <div class="settings-panel">
                <div class="setting-item">
                    <label>زبان / Language</label>
                    <select id="doorLang" onchange="saveDoorSettings()">
                        <option value="fa">فارسی</option>
                        <option value="ar">العربية</option>
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="zh">中文</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>صدا / Sound</label>
                    <select id="doorSound" onchange="saveDoorSettings()">
                        <option value="true">روشن (🔊)</option>
                        <option value="false">خاموش (🔇)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>تم / Theme</label>
                    <select id="doorTheme" onchange="saveDoorSettings()">
                        <option value="light">روشن</option>
                        <option value="dark">تاریک</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- فضای خالی میانی برای دیده شدن طرح درب چوبی و نور وسط آن -->
        <div></div>

        <!-- پایین صفحه: دکمه ورود و لینک‌ها -->
        <div class="bottom-section">
            <a href="index.html" class="enter-main-btn" onclick="grantAccess()">ورود به درگاه</a>
            <div class="contact-footer">
                <a href="https://eitaa.com/pazashke" target="_blank">ارتباط در ایتا</a>
                <a href="mailto:saiedtaheri53@gmail.com">ارسال ایمیل</a>
            </div>
        </div>
    </div>
</div>

<script>
    function saveDoorSettings() {
        localStorage.setItem('userLang', document.getElementById('doorLang').value);
        localStorage.setItem('sound', document.getElementById('doorSound').value);
        localStorage.setItem('userTheme', document.getElementById('doorTheme').value);
    }

    function grantAccess() {
        localStorage.setItem('tibb_entered_through_door', 'true');
        saveDoorSettings();
    }

    // بارگذاری تنظیمات ذخیره‌شده
    window.onload = function() {
        if(localStorage.getItem('userLang')) document.getElementById('doorLang').value = localStorage.getItem('userLang');
        if(localStorage.getItem('sound')) document.getElementById('doorSound').value = localStorage.getItem('sound');
        if(localStorage.getItem('userTheme')) document.getElementById('doorTheme').value = localStorage.getItem('userTheme');
    }
</script>

</body>
</html>
