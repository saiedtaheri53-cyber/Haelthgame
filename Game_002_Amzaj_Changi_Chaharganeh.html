<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی ۰۰۲: امزاج چهارگانه | طب سلامتی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Vazirmatn", "Vazir", Tahoma, "Segoe UI", sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%);
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    line-height: 1.8;
  }
  .card {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    max-width: 760px;
    width: 100%;
    padding: 32px 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    text-align: center;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
  }
  .badge {
    display: inline-block;
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  p.desc {
    color: #cbd5e1;
    font-size: 1rem;
    margin-bottom: 24px;
    text-align: justify;
    text-align-last: center;
  }
  .humors-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .humor-pill {
    border-radius: 14px;
    padding: 10px 8px;
    font-size: 0.88rem;
    font-weight: 700;
  }
  .h-dam { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
  .h-safra { background: rgba(245, 158, 11, 0.2); color: #fde047; border: 1px solid rgba(245, 158, 11, 0.4); }
  .h-balgham { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
  .h-soda { background: rgba(148, 163, 184, 0.2); color: #e2e8f0; border: 1px solid rgba(148, 163, 184, 0.4); }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    transition: all 0.2s ease;
  }
  .btn-main {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    color: #fff;
    padding: 14px 44px;
    font-size: 1.1rem;
    box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.5);
  }
  .btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px -5px rgba(234, 88, 12, 0.6);
  }
  .btn-next {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    padding: 12px 36px;
    font-size: 1rem;
    margin-top: 18px;
    box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
  }
  .btn-next:hover { transform: translateY(-2px); }
  .btn-hint {
    background: rgba(255, 255, 255, 0.08);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.4);
    padding: 8px 18px;
    font-size: 0.85rem;
  }
  .btn-hint:hover:not(:disabled) {
    background: rgba(251, 191, 36, 0.18);
  }
  .btn-hint:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .top-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 0.95rem;
    flex-wrap: wrap;
    gap: 8px;
  }
  .score-badge {
    background: rgba(245, 158, 11, 0.18);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fde047;
    padding: 4px 14px;
    border-radius: 999px;
    font-weight: 800;
  }
  .progress-bar-wrap {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #ec4899, #f59e0b, #10b981);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .q-box {
    text-align: right;
  }
  .q-title {
    font-size: 1.15rem;
    font-weight: 800;
    margin-bottom: 20px;
    color: #f1f5f9;
    line-height: 1.7;
  }
  .options-grid {
    display: grid;
    gap: 12px;
  }
  .opt-btn {
    width: 100%;
    text-align: right;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e2e8f0;
    padding: 13px 18px;
    border-radius: 14px;
    font-size: 0.98rem;
    line-height: 1.6;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .opt-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(255, 255, 255, 0.3);
    transform: translateX(-4px);
  }
  .opt-btn.correct {
    background: rgba(16, 185, 129, 0.25) !important;
    border-color: #10b981 !important;
    color: #a7f3d0 !important;
  }
  .opt-btn.wrong {
    background: rgba(239, 68, 68, 0.25) !important;
    border-color: #ef4444 !important;
    color: #fecaca !important;
  }
  .opt-btn.removed {
    opacity: 0.25;
    text-decoration: line-through;
    cursor: not-allowed;
  }
  .opt-btn:disabled {
    cursor: default;
  }
  .opt-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    font-size: 0.85rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .feedback-box {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 0.93rem;
    text-align: right;
    line-height: 1.7;
    animation: fadeIn 0.3s ease;
  }
  .fb-correct {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #a7f3d0;
  }
  .fb-wrong {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fecaca;
  }
  .summary-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin: 24px 0;
  }
  .stat-card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 14px;
  }
  .stat-val {
    font-size: 1.5rem;
    font-weight: 900;
    color: #fbbf24;
    margin-bottom: 4px;
  }
  .stat-label {
    font-size: 0.82rem;
    color: #94a3b8;
  }
  .final-score {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(90deg, #fbbf24, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 12px 0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media(max-width: 520px) {
    .card { padding: 22px 16px; }
    .q-title { font-size: 1.05rem; }
    .opt-btn { font-size: 0.9rem; padding: 11px 14px; }
  }
</style>
</head>

<div class="card" id="app"></div>

<script>
const RAW_QUESTIONS = [{"q": "مزاج دموی از نظر کیفیت‌های چهارگانه چگونه است؟", "o": ["گرم و تر", "گرم و خشک", "سرد و تر", "سرد و خشک"], "a": 0, "e": "دموی گرم و تر است؛ مانند هوای دلپذیر بهار."}, {"q": "فصل غالب مزاج دم کدام است؟", "o": ["بهار", "تابستان", "پاییز", "زمستان"], "a": 0, "e": "بهار فصل غلبهٔ دم است؛ رطوبت و حرارت معتدل بهار با دم هم‌خوان است."}, {"q": "وقت غالب دم در شبانه‌روز کدام است؟", "o": ["بامداد (صبح زود)", "ظهر و بعدازظهر", "اوایل شب", "نیمه‌شب تا سحر"], "a": 0, "e": "دم در بامداد غلبه دارد، صفرا ظهر، بلغم اول شب و سودا نیمه‌شب."}, {"q": "رنگ چهرهٔ فرد غلبه‌یافته با دم چگونه توصیف می‌شود؟", "o": ["سرخ و گلگون", "زرد مایل به کاهی", "سفید و بی‌رنگ", "تیره و مایل به کبود"], "a": 0, "e": "سرخی و برافروختگی چهره از نشانه‌های بارز غلبه دم است."}, {"q": "مزاج صفراوی از نظر کیفیات چهارگانه چگونه است؟", "o": ["گرم و خشک", "گرم و تر", "سرد و خشک", "سرد و تر"], "a": 0, "e": "صفرا گرم و خشک است؛ مانند آفتاب تند تابستان."}, {"q": "فصل غالب مزاج صفرا کدام است؟", "o": ["تابستان", "بهار", "زمستان", "پاییز"], "a": 0, "e": "تابستان فصل غلبهٔ صفراست به سبب حرارت و خشکی زیاد."}, {"q": "وقت غالب صفرا در شبانه‌روز کدام است؟", "o": ["ظهر و پس‌چاشت", "بامداد", "اوایل شب", "نیمه‌شب"], "a": 0, "e": "حرارت ظهر بیشترین سازگاری را با طبع گرم و خشک صفرا دارد."}, {"q": "رنگ خلط صفرا چگونه توصیف می‌شود؟", "o": ["زرد مایل به سرخ یا طلایی", "سفید شیری", "سیاه قیرگون", "قرمز آلبالویی"], "a": 0, "e": "صفرا خلطی زردرنگ، سبک و کف‌آلود است."}, {"q": "مزاج بلغمی از نظر کیفیات چهارگانه چگونه است؟", "o": ["سرد و تر", "گرم و تر", "گرم و خشک", "سرد و خشک"], "a": 0, "e": "بلغم سرد و تر است؛ مانند باران و برف زمستانی."}, {"q": "فصل غالب مزاج بلغم کدام است؟", "o": ["زمستان", "تابستان", "بهار", "پاییز"], "a": 0, "e": "سردی و نمناکی زمستان بیشترین تحریک را بر خلط بلغم دارد."}, {"q": "وقت غالب خلط بلغم در شبانه‌روز کدام است؟", "o": ["اوایل شب تا نیمهٔ شب", "ظهر", "بامداد", "عصر"], "a": 0, "e": "برودت و سکون اول شب با طبیعت سرد و تر بلغم همراه است."}, {"q": "رنگ طبیعی خلط بلغم چگونه است؟", "o": function toPersianDigits(num) {
  const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(num).replace(/\d/g, d => f[d]);
}

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let questions = [];
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let hintsUsed = 0;
let answered = false;
let currentQuestion = null;

const app = document.getElementById("app");

function startGame() {
  questions = shuffle(RAW_QUESTIONS).map(q => {
    const originalOptions = q.o.map((text, idx) => ({ text, isCorrect: idx === q.a }));
    const shuffledOpts = shuffle(originalOptions);
    const correctIdx = shuffledOpts.findIndex(o => o.isCorrect);
    return {
      q: q.q,
      opts: shuffledOpts.map(o => o.text),
      correctIndex: correctIdx,
      explanation: q.e
    };
  });
  currentIndex = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  hintsUsed = 0;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  currentQuestion = questions[currentIndex];
  const qNumFa = toPersianDigits(currentIndex + 1);
  const totalFa = toPersianDigits(questions.length);
  const scoreFa = toPersianDigits(score);
  const progressPct = ((currentIndex) / questions.length) * 100;

  const optLabels = ['الف', 'ب', 'ج', 'د'];
  const optionsHtml = currentQuestion.opts.map((opt, i) => `
    <button class="opt-btn" id="opt-${i}" onclick="handleAnswer(${i})">
      <span class="opt-num">${optLabels[i]}</span>
      <span>${opt}</span>
    </button>
  `).join('');

  app.innerHTML = `
    <div class="top-stats">
      <span>سؤال <strong>${qNumFa}</strong> از <strong>${totalFa}</strong></span>
      <button class="btn-hint" id="hintBtn" onclick="useHint()">💡 راهنما (حذف ۲ گزینه) [۵- امتیاز]</button>
      <span class="score-badge">امتیاز: ${scoreFa}</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" style="width: ${progressPct}%"></div>
    </div>
    <div class="q-box">
      <div class="q-title">${currentQuestion.q}</div>
      <div class="options-grid" id="optionsContainer">
        ${optionsHtml}
      </div>
      <div id="feedbackContainer"></div>
    </div>
  `;
}

function useHint() {
  if (answered) return;
  const hintBtn = document.getElementById("hintBtn");
  if (!hintBtn || hintBtn.disabled) return;
  hintBtn.disabled = true;
  hintsUsed++;
  score = Math.max(0, score - 5);
  document.querySelector(".score-badge").innerText = "امتیاز: " + toPersianDigits(score);

  const wrongIndices = [0, 1, 2, 3].filter(idx => idx !== currentQuestion.correctIndex);
  const shuffledWrong = shuffle(wrongIndices);
  const toRemove = shuffledWrong.slice(0, 2);

  toRemove.forEach(idx => {
    const btn = document.getElementById("opt-" + idx);
    if (btn) {
      btn.classList.add("removed");
      btn.disabled = true;
    }
  });
}

function handleAnswer(selectedIdx) {
  if (answered) return;
  answered = true;

  const hintBtn = document.getElementById("hintBtn");
  if (hintBtn) hintBtn.disabled = true;

  const isCorrect = (selectedIdx === currentQuestion.correctIndex);
  const selectedBtn = document.getElementById("opt-" + selectedIdx);
  const correctBtn = document.getElementById("opt-" + currentQuestion.correctIndex);

  // Disable all options
  for (let i = 0; i < 4; i++) {
    const b = document.getElementById("opt-" + i);
    if (b) b.disabled = true;
  }

  if (isCorrect) {
    score += 10;
    correctCount++;
    if (selectedBtn) selectedBtn.classList.add("correct");
  } else {
    wrongCount++;
    if (selectedBtn) selectedBtn.classList.add("wrong");
    if (correctBtn) correctBtn.classList.add("correct");
  }

  document.querySelector(".score-badge").innerText = "امتیاز: " + toPersianDigits(score);

  const fbClass = isCorrect ? "fb-correct" : "fb-wrong";
  const fbTitle = isCorrect ? "✓ آفرین! پاسخ شما کاملاً درست است." : "✗ متأسفانه پاسخ نادرست بود.";

  const fbContainer = document.getElementById("feedbackContainer");
  fbContainer.innerHTML = `
    <div class="feedback-box ${fbClass}">
      <strong>${fbTitle}</strong><br>
      <span>${currentQuestion.explanation}</span>
    </div>
    <div style="text-align: center; margin-top: 14px;">
      <button class="btn-next" onclick="nextQuestion()">
        ${currentIndex === questions.length - 1 ? 'مشاهده نتیجه نهایی' : 'سؤال بعدی ←'}
      </button>
    </div>
  `;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    showResultScreen();
  }
}

function showResultScreen() {
  const maxScore = questions.length * 10;
  const percentage = Math.round((score / maxScore) * 100);

  let evaluation = "";
  if (percentage >= 85) {
    evaluation = "عالی و درخشان! تسلط فوق‌العاده‌ای بر مبحث امزاج و اخلاط طب سنتی دارید.";
  } else if (percentage >= 65) {
    evaluation = "بسیار خوب! پایه‌های علمی شما قوی است و با اندکی مرور به درجه تسلط کامل می‌رسید.";
  } else if (percentage >= 45) {
    evaluation = "خوب و قابل قبول؛ مرور مجدد ویژگی‌های فصول و علائم غلبه به ارتقای نمره شما کمک می‌کند.";
  } else {
    evaluation = "نیاز به مرور و مطالعه بیشتر مبانی امزاج چهارگانه. پیشنهاد می‌شود مجدداً آزمون را تکرار فرمایید.";
  }

  app.innerHTML = `
    <span class="badge">پایان آزمون ۱۰۰ سؤالی</span>
    <h1>کارنامه نهایی آزمون امزاج</h1>
    <div class="final-score">${toPersianDigits(score)} <span style="font-size: 1.1rem; color: #cbd5e1;">/ ${toPersianDigits(maxScore)} امتیاز</span></div>
    <p style="color: #38bdf8; font-size: 1.1rem; font-weight: 700; margin-bottom: 20px;">
      درصد موفقیت: ${toPersianDigits(percentage)}٪
    </p>
    <div class="summary-stats">
      <div class="stat-card">
        <div class="stat-val" style="color: #34d399;">${toPersianDigits(correctCount)}</div>
        <div class="stat-label">پاسخ‌های درست</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color: #f87171;">${toPersianDigits(wrongCount)}</div>
        <div class="stat-label">پاسخ‌های نادرست</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color: #fbbf24;">${toPersianDigits(hintsUsed)}</div>
        <div class="stat-label">استفاده از راهنما</div>
      </div>
    </div>
    <div style="background: rgba(255, 255, 255, 0.07); padding: 16px; border-radius: 14px; margin-bottom: 24px; font-size: 0.95rem; line-height: 1.8; color: #f1f5f9;">
      ${evaluation}
    </div>
    <button class="btn-main" onclick="startGame()">شروع دوباره آزمون ↻</button>
  `;
}

showStartScreen();
</script>
</body>
</html>
