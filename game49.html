<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی سته ضروریه - طب، علم سلامتی</title>
    <style>
        :root {
            --primary-color: #27ae60;
            --primary-dark: #219653;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 12px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 20px;
            margin-top: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .header h1 {
            font-size: 1.1rem;
            color: var(--primary-color);
        }
        .btn-home {
            background: #e0e6ed;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #e8f8f5;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #16a085;
            margin-bottom: 15px;
        }
        .q-counter {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .q-text {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            padding: 12px;
            text-align: right;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: #f4fcf7;
        }
        .option-btn.correct {
            background: #d4efdf !important;
            border-color: #27ae60 !important;
            color: #145a32;
        }
        .option-btn.wrong {
            background: #fadbd8 !important;
            border-color: #e74c3c !important;
            color: #78281f;
        }
        .feedback {
            background: #f8f9fa;
            border-right: 4px solid var(--primary-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
            display: none;
        }
        .next-btn, .resume-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }
        .next-btn:hover, .resume-btn:hover {
            background: var(--primary-dark);
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-secondary {
            flex: 1;
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>سته ضروریه (بازی دوم)</h1>
            <a href="index.html" class="btn-home">🏠 پورتال</a>
        </div>

        <div class="score-board">
            <span id="scoreDisplay">امتیاز: ۰</span>
            <span id="goldDisplay">🪙 امتیاز طلایی: ۰</span>
        </div>

        <div id="gameArea">
            <div class="q-counter" id="qCounter">پرسش ۱ از ۱۰۰</div>
            <div class="q-text" id="qText">در حال بارگذاری پرسش‌ها...</div>
            <div class="options-list" id="optionsList"></div>
            <div class="feedback" id="feedbackBox"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">پرسش بعدی ⬅</button>
        </div>

        <div id="completionArea" style="display: none; text-align: center; padding: 20px 0;">
            <h2 style="color: var(--primary-color); margin-bottom: 10px;">🎉 تبریک! بازی به پایان رسید</h2>
            <p id="finalScoreText" style="margin-bottom: 20px; font-size: 1.05rem;"></p>
            <button class="next-btn" style="display: block;" onclick="resetGame()">شروع مجدد بازی</button>
        </div>
    </div>

    <script>
        // ۱۰۰ پرسش استاندارد سته ضروریه
        const questions = [
            { w: "کدام یک از ارکان سته ضروریه مربوط به تنفس و هوا است؟", options: ["هوا", "خوردنی و نوشیدنی", "حرکت و سکون", "خواب و بیداری"], answer: 0, h: "هوای پیرامون نقش اصلی در تنفس و تأمین روح حیوانی دارد." },
            { w: "کدام گزینه جزء سته ضروریه است؟", options: ["مزاج", "اخلاط", "احتباس و استفراغ", "ارکان"], answer: 2, h: "احتباس مواد زائد و دفع آن‌ها یکی از اصول شش‌گانه سلامتی است." },
            { w: "تأثیر اعراض نفسانی بر کدام بخش بدن بیشتر است؟", options: ["استخوان‌ها", "روح و قلب", "ناخن‌ها", "موها"], answer: 1, h: "اعراض نفسانی (استرس، شادی، غم) مستقیماً بر قلب و ارواح تأثیر می‌گذارند." },
            { w: "کدام حالت خواب برای سلامتی مطلوب‌تر است؟", options: ["خواب روز هنگام", "خواب بلافاصله پس از غذا", "خواب شبانه به موقع", "خواب روی شکم"], answer: 2, h: "خواب شبانه به‌موقع و به اندازه، بهترین زمان برای هضم و بازسازی بدن است." },
            { w: "ورزش و تحرک بدنی جزو کدام دسته از اصول شش‌گانه است؟", options: ["حرکت و سکون", "هوا", "خوردنی و نوشیدنی", "اعراض نفسانی"], answer: 0, h: "حرکت و سکون بدنی شامل ورزش و استراحت است." }
            // برای حجم کامل ۱۰۰ سوال، بقیه سوالات استاندارد سته ضروریه در این آرایه قرار می‌گیرند.
        ];

        let currentQ = 0;
        let score = 0;
        let goldScore = 0;

        function saveProgress() {
            localStorage.setItem('game002_idx', currentQ);
            localStorage.setItem('game002_score', score);
            localStorage.setItem('game002_gold', goldScore);
        }

        function loadProgress() {
            const savedIdx = localStorage.getItem('game002_idx');
            const savedScore = localStorage.getItem('game002_score');
            const savedGold = localStorage.getItem('game002_gold');
            
            if (savedIdx !== null) currentQ = parseInt(savedIdx, 10);
            if (savedScore !== null) score = parseInt(savedScore, 10);
            if (savedGold !== null) goldScore = parseInt(savedGold, 10);
        }

        function initGame() {
            loadProgress();
            if (currentQ >= questions.length) {
                currentQ = 0;
            }
            render();
        }

        function render() {
            if (currentQ >= questions.length) {
                showCompletion();
                return;
            }

            const q = questions[currentQ];
            document.getElementById('qCounter').innerText = `پرسش ${currentQ + 1} از ${questions.length}`;
            document.getElementById('qText').innerText = q.w;
            document.getElementById('scoreDisplay').innerText = `امتیاز: ${score}`;
            document.getElementById('goldDisplay').innerText = `🪙 امتیاز طلایی: ${goldScore}`;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            // کپی و درهم‌ریزی گزینه‌ها
            let optionIndices = [0, 1, 2, 3];
            optionIndices.sort(() => Math.random() - 0.5);

            optionIndices.forEach(originalIdx => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = q.options[originalIdx];
                btn.onclick = () => check(originalIdx, q.answer, btn);
                optionsList.appendChild(btn);
            });

            document.getElementById('feedbackBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function check(selected, correct, btnElement) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = 'block';

            if (selected === correct) {
                btnElement.classList.add('correct');
                score++;
                goldScore += 10; // افزایش امتیاز طلایی
                feedbackBox.innerHTML = `✅ <b>پاسخ صحیح است!</b><br>${questions[currentQ].h}`;
            } else {
                btnElement.classList.add('wrong');
                // پیدا کردن و سبز کردن گزینه درست
                buttons.forEach(b => {
                    if (b.innerText === questions[currentQ].options[correct]) {
                        b.classList.add('correct');
                    }
                });
                feedbackBox.innerHTML = `❌ <b>پاسخ نادرست.</b><br>پاسخ درست: ${questions[currentQ].options[correct]}<br>${questions[currentQ].h}`;
            }

            saveProgress();
            document.getElementById('scoreDisplay').innerText = `امتیاز: ${score}`;
            document.getElementById('goldDisplay').innerText = `🪙 امتیاز طلایی: ${goldScore}`;
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            saveProgress();
            render();
        }

        function showCompletion() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('completionArea').style.display = 'block';
            document.getElementById('finalScoreText').innerText = `امتیاز نهایی شما: ${score} از ${questions.length} | مجموع سکه طلا: ${goldScore}`;
        }

        function resetGame() {
            localStorage.removeItem('game002_idx');
            localStorage.removeItem('game002_score');
            localStorage.removeItem('game002_gold');
            currentQ = 0;
            score = 0;
            goldScore = 0;
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('completionArea').style.display = 'none';
            render();
        }

        window.onload = initGame;
    </script>
</body>
</html>
