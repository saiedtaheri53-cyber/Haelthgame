    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Tahoma', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 600px; text-align: center; }
        .question { font-size: 1.4rem; margin-bottom: 1.5rem; font-weight: bold; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { padding: 15px; font-size: 1rem; border: 2px solid var(--primary); background: white; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--primary); color: white; }
        .stats { margin-top: 2rem; display: flex; justify-content: space-around; font-size: 0.9rem; color: #666; }
        .feedback { margin-top: 1rem; height: 1.5rem; font-weight: bold; }
        .correct { color: #27ae60; } .wrong { color: #c0392b; }
        .hint { font-style: italic; color: #7f8c8d; margin-top: 10px; display: none; }
    </style>

        <div class="hint" id="hint-text"></div>

let currentQuestionIndex = 0; let score = 0;
let allCorrectAnswers = rawQuestions.map(q => q.a);

function initGame() { rawQuestions.sort(() => Math.random() - 0.5); showQuestion(); }

function showQuestion() {
    const qData = rawQuestions[currentQuestionIndex];
    document.getElementById('question-text').textContent = qData.w;
    document.getElementById('q-count').textContent = currentQuestionIndex + 1;
    const options = generateSmartOptions(qData.a);
    const container = document.getElementById('options-container'); container.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button'); btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt, qData); container.appendChild(btn);
    });
}

function generateSmartOptions(correctAnswer) {
    let options = [correctAnswer];
    let pool = allCorrectAnswers.filter(a => a !== correctAnswer);
    pool.sort(() => Math.random() - 0.5);
    for(let i = 0; i < 3; i++) { if(pool[i]) options.push(pool[i]); }
    while(options.length < 4) { options.push("گزینه نامعتبر"); }
    return options.sort(() => Math.random() - 0.5);
}

function checkAnswer(selected, qData) {
    const feedback = document.getElementById('feedback-text');
    const hint = document.getElementById('hint-text');
    document.querySelectorAll('#options-container button').forEach(b => b.disabled = true);
    if (selected === qData.a) { score += 10; feedback.textContent = "صحیح!"; feedback.className = "feedback correct"; document.getElementById('score').textContent = score; }
    else { feedback.textContent = "خطا!"; feedback.className = "feedback wrong"; }
    hint.textContent = "راهنما: " + qData.h; hint.style.display = "block";
    setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < rawQuestions.length) showQuestion(); else endGame();
    }, 2500);
}

function endGame() {
    document.getElementById('game-area').innerHTML = `<h2>پایان بازی!</h2><p>امتیاز نهایی شما: ${score}</p><button onclick="location.reload()">شروع مجدد</button>`;
}

initGame();
</script>
