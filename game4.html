<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزاج‌سنج اختصاصی کاربران | پورتال سلامت</title>
    <style>
        :root {
            --primary: #2e7d32;
            --secondary: #4caf50;
            --accent: #ffb300;
            --bg: #f4f9f4;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #555555;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: var(--primary);
            font-size: 20px;
        }

        .score-badge {
            background: #fff8e1;
            color: #f57f17;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #ffe082;
        }

        .progress-bar-container {
            width: 100%;
            background: #e0e0e0;
            border-radius: 8px;
            height: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--secondary);
            width: 5%;
            transition: width 0.4s ease;
        }

        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #fafafa;
            border: 2px solid #e0e0e0;
            padding: 14px 18px;
            text-align: right;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }

        .option-btn:hover {
            background: #e8f5e9;
            border-color: var(--secondary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .result-box {
            display: none;
            text-align: right;
        }

        .result-box h3 {
            color: var(--primary);
            font-size: 22px;
            margin-top: 0;
        }

        .result-card {
            background: #f1f8e9;
            border-right: 5px solid var(--primary);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            line-height: 1.7;
        }

        .nav-links {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .btn-link {
            flex: 1;
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-link:hover {
            background: #1b5e20;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-container">
        <div class="header">
            <h2 id="quiz-title">مزاج‌سنج اختصاصی کاربران</h2>
            <div class="score-badge">🎁 کل سکه‌ها: <span id="total-gifts">0</span></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-box" id="question-text">در حال بارگذاری سوالات...</div>
        <div class="options-list" id="options-container"></div>
    </div>

    <div class="result-box" id="result-container">
        <h3>نتیجه تحلیل مزاج اختصاصی شما</h3>
        <div class="result-card" id="result-content"></div>
        <div class="nav-links">
            <a href="Main_Menu_Game_Library.html" class="btn-link">بازگشت به پورتال بازی‌ها</a>
            <button onclick="location.reload()" class="btn-link" style="background:#ff8f00; border:none; cursor:pointer;">تکرار آزمون</button>
        </div>
    </div>
</div>

<script>
    // بانک ۲۰ سوال جامع تشخیصی مزاج
    const questions = [
        { q: "۱. ساختار جسمانی و استخوان‌بندی شما چگونه است؟", options: [
            { text: "درشت، عضلانی و چهارشانه", type: "dam", weight: 2 },
            { text: "متوسط، استخوان‌بندی باریک و خشک", type: "safra", weight: 2 },
            { text: "چاق، نرم‌گوشت و پرحجم", type: "balgham", weight: 2 },
            { text: "لاغر، استخوانی و کم‌گوشت", type: "sowda", weight: 2 }
        ]},
        { q: "۲. رنگ پوست طبیعی بدن شما چه تمایلی دارد؟", options: [
            { text: "گلگون، سرخ و سفید", type: "dam", weight: 2 },
            { text: "زردچوبه‌ای، گندمی مایل به زرد", type: "safra", weight: 2 },
            { text: "سفید و رنگ‌پریده، مهتابی", type: "balgham", weight: 2 },
            { text: "سبزه تیره، گندمی تیره یا مایل به خاکستری", type: "sowda", weight: 2 }
        ]},
        { q: "۳. حرارت بدن شما در حالت عادی چگونه است؟", options: [
            { text: "گرم، دیگران از گرمای دست من تعجب می‌کنند", type: "dam", weight: 3 },
            { text: "بسیار گرم و گاهی احساس حرارت درونی", type: "safra", weight: 3 },
            { text: "سرد، دست و پای همیشه سردی دارم", type: "balgham", weight: 3 },
            { text: "سرد و خشک، معمولاً با پتو هم گرم نمی‌شوم", type: "sowda", weight: 3 }
        ]},
        { q: "۴. میزان خواب و کیفیت آن در شما چطور است؟", options: [
            { text: "خواب سنگین و نسبتاً زیاد (۸ ساعت یا بیشتر)", type: "dam", weight: 2 },
            { text: "خواب کم، سبک و بیدار شدن سریع", type: "safra", weight: 2 },
            { text: "خواب‌آلودگی زیاد در طول روز، سنگین", type: "balgham", weight: 2 },
            { text: "خواب کم، سبک، دچار بی‌خوابی یا افکار شبانه", type: "sowda", weight: 2 }
        ]},
        { q: "۵. واکنش عاطفی و خلق‌وخوی غالب شما کدام است؟", options: [
            { text: "خوش‌رو، سخاوتمند، اهل صلح و گاهی تندمزاجی آنی", type: "dam", weight: 2 },
            { text: "پرتلاش، تیزهوش، بی‌قرار و زودجوش", type: "safra", weight: 2 },
            { text: "آرام، صبور، کم‌حرف، دیرعصبانی‌شونده", type: "balgham", weight: 2 },
            { text: "دقیق، اهل تحلیل، محافظه‌کار، اهل تفکر عمیق", type: "sowda", weight: 2 }
        ]},
        { q: "۶. وضعیت هضم غذا و اشتهای شما چطور است؟", options: [
            { text: "اشتهای خوب، هضم قوی و توانایی خوردن غذاهای مختلف", type: "dam", weight: 2 },
            { text: "اشتهای متغیر، گاهی ضعف ناگهانی همراه با گرسنگی کاذب", type: "safra", weight: 2 },
            { text: "اشتهای زیاد اما هضم ضعیف، آب دهان در خواب", type: "balgham", weight: 2 },
            { text: "اشتهای کم، نفخ معده، دیر هضم شدن غذا", type: "sowda", weight: 2 }
        ]},
        { q: "۷. تمایل شما به آب و نوشیدنی‌ها چگونه است؟", options: [
            { text: "تشنگی متوسط، دوستدار آب خنک", type: "dam", weight: 1 },
            { text: "تشنگی زیاد، علاقه شدید به آب سرد و مایعات ترش", type: "safra", weight: 2 },
            { text: "کم‌تشنگی، نیاز کمتر به نوشیدن آب", type: "balgham", weight: 1 },
            { text: "تشنگی متوسط اما حساسیت به سردی آب", type: "sowda", weight: 1 }
        ]},
        { q: "۸. واکنش شما نسبت به فصل‌ها (گرما و سرما) چطور است؟", options: [
            { text: "تحمل سرما خوب است، بهار و هوای معتدل را دوست دارم", type: "dam", weight: 2 },
            { text: "از هوای گرم فراری‌ام، تابستان برایم آزاردهنده است", type: "safra", weight: 2 },
            { text: "از سرما بیزارم، زمستان و پاییز حالم را می‌گیرد", type: "balgham", weight: 2 },
            { text: "هوای سرد و خشک پاییز باعث خشکی پوست و افسردگی‌ام می‌شود", type: "sowda", weight: 2 }
        ]},
        { q: "۹. سرعت حرکت، تکلم و انجام کارها در شما چگونه است؟", options: [
            { text: "چابک، معتدل و باانرژی", type: "dam", weight: 2 },
            { text: "سریع، فرز، تندتند راه رفتن و سریع حرف زدن", type: "safra", weight: 2 },
            { text: "کند، باوقار، آرام و باحوصله", type: "balgham", weight: 2 },
            { text: "دقیق اما کند، با تأمل و محاسبه‌شده", type: "sowda", weight: 2 }
        ]},
        { q: "۱۰. وضعیت موی سر (رنگ، جنس و ریزش) شما چطور است؟", options: [
            { text: "پُرپشت، ضخیم و گاهی مجعد (موج‌دار)", type: "dam", weight: 2 },
            { text: "کم‌پشت، نازک، مایل به خرمایی یا مستعد کم‌پشتی زودرس", type: "safra", weight: 2 },
            { text: "نرم، لخت، نازک و روشن", type: "balgham", weight: 2 },
            { text: "تیره، ضخیم، خشک یا مستعد سفیدی زودرس", type: "sowda", weight: 2 }
        ]},
        { q: "۱۱. نبض بدن شما در حالت معاینه چگونه است؟", options: [
            { text: "پر، قوی و با دامنه وسیع", type: "dam", weight: 3 },
            { text: "سریع، باریک و محکم", type: "safra", weight: 3 },
            { text: "کند، نرم و ضعیف", type: "balgham", weight: 3 },
            { text: "کند، سفت و باریک", type: "sowda", weight: 3 }
        ]},
        { q: "۱۲. تعریق بدن و بوی عرق شما چه ویژگی دارد؟", options: [
            { text: "تعریق نسبتاً زیاد با بوی گرم و مطبوع", type: "dam", weight: 2 },
            { text: "تعریق زیاد در نواحی پیشانی و سر با بوی تند", type: "safra", weight: 2 },
            { text: "تعریق کم، پوست سرد و مرطوب", type: "balgham", weight: 2 },
            { text: "تعریق بسیار کم، پوست خشک", type: "sowda", weight: 2 }
        ]},
        { q: "۱۳. وضعیت دهان و طعم آن به هنگام صبح چیست؟", options: [
            { text: "طعم دهان شیرین یا طبیعی هنگام بیدار شدن", type: "dam", weight: 2 },
            { text: "طعم تلخ، خشکی دهان و احساس حرارت در گلو", type: "safra", weight: 2 },
            { text: "طعم دهان ترش، بی‌مزه یا پُر از آب دهان شفاف", type: "balgham", weight: 2 },
            { text: "طعم دهان شور، ترش یا گس", type: "sowda", weight: 2 }
        ]},
        { q: "۱۴. علاقه غذایی شما به چه طعم‌هایی است؟", options: [
            { text: "علاقه به طعم‌های ملایم، شیرینی طبیعی و ترشی ملایم", type: "dam", weight: 2 },
            { text: "علاقه به ترشیجات، آبلیمو، ماست و غذاهای خنک", type: "safra", weight: 2 },
            { text: "علاقه به گرمی‌ها، چای پررنگ، ادویه و خرما", type: "balgham", weight: 2 },
            { text: "علاقه به شیرینی‌جات گرم، عسل، گوشت گوسفند و ارده", type: "sowda", weight: 2 }
        ]},
        { q: "۱۵. میزان حافظه و یادگیری شما چگونه است؟", options: [
            { text: "حافظه خوب در حفظ کلیات، یادگیری متوسط", type: "dam", weight: 2 },
            { text: "حفظ سریع مطالب اما فراموشی سریع جزئیات", type: "safra", weight: 2 },
            { text: "یادگیری کند اما ماندگار در حافظه درازمدت", type: "balgham", weight: 2 },
            { text: "دقت بالا در حفظ جزئیات، تفکر عمیق و دقیق", type: "sowda", weight: 2 }
        ]},
        { q: "۱۶. وضعیت پوست از نظر میزان چربی یا خشکی چیست؟", options: [
            { text: "پوست مرطوب، باطراوت و گلگون", type: "dam", weight: 2 },
            { text: "پوست نسبتاً خشک یا مختلط، مستعد جوش و آکنه گرم", type: "safra", weight: 2 },
            { text: "پوست نرم، سرد، سفید و مرطوب", type: "balgham", weight: 2 },
            { text: "پوست خشک، سرد، تیره و مستعد ترک‌خوردگی", type: "sowda", weight: 2 }
        ]},
        { q: "۱۷. واکنش شما در برابر استرس و بحران‌ها چیست؟", options: [
            { text: "حفظ آرامش نسبی و تلاش برای صلح و سازش", type: "dam", weight: 2 },
            { text: "واکنش سریع، عصبانیت آنی و فروکش کردن سریع", type: "safra", weight: 2 },
            { text: "بی‌تفاوت نسبت به تنش‌ها، درون‌گرا و تحمل بالا", type: "balgham", weight: 2 },
            { text: "نگرانی زیاد، وسواس فکری و تمرکز روی جنبه‌های منفی", type: "sowda", weight: 2 }
        ]},
        { q: "۱۸. وضعیت تنفس و سینه شما چطور است؟", options: [
            { text: "سینه‌ای پهن، تنفس عمیق و فراخ", type: "dam", weight: 2 },
            { text: "تنفس سریع، عمق متوسط", type: "safra", weight: 2 },
            { text: "تنفس آرام، گاهی احساس سنگینی در سینه به دلیل سردی", type: "balgham", weight: 2 },
            { text: "تنفس کوتاه و سطحی", type: "sowda", weight: 2 }
        ]},
        { q: "۱۹. قدرت بدنی و استقامت شما در کارهای سخت چگونه است؟", options: [
            { text: "انرژی عالی و استقامت بدنی خوب", type: "dam", weight: 2 },
            { text: "انرژی انفجاری بالا اما زود خسته شدن در کارهای یکنواخت", type: "safra", weight: 2 },
            { text: "انرژی کم برای کارهای پرتحرک، نیازمند استراحت زیاد", type: "balgham", weight: 2 },
            { text: "استقامت فکری بالا اما توان بدنی متوسط و زودرنج", type: "sowda", weight: 2 }
        ]},
        { q: "۲۰. میل به فعالیت‌های اجتماعی و ارتباط با دیگران؟", options: [
            { text: "بسیار اجتماعی، خوش‌برخورد، مهمان‌دوست و پرجمعیت", type: "dam", weight: 2 },
            { text: "رهبر مآب، اهل رقابت، صریح و قاطع در گفتار", type: "safra", weight: 2 },
            { text: "گوشه‌گیر، کم‌حرف، متمایل به سکوت و آرامش فردی", type: "balgham", weight: 2 },
            { text: "اهل مطالعه، تنهایی‌طلب، دقیق و سنجیده در روابط", type: "sowda", weight: 2 }
        ]}
    ];

    let currentQuestion = 0;
    let scores = { dam: 0, safra: 0, balgham: 0, sowda: 0 };
    let totalGifts = parseInt(localStorage.getItem('health_game_total_gifts') || '40'); // شروع از امتیازات بازی‌های قبل

    const descriptions = {
        dam: {
            title: "مزاج غالب: دموی (گرم و تر)",
            desc: "شما طبعی گرم و تر دارید. خون در وجود شما جریان پرنشاطی دارد. افراد دموی‌مزاج معمولاً شاداب، خوش‌خلق، دارای انرژی بالا و بدنی قوی هستند.",
            moseleh: "کاهو، سرکه، انار ترش، زرشک، مرکبات و غذاهای با طبع خنک و تر."
        },
        safra: {
            title: "مزاج غالب: صفراوی (گرم و خشک)",
            desc: "طبع شما گرم و خشک است. صفرا نمایانگر عنصر آتش در وجود شماست. تیزهوش، پرانرژی، فرز، دقیق و گاهی زودجوش و پرشور هستید.",
            moseleh: "آلو، خیار، هندوانه، کاهو، سکنجبین، عناب و آش‌های ساده و خنک."
        },
        balgham: {
            title: "مزاج غالب: بلغمی (سرد و تر)",
            desc: "طبع شما سرد و تر است (منسوب به آب). افرادی با این مزاج آرام، صبور، متین، دوراندیش و دارای حافظه خوب در درازمدت هستند.",
            moseleh: "عسل، ارده با شیره، ادویه‌جات گرم (زنجبیل، دارچین)، خرما و گردو."
        },
        sowda: {
            title: "مزاج غالب: سوداوی (سرد و خشک)",
            desc: "طبع شما سرد و خشک است (منسوب به خاک). افرادی با این مزاج بسیار دقیق، اهل تحلیل، منطقی، وفادار، عمیق و سخت‌کوش هستند.",
            moseleh: "غذاهای آب‌پز گرم، گوشت گوسفند، عسل، انجیر، مویز و خورشت‌های چرب با ادویه گرم."
        }
    };

    function updateGiftDisplay() {
        document.getElementById('total-gifts').innerText = totalGifts;
        localStorage.setItem('health_game_total_gifts', totalGifts);
    }

    function loadQuestion() {
        if (currentQuestion >= questions.length) {
            showResult();
            return;
        }

        const q = questions[currentQuestion];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-bar').style.width = ((currentQuestion + 1) / questions.length) * 100 + '%';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => selectAnswer(opt.type, opt.weight);
            container.appendChild(btn);
        });
    }

    function selectAnswer(type, weight) {
        scores[type] += weight;
        totalGifts += 5; // هر پاسخ درست معادل ۵ سکه هدیه
        updateGiftDisplay();
        
        currentQuestion++;
        loadQuestion();
    }

    function showResult() {
        document.getElementById('quiz-container').style.display = 'none';
        
        // پیدا کردن بیشترین امتیاز
        let maxType = 'dam';
        let maxVal = -1;
        for (let t in scores) {
            if (scores[t] > maxVal) {
                maxVal = scores[t];
                maxType = t;
            }
        }

        const res = descriptions[maxType];
        const resCard = document.getElementById('result-content');
        resCard.innerHTML = `
            <strong style="font-size:18px; color: #1b5e20;">${res.title}</strong><br><br>
            ${res.desc}<br><br>
            <strong>🌿 توصیه‌های تغذیه‌ای و مصلحات:</strong><br>
            ${res.moseleh}
        `;

        document.getElementById('result-container').style.display = 'block';
    }

    // مقداردهی اولیه
    updateGiftDisplay();
    loadQuestion();
</script>

</body>
</html>
