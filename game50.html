</style></head><body><div class="wrap">
<div class="scorebar" role="status" aria-live="polite"><span class="scorelabel">امتیاز طلایی شما</span><span class="score"><span id="score">۰</span> <small>⭐ امتیاز</small></span><button class="chestchip" id="chestChip" type="button" title="صندوقچهٔ طلایی"><span class="chest closed" id="chestIcon">🧰</span><span id="chestLabel">صندوقچه</span></button></div>
<header class="brand"><h1>بازی دوم: ستهٔ ضروریه</h1><p>دانش خود را دربارهٔ اصول شش‌گانهٔ سلامت بسنجید</p></header>
<main class="card"><section class="resume" id="resumeBox" hidden><h3>⏳ بازی ناتمام دارید!</h3><p id="resumeText"></p><div class="btns"><button class="btn primary" id="resumeBtn" type="button">▶ ادامهٔ بازی</button><button class="btn secondary" id="restartBtn" type="button">شروع از ابتدا</button></div></section>

<script>

    { w: "ستهٔ ضروریه به چند اصل بنیادین اشاره دارد؟", options: ["چهار اصل", "پنج اصل", "شش اصل", "هفت اصل"], answer: 2, h: "«سته» به معنای شش است." },

    { w: "کدام مورد در شمار اصول ستهٔ ضروریه قرار می‌گیرد؟", options: ["خواب و بیداری", "رنگ مو", "نوع پوشش", "اندازهٔ دست"], answer: 0, h: "تنظیم خواب و بیداری یکی از شش اصل است." },

    { w: "در دسته‌بندی ستهٔ ضروریه، خوردنی‌ها و نوشیدنی‌ها به چه چیزی مربوط‌اند؟", options: ["تدبیر خوراک و آشامیدنی", "کیفیت خواب", "هیجان‌های روحی", "هوای محیط"], answer: 0, h: "این اصل به نوع و شیوهٔ مصرف خوراک و نوشیدنی می‌پردازد." },

    { w: "کدام مورد جزو اصول ستهٔ ضروریه نیست؟", options: ["رنگ چشم", "هوا", "خواب‌وبیداری", "حرکت‌وسکون"], answer: 0, h: "رنگ چشم در شمار اصول شش‌گانه قرار نمی‌گیرد." },

    { w: "کدام گزینه، همهٔ مواردش از اصول ستهٔ ضروریه هستند؟", options: ["هوا، خواب‌وبیداری، خوردنی‌ونوشیدنی", "رنگ چشم، قد، رنگ مو", "گیاهان، سنگ‌ها، فلزها", "شنیدن، دیدن، بوییدن"], answer: 0, h: "هر سه مورد در فهرست اصول شش‌گانه جای دارند." },

    { w: "هوای معتدل در طب سنتی به چه هوایی گفته می‌شود؟", options: ["هوایی که نه سرد است و نه گرم", "هوای کاملاً سرد", "هوای بسیار خشک", "هوای پر از رطوبت"], answer: 0, h: "اعتدال در حرارت و برودت شرط هوای سالم است." },

    { w: "نتیجه‌گیری کلی ستهٔ ضروریه چیست؟", options: ["تعادل در تمام عوامل برای حفظ سلامت", "فقط خوردن و خوابیدن", "فقط ورزش کردن", "فقط دوری از استرس"], answer: 0, h: "سلامت نتیجهٔ رعایتِ تعادل در هر شش اصل است." }
];
(function(){
 const KEY='game002_sitteh_zaroorieh_progress_v1';
 const GOLD_KEYS=[3,9,19,29,39,49,59,69,79,89]; // milestones (0-based) and streak steps
 const fresh=()=>({index:0,score:0,answered:false,selected:null,correct:false,chest:0,goldHits:[],streak:0});
 let state=fresh(); let storageOK=true;
 const $=id=>document.getElementById(id);
 const fa=n=>new Intl.NumberFormat('fa-IR').format(n);
 function validState(x){return x&&Number.isInteger(x.index)&&x.index>=0&&x.index<=questions.length&&Number.isFinite(x.score)&&x.score>=0&&typeof x.answered==='boolean'&&(x.selected===null||Number.isInteger(x.selected))&&typeof x.correct==='boolean'&&Number.isInteger(x.chest||0)&&Array.isArray(x.goldHits||[])}
 function save(){
   const data=JSON.stringify({version:1,index:state.index,score:state.score,answered:state.answered,selected:state.selected,correct:state.correct,chest:state.chest,goldHits:state.goldHits,streak:state.streak});
   try{localStorage.setItem(KEY,data);storageOK=true;$('saveStatus').textContent='✓ پیشرفت و امتیاز شما ذخیره شد؛ بعداً از همین‌جا ادامه می‌دهید.';$('saveStatus').classList.remove('warning')}
   catch(e){storageOK=false;$('saveStatus').textContent='ذخیره‌سازی این مرورگر در دسترس نیست؛ لطفاً داده‌های مرورگر را مسدود نکنید.';$('saveStatus').classList.add('warning')}
 }
 function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);if(d.version===1&&validState(d)){state={index:d.index,score:Math.floor(d.score),answered:d.answered,selected:d.selected,correct:d.correct,chest:Math.floor(d.chest||0),goldHits:Array.isArray(d.goldHits)?d.goldHits.slice(0,questions.length).filter(Number.isInteger):[],streak:Math.floor(d.streak||0)};if(state.index<questions.length&&state.answered&&(state.selected===null||state.selected<0||state.selected>=questions[state.index].options.length)){state.answered=false;state.selected=null;state.correct=false}}}catch(e){storageOK=false;state=fresh()}}

 function grantGolden(reason){state.chest+=50;state.score+=50;if(!state.goldHits.includes(state.index))state.goldHits.push(state.index);render();
  const b=document.createElement('div');b.className='goldenbonus';b.textContent='🎉 امتیاز طلایی! صندوقچه باز شد: +۵۰ امتیاز ('+reason+')';document.body.appendChild(b);setTimeout(()=>b.remove(),2500);
  const c=$('chestIcon');c.className='chest opened';c.textContent='🎁';setTimeout(()=>{c.className='chest closed'},1400);save()}
 function renderChest(){$('chestLabel').textContent='صندوقچه: '+fa(state.chest);const c=$('chestIcon');if(c.className.indexOf('opened')<0)c.className='chest closed';if(!c.textContent||c.textContent==='')c.textContent='🧰'}
 function render(){
  renderChest();
  $('score').textContent=fa(state.score);renderChest();
  if(state.index>=questions.length){$('game').hidden=true;$('done').hidden=false;$('result').textContent='امتیاز نهایی شما: '+fa(state.score)+' از '+fa(questions.length*10)+' امتیاز. این نتیجه نیز ذخیره شده است.';return}
  $('game').hidden=false;$('done').hidden=true;
  const q=questions[state.index];$('counter').textContent='پرسش '+fa(state.index+1)+' از '+fa(questions.length);
  $('progress').style.width=((state.index+(state.answered?1:0))/questions.length*100)+'%';$('question').textContent=q.w;
  const box=$('options');box.replaceChildren();
  q.options.forEach((text,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=fa(i+1)+') '+text;
   if(state.answered){b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===state.selected)b.classList.add('wrong')}
   b.addEventListener('click',()=>answer(i));box.appendChild(b)});
  const fb=$('feedback');fb.hidden=!state.answered;fb.className='feedback '+(state.correct?'good':'bad');
  if(state.answered)fb.textContent=(state.correct?'پاسخ درست است! ۱۰ امتیاز طلایی گرفتید. ':'پاسخ درست: '+q.options[q.answer]+'؛ ') + q.h;
  $('next').disabled=!state.answered;$('next').textContent=state.index===questions.length-1?'نمایش نتیجه ←':'پرسش بعدی ←';
 }
 function answer(i){if(state.answered||state.index>=questions.length)return;const q=questions[state.index];state.answered=true;state.selected=i;state.correct=i===q.answer;
  if(state.correct){state.score+=10;state.streak++;
    if(state.streak>0&&state.streak%3===0&&!state.goldHits.includes('st'+state.index)){state.goldHits.push('st'+state.index);grantGolden('سه پاسخ درست پیاپی')}
    else if(state.goldHits.indexOf(state.index)<0&&GOLD_KEYS.includes(state.index)&&state.correct){state.goldHits.push(state.index);grantGolden('نقطهٔ عطف بازی')}
  } else state.streak=0;
  save();render()}
 function next(){if(!state.answered)return;state.index++;state.answered=false;state.selected=null;state.correct=false;save();render()}
 function reset(){if(state.index||state.score){if(!confirm('همهٔ پیشرفت و امتیاز ذخیره‌شده پاک و بازی از ابتدا شروع شود؟'))return}state=fresh();save();render()}
 $('next').addEventListener('click',next);$('reset').addEventListener('click',reset);$('playAgain').addEventListener('click',()=>{state=fresh();save();render()});
 window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
 let resumed=false;
 function showResume(){if(resumed)return;const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||!validState(d))return;if(d.index>=questions.length){resumed=true;return}
  $('resumeText').textContent='در پرسش '+fa(d.index+1)+' از '+fa(questions.length)+' هستید و '+fa(d.score)+' امتیاز دارید.';
  $('resumeBox').hidden=false;$('game').hidden=true}
 $('resumeBtn').addEventListener('click',()=>{load();resumed=true;$('resumeBox').hidden=true;render()});
 $('restartBtn').addEventListener('click',()=>{if(!confirm('شروع از ابتدا؟ پیشرفت قبلی پاک می‌شود.'))return;state=fresh();save();resumed=true;$('resumeBox').hidden=true;render()});
 $('chestChip').addEventListener('click',()=>{const c=$('chestIcon');c.className='chest opened';c.textContent='🎁';setTimeout(()=>{c.className='chest closed'},900)});
 $('encyBtn').addEventListener('click',()=>{$('encyMsg').textContent='دانش‌نامهٔ جامع پس از افزودن فایل index.html کنار همین بازی، از این‌جا فعال می‌شود.'});
 load();showResume();render();if(!storageOK)$('saveStatus').textContent='ذخیره‌سازی این مرورگر در دسترس نیست؛ لطفاً داده‌های مرورگر را مسدود نکنید.';
})();
</script></body></html>
