                    "فقط پیش‌بینی آینده افراد و طالع‌بینی",
                    "دسته‌بندی افراد برای مسابقات ورزشی",
                    "تغییر دادن طبع ذاتی انسان‌ها به طبعی دیگر",
                    "افزایش وزن یا کاهش وزن سریع بدون قاعده",
                    "صرفاً جنبه سرگرمی و تفنن علمی دارد"
                ],
                answer: 0,
                hint: "شناخت مزاج چراغ راهنمایی برای حفظ‌الصحه (سلامتی)، تغذیه درست و پیشگیری از ابتلا به بیماری‌هاست."
            }
        ];

        let currentQ = parseInt(localStorage.getItem('game003_idx')) || 0;
        let score = parseInt(localStorage.getItem('game003_score')) || 0;
        let giftScore = parseInt(localStorage.getItem('game003_gift')) || 0;
        let answered = false;

        function render() {
            if (currentQ >= questions.length) {
                document.getElementById('question-text').innerText = "🎉 تبریک! شما آزمون تخصصی هویت‌سنجی مزاج را با موفقیت به پایان رساندید.";
                document.getElementById('options-container').innerHTML = `
                    <div style="text-align:center; font-size:16px; padding:15px; line-height:1.8; color:#2b6cb0; background:#f7fafc; border-radius:8px;">
                        <b>امتیاز نهایی شما:</b> ${score} از ${questions.length}<br>
                        <b>مجموع هدایای کسب شده:</b> 🎁 ${giftScore}<br>
                        <b>نتیجه تحلیل مزاجی:</b> ${score >= 16 ? 'شناخت بسیار عمیق و تسلط کامل بر مبانی مزاج‌شناسی! 🌟' : score >= 10 ? 'آشنایی خوب و قابل قبول با ارکان و امزاج 👍' : 'نیاز به مطالعه بیشتر در متون حفظ‌الصحه 📚'}
                    </div>`;
                document.getElementById('hint-box').style.display = 'none';
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('q-counter').innerText = "پایان آزمون";
                localStorage.removeItem('game003_idx');
                localStorage.removeItem('game003_score');
                localStorage.removeItem('game003_gift');
                return;
            }

            answered = false;
            const q = questions[currentQ];
            document.getElementById('q-counter').innerText = `سوال ${currentQ + 1} از ${questions.length}`;
            document.getElementById('score').innerText = score;
            document.getElementById('gift-score').innerText = giftScore;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, q.answer, q.hint);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(selected, correct, hint) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correct) btn.classList.add('correct');
                if (idx === selected && selected !== correct) btn.classList.add('incorrect');
            });

            if (selected === correct) {
                score++;
                giftScore += 10; // پاداش هدیه عملکرد
                document.getElementById('score').innerText = score;
                document.getElementById('gift-score').innerText = giftScore;
            }

            const hintBox = document.getElementById('hint-box');
            hintBox.innerText = `💡 نکته تخصصی طب سنتی: ${hint}`;
            hintBox.style.display = 'block';

            document.getElementById('next-btn').style.display = 'block';

            // ذخیره پیشرفت در localStorage
            localStorage.setItem('game003_idx', currentQ);
            localStorage.setItem('game003_score', score);
            localStorage.setItem('game003_gift', giftScore);
        }

        function nextQuestion() {
            currentQ++;
            localStorage.setItem('game003_idx', currentQ);
            render();
        }

        function resetGame() {
            if (confirm("آیا می‌خواهید آزمون از ابتدا شروع شود؟ پیشرفت فعلی پاک خواهد شد.")) {
                localStorage.removeItem('game003_idx');
                localStorage.removeItem('game003_score');
                localStorage.removeItem('game003_gift');
                currentQ = 0;
                score = 0;
                giftScore = 0;
                render();
            }
        }

        render();
    </script>
</body>
</html>
