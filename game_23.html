        button { display: block; width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; transition: 0.3s; }
        .opt { background: #f0f0f0; border: 1px solid #ddd; }
        .opt:hover { background: #dcdcdc; }
        .nav-btn { background: #3498db; color: white; display: inline-block; width: auto; padding: 10px 20px; }
        .hint { background: #f39c12; color: white; }
    </style>
</head>

    let qIdx = 0; let score = 0; let answered = new Set();

    function load() {
        let q = questions[qIdx];
        document.getElementById('progress').innerText = `سؤال ${qIdx + 1} از ${questions.length}`;
        document.getElementById('question').innerText = q.q;
        let ops = [q.a, "نادرست", "اشتباه", "غلط"].sort(() => Math.random() - 0.5);
        document.getElementById('options').innerHTML = ops.map(o => `<button class="opt" onclick="check('${o}')">${o}</button>`).join('');
    }

    function check(opt) {
        if (answered.has(qIdx)) return;
        if (opt === questions[qIdx].a) { 
            score += 10; 
            alert("آفرین! درست بود."); 
        } else { 
            alert("متأسفانه نادرست بود. پاسخ: " + questions[qIdx].a); 
        }
        answered.add(qIdx);
        document.getElementById('score').innerText = `امتیاز: ${score}`;
        setTimeout(next, 700);
    }

    function next() { 
        if(qIdx < questions.length - 1) { 
            qIdx++; 
            load(); 
        } else { 
            alert("تبریک! بازی تمام شد. امتیاز نهایی: " + score); 
        } 
    }

    function prev() { 
        if(qIdx > 0) { 
            qIdx--; 
            load(); 
        } 
    }

    function showHint() { 
        alert("راهنما: " + questions[qIdx].h); 
    }

    load();
