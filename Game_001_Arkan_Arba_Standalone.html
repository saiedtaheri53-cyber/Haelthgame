<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب، علم سلامتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .contact-btn { position: fixed; bottom: 20px; right: 20px; background: #0088cc; color: white; padding: 10px; border-radius: 5px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>طب، علم سلامتی</h1>
    <div id="game-container"></div>
    <script>
        let currentIdx = parseInt(localStorage.getItem('arkan_progress')) || 0;
        function updateGame() {
            localStorage.setItem('arkan_progress', currentIdx);
            document.getElementById('game-container').innerHTML = `<p>مرحله فعلی: ${currentIdx}</p>`;
        }
        updateGame();
    </script>
    <a href="https://eitaa.com/۹" class="contact-btn">ارتباط با سازنده</a>
</body>
</html>
