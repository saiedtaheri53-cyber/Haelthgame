<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- اصلاح viewport برای نمایش صحیح در موبایل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی ارکان اربعه</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Tahoma, sans-serif; 
            background: #e8f5e9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 10px;
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; /* محدودیت عرض برای دسکتاپ */
        }
        button { 
            display: block; 
            width: 100%; 
            padding: 18px; /* دکمه‌های بزرگتر برای لمس راحت‌تر */
            margin: 12px 0; 
            border: none; 
            border-radius: 10px; 
            background: #2e7d32; 
            color: white; 
            font-size: 18px; 
            cursor: pointer; 
        }
        #question { font-size: 1.3em; font-weight: bold; margin-bottom: 20px; text-align: center; }
        #feedback { margin-top: 15px; font-weight: bold; color: #d32f2f; text-align: center; }
        #counter { text-align: center; margin-bottom: 10px; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <div id="counter"></div>
        <div id="question"></div>
        <div id="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" style="display: none; background: #1b5e20;" onclick="nextQuestion()">بعدی</button>
    </div>
    <script>
        // (همان آرایه ۱۰۰ سوالی شما - برای کوتاه شدن پیام اینجا تکرار نکردم اما در فایل اصلی حتما بگذارید)
        // ... (کد سوالات شما)
        
        let currentIdx = 0;
        
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            document.getElementById('counter').innerText = `سوال ${currentIdx + 1} از ${questions.length}`;
            document.getElementById('question').innerText = q.w;
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = "none";

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";

            const shuffledOptions = shuffle([...q.options]);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.answer);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                document.getElementById('feedback').innerText = "✅ درست بود!";
                document.getElementById('feedback').style.color = "#2e7d32";
            } else {
                document.getElementById('feedback').innerText = "❌ اشتباه! پاسخ صحیح: " + correct;
                document.getElementById('feedback').style.color = "#d32f2f";
            }
            document.getElementById('next-btn').style.display = "block";
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                document.querySelector('.card').innerHTML = "<h3>پایان بازی!</h3>";
            }
        }
        
        loadQuestion();
    </script>
</body>
</html>
