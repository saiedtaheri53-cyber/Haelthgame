<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب،علم سلامتی</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #game-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { font-size: 1.5rem; color: #2c3e50; }
        .question { font-size: 1.2rem; margin: 20px 0; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background-color: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn:active { transform: scale(0.98); }
        #contact-btn { position: fixed; bottom: 20px; right: 20px; background-color: #f39c12; color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-size: 0.9rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 1000; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-card">
    <h1>طب،علم سلامتی</h1>
    <div id="game-content">
        <div id="question-text" class="question">در حال بارگذاری...</div>
        <div id="options-container"></div>
        <div id="status"></div>
    </div>
</div>

<a id="contact-btn" href="https://eitaa.com/۹">ارتباط با ما</a>

<script>
    const questions = [
        { q: "عنصر آتش چه طبعی دارد؟", a: ["گرم و خشک", "سرد و تر"], correct: 0 },
        { q: "عنصر آب چه طبعی دارد؟", a: ["سرد و تر", "گرم و خشک"], correct: 0 },
        { q: "کدام عنصر گرم و تر است؟", a: ["هوا", "خاک"], correct: 0 }
    ];

    let currentIdx = parseInt(localStorage.getItem('arkan_progress')) || 0;

    function loadQuestion() {
        if (currentIdx >= questions.length) {
            document.getElementById('game-content').innerHTML = "<h2>پایان بازی!</h2>";
            localStorage.removeItem('arkan_progress');
            return;
        }
        
        const q = questions[currentIdx];
        document.getElementById('question-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i);
            container.appendChild(btn);
        });
    }

    function checkAnswer(idx) {
        if (idx === questions[currentIdx].correct) {
            document.getElementById('status').innerText = "✅ درست!";
            document.getElementById('status').style.color = "green";
            currentIdx++;
            localStorage.setItem('arkan_progress', currentIdx);
            setTimeout(loadQuestion, 1000);
        } else {
            document.getElementById('status').innerText = "❌ اشتباه! دوباره تلاش کن.";
            document.getElementById('status').style.color = "red";
        }
    }

    loadQuestion();
</script>

</body>
</html>
