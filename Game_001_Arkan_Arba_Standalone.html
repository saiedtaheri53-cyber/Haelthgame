<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بازی ارکان اربعه</title>
    <style>
        body { font-family: Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f0f7f4; padding: 10px; box-sizing: border-box; }
        #game-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; background-color: #2ecc71; color: white; }
        button:active { background-color: #27ae60; }
        h2 { font-size: 18px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="question-area">
        <h2 id="question">بارگذاری...</h2>
        <div id="options-area"></div>
    </div>
</div>

<script>
    const questions = [
        // کپی کامل آرایه سوالات شما (در اینجا ۱۰۰ سوال شما قرار می‌گیرد)
        {w: "آیا آتش گرم است؟", options: ["بله", "خیر"], answer: "بله", h: "آتش ذاتاً گرم است."},
        // ... (سایر سوالات)
    ];

    let currentQ = 0;
    const qEl = document.getElementById("question");
    const optEl = document.getElementById("options-area");

    function loadQ() {
        if(currentQ >= questions.length) { qEl.innerText = "تمام شد!"; optEl.innerHTML = ""; return; }
        const q = questions[currentQ];
        qEl.innerText = q.w;
        optEl.innerHTML = "";
        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === q.answer) alert("درست بود");
                currentQ++;
                loadQ();
            };
            optEl.appendChild(btn);
        });
    }
    loadQ();
</script>
</body>
</html>
