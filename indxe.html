https://fonts.goo<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب پلی | طب، علم سلامتی</title>
    <meta name="description" content="طب، علم سلامتی؛ فعال‌سازی دانشنامه جامع طب">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Devanagari&family=Noto+Sans+SC&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2c5e1a;
            --accent-color: #d4af37;
            --bg-color: #f4f1ea;
            --text-color: #333;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        header {
            width: 100%;
            padding: 20px 0;
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .bismillah {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .branding {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .language-selector {
            margin: 20px 0;
        }

        .lang-btn {
            background: white;
            border: 1px solid var(--primary-color);
            padding: 5px 15px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.3s;
        }

        .lang-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 800px;
            padding: 30px 0;
        }

        .game-card {
            background: white;
            border: 2px solid var(--accent-color);
            border-radius: 15px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            background-color: #fffdf5;
        }

        .game-card i {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            color: #777;
        }

        /* Responsive for RTL/LTR */
        [dir="ltr"] .language-selector { direction: ltr; }
        [dir="ltr"] .lang-btn { margin: 0 5px; }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .menu-container { animation: fadeIn 1s ease-in; }
    </style>
</head>
<body>

    <header>
        <div class="bismillah">بسم الله الرحمن الرحیم</div>
        <div class="branding">طب پلی | TibbPlay</div>
    </header>

    <div class="language-selector">
        <button class="lang-btn" onclick="setLanguage('fa')">فارسی</button>
        <button class="lang-btn" onclick="setLanguage('ar')">العربية</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('hi')">हिन्दी</button>
        <button class="lang-btn" onclick="setLanguage('zh')">中文</button>
    </div>

    <h2 id="welcome-text">انتخاب بازی</h2>

    <nav class="menu-container">
        <a href="game1.html" class="game-card" id="g1">بازی ۱</a>
        <a href="game2.html" class="game-card" id="g2">بازی ۲</a>
        <a href="game3.html" class="game-card" id="g3">بازی ۳</a>
        <a href="game4.html" class="game-card" id="g4">بازی ۴</a>
        <a href="game5.html" class="game-card" id="g5">بازی ۵</a>
        <a href="game6.html" class="game-card" id="g6">بازی ۶</a>
    </nav>

    <footer>
        <p id="footer-text">طب، علم سلامتی؛ فعال‌سازی دانشنامه جامع</p>
    </footer>

    <script>
        const translations = {
            fa: {
                welcome: "انتخاب بازی",
                footer: "طب، علم سلامتی؛ فعال‌سازی دانشنامه جامع",
                games: ["بازی ۱", "بازی ۲", "بازی ۳", "بازی ۴", "بازی ۵", "بازی ۶"],
                dir: "rtl"
            },
            ar: {
                welcome: "اختر اللعبة",
                footer: "الطب، علم الصحة؛ تفعيل الموسوعة الشاملة",
                games: ["اللعبة ١", "اللعبة ٢", "اللعبة ٣", "اللعبة ٤", "اللعبة ٥", "اللعبة ٦"],
                dir: "rtl"
            },
            en: {
                welcome: "Select a Game",
                footer: "Tibb, the science of health; activating the comprehensive encyclopedia",
                games: ["Game 1", "Game 2", "Game 3", "Game 4", "Game 5", "Game 6"],
                dir: "ltr"
            },
            hi: {
                welcome: "खेल चुनें",
                footer: "तिब्ब, स्वास्थ्य का विज्ञान; व्यापक विश्वकोश को सक्रिय करना",
                games: ["खेल १", "खेल २", "खेल ३", "खेल ४", "खेल ५", "खेल ६"],
                dir: "ltr"
            },
            zh: {
                welcome: "选择游戏",
                footer: "提比，健康科学；激活综合百科全书",
                games: ["游戏 1", "游戏 2", "游戏 3", "游戏 4", "游戏 5", "游戏 6"],
                dir: "ltr"
            }
        };

        function setLanguage(lang) {
            const data = translations[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = data.dir;
            document.getElementById('welcome-text').innerText = data.welcome;
            document.getElementById('footer-text').innerText = data.footer;
            
            const gameLinks = document.querySelectorAll('.game-card');
            gameLinks.forEach((link, index) => {
                link.innerText = data.games[index];
            });

            // Save preference
            localStorage.setItem('preferredLang', lang);
        }

        // Load saved language
        window.onload = () => {
            const savedLang = localStorage.getItem('preferredLang') || 'fa';
            setLanguage(savedLang);
        };
    </script>
</body>
</html>
