<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی ۲۱: ورزش و حرکات بدنی</title>
    <style>
        :root { --main: #d84315; --bg: #fbe9e7; --btn: #ffccbc; --succ: #4caf50; --err: #f44336; }
        body { font-family: Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 95%; max-width: 550px; }
        .info { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: var(--main); }
        #q { font-size: 1.2em; margin-bottom: 20px; font-weight: bold; }
        .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; background: var(--btn); cursor: pointer; transition: 0.2s; }
        button:hover { background: #ffab91; }
        .ok { background: var(--succ) !important; color: white; }
        .no { background: var(--err) !important; color: white; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🏋️ ورزش و حرکات بدنی</h2>
        <div class="info"><span>امتیاز: <span id="pts">0</span></span><span>مرحله: <span id="stg">1</span></span></div>
        <div id="q"></div>
        <div id="opts" class="opts"></div>
    </div>
    <script>
        const data = [
            {q: "بهترین زمان ورزش چه زمانی است؟", a: "بعد از هضم غذا"}, {q: "ورزش با معده پر چه عارضه‌ای دارد؟", a: "فساد هضم و بیماری"}, {q: "ورزش شدید قبل از هضم غذا چه می‌کند؟", a: "توزیع مواد خام در بدن"}, {q: "ورزش معتدل چه اثری بر روح دارد؟", a: "نشاط و شادی"},
            {q: "آیا ورزش سنگین در هوای بسیار گرم توصیه می‌شود؟", a: "خیر"}, {q: "نشانه ورزش کافی چیست؟", a: "سرخ شدن پوست"}, {q: "ورزش برای کدام اخلاط مفید است؟", a: "دفع فضولات اخلاط"}, {q: "آیا پیاده‌روی سریع نوعی ورزش است؟", a: "بله"},
            {q: "ورزش باعث خروج چه چیزی از بدن می‌شود؟", a: "بخارات زائد"}, {q: "آیا در زمان بیماری باید ورزش کرد؟", a: "خیر"}, {q: "کدام ورزش برای تقویت قلب توصیه شده؟", a: "تنفس عمیق و پیاده‌روی"}, {q: "آیا استراحت بعد از ورزش لازم است؟", a: "بله"},
            {q: "ورزش باعث تقویت کدام عضو می‌شود؟", a: "تمام عضلات و مفاصل"}, {q: "آیا خوابیدن بلافاصله بعد از ورزش درست است؟", a: "خیر"}, {q: "ورزش برای رفع کدام غلبه مفید است؟", a: "بلغم و سودا"}, {q: "آیا ورزش در صبحگاه برای مزاج‌های سرد عالی است؟", a: "بله"},
            {q: "آیا ورزش زیاد باعث خشکی بدن می‌شود؟", a: "بله"}, {q: "ورزش متعادل باعث چه نوع حرارتی می‌شود؟", a: "حرارت غریزی"}, {q: "آیا شنا ورزش کاملی محسوب می‌شود؟", a: "بله"}, {q: "ورزش باعث باز شدن چه چیزی می‌شود؟", a: "مساوی پوست و منافذ"},
            {q: "آیا ورزش با عصبانیت و خشم مفید است؟", a: "خیر"}, {q: "ورزش برای کاهش وزن در کدام مزاج موثرتر است؟", a: "بلغم"}, {q: "بهترین ورزش برای سالمندان چیست؟", a: "پیاده‌روی آرام"}, {q: "آیا ورزش باید به تدریج شروع شود؟", a: "بله"},
            {q: "هدف از ورزش در طب سنتی چیست؟", a: "حفظ سلامتی"}, {q: "آیا ورزش باید متناسب با سن باشد؟", a: "بله"}, {q: "ورزش باعث تقویت کدام سیستم می‌شود؟", a: "سیستم دفاعی"}, {q: "آیا ورزش برای افراد صفراوی باید ملایم باشد؟", a: "بله"},
            {q: "آیا حمام بعد از ورزش مفید است؟", a: "بله، بعد از استراحت"}, {q: "ورزش باعث جریان خون در کدام اعضا می‌شود؟", a: "تمام اعضا"}, {q: "آیا ورزش طول عمر را زیاد می‌کند؟", a: "بله"}, {q: "ورزش برای دفع اخلاط فاسد چه می‌کند؟", a: "آنها را به سطح می‌آورد"},
            {q: "آیا ورزش سنگین برای مزاج‌های خشک توصیه می‌شود؟", a: "خیر"}, {q: "ورزش باعث بهبود چه نوع هضمی می‌شود؟", a: "هضم کبدی"}, {q: "آیا کشش عضلات نوعی ورزش است؟", a: "بله"}, {q: "ورزش باعث دفع چه چیزی از راه تعریق می‌شود؟", a: "سموم"},
            {q: "آیا در محیط آلوده باید ورزش کرد؟", a: "خیر"}, {q: "ورزش موجب افزایش چه کیفیتی در بدن می‌شود؟", a: "گرمی"}, {q: "آیا بازی‌های گروهی برای روحیه مفیدند؟", a: "بله"}, {q: "ورزش متعادل باعث چه می‌شود؟", a: "استحکام اعضا"},
            {q: "آیا ورزش برای رفع یبوست مفید است؟", a: "بله"}, {q: "آیا هنگام ورزش باید تنفس منظم داشت؟", a: "بله"}, {q: "ورزش برای درمان چه چیزی عالی است؟", a: "سستی و تنبلی"}, {q: "آیا بعد از ورزش باید آب یخ خورد؟", a: "هرگز"},
            {q: "آیا ورزش برای تقویت ریه مفید است؟", a: "بله"}, {q: "ورزش باعث تخلیه چیست؟", a: "فضولات غده‌ای"}, {q: "آیا ورزش در دوران نقاهت بیماری مفید است؟", a: "فقط بسیار ملایم"}, {q: "آیا ورزش سنگین باعث لاغری می‌شود؟", a: "بله"},
            {q: "ورزش معتدل چه تاثیری بر خواب دارد؟", a: "کیفیت خواب را بهتر می‌کند"}, {q: "آیا تمرکز حین ورزش مفید است؟", a: "بله"}, {q: "ورزش باعث چه نوع خون‌سازی می‌شود؟", a: "خون سالم"}, {q: "آیا ورزش برای تقویت مفاصل لازم است؟", a: "بله"},
            {q: "ورزش مانع از تجمع چه چیزی می‌شود؟", a: "چربی‌های زائد"}, {q: "آیا پیاده‌روی در طبیعت مفیدتر است؟", a: "بله"}, {q: "ورزش سنگین باعث افزایش چه چیزی در خون می‌شود؟", a: "بخارات صفراوی"}, {q: "آیا ورزش باید لذت‌بخش باشد؟", a: "بله"},
            {q: "ورزش متعادل یعنی چه؟", a: "ورزشی که خسته نکند"}, {q: "آیا فعالیت‌های روزانه ورزش محسوب می‌شوند؟", a: "بستگی به شدت دارد"}, {q: "ورزش برای رفع خستگی‌های ذهنی مفید است؟", a: "بله"}
        ];

        let p = 0, st = 0;
        const qEl = document.getElementById('q'), oEl = document.getElementById('opts'), ptEl = document.getElementById('pts'), stEl = document.getElementById('stg');
        
        function load() {
            if(st >= data.length) { qEl.innerText = "پایان! امتیاز: " + p; oEl.innerHTML = ""; return; }
            ptEl.innerText = p; stEl.innerText = (st+1); qEl.innerText = data[st].q; oEl.innerHTML = "";
            let ch = [data[st].a, "خیر", "بی‌اثر", "مضر"].sort(() => Math.random()-0.5);
            ch.forEach(c => {
                let b = document.createElement('button'); b.innerText = c;
                b.onclick = () => {
                    oEl.querySelectorAll('button').forEach(x => x.disabled = true);
                    if(c === data[st].a) { b.classList.add('ok'); p += 5; } else { b.classList.add('no'); }
                    setTimeout(() => { st++; load(); }, 700);
                };
                oEl.appendChild(b);
            });
        }
        load();
    </script>
</body>
</html>
