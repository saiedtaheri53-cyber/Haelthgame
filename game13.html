<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشنامه مزاج‌شناسی - ۱۰۰ سوال تخصصی</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .q-box { font-size: 19px; color: #2c3e50; margin-bottom: 25px; min-height: 80px; line-height: 1.6; }
        .btn { display: block; width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 15px; cursor: pointer; font-size: 17px; font-weight: bold; transition: 0.2s; color: white; }
        .btn-yes { background: #27ae60; }
        .btn-no { background: #c0392b; }
        .progress { font-size: 14px; color: #7f8c8d; margin-top: 15px; }
        .golden-badge { color: #d35400; font-size: 24px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

<div class="box" id="game-box">
    <div class="q-box" id="q-text">در حال بارگذاری دانش‌نامه مزاج‌شناسی...</div>
    <div id="options">
        <button class="btn btn-yes" onclick="checkAnswer('بله')">بله</button>
        <button class="btn btn-no" onclick="checkAnswer('خیر')">خیر</button>
    </div>
    <div class="progress" id="status">سوال ۱ از ۱۰۰</div>
</div>

<script>
    const questions = [
        {q: "آیا مزاج دم (خون) گرم و تر است؟", a: "بله"}, {q: "آیا مزاج صفرا سرد و خشک است؟", a: "خیر"},
        {q: "آیا مزاج بلغم سرد و تر است؟", a: "بله"}, {q: "آیا مزاج سودا سرد و خشک است؟", a: "بله"},
        {q: "آیا افراد صفراوی زود عصبانی می‌شوند؟", a: "بله"}, {q: "آیا افراد بلغمی‌مزاج معمولاً کند و آرام هستند؟", a: "بله"},
        {q: "آیا پوستِ گرم و تر (دموی) معمولاً سرخ است؟", a: "بله"}, {q: "آیا سوداوی‌ها معمولاً اشتهای زیادی دارند؟", a: "خیر"},
        {q: "آیا خوابِ زیاد از علائم غلبه بلغم است؟", a: "بله"}, {q: "آیا خشکی دهان از علائم صفرا است؟", a: "بله"},
        {q: "آیا افراد دموی‌مزاج معمولاً خواب سبکی دارند؟", a: "خیر"}, {q: "آیا سوداوی‌ها مستعد یبوست هستند؟", a: "بله"},
        {q: "آیا صفراوی‌ها به گرما حساس‌ترند؟", a: "بله"}, {q: "آیا بلغم باعث چاقی شکمی می‌شود؟", a: "بله"},
        {q: "آیا مزاج اصلی انسان در هنگام تولد تغییر می‌کند؟", a: "خیر"}, {q: "آیا سودا سبک‌ترین اخلاط است؟", a: "خیر"},
        {q: "آیا صفرا گرم و خشک است؟", a: "بله"}, {q: "آیا بلغم سرد و تر است؟", a: "بله"},
        {q: "آیا کبد منشأ تولید صفراست؟", a: "بله"}, {q: "آیا طحال منشأ تولید سوداست؟", a: "بله"},
        {q: "آیا افراد صفراوی قدبلند و لاغر هستند؟", a: "خیر"}, {q: "آیا رنگ پوست سوداوی‌ها معمولاً تیره است؟", a: "بله"},
        {q: "آیا بلغم باعث سفیدی مو در سنین پایین می‌شود؟", a: "بله"}, {q: "آیا خون (دم) شیرین‌مزه است؟", a: "بله"},
        {q: "آیا صفرا تلخ‌مزه است؟", a: "بله"}, {q: "آیا سودا ترش‌مزه است؟", a: "بله"},
        {q: "آیا بلغم بی‌مزه است؟", a: "بله"}, {q: "آیا مزاج تابستان گرم و خشک است؟", a: "بله"},
        {q: "آیا مزاج زمستان سرد و تر است؟", a: "بله"}, {q: "آیا مزاج بهار گرم و تر است؟", a: "بله"},
        {q: "آیا مزاج پاییز سرد و خشک است؟", a: "بله"}, {q: "آیا صفراوی‌ها در هوای سرد احساس بهتری دارند؟", a: "بله"},
        {q: "آیا بلغمی‌ها به خوردن گرمیجات نیاز دارند؟", a: "بله"}, {q: "آیا سوداوی‌ها بهتر است غذاهای سرد بخورند؟", a: "خیر"},
        {q: "آیا تپش قلب از علائم غلبه صفراست؟", a: "بله"}, {q: "آیا بی‌خوابی از علائم غلبه سوداست؟", a: "بله"},
        {q: "آیا سرگیجه صبحگاهی از علائم غلبه بلغم است؟", a: "بله"}, {q: "آیا مزاج کودکان گرم و تر است؟", a: "بله"},
        {q: "آیا مزاج سالمندان سرد و خشک است؟", a: "بله"}, {q: "آیا مزاج میانسالان گرم و خشک است؟", a: "بله"},
        {q: "آیا پوست سرد و خشک (سوداوی) معمولاً تیره است؟", a: "بله"}, {q: "آیا اشتهای کاذب از علائم بلغم معده است؟", a: "بله"},
        {q: "آیا صفراوی‌ها معمولاً ریزش موی زودرس دارند؟", a: "بله"}, {q: "آیا سوداوی‌ها وسواسی‌تر هستند؟", a: "بله"},
        {q: "آیا بلغم باعث کاهش حافظه می‌شود؟", a: "بله"}, {q: "آیا افراد دموی معمولاً پرانرژی هستند؟", a: "بله"},
        {q: "آیا صفراوی‌ها زودتر از دیگران پیر می‌شوند؟", a: "خیر"}, {q: "آیا خوابیدن بعد از حمام برای سوداوی‌ها مضر است؟", a: "بله"},
        {q: "آیا گرمیِ مزاج باعث لاغری می‌شود؟", a: "بله"}, {q: "آیا رطوبتِ مزاج باعث چاقی می‌شود؟", a: "بله"},
        {q: "آیا مزاج سودا باعث خشکی پوست می‌شود؟", a: "بله"}, {q: "آیا خوردن ماست برای سوداوی‌ها مفید است؟", a: "خیر"},
        {q: "آیا خوردن سرکه برای صفراوی‌ها مفید است؟", a: "بله"}, {q: "آیا بادام برای تقویت مغز سوداوی‌ها مفید است؟", a: "بله"},
        {q: "آیا زنجبیل برای رفع بلغم مفید است؟", a: "بله"}, {q: "آیا عسل برای همه مزاج‌ها یکسان است؟", a: "خیر"},
        {q: "آیا صفراوی‌ها معمولاً تشنه می‌شوند؟", a: "بله"}, {q: "آیا بلغمی‌ها زیاد تشنه می‌شوند؟", a: "خیر"},
        {q: "آیا سوداوی‌ها زود غمگین می‌شوند؟", a: "بله"}, {q: "آیا دموی‌ها روحیه شاد و امیدوار دارند؟", a: "بله"},
        {q: "آیا صفراوی‌ها در عصبانیت جسور هستند؟", a: "بله"}, {q: "آیا مزاج در اثر محیط تغییر می‌کند؟", a: "بله"},
        {q: "آیا بلغم باعث سفیدی زبان می‌شود؟", a: "بله"}, {q: "آیا صفرا باعث زردی زبان می‌شود؟", a: "بله"},
        {q: "آیا سودا باعث تیرگی زبان می‌شود؟", a: "بله"}, {q: "آیا دم باعث قرمزی زبان می‌شود؟", a: "بله"},
        {q: "آیا ورزش سنگین برای صفراوی‌ها مضر است؟", a: "بله"}, {q: "آیا خواب روز برای بلغمی‌ها مفید است؟", a: "خیر"},
        {q: "آیا سیاهدانه برای درمان بلغم عالی است؟", a: "بله"}, {q: "آیا گلاب برای رفع سودا مفید است؟", a: "بله"},
        {q: "آیا صفرا باعث تلخی دهان در صبح می‌شود؟", a: "بله"}, {q: "آیا مزاج اولیه را می‌توان کاملاً تغییر داد؟", a: "خیر"},
        {q: "آیا طبع گرم و خشک همان مزاج صفراست؟", a: "بله"}, {q: "آیا طبع سرد و تر همان مزاج بلغم است؟", a: "بله"},
        {q: "آیا طبع سرد و خشک همان مزاج سوداست؟", a: "بله"}, {q: "آیا طبع گرم و تر همان مزاج دم است؟", a: "بله"},
        {q: "آیا مزاج صفرا باعث کم‌خوابی می‌شود؟", a: "بله"}, {q: "آیا مزاج بلغم باعث خستگی زیاد می‌شود؟", a: "بله"},
        {q: "آیا سوداوی‌ها بیشتر دچار دلهره می‌شوند؟", a: "بله"}, {q: "آیا دموی‌ها بیشتر دچار جوش صورت می‌شوند؟", a: "بله"},
        {q: "آیا مزاج سودا باعث تیرگی زیر چشم می‌شود؟", a: "بله"}, {q: "آیا مزاج صفرا باعث کم‌مویی می‌شود؟", a: "بله"},
        {q: "آیا خوردن گرمیجات زیاد مزاج را سوداوی می‌کند؟", a: "بله"}, {q: "آیا خوردن سردیجات زیاد مزاج را بلغمی می‌کند؟", a: "بله"},
        {q: "آیا مزاج صفراوی با حجامت تعدیل می‌شود؟", a: "بله"}, {q: "آیا مزاج بلغمی با بادکش تعدیل می‌شود؟", a: "بله"},
        {q: "آیا سوداوی‌ها بهتر است در هوای گرم زندگی کنند؟", a: "بله"}, {q: "آیا دموی‌ها باید از پرخوری پرهیز کنند؟", a: "بله"},
        {q: "آیا صفراوی‌ها نباید زیر نور شدید آفتاب بمانند؟", a: "بله"}, {q: "آیا بلغمی‌ها نباید زیاد آب بخورند؟", a: "بله"},
        {q: "آیا مزاج سرد و تر نیاز به ورزش دارد؟", a: "بله"}, {q: "آیا مزاج گرم و خشک نیاز به آرامش دارد؟", a: "بله"},
        {q: "آیا سوداوی‌ها نیاز به شادی و تفریح دارند؟", a: "بله"}, {q: "آیا دموی‌ها معمولاً خوش‌مشرب هستند؟", a: "بله"},
        {q: "آیا صفراوی‌ها حافظه کوتاه‌مدت خوبی دارند؟", a: "بله"}, {q: "آیا بلغمی‌ها حافظه بلندمدت خوبی دارند؟", a: "بله"},
        {q: "آیا مزاج‌شناسی علمی دقیق و مبتنی بر تجربه است؟", a: "بله"}, {q: "آیا مزاج انسان یکسان باقی می‌ماند؟", a: "خیر"}
    ];

    let cur = 0, score = 0;

    function checkAnswer(ans) {
        if (ans === questions[cur].a) score++;
        cur++;
        if (cur < questions.length) {
            update();
        } else {
            showResult();
        }
    }

    function update() {
        document.getElementById('q-text').innerText = questions[cur].q;
        document.getElementById('status').innerText = `سوال ${cur + 1} از ۱۰۰`;
    }

    function showResult() {
        const isGolden = score === 100;
        document.getElementById('game-box').innerHTML = `
            ${isGolden ? '<div class="golden-badge">🌟 استاد مزاج‌شناسی</div>' : '<h2>پایان آزمون مزاج</h2>'}
            <p>امتیاز نهایی شما: <strong>${score} از ۱۰۰</strong></p>
            <button class="btn" style="background:#3498db" onclick="location.reload()">شروع مجدد آزمون</button>
        `;
    }

    update();
</script>
</body>
</html>
