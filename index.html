<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرتال بازی‌های سلامت</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #81c784;
            --accent-color: #ff9800;
            --bg-color: #f1f8e9;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        header p {
            margin: 0.5rem 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            padding: 2rem 0;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .game-icon {
            font-size: 3rem;
            padding: 1.5rem 0;
            background: #f9f9f9;
        }

        .game-info {
            padding: 1.5rem;
        }

        .game-info h3 {
            margin: 0 0 0.5rem;
            color: var(--primary-color);
        }

        .game-info p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .play-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
            margin-bottom: 1.5rem;
        }

        .play-btn:hover {
            background-color: var(--secondary-color);
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            color: #888;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .container { width: 95%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>پورتال بازی‌های سلامت</h1>
        <p>یادگیری مفاهیم طب سنتی از طریق بازی‌های تعاملی</p>
    </header>

    <div class="container">
        <div class="game-grid">

    <footer>

</body>
</html>
