<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب پلی | طب، علم سلامتی - فعال‌سازی دانشنامه جامع</title>
    <meta name="description" content="طب پلی: دانشنامه جامع طب سنتی و علم سلامتی">
    
    <!-- Fonts -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        :root {
            --primary-color: #2c5e1a; /* سبز طب سنتی */
            --secondary-color: #d4af37; /* طلایی */
            --bg-color: #f4f1ea;
            --text-color: #333;
            --card-bg: #ffffff;
            --font-family: 'Vazirmatn', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        header {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            text-align: center;
            padding: 20px 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .bismillah {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .branding {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Search Bar */
        .search-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        #gameSearch {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: 2px solid var(--primary-color);
            outline: none;
            font-family: inherit;
            text-align: center;
        }

        /* Settings Panel */
        .settings-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #e0dbcf;
            flex-wrap: wrap;
        }

        .settings-bar select, .settings-bar button {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: inherit;
            cursor: pointer;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            border: 1px solid #eee;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--secondary-color);
        }

        .game-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .game-card .title {
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background: var(--primary-color);
            color: white;
            margin-top: 40px;
        }

        .footer-links a {
            color: var(--secondary-color);
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
        }

        /* Dark Mode classes */
        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #f4f4f4;
            --card-bg: #2d2d2d;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <span class="bismillah">بسم الله الرحمن الرحیم</span>
    <div class="branding">طب پلی | طب، علم سلامتی</div>
</header>

<div class="settings-bar">
    <select id="fontSelect" onchange="updateSettings()">
        <option value="'Vazirmatn', sans-serif">فونت وزیر</option>
        <option value="serif">فونت کلاسیک</option>
        <option value="cursive">فونت نستعلیق</option>
    </select>

    <select id="themeSelect" onchange="updateSettings()">
        <option value="light">حالت روشن</option>
        <option value="dark">حالت تاریک</option>
    </select>

    <button id="soundBtn" onclick="toggleSound()">🔊 صدا: روشن</button>
</div>

<div class="search-container">
    <input type="text" id="gameSearch" placeholder="جستجوی بازی یا موضوع..." onkeyup="filterGames()">
</div>

<main class="games-grid" id="gamesGrid">
    <!-- Games will be injected by JavaScript -->
</main>

<footer>
    <div class="footer-links">
        <a href="https://eitaa.com/pazashke" target="_blank">ارتباط با ما (ایتا)</a> | 
        <a href="mailto:saiedtaheri53@gmail.com">ایمیل پشتیبانی</a>
    </div>
    <p style="font-size: 0.8rem; margin-top: 15px; opacity: 0.7;">© تمامی حقوق برای طب پلی محفوظ است</p>
</footer>

<script>
    // --- Data: 100 Games Configuration ---
    const games = [
        { id: 1, title: "ارکان اربعه", icon: "⚖️", link: "game1.html" },
        { id: 2, title: "ستّه ضروریه", icon: "🌡️", link: "game2.html" },
        { id: 3, title: "مزاج‌شناسی پایه", icon: "🔥", link: "game3.html" },
        { id: 4, title: "عناصر چهارگانه", icon: "🌍", link: "game4.html" },
        { id: 5, title: "تعادل بدن", icon: "☯️", link: "game5.html" },
        { id: 6, title: "فیزیولوژی پایه", icon: "🧬", link: "game6.html" },
        // Dynamic Games (Placeholder for 7-99)
        ...Array.from({ length: 93 }, (_, i) => ({
            id: i + 7,
            title: `بازی شماره ${i + 7}`, // In real version, names will be specific
            icon: "🧩",
            link: `game${i + 7}.html`
        })),
        { id: 100, title: "دانشنامه جامع", icon: "📚", link: "game100.html" }
    ];

    // Note: For the actual production, the names in the loop above 
    // will be replaced with the 100 specific names I've prepared.

    const gamesGrid = document.getElementById('gamesGrid');
    const searchInput = document.getElementById('gameSearch');

    // --- Render Games ---
    function renderGames(gameList) {
        gamesGrid.innerHTML = '';
        gameList.forEach(game => {
            const card = document.createElement('a');
            card.className = 'game-card';
            card.href = game.link;
            card.innerHTML = `
                <div class="icon">${game.icon}</div>
                <div class="title">${game.title}</div>
            `;
            gamesGrid.appendChild(card);
        });
    }

    // --- Filter Logic ---
    function filterGames() {
        const query = searchInput.value.toLowerCase();
        const filtered = games.filter(g => g.title.toLowerCase().includes(query));
        renderGames(filtered);
    }

    // --- Settings & LocalStorage ---
    function updateSettings() {
        const font = document.getElementById('fontSelect').value;
        const theme = document.getElementById('themeSelect').value;
        const sound = localStorage.getItem('sound') !== 'false';

        document.body.style.setProperty('--font-family', font);
        
        if (theme === 'dark') {
            document.body.classList.add('dark-mode');
        } else {
            document.body.classList.remove('dark-mode');
        }

        localStorage.setItem('userFont', font);
        localStorage.setItem('userTheme', theme);
        localStorage.setItem('sound', sound);
    }

    function toggleSound() {
        const btn = document.getElementById('soundBtn');
        let sound = localStorage.getItem('sound') !== 'false';
        sound = !sound;
        localStorage.setItem('sound', sound);
        btn.innerText = sound ? "🔊 صدا: روشن" : "🔇 صدا: خاموش";
        updateSettings();
    }

    function loadSettings() {
        const savedFont = localStorage.getItem('userFont') || "'Vazirmatn', sans-serif";
        const savedTheme = localStorage.getItem('userTheme') || 'light';
        const savedSound = localStorage.getItem('sound') !== 'false';

        document.getElementById('fontSelect').value = savedFont;
        document.getElementById('themeSelect').value = savedTheme;
        document.getElementById('soundBtn').innerText = savedSound ? "🔊 صدا: روشن" : "🔇 صدا: خاموش";
        
        updateSettings();
    }

    // Initialize
    window.onload = () => {
        loadSettings();
        renderGames(games);
    };

</script>
</body>
</html>
