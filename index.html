clamp(20px,4vw,39px);font-weight:bold;line-height:1.7;color:transparent;background:linear-gradient(110deg,#fff2ae,#c28c2e 35%,#fff0a6 55%,#9b681e 75%,#ffe6a0);background-clip:text;-webkit-background-clip:text;text-shadow:0 1px 2px #120a04}.medallion{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(188px,32vw,310px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#25180eeF,#140e0beF 76%);border:4px double #e0bd66;box-shadow:0 0 0 5px #513817,0 0 25px #e5b9554a,inset 0 0 0 8px #d7b15035;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px}.medallion h1{color:#f1d37d;font-size:clamp(21px,4vw,37px);margin:4px 0 2px;text-shadow:0 2px 4px #000}.medallion p{margin:2px;font-size:clamp(12px,2vw,16px);color:#fff1d0}.emblem{width:39px;height:39px;fill:none;stroke:#e4c36d;stroke-width:2.3}.knocker-wrap{position:absolute;top:55%;z-index:4;display:flex;flex-direction:column;align-items:center;gap:8px}.knocker-wrap.r{right:12%}.knocker-wrap.l{left:12%}.strike{width:clamp(61px,9vw,86px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#745026 0 38%,#2a1c12 41% 62%,#0d0906 67%);box-shadow:inset 0 0 8px #000,0 2px 6px #0009;display:grid;place-items:center}.knocker{width:80%;height:88%;border:0;background:none;position:relative;cursor:pointer;color:#efce73;filter:drop-shadow(0 2px 2px #000);animation:sway 3.4s ease-in-out infinite}.knocker:focus-visible,.direct:focus-visible,select:focus-visible{outline:3px solid #fff2aa;outline-offset:4px}.knocker:hover{filter:drop-shadow(0 0 9px #ffd56b);transform:scale(1.07)}.ring:before{content:'';position:absolute;width:56%;height:65%;left:22%;top:19%;border:6px solid #c89a45;border-radius:48% 48% 45% 45%;box-shadow:inset 0 0 2px #fff0a3,0 0 3px #120a04}.ring:after{content:'';position:absolute;width:21%;height:21%;left:39.5%;top:9%;border-radius:50%;background:linear-gradient(120deg,#f1d27b,#7e521e);box-shadow:0 3px 4 </style></head><body><div class="backdrop" aria-hidden="true"></div>
<div class="lang"><label for="doorLang" class="sr-only">زبان</label><select id="doorLang" aria-label="انتخاب زبان"><option value="fa">فارسی</option><option value="ar">العربية</option><option value="en">English</option><option value="hi">हندی</option><option value="zh">中文</option></select></div>

<script>
(function(){'use strict';const translations={fa:{hint:'هر دو کوبه به یک دانشنامه می‌رسند',right:'بازی و تمرین',left:'آموزش و خواندن'},ar:{hint:'كلتا الطرقتين تؤديان إلى الموسوعة نفسها',right:'اللعب والتدريب',left:'التعلّم والقراءة'},en:{hint:'Both knockers lead to the same encyclopedia',right:'Play & Practice',left:'Learn & Read'}};const select=document.getElementById('doorLang');let saved='fa';try{saved=localStorage.getItem('tibb_lang')||'fa'}catch(_){}select.value=['fa','ar','en','hi','zh'].includes(saved)?saved:'fa';function update(){let lang=select.value;try{localStorage.setItem('tibb_lang',lang)}catch(_){}const d=translations[lang]||translations.en;document.getElementById('hint').textContent=d.hint;document.querySelector('[data-label="right"]').textContent=d.right;document.querySelector('[data-label="left"]').textContent=d.left;document.querySelector('[data-knocker].male').setAttribute('aria-label',d.right);document.querySelector('[data-knocker].ring').setAttribute('aria-label',d.left);document.documentElement.lang=lang==='hi'?'en':lang==='zh'?'en':lang;document.documentElement.dir=lang==='en'?'ltr':'rtl'}select.addEventListener('change',update);update();let navigating=false;function knock(btn){if(navigating)return;navigating=true;try{const Audio=window.AudioContext||window.webkitAudioContext;if(Audio){const ctx=new Audio(),now=ctx.currentTime;const buffer=ctx.createBuffer(1,ctx.sampleRate*.18,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);const noise=ctx.createBufferSource(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();noise.buffer=buffer;filter.type='lowpass';filter.frequency.value=850;gain.gain.setValueAtTime(.32,now);gain.gain.exponentialRampToValueAtTime(.001,now+.17);noise.connect(filter).connect(gain).connect(ctx.destination);noise.start();const osc=ctx.createOscillator(),og=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(115,now);osc.frequency.exponentialRampToValueAtTime(55,now+.2);og.gain.setValueAtTime(.45,now);og.gain.exponentialRampToValueAtTime(.001,now+.23);osc.connect(og).connect(ctx.destination);osc.start();osc.stop(now+.24)}}catch(_){}try{sessionStorage.setItem('door_passed','1')}catch(_){}if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){location.href='dashboard.html';return}btn.classList.add('hit');document.getElementById('portal').classList.add('open');setTimeout(()=>location.href='dashboard.html',1100)}document.querySelectorAll('[data-knocker]').forEach(b=>b.addEventListener('click',()=>knock(b)));})();
