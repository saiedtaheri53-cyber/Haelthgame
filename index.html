<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشنامه جامع طب، علم سلامتی</title>
    <style>
        :root {
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --accent-color: #d8f3dc;
            --gold-color: #ffd700;
            --text-color: #212529;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
        }
        .stats-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        .game-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border-right: 5px solid var(--secondary-color);
        }
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .game-card h3 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }
        .game-card p {
            font-size: 0.85srem;
            color: #6c757d;
            margin: 0 0 15px 0;
        }
        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            font-size: 0.9rem;
        }
        .btn:hover {
            background-color: var(--primary-color);
        }
        /* Quiz Interface */
        #quiz-container {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .question-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: var(--bg-color);
            border: 2px solid #dee2e6;
            padding: 12px 15px;
            border-radius: 8px;
            text-align: right;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: var(--accent-color);
            border-color: var(--secondary-color);
        }
        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>دانشنامه جامع طب، علم سلامتی</h1>
        <div class="stats-box">⭐ صندوقچه طلایی: <span id="global-gold">0</span> سکه</div>
    </header>

    <div class="container">
        <!-- منوی اصلی پورتال -->
        <div id="portal-menu">
            <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 20px;">فهرست بازی‌ها و آزمون‌های تخصصی</h2>
            <div class="portal-grid" id="games-grid">
                <!-- کارت‌ها به‌صورت دینامیک بارگذاری می‌شوند -->
            </div>
        </div>

        <!-- صفحه آزمون -->
        <div id="quiz-container">
            <a class="back-link" onclick="returnToPortal()">← بازگشت به فهرست پورتال</a>
            <div class="quiz-header">
                <span id="q-progress">سوال ۱ از ۱۰۰</span>
                <span id="q-score">امتیاز: ۰</span>
            </div>
            <div class="question-text" id="q-text">در حال بارگذاری سوال...</div>
            <div class="options-grid" id="q-options">
                <!-- گزینه‌ها -->
            </div>
        </div>
    </div>

    <script>
        // بانک جامع داده‌های بازی‌ها (قابل گسترش تا ۱۰۰ بازی)
        const gamesData = {
            1: {
                title: "بازی ۱: ارکان اربعه",
                desc: "آشنایی با آتش، هوا، آب و خاک و مزاج‌های بنیادین در طب سنتی.",
                questions: [
                    { q: "رکن آتش چه مزاجی دارد؟", options: ["گرم و خشک", "گرم و تر", "سرد و خشک", "سرد و تر"], answer: 0 },
                    { q: "رکن آب دارای چه کیفیتی است؟", options: ["گرم و خشک", "سرد و تر", "گرم و تر", "سرد و خشک"], answer: 1 },
                    { q: "سنگین‌ترین رکن در میان ارکان اربعه کدام است؟", options: ["آتش", "هوا", "آب", "خاک"], answer: 3 },
                    { q: "رکن هوا چه مزاجی دارد؟", options: ["گرم و تر", "سرد و خشک", "سرد و تر", "گرم و خشک"], answer: 0 }
                ]
            },
            2: {
                title: "بازی ۲: سته ضروریه",
                desc: "بررسی ۶ اصل ضروری حفظ صحت (هوا، اغذیه، حرکت، خواب، اعراض نفسانی و استفراغ).",
                questions: [
                    { q: "کدام مورد جزو سته ضروریه است؟", options: ["هوای محیط", "ورزش و حرکت", "حالت روحی و اعراض نفسانی", "هر سه مورد صحیح است"], answer: 3 },
                    { q: "تنظیم خواب و بیداری چه تأثیری بر بدن دارد؟", options: ["تحلیل قوای هاضمه", "تعادل اخلاط و آرامش اعصاب", "افزایش بلغم", "ایجاد خشکی مطلق"], answer: 1 },
                    { q: "احتباس و استفراغ در سته ضروریه به چه معناست؟", options: ["خوردن مواد ترش", "خواب طولانی", "خروج مواد زائد و حفظ مواد مفید", "ورزش سنگین"], answer: 2 }
                ]
            }
        };

        let currentGameId = null;
        let currentQIndex = 0;
        let score = 0;
        let globalGold = parseInt(localStorage.getItem('health_portal_global_gold')) || 0;

        document.getElementById('global-gold').innerText = globalGold;

        function renderPortal() {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            for (let id in gamesData) {
                const game = gamesData[id];
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3>${game.title}</h3>
                    <p>${game.desc}</p>
                    <button class="btn" onclick="startQuiz(${id})">ورود به بازی</button>
                `;
                grid.appendChild(card);
            }
        }

        function startQuiz(id) {
            currentGameId = id;
            currentQIndex = 0;
            score = 0;
            document.getElementById('portal-menu').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const game = gamesData[currentGameId];
            if (currentQIndex >= game.questions.length) {
                finishQuiz();
                return;
            }
            const qData = game.questions[currentQIndex];
            document.getElementById('q-progress').innerText = `سوال ${currentQIndex + 1} از ${game.questions.length}`;
            document.getElementById('q-score').innerText = `امتیاز: ${score}`;
            document.getElementById('q-text').innerText = qData.q;

            const optionsGrid = document.getElementById('q-options');
            optionsGrid.innerHTML = '';
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, qData.answer, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx, correctIdx, btn) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);

            if (selectedIdx === correctIdx) {
                btn.classList.add('correct');
                score += 10;
                globalGold += 5;
                localStorage.setItem('health_portal_global_gold', globalGold);
                document.getElementById('global-gold').innerText = globalGold;
            } else {
                btn.classList.add('wrong');
                buttons[correctIdx].classList.add('correct');
            }

            setTimeout(() => {
                currentQIndex++;
                loadQuestion();
            }, 1200);
        }

        function finishQuiz() {
            document.getElementById('quiz-container').innerHTML = `
                <a class="back-link" onclick="returnToPortal()">← بازگشت به فهرست پورتال</a>
                <div style="text-align: center; padding: 30px;">
                    <h2 style="color: var(--primary-color);">🎉 آزمون به پایان رسید!</h2>
                    <p style="font-size: 1.2rem; margin: 20px 0;">امتیاز شما در این بازی: <strong>${score}</strong></p>
                    <p style="color: #6c757d;">سکه‌های صندوقچه طلایی شما ذخیره شد.</p>
                    <button class="btn" onclick="returnToPortal()" style="margin-top: 15px;">بازگشت به پورتال</button>
                </div>
            `;
        }

        function returnToPortal() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('portal-menu').style.display = 'block';
            // بازنشانی ساختار کوئیز در صورت بازگشت
            location.reload(); 
        }

        renderPortal();
    </script>
</body>
</html>
