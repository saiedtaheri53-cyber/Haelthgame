<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d12">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="door-bg.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <title>طب، علم سلامتی | دروازه</title>
  <style>
    :root{color-scheme:dark;--gold:#e6c56e;--gold2:#9e7023}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Tahoma,sans-serif;background:#1a130f;color:#f4e8d1}
    .portal{display:flex;justify-content:center;align-items:center;min-height:100vh;position:relative;overflow:hidden}
    .doors{position:absolute;inset:0;background:url('door-bg.webp') center/cover no-repeat}
  </style>
</head>
<body>
  <div class="portal" id="portal" aria-label="دروازه دانشنامه">
    <div class="doors" aria-hidden="true">
      <section class="leaf right"></section>
    </div>
    <div class="knocker-wrap r">
      <div class="strike">
        <button class="knocker male" type="button" aria-label="بازی و تمرین">ارتباط</button>
      </div>
    </div>
    <div class="knocker-wrap l">
      <div class="strike">
        <button class="knocker ring" type="button" aria-label="آموزش و خواندن">آموزش</button>
      </div>
    </div>
    <div class="medallion">
      <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 39C8 29 12 16 21 17c4 0 3 4 3 4s-1-4 3-4c9-1 13 12-3 22z" fill="var(--gold)"></path>
      </svg>
    </div>
    <div class="hint" id="hint" aria-live="polite">
      <a href="dashboard.html">ورود مستقیم به دانشنامه</a>
    </div>
  </div>
  <script>
    (function(){
      'use strict';
      const translations = {
        fa: { hint: 'هر دو کوبه به یک دانشنامه می‌رسند', right: 'بازی و تمرین', left: 'آموزش و خواندن' }
      };
    })();
  </script>
</body>
</html>
