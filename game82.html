<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتال طب و سلامت</title>
    <style>
        :root { --main-green: #2e7d32; --gold: #ffd700; }
        body { font-family: Tahoma, sans-serif; background: #f0f4f0; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stats { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; font-weight: bold; color: var(--main-green); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 10px; background: var(--main-green); color: white; cursor: pointer; font-size: 14px; transition: 0.3s; }
        button:active { transform: scale(0.95); }
        .gold-btn { background: var(--gold); color: black; font-weight: bold; }
        #question-box { margin-bottom: 20px; min-height: 80px; padding: 15px; border: 2px solid var(--main-green); border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- نمایش امتیازات -->
    <div class="stats">
        <span id="counter">سوال: ۱/۱۰۰</span>
        <span id="game-score">امتیاز این بازی: ۰</span>
        <span id="gold-score" style="color: #b8860b;">امتیاز طلایی (کل پروژه): ۰</span>
    </div>

    <div id="question-box">بارگذاری سوالات...</div>
    <div id="options" class="grid"></div>

    <div class="grid" style="margin-top: 20px;">
        <button onclick="prev()">قبلی</button>
        <button onclick="next()">بعدی</button>
        <button onclick="showAnswer()">جواب</button>
        <button class="gold-btn" onclick="showHint()">راهنما</button>
        <button onclick="resetGame()" style="background: #d32f2f;">شروع مجدد بازی</button>
        <button onclick="goHome()">بازگشت به فهرست</button>
    </div>
</div>

<script>
    // بازیابی امتیازات از حافظه
    let gameScore = parseInt(localStorage.getItem('gameScore')) || 0;
    let goldScore = parseInt(localStorage.getItem('goldScore')) || 0;
    let currentQ = parseInt(localStorage.getItem('currentQ')) || 0;

    const questions = [
        { q: "آیا آتش گرم و خشک است؟", a: ["بله", "خیر"], correct: 0 },
        { q: "ارکان اربعه کدامند؟", a: ["آب، باد، خاک، آتش", "سرد، گرم، تر، خشک"], correct: 0 }
        // اینجا ۱۰۰ سوال خود را اضافه کنید
    ];

    function updateUI() {
        document.getElementById('game-score').innerText = "امتیاز این بازی: " + gameScore;
        document.getElementById('gold-score').innerText = "امتیاز طلایی (کل): " + goldScore;
        document.getElementById('counter').innerText = "سوال: " + (currentQ + 1) + "/100";
        document.getElementById('question-box').innerText = questions[currentQ].q;
        
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = '';
        questions[currentQ].a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx);
            optDiv.appendChild(btn);
        });
    }

    function checkAnswer(idx) {
        if(idx === questions[currentQ].correct) {
            gameScore++;
            goldScore++; // افزایش امتیاز در هر دو بخش
            localStorage.setItem('gameScore', gameScore);
            localStorage.setItem('goldScore', goldScore);
            updateUI();
            alert("صحیح!");
            next();
        } else {
            alert("اشتباه بود!");
        }
    }

    function next() {
        if(currentQ < questions.length - 1) {
            currentQ++;
            localStorage.setItem('currentQ', currentQ);
            updateUI();
        }
    }

    function prev() {
        if(currentQ > 0) {
            currentQ--;
            updateUI();
        }
    }

    function resetGame() {
        gameScore = 0;
        currentQ = 0;
        localStorage.setItem('gameScore', 0);
        localStorage.setItem('currentQ', 0);
        updateUI();
    }

    function showHint() { alert("راهنما: ارکان اربعه اساس خلقت هستند."); }
    function showAnswer() { alert("جواب صحیح: " + questions[currentQ].a[questions[currentQ].correct]); }
    function goHome() { alert("بازگشت به فهرست..."); }

    updateUI();
</script>

</body>
</html>
