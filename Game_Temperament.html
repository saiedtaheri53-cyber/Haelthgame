<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>حکمت‌سنج مزاج، ارکان و اخلاط</title>
  <style>
    :root {
      --p: #15803d;
      --pd: #14532d;
      --bg: #f3fbf6;
      --card: #ffffff;
      --c: #16a34a;
      --w: #dc2626;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Tahoma, sans-serif;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .container {
      background: var(--card);
      border-radius: 18px;
      padding: clamp(14px, 4vw, 24px);
      width: min(96vw, 650px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.07);
      border: 1.5px solid #dcfce7;
      display: flex;
      flex-direction: column;
    }
    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      color: var(--pd);
    }
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      font-weight: bold;
      margin-bottom: 10px;
      background: #ecfdf5;
      padding: 8px 14px;
      border-radius: 10px;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .prog {
      background: #e5e7eb;
      height: 8px;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #15803d);
      transition: width 0.3s ease;
    }
    .qbox {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 14px;
      color: #111827;
      min-height: 48px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-opt {
      background: #ffffff;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      padding: clamp(10px, 3vw, 14px) 14px;
      font-size: clamp(0.95rem, 3.4vw, 1.05rem);
      text-align: right;
      cursor: pointer;
      font-weight: 600;
      color: #374151;
      line-height: 1.4;
      transition: all 0.2s ease;
    }
    .btn-opt:hover:not([disabled]) {
      border-color: var(--p);
      background: #f0fdf4;
    }
    .btn-opt.correct {
      background: #dcfce7 !important;
      border-color: var(--c) !important;
      color: #14532d !important;
      font-weight: bold;
    }
    .btn-opt.wrong {
      background: #fee2e2 !important;
      border-color: var(--w) !important;
      color: #7f1d1d !important;
      font-weight: bold;
    }
    .fb {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: clamp(0.9rem, 3vw, 1rem);
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .fb.correct {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .fb.wrong {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .btn-next {
      background: var(--p);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: clamp(0.95rem, 3.2vw, 1.05rem);
      font-weight: bold;
      cursor: pointer;
      display: none;
      float: left;
    }
    .result {
      display: none;
      text-align: center;
      padding: 16px 8px;
    }
    .r-score {
      font-size: clamp(2rem, 7vw, 2.5rem);
      font-weight: 800;
      color: var(--p);
      margin: 12px 0;
    }
    .btn-act {
      background: var(--p);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: clamp(0.9rem, 3vw, 1rem);
      cursor: pointer;
      text-decoration: none;
      margin: 4px;
      display: inline-block;
    }
    .btn-out {
      background: white;
      color: var(--pd);
      border: 1.5px solid var(--p);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: clamp(0.9rem, 3vw, 1rem);
      text-decoration: none;
      margin: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="container">
  <div id="quiz-screen">
    <div class="header"><h1>حکمت‌سنج مزاج، ارکان و اخلاط</h1></div>
    <div class="stats">
      <span id="qc">پرسش ۱</span>
      <span id="sc">امتیاز: ۰</span>
    </div>
    <div class="prog"><div class="bar" id="pb"></div></div>
    <div class="qbox" id="qt">در حال بارگذاری...</div>
    <div class="grid" id="og"></div>
    <div class="fb" id="fb"></div>
    <div style="overflow:hidden;"><button class="btn-next" id="bn" onclick="nextQ()">پرسش بعدی</button></div>
  </div>

  <div class="result" id="res-screen">
    <h2>پایان آزمون حکمت‌سنجی</h2>
    <div class="r-score" id="fs">۰ / ۱۰۰</div>
    <p id="fe" style="color:#374151; font-size:1.05rem; line-height:1.6;"></p>
    <div style="margin-top:18px;">
      <button class="btn-act" onclick="restart()">آزمون مجدد</button>
      <a href="index.html" class="btn-out">بازگشت به پورتال</a>
    </div>
  </div>
</div>

<script>
const rawQuestions = [
  {q:"رکن آتش دارای کدام کیفیت است؟", c:"گرم و خشک", w:["گرم و تر","سرد و خشک","سرد و تر"], f:"آتش گرم و خشک و در بالاترین مرتبه لطافت است."},
  {q:"رکن هوا دارای چه کیفیتی است؟", c:"گرم و تر", w:["گرم و خشک","سرد و تر","سرد و خشک"], f:"هوا گرم و تر و دارای نفوذ و انتشار است."},
  {q:"کیفیت اصلی رکن آب چیست؟", c:"سرد و تر", w:["سرد و خشک","گرم و تر","گرم و خشک"], f:"آب سرد و تر و مایه انعطاف است."},
  {q:"سنگین‌ترین رکن پایدارکننده شکل چیست؟", c:"خاک (ارض)", w:["آب","هوا","آتش"], f:"خاک سرد و خشک و مایه ثبات و حفظ صورت است."},
  {q:"خلط دم (خون) معادل کدام کیفیت است؟", c:"گرم و تر", w:["گرم و خشک","سرد و خشک","سرد و تر"], f:"دم گرم و تر و مایه‌بخش تغذیه اندام‌هاست."},
  {q:"خلط صفرا چه کیفیتی دارد؟", c:"گرم و خشک", w:["گرم و تر","سرد و تر","سرد و خشک"], f:"صفرا گرم و خشک و لطیف‌کننده خون برای عروق باریک است."},
  {q:"خلط بلغم چه کیفیتی دارد؟", c:"سرد و تر", w:["گرم و تر","سرد و خشک","گرم و خشک"], f:"بلغم سرد و تر و مایع مفاصل و ذخیره غذایی است."},
  {q:"خلط سودا دارای کدام کیفیت است؟", c:"سرد و خشک", w:["سرد و تر","گرم و خشک","گرم و تر"], f:"سودا سرد و خشک و رسوب دهنده و مایه استحکام استخوان است."},
  {q:"مزاج فصل بهار چیست؟", c:"معتدل مایل به گرم و تر", w:["گرم و خشک","سرد و خشک","سرد و تر"], f:"بهار معتدل و شبیه مزاج خلط دم است."},
  {q:"مزاج فصل تابستان چیست؟", c:"گرم و خشک", w:["گرم و تر","سرد و تر","سرد و خشک"], f:"تابستان گرم و خشک (صفراوی) است."},
  {q:"مزاج فصل پاییز چیست؟", c:"سرد و خشک", w:["سرد و تر","گرم و خشک","گرم و تر"], f:"پاییز سرد و خشک (سوداوی) است."},
  {q:"مزاج فصل زمستان چیست؟", c:"سرد و تر", w:["سرد و خشک","گرم و تر","گرم و خشک"], f:"زمستان سرد و تر (بلغم‌زا) است."},
  {q:"مزاج دوران جوانی چیست؟", c:"گرم و خشک", w:["گرم و تر","سرد و تر","سرد و خشک"], f:"جوانی دوره غلبه حرارت و خشکی (صفرا) است."},
  {q:"مزاج سن رشد و کودکی چیست؟", c:"گرم و تر", w:["گرم و خشک","سرد و خشک","سرد و تر"], f:"کودکی اوج رطوبت و حرارت غریزی است."},
  {q:"سن کهولت و پیری به کدام سمت می‌رود؟", c:"سرد و خشک", w:["گرم و تر","گرم و خشک","سرد و تر"], f:"پیری دوران افول حرارت غریزی و غلبه سردی و خشکی است."},
  {q:"مزه ترش چه طبعی دارد؟", c:"سرد و خشک", w:["گرم و خشک","سرد و تر","گرم و تر"], f:"ترشی قابض و سرد و خشک است."},
  {q:"مزه تند (حریف) نشانه چیست؟", c:"گرم و خشک شدید", w:["سرد و خشک","سرد و تر","گرم و تر"], f:"تندی اوج حرارت و خشکی است."},
  {q:"مزه شیرین عموماً دلالت بر چیست؟", c:"گرم و تر", w:["سرد و خشک","سرد و تر","گرم و خشک"], f:"شیرینی متمایل به اعتدال و گرمی و تری است."},
  {q:"طعم تلخ چه کیفیتی دارد؟", c:"گرم و خشک", w:["سرد و تر","سرد و خشک","گرم و تر"], f:"تلخی گرم و خشک و زداینده فضولات است."},
  {q:"مزه بی‌مزه (تفه) علامت چیست؟", c:"سرد و تر", w:["گرم و خشک","سرد و خشک","گرم و تر"], f:"بی‌مزگی ناشی از غلبه بلغم و رطوبت است."},
  {q:"منشأ اصلی حرارت غریزی و روح حیوانی کدام عضو است؟", c:"قلب", w:["کبد","مغز","معده"], f:"قلب گرم‌ترین عضو و معدن روح حیوانی است."},
  {q:"محل تولید اخلاط چهارگانه کجاست؟", c:"کبد", w:["قلب","معده","طحال"], f:"کبد محل تبدیل کیموس معدی به اخلاط چهارگانه است."},
  {q:"مزاج طبیعی مغز برای ادراک چگونه است؟", c:"سرد و تر", w:["گرم و خشک","گرم و تر","سرد و خشک"], f:"مغز نیازمند رطوبت و انعطاف جهت پذیرش صور حسی است."},
  {q:"سرد و خشک‌ترین بافت بدن چیست؟", c:"استخوان", w:["چربی","عضله","پوست"], f:"استخوان به دلیل تراکم بالا، سرد و خشک‌ترین بافت است."},
  {q:"چربی بدن (شحم) چه طبعی دارد؟", c:"سرد و تر", w:["گرم و خشک","سرد و خشک","گرم و تر"], f:"چربی‌ها دارای برودت و رطوبت متراکم هستند."},
  {q:"نبض افراد دموی‌مزاج چگونه است؟", c:"عظیم، ممتلی و قوی", w:["صغیر و کند","باریک و سخت","نرم و بی‌رمق"], f:"نبض دموی پر، کشیده و قدرتمند است."},
  {q:"پوست صفراوی‌ها معمولاً چه رنگی است؟", c:"گرم، خشک و متمایل به زردی", w:["سرد و سفید","سرد و تیره","گلگون و مرطوب"], f:"صفراوی‌ها رنگ زرد کهربایی و پوست گرم دارند."},
  {q:"کسالت صبحگاهی و پرخوابی نشانه غلبه کدام خلط است؟", c:"بلغم", w:["صفرا","سودا","دم"], f:"رطوبت و سردی بلغم موجب سنگینی و خواب زیاد می‌شود."},
  {q:"وسواس فکری و دیر به خواب رفتن علامت چیست؟", c:"غلبه سودا", w:["غلبه بلغم","غلبه دم","اعتدال مزاج"], f:"خشکی و برودت سودا فکر را آشفته و خواب را کم می‌کند."},
  {q:"تلخی دهان صبحگاهی و تشنگی شدید علامت چیست؟", c:"غلبه صفرا", w:["غلبه بلغم","غلبه سودا","ضعف هاضمه"], f:"حرارت و خشکی صفرا سبب تلخی و عطش مفرط است."},
  {q:"سنگینی سر و خمیازه مکرر نشانه چیست؟", c:"غلبه دم", w:["غلبه سودا","غلبه صفرا","غلبه رطوبت"], f:"امتلاء خون باعث سنگینی سر و کشیدگی بدن می‌شود."},
  {q:"کدام حبوبات سرد و خشک است؟", c:"عدس", w:["نخود","لوبیا","باقلا"], f:"عدس قابض و سودازاست."},
  {q:"طبیعت نخود چیست؟", c:"گرم و تر", w:["سرد و تر","سرد و خشک","گرم و خشک"], f:"نخود خون‌ساز عالی و گرم و تر است."},
  {q:"زنجبیل دارای چه طبعی است؟", c:"گرم و خشک", w:["سرد و خشک","سرد و تر","گرم و تر"], f:"زنجبیل هاضم و مقوی معده سرد است."},
  {q:"کاسنی چه طبع و اثری دارد؟", c:"سرد و تر - تعدیل کبد", w:["گرم و خشک","سرد و خشک","گرم و تر"], f:"کاسنی مفتح و خنک‌کننده کبد است."},
  {q:"ماست تازه چه کیفیتی دارد؟", c:"سرد و تر", w:["گرم و خشک","گرم و تر","سرد و خشک"], f:"ماست سرد و تر است و مصلح آن نعناع و پونه است."},
  {q:"مصلح غذایی چیست؟", c:"تعدیل‌کننده عوارض و اصلاح‌کننده هضم", w:["طعم‌دهنده صرف","داروی مسهل","غذای مکمل"], f:"مصلح، تیزی و افراط طبع غذا را تعدیل می‌کند."},
  {q:"مصلح ماهی چیست؟", c:"خرما و گردو", w:["ماست","دوغ","آبغوره"], f:"ماهی سرد و تر است و با گرمیجات اصلاح می‌شود."},
  {q:"گوشت گوسفند دارای چه طبعی است؟", c:"گرم و تر", w:["سرد و خشک","سرد و تر","گرم و خشک"], f:"گوشت گوسفندی صالح‌ترین گوشت با طبع گرم و تر است."},
  {q:"گوشت گاو چه ویژگی مزاجی دارد؟", c:"سرد و خشک و غلیظ", w:["گرم و تر و لطیف","گرم و خشک","معتدل زود هضم"], f:"گوشت گاو دیرهضم و سودازاست."},
  {q:"عسل طبیعی چه کیفیتی دارد؟", c:"گرم و خشک", w:["سرد و تر","سرد و خشک","معتدل"], f:"عسل جلادهنده و زداینده بلغم لزج است."},
  {q:"هندوانه دارای چه طبعی است؟", c:"سرد و تر", w:["گرم و خشک","گرم و تر","سرد و خشک"], f:"هندوانه برودت‌زا و تسکین‌دهنده عطش است."},
  {q:"خرما دارای چه طبعی است؟", c:"گرم و تر", w:["سرد و تر","سرد و خشک","سرد"], f:"خرما انرژی‌بخش و گرم و تر است."},
  {q:"انگور رسیده شیرین چه طبعی دارد؟", c:"گرم و تر", w:["سرد و خشک","سرد و تر","گرم و خشک"], f:"انگور غذای مطلق و خونساز است."},
  {q:"لیموترش چه طبعی دارد؟", c:"سرد و خشک", w:["گرم و تر","گرم و خشک","سرد و تر"], f:"لیموترش قاطع صفرا و حرارت است."},
  {q:"سرکه انگور طبیعی چه طبعی دارد؟", c:"سرد و خشک", w:["گرم و تر","سرد و تر","گرم"], f:"سرکه نفوذکننده و سرد و خشک است."},
  {q:"سکنجبین از ترکیب چه چیزهایی ساخته می‌شود؟", c:"سرکه و عسل (یا شکر)", w:["روغن و ماست","نمک و فلفل","شیره و آرد"], f:"سکنجبین ترکیبی معتدل از سرکه و عسل است."},
  {q:"آب یخ ناشتا چه آسیبی به کبد می‌زند؟", c:"ایجاد کبد چرب و شوک برودتی", w:["تقویت هضم","تصفیه صفرا","افزایش اشتها"], f:"آب یخ ناگهان کبد گرم را سرد و مسدود می‌کند."},
  {q:"سته ضروریه یعنی چه؟", c:"شش اصل ضروری برای حفظ سلامت", w:["شش داروی ترکیبی","شش عضو بدن","شش طعم غذا"], f:"هوا، غذا، حرکت، خواب، استفراغ و حالات روحی شش اصل هستند."},
  {q:"سریع‌ترین اثر روحی بر مزاج مربوط به کدام است؟", c:"اعراض نفسانی (شادی، خشم و...)", w:["تغییر فصل","ورزش","نوع خواب"], f:"حالات روحی فوراً حرارت غریزی را جابجا می‌کنند."},
  {q:"ورزش معتدل چه کمکی به بدن می‌کند؟", c:"تقویت حرارت غریزی و دفع سموم", w:["سرد کردن اندام‌ها","تخریب عضلات","تولید خلط فاسد"], f:"ورزش چراغ حرارت غریزی را روشن نگه می‌دارد."},
  {q:"خواب روز و هنگام غروب چه عارضه‌ای دارد؟", c:"ازدیاد بلغم و تباهی چهره", w:["تقویت حافظه","کاهش صفرا","تقویت گوارش"], f:"خواب غروب موجب خمودگی و فساد هضم است."},
  {q:"تعریق و ادرار جزء کدام اصل سته ضروریه است؟", c:"استفراغ و احتباس", w:["اعراض نفسانی","ماکول و مشروب","حرکت و سکون"], f:"خروج مواد زاید از اصول استفراغ است."},
  {q:"مزاج جبلی چیست؟", c:"مزاج سرشتی و مادرزادی اولیه", w:["مزاج بیمار موقت","مزاجی که روزانه عوض شود","مزاج ناشی از دارو"], f:"مزاج جبلی سرشت پایه و اصلی هر فرد است."},

  {q:"حجامت برای تعدیل کدام خلط کاربرد دارد؟", c:"تعدیل دم و کاهش حرارت", w:["دفع سودای عمقی","رفع بلغم سفت","کاهش وزن"], f:"حجامت حرارت و غلیان خون را کاهش می‌دهد."},

  {q:"بهترین زمان صرف غذا چیست؟", c:"هنگام اشتهای واقعی پس از تخلیه وعده قبل", w:["سر ساعت بدون میل","هر وقت در دسترس بود","روزی یک بار"], f:"ورود غذا روی غذای هضم‌نشده سبب فساد کیموس است."},
  {q:"آب خنک زدن به پا پس از حمام چه فایده‌ای دارد؟", c:"بستن منافذ و حفظ حرارت غریزی", w:["ایجاد سرماخوردگی","سرد شدن استخوان","تولید بلغم"], f:"آب خنک منافذ را منقبض و حرارت را درون بدن نگه می‌دارد."},
  {q:"بوییدن گل‌های معطر گرم چه تاثیری دارد؟", c:"تقویت روح نفسانی و رفع خمودگی مغز", w:["سردرد حتمی","کاهش حافظه","تولید عفونت"], f:"روایح گرم مغز سرد را سرحال می‌کنند."},
  {q:"مصلح سردی گوشت گاو چیست؟", c:"سیر، دارچین و زنجبیل", w:["ماست","دوغ","خیار"], f:"ادویه‌های گرم سنگینی گوشت گاو را مهار می‌کنند."},
  {q:"انار شیرین چه طبعی دارد؟", c:"معتدل مایل به سردی و تری", w:["گرم و خشک","سرد و خشک","بسیار گرم"], f:"انار شیرین مصفای کبد و خونساز است."},
  {q:"نوشیدن آب بین لقمه‌های غذا چه ضرری دارد؟", c:"رقیق شدن شیره هاضمه و خام ماندن هضم", w:["تسریع هضم","جلوگیری از رفلاکس","تقویت معده"], f:"آب وسط غذا حرارت هضم را خاموش می‌کند."},
  {q:"آویشن چه اثری بر معده دارد؟", c:"تقویت هاضمه و دفع لزوجات", w:["شل کردن معده","سودازایی","زخم سرد"], f:"آویشن گرم و خشک و تقویت‌کننده معده است."},
  {q:"خاکشیر با آب جوش چه اثری دارد؟", c:"ملین و بازکننده روده‌ها", w:["قابض شدید","سردکننده کبد","سنگ‌ساز"], f:"خاکشیر با آب گرم ملین است."},
  {q:"زردچوبه دارای چه خاصیتی است؟", c:"گرم و خشک و مفتح سدد کبد", w:["سرد و تر","سرد و خشک","خنک‌کننده"], f:"زردچوبه بازکننده گرفتگی‌های کبدی است."},
  {q:"خوردن شام سنگین نزدیک خواب چه عارضه‌ای دارد؟", c:"کابوس، بوی بد دهان و سنگینی سر", w:["خواب راحت","تقویت قلب","افزایش هوش"], f:"صعود بخارات خام هضم‌نشده خواب را آشفته می‌کند."},
  {q:"علامت اعتدال اخلاط چیست؟", c:"رنگ گلگون، خواب معتدل و نشاط", w:["بی‌خوابی زیاد","سفیدی بی‌رمق","زردی چشم"], f:"سلامت نشانه توازن چهار خلط است."},
  {q:"کیموس معدی چیست؟", c:"غذای هضم‌شده در معده برای کبد", w:["خون خالص","صفرا","فضله روده"], f:"کیموس حاصل هضم اول است."},
  {q:"هضم چهارگانه به ترتیب در کجاست؟", c:"معده، کبد، عروق، بافت‌ها", w:["کبد، معده، روده، کلیه","دهان، قلب، ریه، مغز","روده، پوست، مو، استخوان"], f:"چهار مرتبه هضم در این اندام‌ها تکمیل می‌شود."},
  {q:"هدف غایی مزاج‌شناسی چیست؟", c:"حفظ تندرستی با سبک زندگی درست", w:["دارو درمانی بی‌رویه","رنگ‌شناسی صرف","محرومیت از غذاها"], f:"هدف حفظ تعادل فطری و پیشگیری است."},
  {q:"قاعده کلی درمان غلبه خلط چیست؟", c:"علاج به ضد کیفیت غالب", w:["علاج به مثل","قطع آب و غذا","سکون مطلق"], f:"اصلاح مزاج با کیفیت متضاد انجام می‌شود."},
  {q:"حکمت طبیعی چه رابطه‌ای با سلامت دارد؟", c:"انسان را جزئی هماهنگ با عالم آفرینش می‌داند", w:["علمی بی‌ارتباط به جهان","تنها متکی بر داروهای شیمیایی","محدود به تجربیات فردی"], f:"قوانین حاکم بر طبیعت بدن با ارکان عالم پیوند دارد."}
];

let questions = [];
let idx = 0, score = 0, ans = false;

function buildQuestions() {
  questions = rawQuestions.map(item => {
    let opts = [item.c, ...item.w];
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    return {
      q: item.q,
      o: opts,
      a: opts.indexOf(item.c),
      f: item.f
    };
  });
}

function render() {
  ans = false;
  const cur = questions[idx];
  document.getElementById("qc").innerText = "پرسش " + (idx + 1) + " از " + questions.length;
  document.getElementById("sc").innerText = "امتیاز: " + score;
  document.getElementById("pb").style.width = ((idx) / questions.length * 100) + "%";
  document.getElementById("qt").innerText = (idx + 1) + ". " + cur.q;
  
  const og = document.getElementById("og");
  og.innerHTML = "";
  const fb = document.getElementById("fb");
  fb.className = "fb";
  fb.style.display = "none";
  document.getElementById("bn").style.display = "none";

  cur.o.forEach((txt, i) => {
    const btn = document.createElement("button");
    btn.className = "btn-opt";
    btn.innerText = txt;
    btn.onclick = () => select(i);
    og.appendChild(btn);
  });
}

function select(sel) {
  if (ans) return;
  ans = true;
  const cur = questions[idx];
  const btns = document.querySelectorAll(".btn-opt");
  const fb = document.getElementById("fb");
  
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === cur.a) b.classList.add("correct");
  });

  if (sel === cur.a) {
    score++;
    fb.className = "fb correct";
    fb.innerText = "✓ پاسخ صحیح است! " + cur.f;
  } else {
    btns[sel].classList.add("wrong");
    fb.className = "fb wrong";
    fb.innerText = "✗ نادرست! " + cur.f;
  }
  fb.style.display = "block";
  document.getElementById("sc").innerText = "امتیاز: " + score;
  document.getElementById("bn").style.display = "inline-block";
}

function nextQ() {
  idx++;
  if (idx < questions.length) render();
  else showEnd();
}

function showEnd() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("res-screen").style.display = "block";
  document.getElementById("fs").innerText = score + " / " + questions.length;
  let p = (score / questions.length) * 100;
  let desc = p >= 85 ? "عالی! تسلط کامل و عمیقی بر مبانی مزاج و ارکان دارید." : (p >= 60 ? "خوب! دانش پایه‌ای مناسبی دارید؛ با مرور بیشتر استاد خواهید شد." : "نیاز به مطالعه بیشتر مبانی سته ضروریه و اخلاط.");
  document.getElementById("fe").innerText = desc;
}

function restart() {
  idx = 0; score = 0;
  buildQuestions();
  document.getElementById("res-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  render();
}

buildQuestions();
window.onload = render;
if (document.readyState === "complete" || document.readyState === "interactive") render();
</script>
