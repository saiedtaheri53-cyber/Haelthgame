
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون جامع امزاج چهارگانه و اخلاط | بازی سلامت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #2d5a27;
            --primary-light: #4c8c40;
            --accent: #d4a373;
            --bg-page: #f4f1ea;
            --bg-card: #ffffff;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
            --correct: #2e7d32;
            --correct-bg: #e8f5e9;
            --wrong: #c62828;
            --wrong-bg: #ffebee;
            --border-radius: 16px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--bg-card);
            max-width: 750px;
            width: 100%;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border-top: 6px solid var(--primary);
            position: relative;
        }

        header {
            text-align: center;
            border-bottom: 2px dashed #e0e0e0;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #faf8f5;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-light);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.7;
            margin-bottom: 20px;
            color: #1f2937;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #fdfdfd;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct) !important;
            color: var(--correct) !important;
            font-weight: 700;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong) !important;
            color: var(--wrong) !important;
            font-weight: 700;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-correct {
            background: var(--correct-bg);
            border-right: 4px solid var(--correct);
            color: var(--correct);
        }

        .feedback-wrong {
            background: var(--wrong-bg);
            border-right: 4px solid var(--wrong);
            color: var(--wrong);
        }

        .action-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-secondary {
            background: #e9ecef;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 15px 0;
        }

        .result-msg {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .question-text {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <header>
            <h1>حکمت‌سنج امزاج، ارکان و اخلاط</h1>
            <p class="subtitle">سلسله بازی‌های سلامت و طب سنتی | ۱۰۰ پرسش جامع</p>
        </header>

        <div class="hud">
            <div>پرسش: <span id="current-q">۱</span> از <span id="total-q">۱۰۰</span></div>
            <div>امتیاز: <span id="score">۰</span></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-box">
            <div class="question-text" id="question-text">در حال بارگذاری پرسش...</div>
            <div class="options-grid" id="options-grid"></div>
        </div>

        <div class="feedback-box" id="feedback-box"></div>

        <div class="action-container">
            <a href="index.html" class="btn btn-secondary">بازگشت به خانه</a>
            <button id="next-btn" class="btn btn-primary" style="display: none;" onclick="nextQuestion()">پرسش بعدی</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <header>
            <h1>پایان آزمون امزاج و اخلاط</h1>
        </header>
        <div class="result-score" id="final-score">۰ / ۱۰۰</div>
        <div class="result-msg" id="final-msg"></div>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-primary" onclick="restartQuiz()">شروع مجدد</button>
            <a href="index.html" class="btn btn-secondary">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</div>

<script>
const QUESTIONS = [
    { q: "کیفیت اصلی مزاج دم (خون) چیست؟", options: ["گرم و تر", "گرم و خشک", "سرد و تر", "سرد و خشک"], ans: 0, exp: "دم دارای کیفیت گرم و تر بوده و متناظر با عنصر هوا است." },
    { q: "کدام عنصر متناظر با خلط صفرا است؟", options: ["آب", "آتش", "خاک", "هوا"], ans: 1, exp: "صفرا متناظر با عنصر آتش و دارای کیفیت گرم و خشک است." },
    { q: "طعم غالب خلط سودا در حالت طبیعی چیست؟", options: ["شیرین", "تلخ", "ترش و گس", "شور"], ans: 2, exp: "سودای طبیعی دارای طعم گس و مایل به ترشی است." },
    { q: "جایگاه اصلی ذخیره و مدیریت خلط صفرا در بدن کدام عضو است؟", options: ["کیسه صفرا (مراره)", "طحال (سپرز)", "کبد", "کلیه"], ans: 0, exp: "کیسه صفرا محل ذخیره و ترشح خلط صفرا است." },
    { q: "کیفیت کدام خلط «سرد و تر» است؟", options: ["سودا", "صفرا", "بلغم", "دم"], ans: 2, exp: "بلغم طبیعی کیفیتی سرد و تر دارد و معادل عنصر آب است." },
    { q: "طحال (سپرز) جایگاه اصلی تجمع و تعدیل کدام خلط است؟", options: ["دم", "بلغم", "صفرا", "سودا"], ans: 3, exp: "طحال محل تجمع و تصفیهٔ خلط سودا محسوب می‌شود." },
    { q: "سنگین‌ترین و متراکم‌ترین عنصر در میان ارکان چهارگانه چیست؟", options: ["آب", "خاک", "هوا", "آتش"], ans: 1, exp: "خاک سنگین‌ترین و متراکم‌ترین رکن از ارکان اربعه است." },
    { q: "فصل متناظر با غلبهٔ خلط صفرا کدام است؟", options: ["بهار", "تابستان", "پاییز", "زمستان"], ans: 1, exp: "تابستان به دلیل حرارت و خشکی با خلط صفرا تناسب دارد." },
    { q: "رنگ ادرار در فردی با غلبهٔ صفرا معمولاً به چه صورت است؟", options: ["سفید و شفاف", "زرد مایل به سرخ و پررنگ", "تیره و کدر", "کمرنگ و شیری"], ans: 1, exp: "غلبه صفرا ادرار را زرد تند، نارنجی یا ناری می‌سازد." },
    { q: "سبک‌ترین عنصر در میان ارکان چهارگانه کدام است؟", options: ["هوا", "آتش", "آب", "خاک"], ans: 1, exp: "آتش به علت گرمی و لطافت، سبک‌ترین رکن است." },
    { q: "کدام عضو در بدن به عنوان «مطبخ اخلاط» شناخته می‌شود؟", options: ["معده", "کبد", "قلب", "روده"], ans: 1, exp: "کبد محل هضم دوم و تولید اخلاط چهارگانه است." },
    { q: "کیفیت فصل پاییز از نظر طب سنتی چیست؟", options: ["سرد و خشک", "گرم و خشک", "سرد و تر", "گرم و تر"], ans: 0, exp: "فصل پاییز دارای کیفیت سرد و خشک و محرک سودا است." },
    { q: "رکن متناظر با خلط دم (خون) چیست؟", options: ["آتش", "هوا", "آب", "خاک"], ans: 1, exp: "خلط دم متناظر با رکن هوا بوده و دارای حرارت و رطوبت است." },
    { q: "نبض افراد دموی‌مزاج معمولاً چگونه است؟", options: ["ضعیف و کند", "ممتلی، عریض و پر", "باریک و سخت", "سریع و کوتاه"], ans: 1, exp: "نبض دموی‌ها قوی، پرحجم و دارای تواتر مناسب است." },
    { q: "کدام خلط سبک‌تر و لطیف‌تر از سایر اخلاط است؟", options: ["دم", "صفرا", "بلغم", "سودا"], ans: 1, exp: "صفرا به دلیل داشتن حرارت بالا، لطیف‌ترین خلط است." },
    { q: "غلبهٔ کدام خلط موجب وسواس فکری، کابوس و تیرگی رنگ چهره می‌شود؟", options: ["سودا", "بلغم", "صفرا", "دم"], ans: 0, exp: "غلبه سودا موجب افکار منفی، وسواس و تیرگی پوست می‌گردد." },
    { q: "کدام فصل مزاج گرم و تر دارد و محرک خلط دم است؟", options: ["پاییز", "زمستان", "بهار", "تابستان"], ans: 2, exp: "فصل بهار معتدل در حرارت و رطوبت و سازگار با خلط دم است." },
    { q: "در صورت مصرف بیش از حد ترشیجات، کدام خلط تحریک می‌شود؟", options: ["صفرا", "سودا", "دم", "بلغم و سودا"], ans: 3, exp: "ترشیجات طبع سرد داشته و سودا و بلغم را افزایش می‌دهند." },
    { q: "خواب زیاد، سنگینی سر و کندی حواس از علائم غلبهٔ کدام خلط است؟", options: ["صفرا", "سودا", "بلغم", "دم"], ans: 2, exp: "بلغم به خاطر برودت و رطوبت، سنگینی و خواب‌آلودگی می‌آورد." },
    { q: "مزاج ذاتی قلب از نظر طب سنتی چیست؟", options: ["گرم و تر", "گرم و خشک", "سرد و تر", "سرد و خشک"], ans: 1, exp: "قلب منبع حرارت غریزی بوده و مزاج ذاتی آن گرم و خشک است." },
    { q: "مزاج استخوان‌ها در ساختار بدن چیست؟", options: ["سرد و خشک", "سرد و تر", "گرم و تر", "گرم و خشک"], ans: 0, exp: "استخوان‌ها سخت‌ترین بافت بوده و طبع سرد و خشک دارند." },
    { q: "کدام گیاه مصلح گوشت گاو (که طبع سرد و خشک دارد) محسوب می‌شود؟", options: ["سیر، دارچین و زعفران", "خیار و گشنیز", "کاهو", "سرکه"], ans: 0, exp: "ادویه‌های گرم مانند سیر و دارچین مصلح گوشت گاو هستند." },
    { q: "سن نوجوانی تا ۳۵ سالگی (سن شباب) متناظر با غلبهٔ طبیعی کدام خلط است؟", options: ["دم", "صفرا", "سودا", "بلغم"], ans: 1, exp: "دوره جوانی دوره اوج حرارت و غلبه صفرا است." },
    { q: "مزه دهان هنگام صبح در فرد مبتلا به غلبه صفرا چگونه است؟", options: ["ترش", "شیرین", "تلخ", "بی‌مزه"], ans: 2, exp: "تلخی دهان صبحگاهی از علائم شاخص غلبه صفراست." },
    { q: "کدام خلط برای تغذیهٔ استخوان‌ها و تقویت حافظه ضروری است؟", options: ["صفرا", "بلغم", "سودای طبیعی", "دم"], ans: 2, exp: "سودای طبیعی برای استحکام بافت‌ها و استخوان‌ها به کار می‌رود." },
    { q: "کدامیک از امزاج به افراد جسور، فعال، کم‌خواب و با حرارت بالا معروف‌اند؟", options: ["بلغمی", "صفراوی", "سوداوی", "دموی"], ans: 1, exp: "صفراوی‌مزاج‌ها بسیار پرتحرک، کم‌خواب و زودخشم هستند." },
    { q: "مزاج ذاتی مغز در طب سنتی چیست؟", options: ["گرم و تر", "گرم و خشک", "سرد و تر", "سرد و خشک"], ans: 2, exp: "مغز برای حفظ انعطاف و ثبت اطلاعات دارای مزاج سرد و تر است." },
    { q: "غلبهٔ کدام خلط موجب احساس کشیدگی پوست، خشکی چشم و کم‌خوابی مفرط می‌شود؟", options: ["سودا", "بلغم", "دم", "صفرا و سودا"], ans: 3, exp: "خشکی ناشی از غلبه صفرا و سودا این عوارض را به همراه دارد." },
    { q: "مصلح ماست و لبنیات در طب سنتی کدام است؟", options: ["سرکه", "نعناع، پونه و زنیان", "آبغوره", "خیار"], ans: 1, exp: "نعناع و پونه به دلیل گرمی و خشکی مصلح برودت ماست هستند." },
    { q: "رنگ زبان به صورت سفید و باردار، نشان‌دهندهٔ چیست؟", options: ["غلبه دم", "غلبه بلغم", "غلبه صفرا", "غلبه سودا"], ans: 1, exp: "سفیدی زبان نشانه رطوبت و سردی ناشی از بلغم است." },
    { q: "سودای سوخته (سودای غیرطبیعی ناشی از احتراق صفرا) چه نام دارد؟", options: ["سودای دموی", "سودای صفراوی (محترقه)", "بلغم مالح", "خلط خام"], ans: 1, exp: "احتراق صفرا سودای تند و تیز احتراقی می‌سازد." },
    { q: "حس بینایی و بویایی تیزتر معمولاً در کدام مزاج بارزتر است؟", options: ["صفراوی", "بلغمی", "سوداوی", "دموی"], ans: 0, exp: "حرارت و لطافت صفرا حواس را تیز و حساس‌تر می‌کند." },
    { q: "فصل زمستان با کدام خلط هماهنگی و هم‌مزاجی دارد؟", options: ["دم", "صفرا", "بلغم", "سودا"], ans: 2, exp: "زمستان فصل سرما و رطوبت و فصل تجمع خلط بلغم است." },
    { q: "کدام عضو بالاترین حرارت غریزی را در بدن داراست؟", options: ["کبد", "قلب", "معده", "کلیه"], ans: 1, exp: "قلب کانون اصلی حرارت غریزی و حیات است." },
    { q: "ورزش ملایم و متناسب چه اثری بر اخلاط بدن دارد؟", options: ["تولید بلغم", "افزایش حرارت غریزی و دفع فضولات", "تولید سودای غیرطبیعی", "تضعیف کبد"], ans: 1, exp: "ورزش معتدل موجب برافروختن حرارت غریزی و پاکسازی سموم می‌شود." },
    { q: "سکنجبین سنتی ترکیب کدام موارد است؟", options: ["سرکه و عسل/شکر", "آب انار و نمک", "گلاب و بیدمشک", "شیره انگور و روغن بادام"], ans: 0, exp: "سکنجبین از ترکیب سرکه (سرد) و عسل/شکر (گرم) ساخته می‌شود." },
    { q: "کدام خلط به عنوان روان‌کننده مفاصل و رطوبت‌بخش احشا عمل می‌کند؟", options: ["دم", "بلغم طبیعی", "صفرا", "سودا"], ans: 1, exp: "بلغم طبیعی مفاصل را نرم کرده و مانع خشکی اعضا می‌شود." },
    { q: "مزاج ذاتی کبد انسان چیست؟", options: ["گرم و تر", "سرد و تر", "گرم و خشک", "سرد و خشک"], ans: 0, exp: "کبد کارخانه خون‌سازی بوده و مزاج ذاتی آن گرم و تر است." },
    { q: "لعاب اسفرزه و بارهنگ برای تعدیل کدام حالت مفید است؟", options: ["سردی و تری معده", "حرارت و خشکی بیش از حد", "تولید بلغم", "رفع رطوبت"], ans: 1, exp: "دانه‌های لعاب‌دار رطوبت‌بخش و خنک‌کنندهٔ حرارت و خشکی هستند." },
    { q: "کدامیک از علائم مشخصهٔ دموی‌مزاج‌ها نیست؟", options: ["پوست سرخ و سفید", "احساس سنگینی و رخوت بهاره", "لاغری مفرط و پوست خشک", "خونریزی آسان لثه و بینی"], ans: 2, exp: "لاغری مفرط و پوست خشک ویژگی سوداوی‌ها و صفراوی‌هاست." },
