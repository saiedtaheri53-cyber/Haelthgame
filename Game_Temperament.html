<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حکمت‌سنج مزاج، ارکان و اخلاط</title>
  <style>
    :root { --p: #15803d; --pd: #166534; --bg: #f4fbf7; --card: #ffffff; --c: #16a34a; --w: #dc2626; }
    * { box-sizing: border-box; font-family: system-ui, Tahoma, sans-serif; }
    body { margin: 0; padding: 16px; background: var(--bg); color: #1f2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: var(--card); border-radius: 16px; padding: 22px; width: 100%; max-width: 650px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid #dcfce7; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 1.3rem; color: var(--pd); margin: 0; }
    .stats { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; background: #f0fdf4; padding: 8px 14px; border-radius: 8px; color: #374151; }
    .prog { background: #e5e7eb; height: 8px; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
    .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #15803d); transition: 0.3s; }
    .qbox { font-size: 1.1rem; font-weight: bold; line-height: 1.6; margin-bottom: 18px; color: #111827; }
    .grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .btn-opt { background: #fff; border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; text-align: right; cursor: pointer; font-weight: 600; color: #374151; }
    .btn-opt:hover:not([disabled]) { border-color: var(--p); background: #f0fdf4; }
    .btn-opt.correct { background: #dcfce7 !important; border-color: var(--c) !important; color: #14532d !important; }
    .btn-opt.wrong { background: #fee2e2 !important; border-color: var(--w) !important; color: #7f1d1d !important; }
    .fb { display: none; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 14px; line-height: 1.5; }
    .fb.correct { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .fb.wrong { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .btn-next { background: var(--p); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; display: none; float: left; }
    .result { display: none; text-align: center; padding: 20px 10px; }
    .r-score { font-size: 2.2rem; font-weight: 800; color: var(--p); margin: 12px 0; }
    .btn-act { background: var(--p); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; margin: 5px; display: inline-block; }
    .btn-out { background: white; color: var(--pd); border: 2px solid var(--p); padding: 8px 16px; border-radius: 8px; font-weight: bold; text-decoration: none; margin: 5px; display: inline-block; }
  </style>
</head>
<body>
<div class="container">
  <div id="quiz-screen">
    <div class="header"><h1>حکمت‌سنج مزاج، ارکان و اخلاط</h1></div>
    <div class="stats"><span id="qc">پرسش ۱</span><span id="sc">امتیاز: ۰</span></div>
    <div class="prog"><div class="bar" id="pb"></div></div>
    <div class="qbox" id="qt">در حال آماده‌سازی...</div>
    <div class="grid" id="og"></div>
    <div class="fb" id="fb"></div>
    <div style="overflow:hidden;"><button class="btn-next" id="bn" onclick="nextQ()">پرسش بعدی</button></div>
  </div>

  <div class="result" id="res-screen">
    <h2>پایان آزمون حکمت‌سنجی</h2>
    <div class="r-score" id="fs">۰ / ۱۰۰</div>
    <p id="fe" style="color:#4b5563; line-height:1.6;"></p>
    <div style="margin-top:20px;">
      <button class="btn-act" onclick="restart()">آزمون مجدد</button>
      <a href="index.html" class="btn-out">بازگشت به پورتال</a>
    </div>
  </div>
</div>

<script>
const Q = [
  {q:"رکن آتش دارای کدام کیفیت است؟", o:["گرم و خشک","گرم و تر","سرد و خشک","سرد و تر"], a:0, f:"آتش گرم و خشک و در بالاترین مرتبه لطافت است."},
  {q:"رکن هوا دارای چه کیفیتی است؟", o:["گرم و تر","گرم و خشک","سرد و تر","سرد و خشک"], a:0, f:"هوا گرم و تر و دارای نفوذ و انتشار است."},
  {q:"کیفیت اصلی رکن آب چیست؟", o:["سرد و تر","سرد و خشک","گرم و تر","گرم و خشک"], a:0, f:"آب سرد و تر و مایه انعطاف است."},
  {q:"سنگین‌ترین رکن پایدارکننده شکل چیست؟", o:["خاک (ارض)","آب","هوا","آتش"], a:0, f:"خاک سرد و خشک و مایه ثبات و حفظ صورت است."},
  {q:"خلط دم (خون) معادل کدام کیفیت است؟", o:["گرم و تر","گرم و خشک","سرد و خشک","سرد و تر"], a:0, f:"دم گرم و تر و مایه‌بخش تغذیه اندام‌هاست."},
  {q:"خلط صفرا چه کیفیتی دارد؟", o:["گرم و خشک","گرم و تر","سرد و تر","سرد و خشک"], a:0, f:"صفرا گرم و خشک و لطیف‌کننده خون برای عروق باریک است."},
  {q:"خلط بلغم چه کیفیتی دارد؟", o:["سرد و تر","گرم و تر","سرد و خشک","گرم و خشک"], a:0, f:"بلغم سرد و تر و مایع مفاصل و ذخیره غذایی است."},
  {q:"خلط سودا دارای کدام کیفیت است؟", o:["سرد و خشک","سرد و تر","گرم و خشک","گرم و تر"], a:0, f:"سودا سرد و خشک و رسوب دهنده و مایه استحکام استخوان است."},
  {q:"مزاج فصل بهار چیست؟", o:["معتدل مایل به گرم و تر","گرم و خشک","سرد و خشک","سرد و تر"], a:0, f:"بهار معتدل و شبیه مزاج خلط دم است."},
  {q:"مزاج فصل تابستان چیست؟", o:["گرم و خشک","گرم و تر","سرد و تر","سرد و خشک"], a:0, f:"تابستان گرم و خشک (صفراوی) است."},
  {q:"مزاج فصل پاییز چیست؟", o:["سرد و خشک","سرد و تر","گرم و خشک","گرم و تر"], a:0, f:"پاییز سرد و خشک (سوداوی) است."},
  {q:"مزاج فصل زمستان چیست؟", o:["سرد و تر","سرد و خشک","گرم و تر","گرم و خشک"], a:0, f:"زمستان سرد و تر (بلغم‌زا) است."},
  {q:"مزاج دوران جوانی چیست؟", o:["گرم و خشک","گرم و تر","سرد و تر","سرد و خشک"], a:0, f:"جوانی دوره غلبه حرارت و خشکی (صفرا) است."},
  {q:"مزاج سن رشد و کودکی چیست؟", o:["گرم و تر","گرم و خشک","سرد و خشک","سرد و تر"], a:0, f:"کودکی اوج رطوبت و حرارت غریزی است."},
  {q:"سن کهولت و پیری به کدام سمت می‌رود؟", o:["سرد و خشک","گرم و تر","گرم و خشک","سرد و تر"], a:0, f:"پیری دوران افول حرارت غریزی و غلبه سردی و خشکی است."},
  {q:"مزه ترش چه طبعی دارد؟", o:["سرد و خشک","گرم و خشک","سرد و تر","گرم و تر"], a:0, f:"ترشی قابض و سرد و خشک است."},
  {q:"مزه تند (حریف) نشانه چیست؟", o:["گرم و خشک شدید","سرد و خشک","سرد و تر","گرم و تر"], a:0, f:"تندی اوج حرارت و خشکی است."},
  {q:"مزه شیرین عموماً دلالت بر چیست؟", o:["گرم و تر","سرد و خشک","سرد و تر","گرم و خشک"], a:0, f:"شیرینی متمایل به اعتدال و گرمی و تری است."},
  {q:"طعم تلخ چه کیفیتی دارد؟", o:["گرم و خشک","سرد و تر","سرد و خشک","گرم و تر"], a:0, f:"تلخی گرم و خشک و زداینده فضولات است."},
  {q:"مزه بی‌مزه (تفه) علامت چیست؟", o:["سرد و تر","گرم و خشک","سرد و خشک","گرم و تر"], a:0, f:"بی‌مزگی ناشی از غلبه بلغم و رطوبت است."},
  {q:"منشأ اصلی حرارت غریزی و روح حیوانی کدام عضو است؟", o:["قلب","کبد","مغز","معده"], a:0, f:"قلب گرم‌ترین عضو و معدن روح حیوانی است."},
  {q:"محل تولید اخلاط چهارگانه کجاست؟", o:["کبد","قلب","معده","طحال"], a:0, f:"کبد محل تبدیل کیموس معدی به اخلاط چهارگانه است."},
  {q:"مزاج طبیعی مغز برای ادراک چگونه است؟", o:["سرد و تر","گرم و خشک","گرم و تر","سرد و خشک"], a:0, f:"مغز نیازمند رطوبت و انعطاف جهت پذیرش صور حسی است."},
  {q:"سرد و خشک‌ترین بافت بدن چیست؟", o:["استخوان","چربی","عضله","پوست"], a:0, f:"استخوان به دلیل تراکم بالا، سرد و خشک‌ترین بافت است."},
  {q:"چربی بدن (شحم) چه طبعی دارد؟", o:["سرد و تر","گرم و خشک","سرد و خشک","گرم و تر"], a:0, f:"چربی‌ها دارای برودت و رطوبت متراکم هستند."},
  {q:"نبض افراد دموی‌مزاج چگونه است؟", o:["عظیم، ممتلی و قوی","صغیر و کند","باریک و سخت","نرم و بی‌رمق"], a:0, f:"نبض دموی پر، کشیده و قدرتمند است."},
  {q:"پوست صفراوی‌ها معمولاً چه رنگی است؟", o:["گرم، خشک و متمایل به زردی","سرد و سفید","سرد و تیره","گلگون و مرطوب"], a:0, f:"صفراوی‌ها رنگ زرد کهربایی و پوست گرم دارند."},
  {q:"کسالت صبحگاهی و پرخوابی نشانه غلبه کدام خلط است؟", o:["بلغم","صفرا","سودا","دم"], a:0, f:"رطوبت و سردی بلغم موجب سنگینی و خواب زیاد می‌شود."},
  {q:"وسواس فکری و دیر به خواب رفتن علامت چیست؟", o:["غلبه سودا","غلبه بلغم","غلبه دم","اعتدال مزاج"], a:0, f:"خشکی و برودت سودا فکر را آشفته و خواب را کم می‌کند."},
  {q:"تلخی دهان صبحگاهی و تشنگی شدید علامت چیست؟", o:["غلبه صفرا","غلبه بلغم","غلبه سودا","ضعف هاضمه"], a:0, f:"حرارت و خشکی صفرا سبب تلخی و عطش مفرط است."},
  {q:"سنگینی سر و خمیازه مکرر نشانه چیست؟", o:["غلبه دم","غلبه سودا","غلبه صفرا","غلبه رطوبت"], a:0, f:"امتلاء خون باعث سنگینی سر و کشیدگی بدن می‌شود."},
  {q:"کدام حبوبات سرد و خشک است؟", o:["عدس","نخود","لوبیا","باقلا"], a:0, f:"عدس قابض و سودازاست."},
  {q:"طبیعت نخود چیست؟", o:["گرم و تر","سرد و تر","سرد و خشک","گرم و خشک"], a:0, f:"نخود خون‌ساز عالی و گرم و تر است."},
  {q:"زنجبیل دارای چه طبعی است؟", o:["گرم و خشک","سرد و خشک","سرد و تر","گرم و تر"], a:0, f:"زنجبیل هاضم و مقوی معده سرد است."},
  {q:"کاسنی چه طبع و اثری دارد؟", o:["سرد و تر - تعدیل کبد","گرم و خشک","سرد و خشک","گرم و تر"], a:0, f:"کاسنی مفتح و خنک‌کننده کبد است."},
  {q:"ماست تازه چه کیفیتی دارد؟", o:["سرد و تر","گرم و خشک","گرم و تر","سرد و خشک"], a:0, f:"ماست سرد و تر است و مصلح آن نعناع و پونه است."},
  {q:"مصلح غذایی چیست؟", o:["تعدیل‌کننده عوارض و اصلاح‌کننده هضم","طعم‌دهنده صرف","داروی مسهل","غذای مکمل"], a:0, f:"مصلح، تیزی و افراط طبع غذا را تعدیل می‌کند."},
  {q:"مصلح ماهی چیست؟", o:["خرما و گردو","ماست","دوغ","آبغوره"], a:0, f:"ماهی سرد و تر است و با گرمیجات اصلاح می‌شود."},
  {q:"گوشت گوسفند دارای چه طبعی است؟", o:["گرم و تر","سرد و خشک","سرد و تر","گرم و خشک"], a:0, f:"گوشت گوسفندی صالح‌ترین گوشت با طبع گرم و تر است."},
  {q:"گوشت گاو چه ویژگی مزاجی دارد؟", o:["سرد و خشک و غلیظ","گرم و تر و لطیف","گرم و خشک","معتدل زود هضم"], a:0, f:"گوشت گاو دیرهضم و سودازاست."},
  {q:"عسل طبیعی چه کیفیتی دارد؟", o:["گرم و خشک","سرد و تر","سرد و خشک","معتدل"], a:0, f:"عسل جلادهنده و زداینده بلغم لزج است."},
  {q:"هندوانه دارای چه طبعی است؟", o:["سرد و تر","گرم و خشک","گرم و تر","سرد و خشک"], a:0, f:"هندوانه برودت‌زا و تسکین‌دهنده عطش است."},
  {q:"خرما دارای چه طبعی است؟", o:["گرم و تر","سرد و تر","سرد و خشک","سرد"], a:0, f:"خرما انرژی‌بخش و گرم و تر است."},
  {q:"انگور رسیده شیرین چه طبعی دارد؟", o:["گرم و تر","سرد و خشک","سرد و تر","گرم و خشک"], a:0, f:"انگور غذای مطلق و خونساز است."},
  {q:"لیموترش چه طبعی دارد؟", o:["سرد و خشک","گرم و تر","گرم و خشک","سرد و تر"], a:0, f:"لیموترش قاطع صفرا و حرارت است."},
  {q:"سرکه انگور طبیعی چه طبعی دارد؟", o:["سرد و خشک","گرم و تر","سرد و تر","گرم"], a:0, f:"سرکه نفوذکننده و سرد و خشک است."},
  {q:"سکنجبین از ترکیب چه چیزهایی ساخته می‌شود؟", o:["سرکه و عسل (یا شکر)","روغن و ماست","نمک و فلفل","شیره و آرد"], a:0, f:"سکنجبین ترکیبی معتدل از سرکه و عسل است."},
  {q:"آب یخ ناشتا چه آسیبی به کبد می‌زند؟", o:["ایجاد کبد چرب و شوک برودتی","تقویت هضم","تصفیه صفرا","افزایش اشتها"], a:0, f:"آب یخ ناگهان کبد گرم را سرد و مسدود می‌کند."},
  {q:"سته ضروریه یعنی چه؟", o:["شش اصل ضروری برای حفظ سلامت","شش داروی ترکیبی","شش عضو بدن","شش طعم غذا"], a:0, f:"هوا، غذا، حرکت، خواب، استفراغ و حالات روحی شش اصل هستند."},
  {q:"سریع‌ترین اثر روحی بر مزاج مربوط به کدام است؟", o:["اعراض نفسانی (شادی، خشم و...)","تغییر فصل","ورزش","نوع خواب"], a:0, f:"حالات روحی فوراً حرارت غریزی را جابجا می‌کنند."},
  {q:"ورزش معتدل چه کمکی به بدن می‌کند؟", o:["تقویت حرارت غریزی و دفع سموم","سرد کردن اندام‌ها","تخریب عضلات","تولید خلط فاسد"], a:0, f:"ورزش چراغ حرارت غریزی را روشن نگه می‌دارد."},
  {q:"خواب روز و هنگام غروب چه عارضه‌ای دارد؟", o:["ازدیاد بلغم و تباهی چهره","تقویت حافظه","کاهش صفرا","تقویت گوارش"], a:0, f:"خواب غروب موجب خمودگی و فساد هضم است."},
  {q:"تعریق و ادرار جزء کدام اصل سته ضروریه است؟", o:["استفراغ و احتباس","اعراض نفسانی","ماکول و مشروب","حرکت و سکون"], a:0, f:"خروج مواد زاید از اصول استفراغ است."},
  {q:"مزاج جبلی چیست؟", o:["مزاج سرشتی و مادرزادی اولیه","مزاج بیمار موقت","مزاجی که روزانه عوض شود","مزاج ناشی از دارو"], a:0, f:"مزاج جبلی سرشت پایه و اصلی هر فرد است."},
  {q:"نرمی پوست و موهای لخت نشانه چیست؟", o:["غلبه رطوبت","غلبه خشکی","غلبه حرارت شدید","غلبه برودت خشک"], a:0, f:"رطوبت مایه نرمی بافت‌ها و تارهای موست."},
  {q:"موهای مجعد و زبر نشانه چیست؟", o:["مزاج گرم و خشک","مزاج سرد و تر","رطوبت بالا","ضعف حرارت"], a:0, f:"حرارت و خشکی باعث پیچش مو می‌شود."},
  {q:"مصلح نفخ حبوبات چیست؟", o:["زیره و آویشن","گشنیز","غوره","سماق"], a:0, f:"زیره بادشکن و گرم‌کننده است."},
  {q:"طبیعت سیاهدانه چیست؟", o:["گرم و خشک","سرد و تر","سرد و خشک","معتدل"], a:0, f:"سیاهدانه مقطع اخلاط لزج و گرم و خشک است."},
  {q:"اسطوخودوس به چه صفت مشهور است؟", o:["جاروب مغز از بلغم و سودا","سردکننده کبد","خواب‌آور بی اثر","مولد خلط دم"], a:0, f:"اسطوخودوس پاک‌کننده مغز از فضولات بارد است."},
  {q:"خوردن ماهی و ماست با هم چه خطری دارد؟", o:["برودت شدید و ضعف هضم و برص","تقویت معده","سریع الهضم بودن","افزایش صفرا"], a:0, f:"ترکیب دو طبع سرد و تر کبد و اعصاب را سست می‌کند."},
  {q:"کدام سبزی ضد بلغم ریه و معده است؟", o:["نعناع و آویشن","کاهو","اسفناج","گشنیز"], a:0, f:"نعناع گرم و خشک و زداینده لزوجات است."},

  {q:"سیر و پیاز تند چه مزاجی دارند؟", o:["گرم و خشک","سرد و خشک","سرد و تر","گرم و تر"], a:0, f:"سیر و پیاز تند و مفتح و شدیداً گرم و خشک هستند."},
  {q:"خیار چه طبعی دارد؟", o:["سرد و تر","گرم و خشک","سرد و خشک","گرم و تر"], a:0, f:"خیار سرد و تر و فرونشاننده عطش است."},
  {q:"نمک طبیعی طعام چه خاصیتی دارد؟", o:["گرم و خشک و هاضم","سرد و تر","سرد و خشک","خنک"], a:0, f:"نمک طبیعی برطرف‌کننده بلغم و تحریک‌کننده هضم است."},
  {q:"چشیدن نمک قبل غذا چه مزیتی دارد؟", o:["تحریک ترشحات هاضمه و ضدعفونی","سرد کردن معده","ضعف گوارش","افزایش خواب"], a:0, f:"نمک هضم را بیدار و فعال می‌کند."},
  {q:"کدام مغز دانه سرد و خشک است؟", o:["شاه‌بلوط خام","بادام","پسته","گردو"], a:0, f:"بلوط قابض و سرد و خشک است."},
  {q:"بادام درختی شیرین چه مزاجی دارد؟", o:["گرم و تر مایل به اعتدال","سرد و تر","سرد و خشک","گرم و خشک"], a:0, f:"بادام تقویت‌کننده مغز و گرم و تر است."},
  {q:"گردو چه طبعی دارد؟", o:["گرم و خشک","سرد و تر","سرد و خشک","گرم و تر"], a:0, f:"گردو گرم و خشک و مصلح پنیر است."},
  {q:"پنیر تازه بدون مصلح چه طبعی دارد؟", o:["سرد و تر","گرم و خشک","گرم و تر","سرد و خشک"], a:0, f:"پنیر تازه سرد و تر و نیازمند گردوست."},

  {q:"دارچین دارای چه طبعی است؟", o:["گرم و خشک","سرد و خشک","سرد و تر","گرم و تر"], a:0, f:"دارچین گرم‌کننده عضلات و هاضم است."},
  {q:"هل چه خاصیتی دارد؟", o:["گرم و خشک و مقوی فم معده","سرد و تر","سرد و خشک","معتدل"], a:0, f:"هل مقوی دهانه معده و خوشبوکننده است."},
  {q:"گلاب مرغوب دارای چه کیفیتی است؟", o:["مرکب‌القوی و مقوی روح و قلب","گرم و خشک شدید","سرد و خشک شدید","بلغم‌زا"], a:0, f:"گلاب آرام‌بخش قلب و مغز است."},
  {q:"تخم شربتی در آب چه خاصیتی دارد؟", o:["لعاب مرطوب و تسکین تشنگی","افزایش حرارت","سودازایی","تخریب معده"], a:0, f:"لعاب دانه‌ها تسکین‌دهنده حرارت و خشکی است."},
  {q:"کدام گوشت پرنده لطیف‌تر و گرم‌تر است؟", o:["کبک و بلدرچین","غاز پیر","شترمرغ یخ‌زده","اردک باتلاقی"], a:0, f:"پرندگان کوچک کوهی گوشت گرم و سبکی دارند."},
  {q:"ماهی دودی و شور چه خلطی تولید می‌کند؟", o:["سودای سوخته","دم صالح","بلغم پاک","صفرا سبک"], a:0, f:"نمک زیاد و دود باعث تولید سوداست."},
  {q:"حجامت برای تعدیل کدام خلط کاربرد دارد؟", o:["تعدیل دم و کاهش حرارت","دفع سودای عمقی","رفع بلغم سفت","کاهش وزن"], a:0, f:"حجامت حرارت و غلیان خون را کاهش می‌دهد."},
  {q:"فصد (رگ‌زدن) برای چه موردی است؟", o:["کاهش حجم عمومی خون در امتلاء","فقط سردرد ساده","درمان فوری کم‌خونی","تقویت حافظه"], a:0, f:"فصد برای تخلیه عمومی عروق استفاده می‌شود."},
  {q:"زالودرمانی در چه مواردی موثر است؟", o:["رفع احتقان عروق ریز موضعی","تخلیه معده","کاهش سودای مغز","درمان چاقی"], a:0, f:"زالو با بزاق خود جریان مویرگی را باز می‌کند."},
  {q:"چرا مصرف زیاد سرکه برای اعصاب مضر است؟", o:["به علت نفوذ برودت و خشکی به عصب","افزایش چربی خون","تولید جوش صفراوی","ایجاد پرخوابی"], a:0, f:"بافت عصبی از سردی و خشکی آسیب می‌بیند."},
  {q:"بهترین زمان صرف غذا چیست؟", o:["هنگام اشتهای واقعی پس از تخلیه وعده قبل","سر ساعت بدون میل","هر وقت در دسترس بود","روزی یک بار"], a:0, f:"ورود غذا روی غذای هضم‌نشده سبب فساد کیموس است."},
  {q:"آب خنک زدن به پا پس از حمام چه فایده‌ای دارد؟", o:["بستن منافذ و حفظ حرارت غریزی","ایجاد سرماخوردگی","سرد شدن استخوان","تولید بلغم"], a:0, f:"آب خنک منافذ را منقبض و حرارت را درون بدن نگه می‌دارد."},
  {q:"بوییدن گل‌های معطر گرم چه تاثیری دارد؟", o:["تقویت روح نفسانی و رفع خمودگی مغز","سردرد حتمی","کاهش حافظه","تولید عفونت"], a:0, f:"روایح گرم مغز سرد را سرحال می‌کنند."},
  {q:"مصلح سردی گوشت گاو چیست؟", o:["سیر، دارچین و زنجبیل","ماست","دوغ","خیار"], a:0, f:"ادویه‌های گرم سنگینی گوشت گاو را مهار می‌کنند."},
  {q:"انار شیرین چه طبعی دارد؟", o:["معتدل مایل به سردی و تری","گرم و خشک","سرد و خشک","بسیار گرم"], a:0, f:"انار شیرین مصفای کبد و خونساز است."},
  {q:"نوشیدن آب بین لقمه‌های غذا چه ضرری دارد؟", o:["رقیق شدن شیره هاضمه و خام ماندن هضم","تسریع هضم","جلوگیری از رفلاکس","تقویت معده"], a:0, f:"آب وسط غذا حرارت هضم را خاموش می‌کند."},
  {q:"آویشن چه اثری بر معده دارد؟", o:["تقویت هاضمه و دفع لزوجات","شل کردن معده","سودازایی","زخم سرد"], a:0, f:"آویشن گرم و خشک و تقویت‌کننده معده است."},
  {q:"خاکشیر با آب جوش چه اثری دارد؟", o:["ملین و بازکننده روده‌ها","قابض شدید","سردکننده کبد","سنگ‌ساز"], a:0, f:"خاکشیر با آب گرم ملین است."},
  {q:"زردچوبه دارای چه خاصیتی است؟", o:["گرم و خشک و مفتح سدد کبد","سرد و تر","سرد و خشک","خنک‌کننده"], a:0, f:"زردچوبه بازکننده گرفتگی‌های کبدی است."},
  {q:"خوردن شام سنگین نزدیک خواب چه عارضه‌ای دارد؟", o:["کابوس، بوی بد دهان و سنگینی سر","خواب راحت","تقویت قلب","افزایش هوش"], a:0, f:"صعود بخارات خام هضم‌نشده خواب را آشفته می‌کند."},
  {q:"علامت اعتدال اخلاط چیست؟", o:["رنگ گلگون، خواب معتدل و نشاط","بی‌خوابی زیاد","سفیدی بی‌رمق","زردی چشم"], a:0, f:"سلامت نشانه توازن چهار خلط است."},
  {q:"کیموس معدی چیست؟", o:["غذای هضم‌شده در معده برای کبد","خون خالص","صفرا","فضله روده"], a:0, f:"کیموس حاصل هضم اول است."},
  {q:"هضم چهارگانه به ترتیب در کجاست؟", o:["معده، کبد، عروق، بافت‌ها","کبد، معده، روده، کلیه","دهان، قلب، ریه، مغز","روده، پوست، مو، استخوان"], a:0, f:"چهار مرتبه هضم در این اندام‌ها تکمیل می‌شود."},
  {q:"هدف غایی مزاج‌شناسی چیست؟", o:["حفظ تندرستی با سبک زندگی درست","دارو درمانی بی‌رویه","رنگ‌شناسی صرف","محرومیت از غذاها"], a:0, f:"هدف حفظ تعادل فطری و پیشگیری است."},
  {q:"قاعده کلی درمان غلبه خلط چیست؟", o:["علاج به ضد کیفیت غالب","علاج به مثل","قطع آب و غذا","سکون مطلق"], a:0, f:"اصلاح مزاج با کیفیت متضاد انجام می‌شود."},
  {q:"حکمت طبیعی چه رابطه‌ای با سلامت دارد؟", o:["انسان را جزئی هماهنگ با عالم آفرینش می‌داند","علمی بی‌ارتباط به جهان","تنها متکی بر داروهای شیمیایی","محدود به تجربیات فردی"], a:0, f:"قوانین حاکم بر طبیعت بدن با ارکان عالم پیوند دارد."}
];

let idx = 0, score = 0, ans = false;

function render() {
  ans = false;
  const cur = Q[idx];
  document.getElementById("qc").innerText = "پرسش " + (idx + 1) + " از " + Q.length;
  document.getElementById("sc").innerText = "امتیاز: " + score;
  document.getElementById("pb").style.width = ((idx) / Q.length * 100) + "%";
  document.getElementById("qt").innerText = (idx + 1) + ". " + cur.q;
  
  const og = document.getElementById("og");
  og.innerHTML = "";
  const fb = document.getElementById("fb");
  fb.className = "fb";
  fb.style.display = "none";
  document.getElementById("bn").style.display = "none";

  cur.o.forEach((txt, i) => {
    const btn = document.createElement("button");
    btn.className = "btn-opt";
    btn.innerText = txt;
    btn.onclick = () => select(i);
    og.appendChild(btn);
  });
}

function select(sel) {
  if (ans) return;
  ans = true;
  const cur = Q[idx];
  const btns = document.querySelectorAll(".btn-opt");
  const fb = document.getElementById("fb");
  
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === cur.a) b.classList.add("correct");
  });

  if (sel === cur.a) {
    score++;
    fb.className = "fb correct";
    fb.innerText = "✓ پاسخ صحیح است! " + cur.f;
  } else {
    btns[sel].classList.add("wrong");
    fb.className = "fb wrong";
    fb.innerText = "✗ نادرست! " + cur.f;
  }
  fb.style.display = "block";
  document.getElementById("sc").innerText = "امتیاز: " + score;
  document.getElementById("bn").style.display = "inline-block";
}

function nextQ() {
  idx++;
  if (idx < Q.length) render();
  else showEnd();
}

function showEnd() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("res-screen").style.display = "block";
  document.getElementById("fs").innerText = score + " / " + Q.length;
  let p = (score / Q.length) * 100;
  let desc = p >= 85 ? "عالی! تسلط کامل و عمیقی بر مبانی مزاج و ارکان دارید." : (p >= 60 ? "خوب! دانش پایه‌ای مناسبی دارید؛ با مرور بیشتر استاد خواهید شد." : "نیاز به مطالعه بیشتر مبانی سته ضروریه و اخلاط.");
  document.getElementById("fe").innerText = desc;
}

function restart() {
  idx = 0; score = 0;
  document.getElementById("res-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  render();
}

window.onload = render;
if (document.readyState === "complete" || document.readyState === "interactive") render();
</script>
