            let optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            options.forEach((opt, index) => {
                let div = document.createElement("div");
                div.className = "option";
                div.innerText = opt;
                div.onclick = () => checkAnswer(index, newCorrectIndex);
                optionsContainer.appendChild(div);
            });
        }

        function checkAnswer(selectedIndex, correctIndex) {
            let options = document.querySelectorAll(".option");
            // Prevent multiple clicks
            options.forEach(opt => opt.style.pointerEvents = "none");

            if (selectedIndex === correctIndex) {
                options[selectedIndex].classList.add("correct");
                document.getElementById("feedback").innerText = "آفرین! درست است. ✅";
                document.getElementById("feedback").style.color = "#2e7d32";
                score++;
            } else {
                options[selectedIndex].classList.add("wrong");
                options[correctIndex].classList.add("correct");
                document.getElementById("feedback").innerText = "اشتباه بود. ❌";
                document.getElementById("feedback").style.color = "#d32f2f";
            }
            
            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 1200);
        }

        function showResult() {
            const container = document.getElementById("game-container");
            container.innerHTML = `
                <div class="result-screen">
                    <h1>پایان بازی!</h1>
                    <p style="font-size: 24px;">امتیاز نهایی شما:</p>
                    <p style="font-size: 48px; color: #2e7d32; font-weight: bold;">${score} از ${rawQuestions.length}</p>
                    <p>${score >= 80 ? "عالی بود! شما یک متخصص هستید. 🌿" : score >= 50 ? "خوب بود، اما نیاز به مطالعه بیشتر دارید. 📚" : "لطفاً دوباره تمرین کنید. 💪"}</p>
                    <button class="btn-restart" onclick="location.reload()">شروع دوباره</button>
                </div>
            `;
        }

        loadQuestion();
    </script>
</body>
</html>
