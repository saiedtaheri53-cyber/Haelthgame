<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طب و علم سلامتی - بازی شماره ۱</title>
    <style>
        /* استایل‌های اصلی دقیقاً مشابه نسخه اصلی حفظ شد */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #27ae60;
            --accent-color: #f1c40f;
            --error-color: #e74c3c;
            --bg-color: #ecf0f1;
            --text-color: #2c3e50;
        }
        /* ... سایر استایل‌ها از فایل اصلی کپی شده است ... */
    </style>
</head>
<body>
<!-- ساختار HTML دقیقاً مشابه نسخه اصلی است -->
<div class="quiz-container">
    <div class="header-stats">
        <div id="score-display">امتیاز: 0</div>
        <div id="coin-display">🪙: 0</div>
        <div id="golden-score-display">⭐: 0</div> <!-- اضافه شده -->
    </div>
    <!-- سایر بخش‌ها -->
</div>

<script>
    // منطق بازی با حفظ تمام ویژگی‌های اصلی و افزودن امتیاز طلایی
    let score = parseInt(localStorage.getItem('game1_score')) || 0;
    let coins = parseInt(localStorage.getItem('game1_coins')) || 0;
    let goldenScore = parseInt(localStorage.getItem('game1_golden_score')) || 0; // اضافه شده

    // ... سایر توابع بدون تغییر ...

    function updateStats() {
        scoreDisplay.innerText = `امتیاز: ${score}`;
        coinDisplay.innerText = `🪙: ${coins}`;
        goldenScoreDisplay.innerText = `⭐: ${goldenScore}`; // اضافه شده
        
        localStorage.setItem('game1_score', score);
        localStorage.setItem('game1_coins', coins);
        localStorage.setItem('game1_golden_score', goldenScore); // اضافه شده
    }

    // در بخش پاسخ صحیح
    if (selectedIndex === correctIndex) {
        score += 10;
        goldenScore++; // افزایش امتیاز طلایی
        // ... منطق سکه ...
        updateStats();
    }
    
    // ... سایر کدها دقیقاً همان نسخه اصلی هستند ...
</script>
</body>
</html>
